apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-004-24-deployment
  labels:
    app: xben-004-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-004-24
  template:
    metadata:
      labels:
        app: xben-004-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        - name: APP_HOST
          value: "localhost"
        - name: APP_PORT
          value: "5000"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-004-24-service
  labels:
    app: xben-004-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
  selector:
    app: xben-004-24
