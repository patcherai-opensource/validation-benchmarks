apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-005-24-app
  labels:
    app: xben-005-24-app
    challenge: xben-005-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-005-24-app
  template:
    metadata:
      labels:
        app: xben-005-24-app
        challenge: xben-005-24
    spec:
      containers:
      - name: app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-005-24-service
  labels:
    app: xben-005-24-app
    challenge: xben-005-24
spec:
  type: ClusterIP
  selector:
    app: xben-005-24-app
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP