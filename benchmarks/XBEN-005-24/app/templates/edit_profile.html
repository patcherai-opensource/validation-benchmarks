{% extends "base.html" %}

{% block title %}WikiDocs - Settings{% endblock %}

{% block content %}
<h2>User Settings</h2>
{% if msg %}
<div class="alert alert-success" role="alert">
    {{ msg }}
</div>
{% endif %}
<form method="post" action="/edit_profile/{{user.id}}">
    <div class="form-group">
        <label for="name">Display Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
    </div>
    <div class="form-group">
        <label>Account Type</label>
        <input type="text" class="form-control" value="{% if user.is_admin %}Administrator{% else %}Standard User{% endif %}" disabled>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
