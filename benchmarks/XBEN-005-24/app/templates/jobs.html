{% extends "base.html" %}

{% block title %}Projects - Project Hub{% endblock %}

{% block content %}
<h2>My Projects</h2>
{% if is_admin %}
<span class="badge badge-success mb-3">Admin Access</span>
{% endif %}

<div class="card-deck">
    {% for job in jobs %}
    <div class="card mb-3" style="max-width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">{{ job.title }}</h5>
            <p class="card-text">{{ job.description }}</p>
            {% if job.is_private %}
            <span class="badge badge-warning">Internal</span>
            {% endif %}
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
