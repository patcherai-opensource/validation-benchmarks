{% extends "base.html" %}

{% block title %}Projects{% endblock %}

{% block content %}
<h2>Your Projects</h2>
<ul class="list-group">
    {% for job in jobs %}
    <li class="list-group-item">
        <h5>{{ job.title }}</h5>
        <p class="mb-0 text-muted">{{ job.description }}</p>
    </li>
    {% endfor %}
</ul>
{% endblock %}
