<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{% block title %}Netmaker User Portal{% endblock %}</title>
    <style>
        body {
            display: flex;
        }
        .nav {
            width: 200px;
            background-color: #f8f9fa;
            min-height: 100vh;
            padding-top: 20px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="nav flex-column nav-pills" aria-orientation="vertical">
        {% if request.cookies.access_token and current_user %}
        <a class="nav-link" href="/users/{{ current_user.username }}/profile">My Profile</a>
        <a class="nav-link" href="/users/{{ current_user.username }}/edit">Edit Profile</a>
        <a class="nav-link" href="/api/users">User List</a>
        {% endif %}
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
