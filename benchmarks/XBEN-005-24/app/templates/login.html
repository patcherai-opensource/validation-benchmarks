{% extends "base.html" %}

{% block title %}alf.io - Sign in{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title text-center mb-4">alf.io Backoffice</h4>
                <p class="text-muted text-center" style="font-size: 0.85rem;">The open source ticket reservation system</p>

                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post" action="/admin/authenticate">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                </form>
                <hr>
                <p class="text-muted" style="font-size: 0.8rem;">Evaluation instance &mdash; operator accounts use default credentials.</p>
            </div>
        </div>
        <p class="text-muted text-center mt-3" style="font-size: 0.8rem;">v2.0-M4-2303</p>
    </div>
</div>
{% endblock %}
