{% extends "base.html" %}

{% block title %}Login - Event Management Backoffice{% endblock %}

{% block content %}
<div class="login-container">
    <h2>Backoffice Login</h2>
    <p class="text-muted">Event Management Platform</p>
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <p class="small text-muted mt-3">Demo account available: <strong>organizer</strong> / <strong>organizer2024</strong></p>

    <form method="post" action="/auth/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
</div>
{% endblock %}
