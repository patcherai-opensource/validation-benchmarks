<VirtualHost *:80>
    DocumentRoot /var/www/modelforge/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off

    WSGIDaemonProcess modelforge python-path=/var/www/modelforge/
    WSGIProcessGroup modelforge
    WSGIScriptAlias / /var/www/modelforge/modelforge.wsgi

    <Directory "/var/www/modelforge/app/">
        WSGIProcessGroup modelforge
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/modelforge/app/static/"
    <Directory "/var/www/modelforge/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
