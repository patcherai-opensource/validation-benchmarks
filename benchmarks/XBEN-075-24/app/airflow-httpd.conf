<VirtualHost *:80>
    DocumentRoot /var/www/airflow/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off

    WSGIDaemonProcess airflow python-path=/var/www/airflow/
    WSGIProcessGroup airflow
    WSGIScriptAlias / /var/www/airflow/airflow.wsgi

    <Directory "/var/www/airflow/app/">
        WSGIProcessGroup airflow
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/airflow/app/static/"
    <Directory "/var/www/airflow/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
