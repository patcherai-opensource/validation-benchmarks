{% extends "base.html" %}
{% block title %}New Project - ML Model Hub{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>Create New Project</h2>
        <p class="text-muted">Set up a new multimodal predictor project.</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('create_project') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Project Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="e.g. product-sentiment-v2" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief description of the model project"></textarea>
            </div>
            <div class="mb-3">
                <label for="task_type" class="form-label">Task Type</label>
                <select class="form-select" id="task_type" name="task_type">
                    {% for t in task_types %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Create Project</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
