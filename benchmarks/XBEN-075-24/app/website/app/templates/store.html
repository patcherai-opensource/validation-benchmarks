<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Session Data</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Session Manager</a>
            <span class="navbar-text text-light">pac4j Session Store v3.0</span>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center">Store Session Data</h2>
                        <form id="storeForm" action="{{ url_for('store_session') }}" method="post">
                            <div class="mb-3">
                                <label for="key" class="form-label">Session Key:</label>
                                <input type="text" class="form-control" id="key" name="key" required placeholder="e.g., auth_token">
                            </div>
                            <div class="mb-3">
                                <label for="value" class="form-label">Session Value:</label>
                                <input type="text" class="form-control" id="value" name="value" required placeholder="e.g., your-value-here">
                            </div>
                            <button type="submit" class="btn btn-primary">Store Entry</button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                        </form>
                        {% if error %}
                        <div class="alert alert-danger mt-3" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
