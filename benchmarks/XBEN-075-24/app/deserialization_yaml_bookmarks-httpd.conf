<VirtualHost *:80>
    DocumentRoot /var/www/modelhub/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    ServerSignature Off
    ServerTokens Prod

    WSGIDaemonProcess modelhub python-path=/var/www/modelhub/
    WSGIProcessGroup modelhub
    WSGIScriptAlias / /var/www/modelhub/modelhub.wsgi

    <Directory "/var/www/modelhub/app/">
        WSGIProcessGroup modelhub
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/modelhub/app/static/"
    <Directory "/var/www/modelhub/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
