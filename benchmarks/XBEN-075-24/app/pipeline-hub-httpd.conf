<VirtualHost *:80>
    DocumentRoot /var/www/pipeline-hub/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off
    ServerTokens Prod

    WSGIDaemonProcess pipeline-hub python-path=/var/www/pipeline-hub/
    WSGIProcessGroup pipeline-hub
    WSGIScriptAlias / /var/www/pipeline-hub/pipeline_hub.wsgi

    <Directory "/var/www/pipeline-hub/app/">
        WSGIProcessGroup pipeline-hub
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/pipeline-hub/app/static/"
    <Directory "/var/www/pipeline-hub/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
