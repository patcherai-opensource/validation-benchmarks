<VirtualHost *:80>
    DocumentRoot /var/www/artisancms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /artisancms python-path=/var/www/artisancms/
    WSGIProcessGroup /artisancms
    WSGIScriptAlias / /var/www/artisancms/artisancms.wsgi

    <Directory "/var/www/artisancms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /artisancms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/artisancms/app/static/"
    <Directory "/var/www/artisancms/app/static">
        Options Indexes MultiViews
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
