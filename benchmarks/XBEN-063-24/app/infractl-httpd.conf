<VirtualHost *:80>
    DocumentRoot /var/www/infractl/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /infractl python-path=/var/www/infractl/
    WSGIProcessGroup /infractl
    WSGIScriptAlias / /var/www/infractl/infractl.wsgi

    <Directory "/var/www/infractl/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /infractl
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
