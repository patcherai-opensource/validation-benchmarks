<VirtualHost *:80>
    DocumentRoot /var/www/ansible_controller/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess ansible_controller python-path=/var/www/ansible_controller/
    WSGIProcessGroup ansible_controller
    WSGIScriptAlias / /var/www/ansible_controller/ansible_controller.wsgi

    <Directory "/var/www/ansible_controller/app/">
        WSGIProcessGroup ansible_controller
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ServerSignature Off
    Header unset X-Powered-By
</VirtualHost>
