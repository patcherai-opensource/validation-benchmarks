<VirtualHost *:80>
    DocumentRoot /var/www/grav_cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess grav_cms python-path=/var/www/grav_cms/
    WSGIProcessGroup grav_cms
    WSGIScriptAlias / /var/www/grav_cms/grav.wsgi

    <Directory "/var/www/grav_cms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup grav_cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
