<VirtualHost *:80>
    DocumentRoot /var/www/novacms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /novacms python-path=/var/www/novacms/
    WSGIProcessGroup /novacms
    WSGIScriptAlias / /var/www/novacms/novacms.wsgi

    <Directory "/var/www/novacms/app/">
        WSGIProcessGroup /novacms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
