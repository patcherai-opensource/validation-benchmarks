<VirtualHost *:80>
    DocumentRoot /var/www/nodepilot/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off

    WSGIDaemonProcess nodepilot python-path=/var/www/nodepilot/
    WSGIProcessGroup nodepilot
    WSGIScriptAlias / /var/www/nodepilot/nodepilot.wsgi

    <Directory "/var/www/nodepilot/app/">
        WSGIProcessGroup nodepilot
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
