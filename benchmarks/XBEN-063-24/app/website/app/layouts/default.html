<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Statement - Default Layout</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-between mt-5">
            <div class="col-md-9">
                <h2>Loan Statement</h2>
                <div class="card">
                    <div class="card-header">
                        <strong>Account Holder:</strong> {{ user.name }} {{ user.lastname }}
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tr>
                                <th>Loan Principal:</th>
                                <td>${{ loan_amount }}</td>
                            </tr>
                            <tr>
                                <th>Term Length:</th>
                                <td>{{ loan_term_months }} months</td>
                            </tr>
                            <tr>
                                <th>Monthly Payment:</th>
                                <td>${{ monthly_payment }}</td>
                            </tr>
                            <tr>
                                <th>Total Payments:</th>
                                <td>${{ total_payments }}</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('home') }}">Home</a></li>
                            <li class="list-group-item"><a href="{{ url_for('profile') }}">Profile</a></li>
                            <li class="list-group-item"><a href="{{ url_for('loan_details') }}">Loan Details</a></li>
                            <li class="list-group-item"><a href="{{ url_for('statements') }}">Statements</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Exit</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
