<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocPortal - Document View</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar { background-color: #0d6efd; padding: 10px 20px; color: white; }
        .navbar a { color: white; text-decoration: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .content { background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/dashboard">DocPortal</a> | <a href="/docs">Documentation</a> | <a href="/logout">Logout</a>
    </div>
    <div class="container">
        <div class="content">
            {{content}}
        </div>
    </div>
</body>
</html>
