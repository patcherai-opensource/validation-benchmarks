<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Report - Compact</title>
    <style>
        body { font-family: 'Courier New', monospace; margin: 20px; font-size: 12px; }
        .header { text-align: center; margin-bottom: 20px; }
        .data-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #999; padding: 5px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h2>LOAN STATEMENT</h2>
        <p>{{ user.name }} {{ user.lastname }}</p>
    </div>
    <div class="data-row"><span>Principal:</span><span>${{ "%.2f"|format(loan_amount) }}</span></div>
    <div class="data-row"><span>Term:</span><span>{{ loan_term_months }} mo</span></div>
    <div class="data-row"><span>Monthly:</span><span>${{ "%.2f"|format(monthly_payment) }}</span></div>
    <div class="data-row"><span>Total:</span><span>${{ "%.2f"|format(total_payment) }}</span></div>
    <div class="data-row"><span>Interest:</span><span>${{ "%.2f"|format(total_interest) }}</span></div>
</body>
</html>
