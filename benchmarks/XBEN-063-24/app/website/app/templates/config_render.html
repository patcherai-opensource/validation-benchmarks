<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfigMgr - Render Template</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">ConfigMgr</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">{{ user.name }} {{ user.lastname }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">Navigation</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
                        <li class="list-group-item"><a href="{{ url_for('configs') }}">Configuration Templates</a></li>
                        <li class="list-group-item"><a href="{{ url_for('profile') }}">Profile</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <h2>Render: {{ template.name }}</h2>
                <hr>
                
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <div class="row">
                    <div class="col-md-6">
                        <h5>Template</h5>
                        <pre class="bg-light p-3 border rounded"><code>{{ template.yaml_content }}</code></pre>
                    </div>
                    <div class="col-md-6">
                        <form method="post">
                            <div class="mb-3">
                                <label for="variables" class="form-label">Variables (YAML)</label>
                                <textarea class="form-control font-monospace" id="variables" name="variables" rows="8" placeholder="# Define variables as YAML
hostname: server1.example.com
port: 8080">{{ variables if variables else '' }}</textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Render Configuration</button>
                        </form>
                    </div>
                </div>
                
                {% if output %}
                <hr>
                <h5>Rendered Output</h5>
                <pre class="bg-dark text-light p-3 rounded"><code>{{ output }}</code></pre>
                {% endif %}
                
                <div class="mt-3">
                    <a href="{{ url_for('configs') }}" class="btn btn-secondary">Back to Templates</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
