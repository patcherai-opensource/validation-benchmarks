<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocPortal - Dashboard</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">DocPortal</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.name }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">Navigation</div>
                    <div class="list-group list-group-flush">
                        <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action active">Dashboard</a>
                        <a href="{{ url_for('docs') }}" class="list-group-item list-group-item-action">Documentation</a>
                        <a href="{{ url_for('settings') }}" class="list-group-item list-group-item-action">Settings</a>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Welcome to DocPortal</h4>
                        <p class="card-text">Hello {{ user.name }} {{ user.lastname }}! This is the internal documentation portal.</p>
                        <hr>
                        <h5>Quick Links</h5>
                        <ul>
                            <li><a href="{{ url_for('view_document') }}?doc=welcome">Welcome Guide</a></li>
                            <li><a href="{{ url_for('view_document') }}?doc=getting-started">Getting Started</a></li>
                            <li><a href="{{ url_for('view_document') }}?doc=api-reference">API Reference</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
