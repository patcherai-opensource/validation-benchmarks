<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraCtl - Settings</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🔧 InfraCtl</span>
            <span class="navbar-text text-white">{{ user.name }} {{ user.lastname }}</span>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-between mt-4">
            <div class="col-md-9">
                <h2>Connection Settings</h2>
                <form method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">First Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Last Name:</label>
                        <input type="text" class="form-control" id="lastname" name="lastname" value="{{ user.lastname }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <hr>
                    <h5>Default Connection Parameters</h5>
                    <div class="mb-3">
                        <label for="default_host" class="form-label">Default Host:</label>
                        <input type="text" class="form-control" id="default_host" name="default_host" value="{{ user.default_host }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="default_port" class="form-label">Default SSH Port:</label>
                        <input type="number" class="form-control" id="default_port" name="default_port" value="{{ user.default_port }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="ssh_timeout" class="form-label">SSH Timeout (seconds):</label>
                        <input type="number" class="form-control" id="ssh_timeout" name="ssh_timeout" value="{{ user.ssh_timeout }}" required>
                    </div>
                    <button type="submit" class="btn btn-success">Save Settings</button>
                </form>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('settings') }}">Settings</a></li>
                            <li class="list-group-item"><a href="{{ url_for('playbooks') }}">Run Playbook</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
