{% extends "base.html" %}
{% block title %}{{ page.title }} - {{ site_title }}{% endblock %}
{% block content %}
<article>
    <h1>{{ page.title }}</h1>
    {% if page.author %}
    <p class="text-muted"><small>by {{ page.author.name }}</small></p>
    {% endif %}
    <hr>
    <div class="page-content">
        {{ rendered_content | safe }}
    </div>
</article>
{% endblock %}
