<VirtualHost *:80>
    DocumentRoot /var/www/loancalc/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    ServerTokens Prod
    ServerSignature Off
    
    WSGIDaemonProcess loancalc python-path=/var/www/loancalc/
    WSGIProcessGroup loancalc
    WSGIScriptAlias / /var/www/loancalc/loancalc.wsgi

    <Directory "/var/www/loancalc/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup loancalc
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
