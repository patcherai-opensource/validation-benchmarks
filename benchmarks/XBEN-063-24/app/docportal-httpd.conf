<VirtualHost *:80>
    DocumentRoot /var/www/docportal/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /docportal python-path=/var/www/docportal/
    WSGIProcessGroup /docportal
    WSGIScriptAlias / /var/www/docportal/docportal.wsgi

    <Directory "/var/www/docportal/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /docportal
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
