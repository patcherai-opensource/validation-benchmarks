<VirtualHost *:80>
    DocumentRoot /var/www/configmgr/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess configmgr python-path=/var/www/configmgr/
    WSGIProcessGroup configmgr
    WSGIScriptAlias / /var/www/configmgr/configmgr.wsgi

    <Directory "/var/www/configmgr/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup configmgr
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
