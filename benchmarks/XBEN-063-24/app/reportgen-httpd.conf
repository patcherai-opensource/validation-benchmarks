<VirtualHost *:80>
    DocumentRoot /var/www/reportgen/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /reportgen python-path=/var/www/reportgen/
    WSGIProcessGroup /reportgen
    WSGIScriptAlias / /var/www/reportgen/reportgen.wsgi

    <Directory "/var/www/reportgen/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /reportgen
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
