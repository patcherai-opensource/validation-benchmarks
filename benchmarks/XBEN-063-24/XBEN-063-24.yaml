apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grav-cms
  name: grav-cms
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grav-cms
  template:
    metadata:
      labels:
        app: grav-cms
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: grav_cms_db
        - name: MYSQL_DATABASE
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-063-24_grav-cve-2023-37897:db
        imagePullPolicy: Always
        args: ["--innodb_use_native_aio=0"]
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=grav_cms_db
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=grav_cms_db
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - env:
        - name: FLAG
          value: FLAG{PLACEHOLDER_FLAG}
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: grav_cms_db
        - name: DB_NAME
          value: database
        - name: SECRET_KEY
          value: a7x9Kp2mQ8vR4wYc
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-063-24_grav-cve-2023-37897:app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: grav-cms
  name: grav-cms-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: grav-cms
  type: ClusterIP
