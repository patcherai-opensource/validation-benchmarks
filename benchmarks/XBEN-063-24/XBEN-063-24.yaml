apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: configmgr
  name: configmgr
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmgr
  template:
    metadata:
      labels:
        app: configmgr
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: configmgr_db_pass
        - name: MYSQL_DATABASE
          value: configmgr
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-063-24_ansible-cve-2021-3583:db
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=configmgr_db_pass
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=configmgr_db_pass
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - env:
        - name: DB_HOST
          value: localhost
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: configmgr_db_pass
        - name: DB_NAME
          value: configmgr
        - name: SECRET_KEY
          value: k8s_configmgr_secret_key_prod
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-063-24_ansible-cve-2021-3583:app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: configmgr
  name: configmgr-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: configmgr
  type: ClusterIP
