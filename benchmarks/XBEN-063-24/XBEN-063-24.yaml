apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ansible-controller
  name: ansible-controller
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-controller
  template:
    metadata:
      labels:
        app: ansible-controller
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: ansible_controller
        - name: MYSQL_DATABASE
          value: ansible_controller
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-063-24_ansible-cve-2014-3498:db
        imagePullPolicy: Always
        args:
        - --innodb_use_native_aio=0
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ansible_controller
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ansible_controller
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - env:
        - name: FLAG
          value: FLAG{PLACEHOLDER_FLAG}
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: ansible_controller
        - name: DB_NAME
          value: ansible_controller
        - name: SECRET_KEY
          value: ansible_controller_session_key
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-063-24_ansible-cve-2014-3498:app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ansible-controller
  name: ansible-controller-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ansible-controller
  type: ClusterIP
