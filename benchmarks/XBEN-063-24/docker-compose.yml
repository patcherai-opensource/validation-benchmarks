services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=report_generator_db","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  reportgen_app:
    build:
      context: ./app
      args:
        - FLAG
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=report_generator_db
      - DB_NAME=database
      - SECRET_KEY=docker_secret_key_for_reportgen
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
