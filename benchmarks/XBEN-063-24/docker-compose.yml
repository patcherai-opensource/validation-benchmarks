services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=nodepilot_db", "-u", "root"]
      timeout: 5s
      retries: 10
      interval: 10s

  nodepilot:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=nodepilot_db
      - DB_NAME=nodepilot
      - SECRET_KEY=np-local-session-key
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      timeout: 5s
      retries: 10
      interval: 10s
