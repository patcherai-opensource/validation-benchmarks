<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusGate Cloud Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.15); padding: 40px; width: 400px; }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { color: #1890ff; font-size: 24px; margin-bottom: 8px; }
        .login-header p { color: #999; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; transition: border-color .3s; }
        .form-group input:focus { border-color: #1890ff; outline: none; box-shadow: 0 0 0 2px rgba(24,144,255,.2); }
        .login-btn { width: 100%; padding: 10px; background: #1890ff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background .3s; }
        .login-btn:hover { background: #40a9ff; }
        .error-msg { color: #ff4d4f; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
        .footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>NexusGate Cloud</h1>
            <p>Enterprise Microservice Platform v3.7.2</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="account">Account</label>
                <input type="text" id="account" name="account" placeholder="Enter your account" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
        <div class="footer">
            &copy; 2024 NexusGate Cloud Platform
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var account = document.getElementById('account').value;
            var password = document.getElementById('password').value;
            fetch('/api/noToken/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({account: account, password: password, grantType: 'password'})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.code === 0 && data.data && data.data.token) {
                    document.cookie = 'access_token=Bearer ' + data.data.token + '; path=/';
                    window.location.href = '/api/portal';
                } else {
                    var errEl = document.getElementById('errorMsg');
                    errEl.textContent = data.msg || 'Login failed';
                    errEl.style.display = 'block';
                }
            })
            .catch(function() {
                var errEl = document.getElementById('errorMsg');
                errEl.textContent = 'Network error';
                errEl.style.display = 'block';
            });
        });
    </script>
</body>
</html>
