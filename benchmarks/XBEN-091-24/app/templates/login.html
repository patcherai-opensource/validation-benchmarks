<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Cloud Platform – Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
               background: #f0f2f5; display: flex; justify-content: center; align-items: center;
               min-height: 100vh; }
        .login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
                      padding: 40px 36px 32px; width: 380px; }
        .login-card h1 { font-size: 22px; color: #1890ff; margin-bottom: 6px; }
        .login-card p.subtitle { font-size: 13px; color: #999; margin-bottom: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9;
                            border-radius: 4px; font-size: 14px; }
        .form-group input:focus { border-color: #1890ff; outline: none; }
        .btn-login { width: 100%; padding: 10px; background: #1890ff; color: #fff;
                     border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
        .btn-login:hover { background: #40a9ff; }
        .msg { color: #ff4d4f; font-size: 13px; margin-top: 12px; display: none; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #bbb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Lamp Cloud Platform</h1>
        <p class="subtitle">Enterprise Microservice Management Console</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="account">Account</label>
                <input type="text" id="account" name="account" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
            <p class="msg" id="errMsg"></p>
        </form>
        <div class="footer">&copy; 2023 Lamp Cloud &middot; v3.7.0</div>
    </div>
    <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var account = document.getElementById('account').value;
        var password = document.getElementById('password').value;
        fetch('/api/oauth/token', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({account: account, password: password})
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.code === 0) {
                localStorage.setItem('token', d.data.token);
                window.location.href = '/api/user/info';
            } else {
                var el = document.getElementById('errMsg');
                el.textContent = d.msg || 'Login failed';
                el.style.display = 'block';
            }
        })
        .catch(function() {
            var el = document.getElementById('errMsg');
            el.textContent = 'Network error';
            el.style.display = 'block';
        });
    });
    </script>
</body>
</html>
