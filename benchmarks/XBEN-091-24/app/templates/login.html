<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Sentry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #1b1124; color: #e0dce5; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .login-card { background: #2c2138; border-radius: 8px; padding: 40px;
                  width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.3); }
    .login-card h1 { font-size: 22px; margin-bottom: 8px; color: #f5f3f7; }
    .login-card p.sub { font-size: 13px; color: #9386a0; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #c4b8d3; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%; padding: 10px 12px; border: 1px solid #3d3350; border-radius: 4px;
      background: #1b1124; color: #e0dce5; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #6c5fc7; }
    button { width: 100%; padding: 10px; background: #6c5fc7; color: #fff; border: none;
             border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #5b4fb5; }
    .error-msg { background: #3d1e36; color: #f87171; padding: 10px; border-radius: 4px;
                 font-size: 13px; margin-bottom: 16px; border: 1px solid #5c2848; }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo svg { width: 40px; height: 40px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg viewBox="0 0 72 66" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M29 2.013a4.006 4.006 0 0 0-6.94 0L.32 40.263a4.003 4.003 0 0 0-.08 3.98 4.006 4.006 0 0 0 3.55 2.097h10.68a4.003 4.003 0 0 0 3.47-2.01l9.58-16.6a8.008 8.008 0 0 1 6.94-4.02 8.003 8.003 0 0 1 6.94 4.02l9.58 16.6a4.004 4.004 0 0 0 3.47 2.01h10.68a4.006 4.006 0 0 0 3.55-2.097 4.003 4.003 0 0 0-.08-3.98L46.94 2.013a4.006 4.006 0 0 0-6.94 0L25.52 28.263" stroke="#6c5fc7" stroke-width="3"/>
      </svg>
    </div>
    <h1>Sign In</h1>
    <p class="sub">Sign in to your Sentry account</p>
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/auth/login/">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="password" required>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
