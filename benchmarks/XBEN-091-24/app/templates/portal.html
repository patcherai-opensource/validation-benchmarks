<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusGate Cloud Platform - Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
        .header { background: #001529; color: #fff; padding: 0 24px; height: 48px; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 16px; font-weight: 500; }
        .header .user-info { font-size: 13px; color: rgba(255,255,255,.65); }
        .content { max-width: 960px; margin: 24px auto; padding: 0 24px; }
        .card { background: #fff; border-radius: 4px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .card h2 { font-size: 16px; color: #333; margin-bottom: 12px; }
        .card p { color: #666; font-size: 14px; line-height: 1.6; }
        .nav-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
        .nav-link { display: block; padding: 12px 16px; background: #fafafa; border: 1px solid #e8e8e8; border-radius: 4px; color: #1890ff; text-decoration: none; font-size: 14px; }
        .nav-link:hover { background: #e6f7ff; border-color: #1890ff; }
        .login-prompt { text-align: center; padding: 40px; }
        .login-prompt a { color: #1890ff; text-decoration: none; }
        #userSection, #guestSection { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NexusGate Cloud Platform</h1>
        <span class="user-info" id="userDisplay"></span>
    </div>
    <div class="content">
        <div id="guestSection">
            <div class="card login-prompt">
                <h2>Welcome to NexusGate Cloud</h2>
                <p>Please <a href="/api/noToken/login">sign in</a> to access the platform.</p>
            </div>
        </div>
        <div id="userSection">
            <div class="card">
                <h2>Platform Overview</h2>
                <p>NexusGate Cloud is an enterprise-grade microservice platform providing authentication, authorization, and service governance.</p>
            </div>
            <div class="card">
                <h2>Quick Navigation</h2>
                <div class="nav-links" id="navLinks"></div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var token = (document.cookie.match(/access_token=([^;]+)/) || [])[1] || '';
            if (!token) {
                document.getElementById('guestSection').style.display = 'block';
                return;
            }
            fetch('/api/user/info', {headers: {'Authorization': token}})
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.code === 0 && data.data) {
                    document.getElementById('userSection').style.display = 'block';
                    document.getElementById('userDisplay').textContent = data.data.name + ' (' + data.data.role + ')';
                    return fetch('/api/menu/router', {headers: {'Authorization': token}});
                } else {
                    document.getElementById('guestSection').style.display = 'block';
                }
            })
            .then(function(r) { if (r) return r.json(); })
            .then(function(data) {
                if (data && data.code === 0) {
                    var container = document.getElementById('navLinks');
                    data.data.forEach(function(m) {
                        var a = document.createElement('a');
                        a.className = 'nav-link';
                        a.href = '#';
                        a.textContent = m.name;
                        container.appendChild(a);
                    });
                }
            })
            .catch(function() {
                document.getElementById('guestSection').style.display = 'block';
            });
        })();
    </script>
</body>
</html>
