<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - CloudVault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; }
        .header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header h1 span { color: #4f8cff; }
        .admin-badge { background: #e74c3c; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; margin-left: 12px; }
        .nav a { color: #aaa; text-decoration: none; font-size: 14px; margin-left: 20px; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .section { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section h2 { color: #1a1a2e; margin-bottom: 16px; font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .admin-card { background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; }
        .admin-card h3 { color: #1a1a2e; margin-bottom: 8px; }
        .admin-card a { color: #4f8cff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display: flex; align-items: center;">
            <h1>Cloud<span>Vault</span></h1>
            <span class="admin-badge">ADMIN</span>
        </div>
        <nav class="nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/admin/panel">Admin Panel</a>
            <a href="/auth/logout" style="color: #ff6b6b;">Logout</a>
        </nav>
    </div>
    <div class="container">
        <div class="section">
            <h2>Administration Tools</h2>
            <div class="grid">
                <div class="admin-card">
                    <h3>📊 Audit Logs</h3>
                    <a href="/api/v1/audit/logs">View Logs</a>
                </div>
                <div class="admin-card">
                    <h3>👥 User Management</h3>
                    <a href="/api/v1/users/me">User Info</a>
                </div>
                <div class="admin-card">
                    <h3>📁 All Documents</h3>
                    <a href="/api/v1/documents">Browse</a>
                </div>
                <div class="admin-card">
                    <h3>💾 System Export</h3>
                    <a href="/admin/system/export">Export Config</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
