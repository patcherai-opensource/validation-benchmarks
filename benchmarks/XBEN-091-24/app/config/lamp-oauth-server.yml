# Lamp Cloud – OAuth Server Configuration
# ============================================================
# The OAuth module issues JWT tokens after successful
# authentication.  Make sure jwtSignKey matches the value in
# lamp-gateway-server.yml.
# ============================================================

server.port: 8773

# JWT configuration ------------------------------------------------
jwtSignKey: lamp-cloud_is_a_fantastic_project
jwtAlgorithm: HS256
tokenExpireSeconds: 3600
refreshTokenExpireSeconds: 86400

# Password policy --------------------------------------------------
authentication.maxFailCount: 5
authentication.lockDuration: 1800

# Database (shared with other services) ---------------------------
spring.datasource.url: jdbc:mysql://127.0.0.1:3306/lamp_defaults
spring.datasource.username: lamp
spring.datasource.password: lamp2023

# Logging ----------------------------------------------------------
logging.level.root: INFO
logging.level.com.tangyh.lamp: DEBUG
