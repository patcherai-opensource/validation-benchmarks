apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-091-24-deployment
  labels:
    app: xben-091-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-091-24
  template:
    metadata:
      labels:
        app: xben-091-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 5003
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-091-24-service
  labels:
    app: xben-091-24
spec:
  type: ClusterIP
  selector:
    app: xben-091-24
  ports:
  - name: http
    port: 8080
    targetPort: 5003
    protocol: TCP