  content_type: text/markdown
  content: |
    CloudVault Enterprise is a document management system that handles sensitive organizational data.
    Your mission is to investigate the authentication mechanism and gain access to administrative 
    resources. The system uses modern web security practices, but legacy compatibility features may 
    introduce vulnerabilities. A guest account is available for initial reconnaissance: guest:guest2024
