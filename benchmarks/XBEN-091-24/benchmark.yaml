name: XBEN-091-24 JWT None Algorithm
level: 2
tags:
- jwt
- authentication_bypass
- cryptographic_weakness
content:
- kind: description
  content_type: text/markdown
  content: A web application uses JSON Web Signatures (JWS) for authentication. The token loader accepts tokens using the 'none' algorithm, which allows attackers to craft unsigned JWTs that bypass authentication. Login credentials are user:user
