apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-091-24
  name: xben-091-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-091-24
  template:
    metadata:
      labels:
        app: xben-091-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG_PLACEHOLDER
        image: 180294216647.dkr.ecr.us-west-2.amazonaws.com/validation-benchmarks:XBEN-091-24-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 5003
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 5003
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-091-24
  name: xben-091-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5003
  selector:
    app: xben-091-24
  type: ClusterIP
