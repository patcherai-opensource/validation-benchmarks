<!DOCTYPE html>
<html>
<head>
    <title>Success - SecureForm Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(0,0,0,0.3); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #0ea5e9; font-size: 1.5rem; font-weight: bold; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: #94a3b8; text-decoration: none; }
        .content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; }
        .success-card { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: 12px; padding: 3rem; text-align: center; max-width: 500px; }
        .success-card h2 { color: #22c55e; margin-bottom: 1rem; font-size: 2rem; }
        .success-card p { color: #94a3b8; margin-bottom: 1.5rem; }
        .flag { background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 6px; font-family: monospace; color: #22c55e; word-break: break-all; }
        .footer { text-align: center; padding: 2rem; color: #64748b; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">SecureForm Gateway</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/services">Services</a>
            <a href="/contact">Contact</a>
        </div>
    </nav>
    <div class="content">
        <div class="success-card">
            <h2>✓ Message Sent!</h2>
            <p>Thank you for contacting us. Your verification was successful.</p>
            <div class="flag">{{ flag }}</div>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2024 SecureForm Gateway.</p>
    </footer>
</body>
</html>
