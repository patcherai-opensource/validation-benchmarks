{% extends "base.html" %}
{% block title %}Sign In - QueryBridge{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin: 3rem auto;">
    <h2>Sign In</h2>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/session/connect">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Sign In</button>
    </form>
</div>
{% endblock %}
