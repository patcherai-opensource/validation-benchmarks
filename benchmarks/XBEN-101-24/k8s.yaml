apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-101-24-app
  labels:
    app: xben-101-24-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-101-24-app
  template:
    metadata:
      labels:
        app: xben-101-24-app
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: FLAG
          value: "FLAG{PLACEHOLDER_WILL_BE_REPLACED}"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-101-24-service
  labels:
    app: xben-101-24-app
spec:
  type: ClusterIP
  selector:
    app: xben-101-24-app
  ports:
  - name: http
    port: 8080
    targetPort: 8000
    protocol: TCP
