apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-101-24-app
  name: xben-101-24-app
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-101-24-app
  template:
    metadata:
      labels:
        app: xben-101-24-app
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG{PLACEHOLDER_WILL_BE_REPLACED}
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
        name: web
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-101-24-app
  name: xben-101-24-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8000
  selector:
    app: xben-101-24-app
  type: ClusterIP
