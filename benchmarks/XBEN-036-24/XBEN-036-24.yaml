apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-036-24-app
  name: xben-036-24-app
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-036-24-app
  template:
    metadata:
      labels:
        app: xben-036-24-app
    spec:
      containers:
      - image: 180294216647.dkr.ecr.us-west-2.amazonaws.com/validation-benchmarks:XBEN-036-24-php
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: php
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-036-24-app
  name: xben-036-24-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: xben-036-24-app
  type: ClusterIP
