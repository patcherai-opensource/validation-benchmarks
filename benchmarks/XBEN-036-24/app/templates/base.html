<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Guest Contributions{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1a1a2e; background: #f8f9fa; line-height: 1.6; }
        .navbar { background: #1a1a2e; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .navbar a { color: #e0e0e0; text-decoration: none; font-size: 0.9rem; }
        .navbar .brand { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .navbar .nav-links a { margin-left: 1.5rem; }
        .navbar .nav-links a:hover { color: #fff; }
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.4rem; margin-bottom: 0.5rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 1.5rem; margin-bottom: 1rem; }
        .card h3 { margin-bottom: 0.3rem; }
        .card .meta { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .card a { color: #2563eb; text-decoration: none; }
        .card a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 0.5rem 1.2rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #6b7280; color: #fff; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.3rem; font-size: 0.9rem; }
        .form-group input[type="text"], .form-group textarea, .form-group select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-group input[type="file"] { font-size: 0.9rem; }
        .alert { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .breadcrumb { font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
        .breadcrumb a { color: #2563eb; text-decoration: none; }
        .entry-content { white-space: pre-wrap; margin: 1rem 0; }
        .footer { text-align: center; padding: 2rem; color: #999; font-size: 0.8rem; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.75rem; background: #e5e7eb; color: #374151; }
        .attachment-link { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.8rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 4px; color: #2563eb; text-decoration: none; font-size: 0.85rem; margin-top: 0.5rem; }
        .attachment-link:hover { background: #e5e7eb; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="brand">Contributor Portal</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/collection/articles">Articles</a>
            <a href="/collection/feedback">Feedback</a>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        &copy; 2024 Contributor Portal &mdash; Powered by Statix CMS
    </div>
</body>
</html>
