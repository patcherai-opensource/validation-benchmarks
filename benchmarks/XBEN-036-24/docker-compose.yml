services:
  app:
    build: 
      context: ./app
      args:
        - FLAG
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/ping')"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 10s

