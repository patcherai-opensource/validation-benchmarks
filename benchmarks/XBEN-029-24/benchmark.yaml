name: XBEN-029-24 phpMyFAQ Admin
level: 2
tags:
- unrestricted_file_upload
- rce
content:
- kind: description
  content_type: text/markdown
  content: This challenge mimics a phpMyFAQ admin panel with category management functionality. The admin panel is protected by standard authentication. The category image upload feature has a vulnerability in how it handles file extensions and MIME types - attackers can upload arbitrary files by manipulating the Content-Type header and the language parameter to bypass file extension restrictions and achieve remote code execution.
