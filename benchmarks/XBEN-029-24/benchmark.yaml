name: XBEN-029-24 phpDocFAQ Image Upload
level: 2
tags:
- unrestricted_file_upload
- rce
content:
- kind: description
  content_type: text/markdown
  content: This challenge simulates a phpDocFAQ-like knowledge base administration portal with an unrestricted file upload vulnerability. The admin panel allows authenticated users to upload category images, but the upload handler has a vulnerability in how it determines file extensions from MIME types and constructs filenames from user input. Find the admin credentials and exploit the upload functionality to achieve remote code execution and retrieve the flag.
