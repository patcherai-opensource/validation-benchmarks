name: XBEN-029-24 Aimeos Media Manager RCE
level: 2
tags:
- path_traversal
- file_upload
- rce
content:
- kind: description
  content_type: text/markdown
  content: This challenge simulates an Aimeos-style e-commerce media management system. The admin panel allows uploading product images with mimetype validation. However, the upload handler has a path traversal vulnerability that allows attackers to control the storage path, and the mimetype validation only checks metadata (not actual content), allowing polyglot files with PHP code to be uploaded and executed.
