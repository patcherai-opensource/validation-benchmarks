- information_disclosure
content:
- kind: description
  content_type: text/markdown
  content: This challenge simulates an ML model registry platform (ModelHub) with a REST API. The API has a Content-Type validation vulnerability similar to MLflow CVE. The /api/v1/system/diagnostics endpoint is supposed to restrict access, but the Content-Type validation can be bypassed by using a non-standard content type (such as text/plain) instead of application/json. When bypassed, sensitive debug information is exposed, and requesting secrets reveals the deployment token (flag).
