apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-054-24
  name: xben-054-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-054-24
  template:
    metadata:
      labels:
        app: xben-054-24
    spec:
      containers:
      - image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-054-24_growi-cve-2019-13337:web
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "3000"
        - name: BASIC_AUTH_USER
          value: "wikiuser"
        - name: BASIC_AUTH_PASS
          value: "Kj8mP2xQ9vL4nR7w"
        livenessProbe:
          httpGet:
            path: /ping
            port: 3000
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /ping
            port: 3000
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-054-24
  name: xben-054-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: web
    port: 8080
    protocol: TCP
    targetPort: 3000
  selector:
    app: xben-054-24
  type: ClusterIP
