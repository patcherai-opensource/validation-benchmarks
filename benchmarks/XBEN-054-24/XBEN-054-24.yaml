apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-054-24
  name: xben-054-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-054-24
  template:
    metadata:
      labels:
        app: xben-054-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG_PLACEHOLDER
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-054-24_pim-community-dev-cve-2022-46157:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          tcpSocket:
            port: 80
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          tcpSocket:
            port: 80
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-054-24
  name: xben-054-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: web
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: xben-054-24
  type: ClusterIP
