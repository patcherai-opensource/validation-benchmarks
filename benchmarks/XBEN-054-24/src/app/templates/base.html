<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Application{% endblock %}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #333; }
        .navbar { background: #263238; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .navbar a { color: #90caf9; text-decoration: none; margin-left: 16px; }
        .navbar .brand { font-size: 18px; font-weight: bold; color: white; }
        .container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 24px; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 8px 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #1565c0; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        label { font-weight: 600; }
        .footer { text-align: center; padding: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="brand">AppBuilder</span>
        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">Powered by Flask AppBuilder</div>
</body>
</html>
