<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # VULNERABLE CONFIGURATION - CVE-2022-46157
    # This directive causes Apache to execute ANY .php file as PHP
    # including files uploaded by users to the uploads/ directory.
    # 
    # The fix would be to use <Location "/index.php"> to restrict
    # PHP execution only to the front controller, not all .php files.
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined

</VirtualHost>
