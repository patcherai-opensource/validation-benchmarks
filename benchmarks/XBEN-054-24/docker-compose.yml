services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 15s
