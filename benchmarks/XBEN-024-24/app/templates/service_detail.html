{% extends "base.html" %}
{% block content %}
<h2>{{ service.name }}</h2>
<div class="service-detail">
    <table class="detail-table">
        <tr>
            <th>Name</th>
            <td>{{ service.name }}</td>
        </tr>
        <tr>
            <th>Type</th>
            <td>{{ service.type }}</td>
        </tr>
        <tr>
            <th>Status</th>
            <td><span class="status-badge {{ service.status }}">{{ service.status }}</span></td>
        </tr>
        <tr>
            <th>Endpoint URL</th>
            <td>{{ service.endpoint }}</td>
        </tr>
        <tr>
            <th>WSDL Location</th>
            <td>{{ service.wsdl }}</td>
        </tr>
        <tr>
            <th>Description</th>
            <td>{{ service.description }}</td>
        </tr>
    </table>
</div>
<a href="{{ url_for('list_services') }}" class="back-link">&larr; Back to Service Registry</a>
{% endblock %}
