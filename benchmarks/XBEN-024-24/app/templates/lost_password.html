{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Lost Password</h2>
    <p>Enter your username or email address to receive a password reset link.</p>
    <form method="post" action="{{ url_for('lost_password') }}">
        <table class="form-table">
            <tr>
                <td class="form-label">Username</td>
                <td><input type="text" name="username" size="32" maxlength="64"></td>
            </tr>
            <tr>
                <td class="form-label">or Email</td>
                <td><input type="text" name="email" size="32" maxlength="128"></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Submit" class="btn"></td>
            </tr>
        </table>
    </form>
    <div class="form-links">
        <a href="{{ url_for('login_page') }}">Back to Login</a>
    </div>
</div>
{% endblock %}
