{% extends "base.html" %}
{% block content %}
<h2>Create ModelServe Account</h2>
<form method="post">
    <label for="username">Username:</label>
    <input type="text" name="username" required placeholder="Choose a username">
    <label for="password">Password:</label>
    <input type="password" name="password" required placeholder="Choose a secure password">
    <label for="display_name">Display Name:</label>
    <input type="text" name="display_name" required placeholder="Your full name">
    <label for="organization">Organization:</label>
    <input type="text" name="organization" required placeholder="Company or team name">
    <label for="email">Email:</label>
    <input type="email" name="email" required placeholder="your.email@example.com">
    <button type="submit">Create Account</button>
</form>
<div class="register-link">
    <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
