{% extends "base.html" %}
{% block title %}Users - CMS Administration{% endblock %}
{% block content %}
<div class="users-page">
    <h2>User Management</h2>
    <table class="data-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Active</th>
            </tr>
        </thead>
        <tbody>
            {% for u in user_list %}
            <tr>
                <td>{{ u.username }}</td>
                <td>{{ u.email }}</td>
                <td>{{ u.role }}</td>
                <td>{{ 'Yes' if u.active else 'No' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/admin/users/create" class="btn">Create User</a>
</div>
{% endblock %}
