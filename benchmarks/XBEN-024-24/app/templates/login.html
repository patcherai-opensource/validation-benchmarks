{% extends "base.html" %}
{% block content %}
<div class="login-container">
    <h2>CMS Authentication Portal</h2>
    <p class="login-subtitle">Enterprise Content Management System</p>
    
    <form method="post" class="login-form">
        <div class="form-group">
            <label for="login">Login:</label>
            <input type="text" name="login" id="login" placeholder="Enter your username" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
    </form>
    
    <div class="login-info">
        <p class="auth-mode">Authentication Mode: Standard + LDAP (Legacy)</p>
        <p class="help-text">Contact your system administrator if you need access.</p>
    </div>
</div>
{% endblock %}
