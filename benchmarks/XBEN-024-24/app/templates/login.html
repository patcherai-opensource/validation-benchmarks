{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="post" action="{{ url_for('login') }}">
        <table class="form-table">
            <tr>
                <td class="form-label">Username</td>
                <td><input type="text" name="username" size="32" maxlength="64" required></td>
            </tr>
            <tr>
                <td class="form-label">Password</td>
                <td><input type="password" name="password" size="32" maxlength="64" required></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Login" class="btn"></td>
            </tr>
        </table>
    </form>
    <div class="form-links">
        <a href="{{ url_for('signup_page') }}">Signup for a new account</a> |
        <a href="{{ url_for('lost_password_page') }}">Lost your password?</a>
    </div>
</div>
{% endblock %}
