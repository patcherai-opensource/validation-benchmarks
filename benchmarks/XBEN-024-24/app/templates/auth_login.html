<!DOCTYPE html>
<html>
<head>
    <title>Login - CMS Administration</title>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="cms-login">
    <div id="login-wrapper">
        <div id="login-logo">
            <h1>CMS Administration</h1>
        </div>
        <div id="login-content">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                    <div class="text error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="/admin/auth">
                <input type="text" name="username" autocomplete="username" placeholder="Username" required autofocus>
                <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <a href="/admin/auth/recover" class="lostpassword">Forgot your password?</a>
            <a href="/admin/auth/register">Create an account</a>
        </div>
    </div>
    <div id="footer">
        &copy; 2009-2024 CMS Platform
    </div>
</body>
</html>
