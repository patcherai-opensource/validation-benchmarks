{% extends "base.html" %}
{% block content %}
<div class="content-section">
    <h2>Issues</h2>
    <table class="issue-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Summary</th>
                <th>Status</th>
                <th>Priority</th>
            </tr>
        </thead>
        <tbody>
            {% for issue in issues.values() %}
            <tr>
                <td><a href="{{ url_for('view_issue', issue_id=issue.id) }}">{{ '%07d' % issue.id }}</a></td>
                <td><a href="{{ url_for('view_issue', issue_id=issue.id) }}">{{ issue.summary }}</a></td>
                <td><span class="status-{{ issue.status }}">{{ issue.status }}</span></td>
                <td>{{ issue.priority }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
