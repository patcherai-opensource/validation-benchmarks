<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MLServe - ML Inference Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>MLServe</h1>
        <span class="tagline">Enterprise ML Inference Platform</span>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('docs') }}">API Docs</a>
            <a href="{{ url_for('upload_legacy') }}">Upload</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; 2024 MLServe Inc. | v3.2.1</p>
    </footer>
</body>
</html>
