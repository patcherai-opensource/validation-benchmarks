<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DataFlow Manager - Apache InLong Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!--
        DataFlow Manager REST API - v1.7.0
        
        Sink Configuration API:
        
        POST /api/sink/save
        - Creates a new data sink configuration
        - Request body: {"sinkType": "MYSQL", "sinkName": "my_sink", "jdbcUrl": "jdbc:mysql://host:port/db"}
        - Note: Dangerous JDBC parameters are filtered for security
        
        POST /api/sink/test  
        - Tests connection to a data sink
        - Request body: {"jdbcUrl": "jdbc:mysql://host:port/db"}
        - Returns connection test results
        
        GET /api/sink/list
        - Lists all configured data sinks
        
        DELETE /api/sink/delete/<id>
        - Deletes a data sink by ID
        
        Security: JDBC URLs are sanitized to remove dangerous parameters like
        allowLoadLocalInfile, autoDeserialize, allowUrlInLocalInfile
    -->

    <header>
        <div class="header-content">
            <h1>🔄 DataFlow Manager</h1>
            <span class="version">v1.7.0</span>
        </div>
        <nav>
            <a href="{{ url_for('index') }}">Dashboard</a>
            <a href="{{ url_for('docs') }}">API Docs</a>
        </nav>
    </header>
    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>DataFlow Manager &copy; 2024 - Data Integration Platform</p>
    </footer>
</body>
</html>
