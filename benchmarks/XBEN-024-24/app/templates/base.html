        BentoML-style Image Processing Service API

        1. `/`
           Method: GET
           Description: Landing page with API documentation.

        2. `/health`
           Method: GET
           Description: Health check endpoint.

        3. `/api/process_image`
           Method: POST
           Description: Process an image for ML inference. Accepts image via file upload or URL.
           Parameters:
           - `image`: File upload, URL string, or JSON with image URL

        4. `/api/analyze`
           Method: POST
           Description: Analyze file and return metadata.
           Parameters:
           - `file`: URL string to analyze

        5. `/internal/metadata`
           Method: GET
           Description: Internal metadata endpoint (localhost only).
           Returns instance credentials and configuration.
    -->
