<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}CMS Administration{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="cms-admin">
    <div id="admin-nav">
        {% if 'username' in session %}
        <div class="nav-bar">
            <div class="nav-brand">CMS Admin</div>
            <div class="nav-links">
                <a href="/admin/portal">Dashboard</a>
                <a href="/admin/email/overview">Email</a>
                <a href="/admin/users">Users</a>
                <a href="/admin/settings/system">Settings</a>
                <a href="/admin/auth/logout">Logout</a>
            </div>
        </div>
        {% endif %}
    </div>
    <div id="content">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="text info">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <div id="footer">
        &copy; 2009-2024 CMS Platform
    </div>
</body>
</html>
