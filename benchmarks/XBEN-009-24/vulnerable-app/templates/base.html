<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>{% block title %}PromptForge{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

        <div class="container">
