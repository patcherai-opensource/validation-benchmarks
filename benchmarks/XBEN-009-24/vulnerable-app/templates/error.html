<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - Prompt Workbench</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8f9fa; color: #333; }
        .error { text-align: center; }
        .error h1 { font-size: 4rem; color: #1a1a2e; margin-bottom: 0.5rem; }
        .error p { color: #666; }
        .error a { color: #2d6a4f; }
    </style>
</head>
<body>
    <div class="error">
        <h1>{{ code }}</h1>
        <p>{{ message }}</p>
        <p><a href="/">Return to home</a></p>
    </div>
</body>
</html>
