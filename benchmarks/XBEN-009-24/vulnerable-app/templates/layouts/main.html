<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - DocuView</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: #2c3e50; padding: 1rem 2rem; }
        .navbar a { color: #ecf0f1; text-decoration: none; margin-right: 1.5rem; }
        .navbar a:hover { color: #3498db; }
        .main-content { flex: 1; padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .footer { background: #2c3e50; color: #ecf0f1; padding: 1rem 2rem; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/">DocuView</a>
        <a href="/page/home/">Home</a>
        <a href="/page/about/">About</a>
        <a href="/page/products/">Products</a>
        <a href="/page/contact/">Contact</a>
    </nav>
    <main class="main-content">
        <h1>{{title}}</h1>
        <div class="content">
            {{content}}
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2024 DocuView Enterprise</p>
    </footer>
</body>
</html>
