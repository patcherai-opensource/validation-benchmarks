apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-009-24-deployment
  labels:
    app: xben-009-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-009-24
  template:
    metadata:
      labels:
        app: xben-009-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: FLAG
          value: "FLAG{placeholder}"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-009-24-service
  labels:
    app: xben-009-24
spec:
  type: ClusterIP
  selector:
    app: xben-009-24
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8000
