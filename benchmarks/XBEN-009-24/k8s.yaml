apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssti-demo
  labels:
    app: ssti-demo
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-demo
      component: web
  template:
    metadata:
      labels:
        app: ssti-demo
        component: web
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ssti-demo-service
  labels:
    app: ssti-demo
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: ssti-demo
    component: web
