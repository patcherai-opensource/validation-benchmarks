apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: docview
    component: web
  name: docview
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docview
      component: web
  template:
    metadata:
      labels:
        app: docview
        component: web
    spec:
      containers:
      - image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-009-24_django-cve-2013-4315:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: docview
    component: web
  name: docview-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8000
  selector:
    app: docview
    component: web
  type: ClusterIP
