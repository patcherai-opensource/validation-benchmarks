apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: techcorp-hr
    component: web
  name: techcorp-hr
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techcorp-hr
      component: web
  template:
    metadata:
      labels:
        app: techcorp-hr
        component: web
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG_PLACEHOLDER
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-009-24_django-cve-2021-45116:vulnerable-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: vulnerable-app
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: techcorp-hr
    component: web
  name: techcorp-hr-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8000
  selector:
    app: techcorp-hr
    component: web
  type: ClusterIP
