services:
  web:
    build:
      context: ./vulnerable-app
      args:
        - FLAG=${FLAG:-FLAG{placeholder}}
    environment:
      - FLAG=${FLAG:-FLAG{placeholder}}
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      timeout: 1s
      retries: 5
      interval: 10s
