services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=wikidb_platform","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  wiki_platform:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - "8080:80"
    environment:
      - FLAG=${FLAG:-FLAG{default_flag_for_testing}}
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=wikidb_platform
      - DB_NAME=database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
