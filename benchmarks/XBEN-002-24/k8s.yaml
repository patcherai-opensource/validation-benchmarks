apiVersion: apps/v1
kind: Deployment
metadata:
  name: idor-indirect-trading-platform
  labels:
    app: idor-indirect-trading-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idor-indirect-trading-platform
  template:
    metadata:
      labels:
        app: idor-indirect-trading-platform
    spec:
      containers:
      # MySQL Database Container
      - name: db
        image: /:-mysql
        imagePullPolicy: Always
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "idor_indirect_trading_platform"
        - name: MYSQL_DATABASE
          value: "database"
        ports:
        - containerPort: 3306
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=idor_indirect_trading_platform
            - -u
            - root
          initialDelaySeconds: 30
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=idor_indirect_trading_platform
            - -u
            - root
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      
      # Flask Application Container
      - name: app
        image: /:-app
        imagePullPolicy: Always
        env:
        - name: DB_HOST
          value: "localhost"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "idor_indirect_trading_platform"
        - name: DB_NAME
          value: "database"
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 120
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 90
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: idor-indirect-trading-platform-service
  labels:
    app: idor-indirect-trading-platform
spec:
  type: ClusterIP
  selector:
    app: idor-indirect-trading-platform
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP
