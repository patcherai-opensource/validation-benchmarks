<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Hostname - SolusVM Pro</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .navbar {
            background-color: #16213e !important;
            border-bottom: 1px solid #0f3460;
        }
        .card {
            background-color: #16213e;
            border: 1px solid #0f3460;
            color: #eaeaea;
        }
        .card-header {
            background-color: #0f3460;
            border-bottom: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }
        .form-control {
            background-color: #1a1a2e;
            border: 1px solid #0f3460;
            color: #eaeaea;
        }
        .form-control:focus {
            background-color: #1a1a2e;
            border-color: #e94560;
            color: #eaeaea;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">SolusVM Pro</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/servers">My Servers</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" style="background: transparent;">
                        <li class="breadcrumb-item"><a href="/servers" style="color: #e94560;">Servers</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Change Hostname</li>
                    </ol>
                </nav>
                <h2>Change Hostname</h2>
                <p class="text-muted">Server ID: {{ server.id }}</p>
            </div>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Update Server Hostname</h5>
                    </div>
                    <div class="card-body">
                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Current Hostname</label>
                                <input type="text" class="form-control" value="{{ server.hostname }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label for="newhostname" class="form-label">New Hostname</label>
                                <input type="text" class="form-control" id="newhostname" name="newhostname" required placeholder="e.g., server.example.com">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Update Hostname</button>
                                <a href="/servers" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
