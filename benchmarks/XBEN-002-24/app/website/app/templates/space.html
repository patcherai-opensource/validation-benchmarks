<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ space.name }} - XWiki</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .wiki-header { background-color: #3e6b8a; color: white; padding: 10px 0; }
        .wiki-header .navbar { padding: 0; }
        .wiki-header .nav-link { color: rgba(255,255,255,.8) !important; }
        .content-area { margin-top: 20px; }
        .doc-list { background: white; border: 1px solid #ddd; border-radius: 4px; }
        .doc-list .list-group-item { border-left: 0; border-right: 0; }
        .doc-list .list-group-item:first-child { border-top: 0; }
        .doc-list .list-group-item:last-child { border-bottom: 0; }
        .breadcrumb { background: transparent; padding: 0; }
    </style>
</head>
<body>
    <div class="wiki-header">
        <div class="container">
            <nav class="navbar navbar-expand-lg">
                <a class="navbar-brand text-white" href="/dashboard">XWiki</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <span class="text-white me-3">{{ user.first_name }} {{ user.last_name }}</span>
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-light">Log out</button>
                        </form>
                    </div>
                </div>
            </nav>
        </div>
    </div>
    <div class="container content-area">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/dashboard">Wiki</a></li>
                <li class="breadcrumb-item active">{{ space.name }}</li>
            </ol>
        </nav>
        <h2>{{ space.name }}</h2>
        <p class="text-muted">{{ space.description }}</p>
        <div class="doc-list">
            <ul class="list-group">
                {% for doc in documents %}
                <li class="list-group-item">
                    <a href="/wiki/{{ space.name }}/{{ doc.name }}">{{ doc.title or doc.name }}</a>
                    <small class="text-muted float-end">{{ doc.updated_at }}</small>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
