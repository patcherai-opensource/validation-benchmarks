<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password - SolusVM VPS Control Panel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
        }
        .card {
            background-color: #16213e;
            color: #ffffff;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        .brand-logo {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <span class="brand-logo">SolusVM</span>
                <h4 class="mt-2">VPS Control Panel</h4>
            </div>
            <div class="card">
                <div class="card-body">
                    <p class="mt-3 text-center">Welcome back, {{ first_name }}!</p>
                    <form method="POST">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" hidden>
                            <input type="text" class="form-control" id="user_id" name="user_id" value="{{ user_id }}" hidden>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-3">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
