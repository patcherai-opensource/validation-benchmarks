<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password - EventHub Backoffice</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
        }
        .btn-primary {
            background-color: #0f3460;
            border-color: #0f3460;
        }
        .btn-primary:hover {
            background-color: #e94560;
            border-color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-4">EventHub Backoffice</h2>
                <form method="POST">
                    <div class="form-group">
                        <p class="mt-3 text-center">Welcome back, {{ first_name }}!</p>
                        <label for="password">Password</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ username }}" hidden>
                        <input type="text" class="form-control" id="user_id" name="user_id" value="{{ user_id }}" hidden>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Continue</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
