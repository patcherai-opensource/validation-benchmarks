<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change VNC Password - SolusVM VPS Control Panel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
        }
        .card {
            background-color: #16213e;
            color: #ffffff;
        }
        .navbar {
            background-color: #0f3460 !important;
        }
        .brand-logo {
            color: #00d4ff;
            font-weight: bold;
        }
        .password-display {
            background-color: #0d1b2a;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/dashboard">SolusVM</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/servers">My Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/clientarea.php">Client Area</a>
                    </li>
                    <li class="nav-item">
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Change VNC Password</h2>
                <div class="card">
                    <div class="card-header">
                        <h5>Server: {{ server.hostname }} ({{ server.vserverid }})</h5>
                    </div>
                    <div class="card-body">
                        {% if message %}
                        <div class="alert alert-success">
                            {{ message }}
                        </div>
                        {% endif %}
                        
                        <div class="mb-4">
                            <label class="form-label"><strong>Current VNC Password:</strong></label>
                            <div class="password-display">
                                {{ current_password }}
                            </div>
                        </div>
                        
                        <hr style="border-color: #ffffff33;">
                        
                        <form method="GET" action="/clientarea.php">
                            <input type="hidden" name="modop" value="custom">
                            <input type="hidden" name="a" value="ChangeVNCPassword">
                            <input type="hidden" name="vserverid" value="{{ server.vserverid }}">
                            
                            <div class="form-group">
                                <label for="newvncpassword">New VNC Password:</label>
                                <input type="text" class="form-control" id="newvncpassword" name="newvncpassword" placeholder="Enter new VNC password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-secondary mt-3">Change VNC Password</button>
                            <a href="/clientarea.php" class="btn btn-outline-secondary mt-3">Back to Client Area</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
