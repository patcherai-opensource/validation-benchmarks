<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - CloudVPS Control Panel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .navbar {
            background-color: #0f3460 !important;
        }
        .btn-danger {
            background-color: #e94560;
            border-color: #e94560;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">CloudVPS</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/servers">My Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/servers/managed">Managed Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/billing">Billing</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="/support">Support</a>
                    </li>
                    <li class="nav-item">
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h4 class="mb-4">Support Center</h4>
                <div class="card">
                    <div class="card-body">
                        <h5>Need Help?</h5>
                        <p>Our support team is available 24/7 to assist you with any issues.</p>
                        <p><strong>Email:</strong> support@cloudvps.local</p>
                        <p><strong>Emergency Hotline:</strong> +1-800-CLOUDVPS</p>
                        <hr style="border-color: #0f3460;">
                        <p class="text-muted">No open tickets.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
