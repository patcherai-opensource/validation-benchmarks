<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - EquityTrade Pro</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #1a1d23; color: #e0e0e0; }
        .card { background-color: #2a2d35; border: 1px solid #3a3d45; color: #e0e0e0; }
        .navbar { border-bottom: 1px solid #3a3d45; }
        .brand-text { color: #0d6efd; font-weight: 700; }
        table { width: 100%; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #3a3d45; }
        th { color: #8a8d95; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        a { color: #0d6efd; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1e2128;">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><span class="brand-text">EquityTrade</span> Pro</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orders_archive">Archive</a></li>
                    <li class="nav-item"><a class="nav-link" href="/checkout">Settlement</a></li>
                    <li class="nav-item">
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm ml-2">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h2 class="mb-4">Archived Orders</h2>
                <div class="card">
                    <div class="card-body">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Ticker</th>
                                    <th>Type</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th>Receipt</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for order in orders %}
                                <tr>
                                    <td>{{ order.date }}</td>
                                    <td>{{ order.ticker }}</td>
                                    <td>{{ order.operation_type }}</td>
                                    <td>{{ order.quantity }}</td>
                                    <td>${{ order.price }}</td>
                                    <td>${{ order.quantity * order.price }}</td>
                                    <td><a href="#" class="receipt-link" data-order-id="{{ order.id }}">View</a></td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="receiptModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        $(document).ready(function () {
            $('.receipt-link').click(function (event) {
                event.preventDefault();
                var orderId = $(this).data('order-id');
                $.ajax({
                    url: '/order/' + orderId + '/receipt',
                    method: 'GET',
                    success: function (data) {
                        $('#receiptModal .modal-content').html(data);
                        $('#receiptModal').modal('show');
                    },
                    error: function (xhr, status, error) {
                        console.error('Error loading receipt:', error);
                    }
                });
            });
        });
    </script>
</body>
</html>
