<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC Address Search - NetMon Device Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .navbar {
            background-color: #0f3460 !important;
        }
        table {
            width: 100%;
            background-color: #16213e;
            color: #eaeaea;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        .status-active { color: #28a745; }
        .status-inactive { color: #dc3545; }
        .status-restricted { color: #ffc107; }
        .btn-primary {
            background-color: #0f3460;
            border-color: #0f3460;
        }
        .btn-primary:hover {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-outline-light:hover {
            background-color: #e94560;
            border-color: #e94560;
        }
        .search-info {
            font-size: 0.85rem;
            color: #888;
        }
        #error-message {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">NetMon</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/devices">Devices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/search">MAC Search</a>
                    </li>
                    <li class="nav-item">
                        <form action="/logout" method="post" class="ml-2">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h2 class="text-center mb-4">MAC Address Search</h2>
                <div class="card mb-4">
                    <div class="card-body">
                        <form id="search-form">
                            <div class="form-group">
                                <label for="address">MAC Address</label>
                                <input type="text" class="form-control" id="address" name="address" 
                                       placeholder="e.g., 00:1A:2B:3C:4D:5E or 001A2B3C4D5E">
                                <small class="search-info">Search supports partial matches. Separators (: - . space) are automatically removed.</small>
                            </div>
                            <button type="submit" class="btn btn-primary">Search</button>
                        </form>
                        <div id="error-message" class="mt-3"></div>
                    </div>
                </div>
                
                <div class="card" id="results-card" style="display: none;">
                    <div class="card-header">
                        Search Results (<span id="result-count">0</span> devices found)
                    </div>
                    <div class="card-body">
                        <table class="table" id="results-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Hostname</th>
                                    <th>MAC Address</th>
                                    <th>IP Address</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Location</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody id="results-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        $(document).ready(function() {
            $('#search-form').on('submit', function(e) {
                e.preventDefault();
                
                var address = $('#address').val();
                $('#error-message').text('');
                $('#results-body').empty();
                
                $.ajax({
                    url: '/api/search/mac',
                    method: 'POST',
                    data: { address: address },
                    success: function(response) {
                        $('#results-card').show();
                        $('#result-count').text(response.count);
                        
                        if (response.devices && response.devices.length > 0) {
                            response.devices.forEach(function(device) {
                                var statusClass = 'status-' + device.status;
                                var row = '<tr>' +
                                    '<td>' + device.id + '</td>' +
                                    '<td>' + device.hostname + '</td>' +
                                    '<td><code>' + device.mac_address + '</code></td>' +
                                    '<td>' + device.ip_address + '</td>' +
                                    '<td>' + device.device_type + '</td>' +
                                    '<td class="' + statusClass + '">' + device.status + '</td>' +
                                    '<td>' + device.location + '</td>' +
                                    '<td>' + device.notes + '</td>' +
                                    '</tr>';
                                $('#results-body').append(row);
                            });
                        }
                    },
                    error: function(xhr) {
                        var errorMsg = 'Search failed';
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            errorMsg += ': ' + xhr.responseJSON.error;
                        }
                        $('#error-message').text(errorMsg);
                        $('#results-card').hide();
                    }
                });
            });
        });
    </script>
</body>
</html>
