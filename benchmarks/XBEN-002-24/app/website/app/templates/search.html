<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Orders - Trading Platform</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
            color: #ffffff;
        }
        .card {
            background-color: #34495e;
            color: #ffffff;
        }
        table {
            width: 100%;
            background-color: #34495e;
            color: #ffffff;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ffffff;
        }
        .search-box {
            background-color: #34495e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .error-message {
            color: #e74c3c;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Trading Platform</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/orders">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/orders_archive">Orders Archive</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/search">Search</a>
                    </li>
                    <li class="nav-item">
                        <form action="/logout" method="post">
                            <button type="submit" class="btn btn-success">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Search Orders by Ticker</h2>
                <div class="search-box">
                    <form id="searchForm">
                        <div class="form-group">
                            <label for="ticker">Ticker Symbol</label>
                            <input type="text" class="form-control" id="ticker" name="ticker" placeholder="Enter ticker symbol (e.g., SPY, AAPL, MSFT)">
                            <small class="form-text text-muted">Search for orders by ticker symbol. Partial matches are supported.</small>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Search</button>
                    </form>
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </div>
                <div class="card" id="resultsCard" style="display: none;">
                    <div class="card-body">
                        <h5 class="card-title">Search Results</h5>
                        <table id="resultsTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Date</th>
                                    <th>Ticker</th>
                                    <th>Operation Type</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        $(document).ready(function () {
            $('#searchForm').submit(function (event) {
                event.preventDefault();
                var ticker = $('#ticker').val();
                
                $('#errorMessage').hide();
                $('#resultsCard').hide();
                
                $.ajax({
                    url: '/api/search',
                    method: 'POST',
                    data: { ticker: ticker },
                    success: function (data) {
                        if (data.orders && data.orders.length > 0) {
                            var tbody = $('#resultsBody');
                            tbody.empty();
                            data.orders.forEach(function(order) {
                                tbody.append(
                                    '<tr>' +
                                    '<td>' + order.id + '</td>' +
                                    '<td>' + order.date + '</td>' +
                                    '<td>' + order.ticker + '</td>' +
                                    '<td>' + order.operation_type + '</td>' +
                                    '<td>' + order.quantity + '</td>' +
                                    '<td>$ ' + order.price + '</td>' +
                                    '</tr>'
                                );
                            });
                            $('#resultsCard').show();
                        } else {
                            $('#errorMessage').text('No orders found matching your search.').show();
                        }
                    },
                    error: function (xhr, status, error) {
                        var errorMsg = 'Error searching orders';
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            errorMsg += ': ' + xhr.responseJSON.error;
                        }
                        $('#errorMessage').text(errorMsg).show();
                    }
                });
            });
        });
    </script>

</body>
</html>
