<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaces - Wiki Platform</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .wiki-header { background-color: #3e6b89; color: white; padding: 15px; }
        .wiki-header a { color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg wiki-header">
        <div class="container">
            <a class="navbar-brand" href="/">Wiki Platform</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/wiki/spaces">Spaces</a>
                {% if user %}
                <span class="nav-link">{{ user.display_name }}</span>
                <form action="/logout" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
                {% else %}
                <a class="nav-link" href="/login">Log in</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <h3>Wiki Spaces</h3>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search documents..." autocomplete="off">
                    <button class="btn btn-outline-primary" id="searchBtn">Search</button>
                </div>
                <div id="searchResults" class="list-group" style="position:absolute;z-index:100;"></div>
            </div>
        </div>
        <div class="row mt-3">
            {% for space in spaces %}
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <a href="/wiki/space/{{ space.name }}">{{ space.display_name }}</a>
                        </h5>
                        <p class="card-text text-muted">{{ space.description or '' }}</p>
                        <span class="badge {% if space.visibility == 'public' %}bg-success{% else %}bg-warning{% endif %}">
                            {{ space.visibility }}
                        </span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script>
    $(document).ready(function() {
        var timer;
        $('#searchInput').on('input', function() {
            clearTimeout(timer);
            var val = $(this).val();
            if (val.length < 2) { $('#searchResults').empty(); return; }
            timer = setTimeout(function() {
                $.getJSON('/wiki/api/query', {input: val, q: val + '*', nb: 5, media: 'json'}, function(data) {
                    var html = '';
                    if (data.results) {
                        data.results.forEach(function(r) {
                            html += '<a class="list-group-item list-group-item-action" href="/wiki/doc/' + r.id + '">' + (r.title || r.reference) + '</a>';
                        });
                    }
                    $('#searchResults').html(html || '<span class="list-group-item text-muted">No results</span>');
                });
            }, 300);
        });
        $('#searchBtn').click(function() { $('#searchInput').trigger('input'); });
    });
    </script>
</body>
</html>
