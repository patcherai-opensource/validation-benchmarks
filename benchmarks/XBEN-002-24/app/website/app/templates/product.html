{% extends "base.html" %}
{% block title %}{{ product.name }} - Storefront{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Shop</a></li>
        <li class="breadcrumb-item active">{{ product.name }}</li>
    </ol>
</nav>
<div class="row">
    <div class="col-md-8">
        <h2>{{ product.name }}</h2>
        <p class="lead">${{ product.price }}</p>
        <p>{{ product.description }}</p>
        <p class="text-muted">SKU: {{ product.sku }} &middot; {{ product.stock_quantity }} in stock</p>
        <form action="/checkout" method="POST">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1" max="{{ product.stock_quantity }}" style="width: 80px;">
            </div>
            <div class="form-group">
                <label for="billing_name">Billing Name</label>
                <input type="text" class="form-control" id="billing_name" name="billing_name" required>
            </div>
            <div class="form-group">
                <label for="billing_email">Billing Email</label>
                <input type="email" class="form-control" id="billing_email" name="billing_email" required>
            </div>
            <button type="submit" class="btn btn-primary">Add to Cart &amp; Checkout</button>
        </form>
    </div>
</div>
{% endblock %}
