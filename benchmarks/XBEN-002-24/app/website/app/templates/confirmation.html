<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - ShopCart</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
        }
        .navbar {
            background-color: #ff6b35 !important;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
        }
        .brand-header {
            color: white;
            font-weight: bold;
        }
        .confirmation-box {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand brand-header" href="#">🛒 ShopCart</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/my-orders">My Orders</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">✓ Order Confirmed</h4>
                    </div>
                    <div class="card-body">
                        <h5>Order #{{ order.id }}</h5>
                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Product:</strong> {{ order.product_name }}
                            </div>
                            <div class="col-md-6">
                                <strong>Date:</strong> {{ order.date }}
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Quantity:</strong> {{ order.quantity }}
                            </div>
                            <div class="col-md-6">
                                <strong>Price:</strong> ${{ order.price }}
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <strong>Payment Intent:</strong> <code>{{ order.payment_intent }}</code>
                            </div>
                        </div>
                        <hr>
                        <div class="confirmation-box">
                            <h5>Payment Confirmation</h5>
                            <p class="mb-0">{{ order.confirmation }}</p>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="/my-orders" class="btn btn-primary">Back to My Orders</a>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
