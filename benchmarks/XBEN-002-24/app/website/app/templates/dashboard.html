<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - ShopCart</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
        }
        .navbar {
            background-color: #ff6b35 !important;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
        }
        .brand-header {
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand brand-header" href="#">🛒 ShopCart</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/my-orders">My Orders</a>
                    </li>
                    <li class="nav-item">
                        <form action="/account/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">Sign Out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h3 class="mb-4">My Account</h3>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Welcome, {{ user.first_name }} {{ user.last_name }}!</h5>
                        <p class="card-text">Manage your orders and account settings.</p>
                        <a href="/my-orders" class="btn btn-primary">View My Orders</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
