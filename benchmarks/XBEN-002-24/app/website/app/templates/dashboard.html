<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EventHub Backoffice</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
        }
        .navbar {
            background-color: #0f3460 !important;
        }
        .btn-danger {
            background-color: #e94560;
            border-color: #e94560;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">EventHub Backoffice</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/api/events">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/api/events/disabled">Disabled Events</a>
                    </li>
                    <li class="nav-item">
                        <form action="/logout" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Admin Dashboard</h2>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Welcome, {{ user.first_name }} {{ user.last_name }}</h5>
                        <p class="card-text"><strong>Organization:</strong> {{ user.organization.name }}</p>
                        <p class="card-text"><strong>Role:</strong> {{ user.role }}</p>
                        <p class="card-text"><strong>User ID:</strong> {{ user.id }}</p>
                        <hr style="border-color: #444;">
                        <p class="card-text text-muted">Use the navigation above to manage events for your organization.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
