<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EquityTrade Pro</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #1a1d23; color: #e0e0e0; }
        .card { background-color: #2a2d35; border: 1px solid #3a3d45; color: #e0e0e0; }
        .navbar { border-bottom: 1px solid #3a3d45; }
        .brand-text { color: #0d6efd; font-weight: 700; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1e2128;">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><span class="brand-text">EquityTrade</span> Pro</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orders_archive">Archive</a></li>
                    <li class="nav-item"><a class="nav-link" href="/checkout">Settlement</a></li>
                    <li class="nav-item">
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm ml-2">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="mb-4">Dashboard</h2>
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Welcome back, {{ user.first_name }} {{ user.last_name }}</h5>
                        <p class="card-text">Manage your trades, view settlement status, and access your order archive.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
