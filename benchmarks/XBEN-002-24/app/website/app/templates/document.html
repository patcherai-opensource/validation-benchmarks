<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ document.title }} - XWiki</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .wiki-header { background-color: #3e6b8a; color: white; padding: 10px 0; }
        .wiki-header .navbar { padding: 0; }
        .wiki-header .nav-link { color: rgba(255,255,255,.8) !important; }
        .content-area { margin-top: 20px; }
        .doc-content { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 25px; }
        .doc-meta { color: #666; font-size: 0.85em; margin-bottom: 15px; }
        .breadcrumb { background: transparent; padding: 0; }
    </style>
</head>
<body>
    <div class="wiki-header">
        <div class="container">
            <nav class="navbar navbar-expand-lg">
                <a class="navbar-brand text-white" href="/dashboard">XWiki</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <span class="text-white me-3">{{ user.first_name }} {{ user.last_name }}</span>
                        <form action="/logout" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-light">Log out</button>
                        </form>
                    </div>
                </div>
            </nav>
        </div>
    </div>
    <div class="container content-area">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/dashboard">Wiki</a></li>
                <li class="breadcrumb-item"><a href="/wiki/{{ space.name }}/">{{ space.name }}</a></li>
                <li class="breadcrumb-item active">{{ document.name }}</li>
            </ol>
        </nav>
        <div class="doc-content">
            <h1>{{ document.title }}</h1>
            <div class="doc-meta">
                <span>Created by {{ document.creator_name }}</span> |
                <span>Version {{ document.version }}</span> |
                <span>Last modified: {{ document.updated_at }}</span>
            </div>
            <hr>
            <div class="doc-body">
                {{ document.content }}
            </div>
        </div>
    </div>
</body>
</html>
