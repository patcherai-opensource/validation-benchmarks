<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alf.io Backoffice - Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
        }
        .card {
            background-color: #16213e;
            color: #ffffff;
            border: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }
        .brand-title {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h1 class="brand-title">alf.io</h1>
                    <h4>Backoffice Admin Panel</h4>
                    <p class="text-muted">Multi-tenant Event Management System</p>
                </div>
                <div class="card">
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}
                        <form method="POST">
                            <div class="form-group mb-3">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <small class="text-muted">Authorized access only. All activities are logged.</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
