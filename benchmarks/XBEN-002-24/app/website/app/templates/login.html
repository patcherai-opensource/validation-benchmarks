<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wiki Platform</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 400px; margin: 80px auto; }
        .wiki-header { background-color: #3e6b89; color: white; padding: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="wiki-header">
        <h3>Wiki Platform</h3>
    </div>
    <div class="container login-container">
        <div class="card">
            <div class="card-header"><strong>Sign In</strong></div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/login">
                    <div class="form-group mb-3">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block w-100">Log in</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
