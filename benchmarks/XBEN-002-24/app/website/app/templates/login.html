<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudVPS Control Panel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
        }
        .btn-primary {
            background-color: #0f3460;
            border-color: #0f3460;
        }
        .btn-primary:hover {
            background-color: #e94560;
            border-color: #e94560;
        }
        .login-header {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h2 class="login-header">CloudVPS</h2>
                    <p class="text-muted">Virtual Server Control Panel</p>
                </div>
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <div class="card p-4">
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                    </form>
                </div>
                <p class="text-center mt-3 text-muted small">CloudVPS Control Panel v4.1.2</p>
            </div>
        </div>
    </div>
</body>
</html>
