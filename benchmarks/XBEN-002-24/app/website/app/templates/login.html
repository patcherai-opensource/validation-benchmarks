<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EquityTrade Pro</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1d23;
            color: #e0e0e0;
        }
        .login-card {
            background-color: #2a2d35;
            border: 1px solid #3a3d45;
            border-radius: 8px;
            padding: 2rem;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
        }
        .brand-text {
            color: #0d6efd;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-4"><span class="brand-text">EquityTrade</span> Pro</h2>
                <div class="login-card">
                    {% if error %}
                        <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                    </form>
                </div>
                <p class="text-center mt-3 text-muted" style="font-size: 0.85rem;">&copy; 2024 EquityTrade Pro. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
