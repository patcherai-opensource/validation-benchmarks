<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NetMon Pro</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #0f3460;
            border-color: #0f3460;
        }
        .btn-primary:hover {
            background-color: #e94560;
            border-color: #e94560;
        }
        .form-control {
            background-color: #1a1a2e;
            border-color: #0f3460;
            color: #eaeaea;
        }
        .form-control:focus {
            background-color: #1a1a2e;
            color: #eaeaea;
            border-color: #e94560;
        }
        .logo-text {
            color: #e94560;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center mb-2"><span class="logo-text">NetMon</span> Pro</h2>
                <p class="text-center text-muted mb-4">Network Monitoring System v2.3.1</p>
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <div class="card p-4">
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                    </form>
                </div>
                <p class="text-center text-muted mt-3"><small>NetMon Pro &copy; 2024</small></p>
            </div>
        </div>
    </div>
</body>
</html>
