<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - XWiki</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .login-container { max-width: 400px; margin: 80px auto; }
        .wiki-header { background-color: #3e6b8a; color: white; padding: 15px 20px; }
        .wiki-header h1 { font-size: 1.4em; margin: 0; }
        .panel { border: 1px solid #ddd; border-radius: 4px; background: white; }
        .panel-body { padding: 25px; }
        .btn-primary { background-color: #3e6b8a; border-color: #35607d; }
        .btn-primary:hover { background-color: #35607d; }
    </style>
</head>
<body>
    <div class="wiki-header">
        <div class="container">
            <h1>XWiki - Enterprise Wiki</h1>
        </div>
    </div>
    <div class="login-container">
        <div class="panel">
            <div class="panel-body">
                <h3 class="text-center">Log in</h3>
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/">
                    <div class="form-group mb-3">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block w-100">Log in</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
