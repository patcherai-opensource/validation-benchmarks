<!-- credentials.html -->
<div class="modal-header" style="background-color: #0f3460;">
    <h5 class="modal-title" id="credentialsModalLabel">Server Credentials</h5>
    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body" style="background-color: #16213e;">
    <div class="container">
        <div class="row">
            <div class="col">
                <p><strong>Server ID:</strong> {{ server.id }}</p>
                <p><strong>Hostname:</strong> {{ server.hostname }}</p>
                <p><strong>IP Address:</strong> {{ server.ip_address }}</p>
                <hr style="border-color: #0f3460;"> 
                <p><strong>Root Password:</strong></p>
                <code class="text-warning" style="word-break: break-all;">{{ server.root_password }}</code>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer" style="background-color: #0f3460;">
    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
</div>
