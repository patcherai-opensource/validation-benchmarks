<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Details - NetMon Device Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .navbar {
            background-color: #0f3460 !important;
        }
        .btn-outline-light:hover {
            background-color: #e94560;
            border-color: #e94560;
        }
        .status-active { color: #28a745; }
        .status-inactive { color: #dc3545; }
        .status-restricted { color: #ffc107; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">NetMon</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/devices">Devices</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/search">MAC Search</a>
                    </li>
                    <li class="nav-item">
                        <form action="/logout" method="post" class="ml-2">
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Device Details</h2>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ device.hostname }}</h5>
                        <hr style="border-color: #0f3460;">
                        <p><strong>MAC Address:</strong> <code>{{ device.mac_address }}</code></p>
                        <p><strong>IP Address:</strong> {{ device.ip_address }}</p>
                        <p><strong>Device Type:</strong> {{ device.device_type }}</p>
                        <p><strong>Status:</strong> <span class="status-{{ device.status }}">{{ device.status }}</span></p>
                        <p><strong>Location:</strong> {{ device.location }}</p>
                        <p><strong>Notes:</strong> {{ device.notes }}</p>
                        <hr style="border-color: #0f3460;">
                        <a href="/devices" class="btn btn-outline-light">Back to Devices</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
