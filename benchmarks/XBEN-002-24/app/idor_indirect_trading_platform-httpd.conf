<VirtualHost *:80>
    DocumentRoot /var/www/wiki_platform/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /wiki_platform python-path=/var/www/wiki_platform/
    WSGIProcessGroup /wiki_platform
    WSGIScriptAlias / /var/www/wiki_platform/wiki_platform.wsgi

    <Directory "/var/www/wiki_platform/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /wiki_platform
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
