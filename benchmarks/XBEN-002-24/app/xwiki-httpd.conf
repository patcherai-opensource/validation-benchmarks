<VirtualHost *:80>
    DocumentRoot /var/www/xwiki_platform/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off
    ServerTokens Prod
    
    WSGIDaemonProcess /xwiki_platform python-path=/var/www/xwiki_platform/
    WSGIProcessGroup /xwiki_platform
    WSGIScriptAlias / /var/www/xwiki_platform/xwiki.wsgi

    <Directory "/var/www/xwiki_platform/app/">
        WSGIProcessGroup /xwiki_platform
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
