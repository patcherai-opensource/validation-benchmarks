apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: netguard-platform
  name: netguard-platform-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netguard-platform
  template:
    metadata:
      labels:
        app: netguard-platform
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: toctou_admin_router
        - name: MYSQL_DATABASE
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-088-24_wildfly-elytron-cve-2023-6236:db
        imagePullPolicy: Always
        args: ["--innodb_use_native_aio=0"]
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=toctou_admin_router
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=toctou_admin_router
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - env:
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: toctou_admin_router
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_NAME
          value: database
        - name: SECRET_KEY
          value: a7f3b9e2c1d4f8096e5a3b7d2c8f1e4a9b6d3f7e0c2a5b8d1f4e7a0c3b6d9f2
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-088-24_wildfly-elytron-cve-2023-6236:netguard-platform
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: netguard-platform
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: netguard-platform
  name: netguard-platform-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: netguard-platform
  type: ClusterIP
