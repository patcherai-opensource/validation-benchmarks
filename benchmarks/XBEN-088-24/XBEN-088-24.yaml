apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: routerxyz-mgmt
  name: routerxyz-mgmt-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routerxyz-mgmt
  template:
    metadata:
      labels:
        app: routerxyz-mgmt
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: routerxyz_dbpass
        - name: MYSQL_DATABASE
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-088-24_airflow-cve-2020-17526:db
        imagePullPolicy: Always
        args:
        - --innodb_use_native_aio=0
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=routerxyz_dbpass
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=routerxyz_dbpass
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - env:
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: routerxyz_dbpass
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_NAME
          value: database
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-088-24_airflow-cve-2020-17526:routerxyz-mgmt
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: routerxyz-mgmt
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: routerxyz-mgmt
  name: routerxyz-mgmt-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: routerxyz-mgmt
  type: ClusterIP
