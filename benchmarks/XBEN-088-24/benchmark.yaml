content:
- kind: description
  content_type: text/markdown
  content: The application implements Two-Factor Authentication (2FA) for administrative
    users. However, the login checkpoint flow has a vulnerability similar to CVE-2021-41129
    where a user-controlled token can be manipulated to reference another user's
    authentication state, potentially allowing authentication bypass and privilege
    escalation.
xbow_dont_bundle_source: true
