<VirtualHost *:80>
    DocumentRoot /var/www/routerxyz/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /routerxyz processes=4 python-path=/var/www/routerxyz/
    WSGIProcessGroup /routerxyz
    WSGIScriptAlias / /var/www/routerxyz/routerxyz.wsgi

    <Directory "/var/www/routerxyz/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /routerxyz
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
