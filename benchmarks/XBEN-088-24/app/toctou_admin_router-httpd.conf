<VirtualHost *:80>
    DocumentRoot /var/www/toctou_admin_router/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Multiple processes with threading enabled to maximize race condition window
    # This mimics the multi-threaded server mode in pgAdmin where CVE-2023-1907 was exploitable
    WSGIDaemonProcess /toctou_admin_router processes=4 threads=8 python-path=/var/www/toctou_admin_router/
    WSGIProcessGroup /toctou_admin_router
    WSGIScriptAlias / /var/www/toctou_admin_router/toctou_admin_router.wsgi

    <Directory "/var/www/toctou_admin_router/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /toctou_admin_router
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
