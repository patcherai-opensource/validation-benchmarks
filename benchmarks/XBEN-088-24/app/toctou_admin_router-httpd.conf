<VirtualHost *:80>
    DocumentRoot /var/www/toctou_admin_router/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    # Single process with multiple threads - allows race conditions on shared state
    WSGIDaemonProcess /dbadmin_pro processes=1 threads=25 python-path=/var/www/toctou_admin_router/
    WSGIProcessGroup /dbadmin_pro
    WSGIScriptAlias / /var/www/toctou_admin_router/toctou_admin_router.wsgi

    <Directory "/var/www/toctou_admin_router/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /dbadmin_pro
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
