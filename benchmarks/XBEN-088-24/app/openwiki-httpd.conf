<VirtualHost *:80>
    DocumentRoot /var/www/openwiki/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /openwiki processes=10 python-path=/var/www/openwiki/
    WSGIProcessGroup /openwiki
    WSGIScriptAlias / /var/www/openwiki/openwiki.wsgi

    <Directory "/var/www/openwiki/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /openwiki
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
