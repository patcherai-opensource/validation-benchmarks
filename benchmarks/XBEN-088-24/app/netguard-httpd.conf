<VirtualHost *:80>
    DocumentRoot /var/www/netguard_platform/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess netguard processes=4 python-path=/var/www/netguard_platform/
    WSGIProcessGroup netguard
    WSGIScriptAlias / /var/www/netguard_platform/netguard.wsgi

    <Directory "/var/www/netguard_platform/app/">
        WSGIProcessGroup netguard
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
