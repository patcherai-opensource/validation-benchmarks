<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - {{ tenant.display_name }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .sidebar { background-color: #161b22; border-right: 1px solid #30363d; min-height: 100vh; padding: 20px 16px; }
        .sidebar .brand { color: #58a6ff; font-size: 1.1em; font-weight: 600; margin-bottom: 24px; }
        .sidebar .tenant-name { color: #8b949e; font-size: 0.85em; margin-bottom: 20px; }
        .sidebar .nav-link { color: #c9d1d9; padding: 8px 12px; border-radius: 6px; margin-bottom: 2px; font-size: 0.95em; }
        .sidebar .nav-link:hover { background-color: #21262d; color: #58a6ff; }
        .sidebar .nav-link.active { background-color: #1f6feb22; color: #58a6ff; }
        .content { padding: 30px; }
        .stat-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; }
        .stat-card h6 { color: #8b949e; }
        .stat-card .value { color: #58a6ff; font-size: 1.6em; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <div class="brand">NetGuard</div>
                <div class="tenant-name">{{ tenant.display_name }}</div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('tenant_dashboard', tenant_slug=tenant.tenant_id) }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('tenant_devices', tenant_slug=tenant.tenant_id) }}">Devices</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('network_settings', tenant_slug=tenant.tenant_id) }}">Network</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('account_info', tenant_slug=tenant.tenant_id) }}">Account</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('tenant_logout', tenant_slug=tenant.tenant_id) }}">Sign Out</a></li>
                </ul>
            </div>
            <div class="col-md-10">
                <div class="content">
                    <h4 class="mb-4">Dashboard</h4>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <div class="stat-card">
                                <h6>Managed Devices</h6>
                                <div class="value">{{ devices|length }}</div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="stat-card">
                                <h6>Tenant ID</h6>
                                <div class="value" style="font-size: 1em;">{{ tenant.tenant_id }}</div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="stat-card">
                                <h6>Your Role</h6>
                                <div class="value" style="font-size: 1em;">{{ user.role }}</div>
                            </div>
                        </div>
                    </div>

                    <h5 class="mt-4 mb-3">Device Overview</h5>
                    <table class="table table-dark table-sm" style="border:1px solid #30363d;">
                        <thead><tr><th>Device</th><th>ID</th><th></th></tr></thead>
                        <tbody>
                        {% for d in devices %}
                        <tr>
                            <td>{{ d.name }}</td>
                            <td>{{ d.id }}</td>
                            <td><a href="{{ url_for('device_detail', tenant_slug=tenant.tenant_id, device_id=d.id) }}" style="color: #58a6ff;">View</a></td>
                        </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
