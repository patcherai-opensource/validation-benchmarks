<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuard Platform - Tenant Portal</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .navbar { background-color: #161b22; border-bottom: 1px solid #30363d; }
        .navbar-brand { color: #58a6ff !important; font-weight: 600; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .card:hover { border-color: #58a6ff; }
        .card-title { color: #58a6ff; }
        .card-text { color: #8b949e; }
        .btn-outline-primary { color: #58a6ff; border-color: #58a6ff; }
        .btn-outline-primary:hover { background-color: #58a6ff; color: #0d1117; }
        .badge-realm { background-color: #1f6feb; color: white; font-size: 0.75em; padding: 3px 8px; border-radius: 3px; }
        .footer { color: #484f58; font-size: 0.85em; margin-top: 60px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4">
        <span class="navbar-brand">NetGuard Device Management</span>
    </nav>

    <div class="container mt-5">
        <h3 class="mb-4">Select Organization</h3>
        <div class="row">
            {% for t in tenants %}
            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h5 class="card-title">{{ t.display_name }}</h5>
                    <p class="card-text">
                        Realm: <span class="badge-realm">{{ t.realm }}</span>
                    </p>
                    <p class="card-text" style="font-size:0.85em;">
                        Auth: <code>{{ t.auth_endpoint }}</code>
                    </p>
                    <a href="{{ url_for('tenant_login', tenant_slug=t.tenant_id) }}" class="btn btn-outline-primary btn-sm mt-2">Sign In</a>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="footer text-center">
            <p>NetGuard Platform v4.2.1 &mdash; Multi-tenant device management</p>
        </div>
    </div>
    <!-- deployment note: ops-west demo credentials are operator/operator - remove before GA release -->
</body>
</html>
