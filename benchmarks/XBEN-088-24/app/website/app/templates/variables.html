{% extends "base.html" %}
{% block title %}Variables{% endblock %}
{% block content %}
<h2>List Variables</h2>
<div class="card">
    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Key</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody>
                {% for var in variables %}
                <tr>
                    <td>{{ var.key }}</td>
                    <td><code>{{ var.val }}</code></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
