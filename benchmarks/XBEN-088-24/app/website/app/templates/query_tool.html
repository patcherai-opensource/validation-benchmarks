<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBAdmin Pro - Query Tool</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #2d3436;
            color: #dfe6e9;
        }
        .container-fluid {
            padding: 0;
        }
        .sidebar {
            background-color: #363d40;
            border-right: 2px solid #0984e3;
            padding-top: 20px;
            padding-bottom: 20px;
            min-height: 100vh;
            padding-left: 20px;
        }
        .nav-link {
            color: #74b9ff;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            margin-bottom: 8px;
            border: 1px solid #0984e3;
            border-radius: 5px;
            font-size: 14px;
        }
        .nav-link:hover {
            color: #0984e3;
            background-color: #2d3436;
        }
        .content {
            padding: 25px;
        }
        .sidebar-logo {
            width: 50px;
            margin-bottom: 15px;
            color: #0984e3;
        }
        .sidebar-title {
            font-size: 16px;
            margin-bottom: 20px;
            color: #0984e3;
        }
        .query-editor {
            background-color: #1e272e;
            border: 1px solid #0984e3;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            min-height: 200px;
            color: #dfe6e9;
            width: 100%;
        }
        .info-box {
            background-color: #363d40;
            border-left: 4px solid #0984e3;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <svg width="35" height="35" fill="currentColor" class="sidebar-logo" viewBox="0 0 16 16">
                    <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0Z"/>
                    <path d="M12.096 6.223A4.92 4.92 0 0 0 13 5.698V7c0 .289-.213.654-.753 1.007a4.493 4.493 0 0 1 1.753.25V4c0-1.007-.875-1.755-1.904-2.223C11.022 1.289 9.573 1 8 1s-3.022.289-4.096.777C2.875 2.245 2 2.993 2 4v9c0 1.007.875 1.755 1.904 2.223C4.978 15.71 6.427 16 8 16c.536 0 1.058-.034 1.555-.097a4.525 4.525 0 0 1-.813-.927C8.5 14.992 8.252 15 8 15c-1.464 0-2.766-.27-3.682-.687C3.356 13.875 3 13.373 3 13v-1.302c.271.202.58.378.904.525C4.978 12.71 6.427 13 8 13h.027a4.552 4.552 0 0 1 0-1H8c-1.464 0-2.766-.27-3.682-.687C3.356 10.875 3 10.373 3 10V8.698c.271.202.58.378.904.525C4.978 9.71 6.427 10 8 10c.262 0 .52-.008.774-.024a4.525 4.525 0 0 1 1.102-1.132C9.298 8.944 8.666 9 8 9c-1.464 0-2.766-.27-3.682-.687C3.356 7.875 3 7.373 3 7V5.698c.271.202.58.378.904.525C4.978 6.711 6.427 7 8 7s3.022-.289 4.096-.777ZM3 4c0-.374.356-.875 1.318-1.313C5.234 2.271 6.536 2 8 2s2.766.27 3.682.687C12.644 3.125 13 3.627 13 4c0 .374-.356.875-1.318 1.313C10.766 5.729 9.464 6 8 6s-2.766-.27-3.682-.687C3.356 4.875 3 4.373 3 4Z"/>
                </svg>
                <h2 class="sidebar-title">DBAdmin Pro</h2>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('servers') }}">Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('query_tool') }}">Query Tool</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
            <div class="col-md-10">
                <div class="content">
                    <h1>Query Tool</h1>
                    <p>Execute SQL queries against connected databases.</p>
                    
                    <textarea class="query-editor" placeholder="-- Enter your SQL query here
SELECT * FROM users;"></textarea>
                    
                    <div class="info-box">
                        <strong>No server connected</strong><br>
                        <small>Please connect to a database server first using the Servers page.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
