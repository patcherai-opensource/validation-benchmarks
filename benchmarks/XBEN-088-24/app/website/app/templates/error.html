<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
        }
        .container {
            margin-top: 100px;
        }
        .error-box {
            max-width: 400px;
            margin: auto;
            text-align: center;
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 30px;
            background-color: #333333;
        }
        .error-code {
            font-size: 72px;
            color: #ff4444;
            margin-bottom: 10px;
        }
        .error-text {
            font-size: 18px;
            color: #aaa;
        }
        a {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-box">
            <div class="error-code">{{ error_code }}</div>
            <div class="error-text">{{ error_message }}</div>
            <p class="mt-4"><a href="/">Return to Home</a></p>
        </div>
    </div>
</body>
</html>
