<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Settings - GamePanel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #0a1628;
            color: white;
        }
        .container-fluid {
            padding: 0;
        }
        .sidebar {
            background-color: #1e293b;
            border-right: 3px solid #3b82f6;
            padding-top: 20px;
            padding-bottom: 20px;
            min-height: 100vh;
            padding-left: 25px;
        }
        .nav-link {
            color: #3b82f6;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            margin-bottom: 10px;
            border: 2px solid #3b82f6;
            border-radius: 10px;
        }
        .nav-link:hover {
            color: #60a5fa;
            background-color: #0f172a;
        }
        .content {
            padding: 20px;
        }
        .sidebar-logo {
            width: 70px;
            margin-bottom: 20px;
        }
        .sidebar-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #3b82f6;
        }
        .form-control {
            background-color: #0f172a;
            border-color: #334155;
            color: white;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: white;
        }
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .user-badge {
            background-color: #3b82f6;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar">
                <svg width="40" height="40" fill="currentColor" class="bi panel-logo" viewBox="0 0 16 16" style="color: #3b82f6;">
                    <path d="M6 1h6v7a.5.5 0 0 1-.757.429L9 7.083 6.757 8.43A.5.5 0 0 1 6 8z"/>
                    <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
                    <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
                </svg>
                <h2 class="sidebar-title">GamePanel</h2>
                <p style="color: #64748b; font-size: 11px; margin-bottom: 20px;">
                    {% if user %}
                    Logged in as: <span class="user-badge">{{ user.username }}</span>
                    {% endif %}
                </p>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">My Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('server_settings') }}">Server Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin Panel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
            <div class="col-md-9">
                <div class="content">
                    <h1>Server Configuration</h1>
                    <p style="color: #64748b;">Configure your game server settings</p>
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="server_name">Server Name</label>
                            <input type="text" class="form-control" id="server_name" placeholder="My Minecraft Server">
                        </div>
                        <div class="form-group mb-3">
                            <label for="max_players">Max Players</label>
                            <input type="number" class="form-control" id="max_players" placeholder="50">
                        </div>
                        <div class="form-group mb-3">
                            <label for="game_mode">Game Mode</label>
                            <select class="form-control" id="game_mode">
                                <option>Survival</option>
                                <option>Creative</option>
                                <option>Adventure</option>
                                <option>Hardcore</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block mt-3">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    {% if error_message %}
    <!-- Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content" style="background-color: #1e293b;">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="background-color: transparent; border: none;">
                        <span aria-hidden="true" style="color: white;">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    {{ error_message }}
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

    <!-- JavaScript to show the modal -->
    <script>
        $(document).ready(function(){
            $('#errorModal').modal('show');
        });
    </script>
    {% endif %}

</body>
</html>
