<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WyvernPanel - Servers</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .container-fluid {
            padding: 0;
        }
        .sidebar {
            background-color: #161b22;
            border-right: 1px solid #30363d;
            padding-top: 20px;
            padding-bottom: 20px;
            min-height: 100vh;
            padding-left: 15px;
            padding-right: 15px;
        }
        .nav-link {
            color: #8b949e;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            margin-bottom: 5px;
            border-radius: 6px;
        }
        .nav-link:hover {
            color: #c9d1d9;
            background-color: #21262d;
        }
        .nav-link.active {
            color: #c9d1d9;
            background-color: #21262d;
        }
        .content {
            padding: 30px;
        }
        .sidebar-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #58a6ff;
            padding: 10px 15px;
        }
        .server-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .server-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-online {
            background-color: #238636;
            color: white;
        }
        .status-offline {
            background-color: #6e7681;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h2 class="sidebar-title">WyvernPanel</h2>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('servers') }}">Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('settings') }}">Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
            <div class="col-md-10">
                <div class="content">
                    <h1>Your Servers</h1>
                    
                    <div class="server-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5>Minecraft Server #1</h5>
                                <p style="color: #8b949e; margin: 0;">mc-1.wyvern.local:25565</p>
                            </div>
                            <span class="server-status status-online">Online</span>
                        </div>
                    </div>
                    
                    <div class="server-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5>Web Server</h5>
                                <p style="color: #8b949e; margin: 0;">web-1.wyvern.local:80</p>
                            </div>
                            <span class="server-status status-online">Online</span>
                        </div>
                    </div>
                    
                    <div class="server-card">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5>Database Server</h5>
                                <p style="color: #8b949e; margin: 0;">db-1.wyvern.local:3306</p>
                            </div>
                            <span class="server-status status-offline">Offline</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
