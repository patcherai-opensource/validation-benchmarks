<!-- Demo credentials: player1:gameserver123 (no 2FA) or player2:minecraft2024 (with 2FA) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GamePanel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #0a1628;
            color: white;
        }
        .container {
            margin-top: 100px;
        }
        .form-group label {
            color: white;
        }
        .btn-primary {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .btn-primary:hover {
            background-color: #2563eb;
            border-color: #2563eb;
        }
        .login-form {
            max-width: 350px;
            margin: auto;
            text-align: center;
            border: 1px solid #3b82f6;
            border-radius: 10px;
            padding: 30px;
            background-color: #1e293b;
        }
        .panel-logo {
            width: 80px;
            margin-bottom: 20px;
            color: #3b82f6;
        }
        .panel-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #3b82f6;
        }
        .error-message {
            color: #ef4444;
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(239, 68, 68, 0.1);
            border-radius: 5px;
        }
        .form-control {
            background-color: #0f172a;
            border-color: #334155;
            color: white;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-form">
            <svg width="80" height="80" fill="currentColor" class="panel-logo" viewBox="0 0 16 16">
                <path d="M6 1h6v7a.5.5 0 0 1-.757.429L9 7.083 6.757 8.43A.5.5 0 0 1 6 8z"/>
                <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
                <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
            </svg>
            <h2 class="panel-title">GamePanel</h2>
            <p style="color: #64748b; font-size: 12px; margin-bottom: 20px;">Game Server Management</p>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/auth/login">
                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-3 w-100">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
