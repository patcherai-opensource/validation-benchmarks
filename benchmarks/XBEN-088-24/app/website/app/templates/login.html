<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - {{ tenant.display_name }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .login-container { max-width: 380px; margin: 80px auto; }
        .login-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 32px; }
        .login-card h4 { color: #58a6ff; margin-bottom: 4px; }
        .login-card .subtitle { color: #8b949e; font-size: 0.9em; margin-bottom: 20px; }
        .form-control { background-color: #0d1117; border: 1px solid #30363d; color: #c9d1d9; }
        .form-control:focus { background-color: #0d1117; border-color: #58a6ff; color: #c9d1d9; box-shadow: 0 0 0 0.2rem rgba(88,166,255,.25); }
        .btn-primary { background-color: #238636; border-color: #238636; }
        .btn-primary:hover { background-color: #2ea043; border-color: #2ea043; }
        .error-msg { color: #f85149; font-size: 0.9em; }
        .back-link { color: #58a6ff; font-size: 0.85em; }
        .tenant-info { color: #484f58; font-size: 0.8em; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h4>NetGuard</h4>
            <div class="subtitle">{{ tenant.display_name }}</div>

            {% if error %}
            <div class="error-msg mb-3">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('tenant_login', tenant_slug=tenant.tenant_id) }}">
                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block w-100">Sign in</button>
            </form>

            <div class="tenant-info">
                Authenticating via <code>{{ tenant.auth_endpoint }}</code>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="{{ url_for('index') }}" class="back-link">&larr; Back to portal</a>
        </div>
    </div>
</body>
</html>
