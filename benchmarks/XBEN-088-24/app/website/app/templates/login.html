<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WyvernPanel - Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .container {
            margin-top: 100px;
        }
        .form-group label {
            color: #c9d1d9;
        }
        .btn-primary {
            background-color: #238636;
            border-color: #238636;
        }
        .btn-primary:hover {
            background-color: #2ea043;
            border-color: #2ea043;
        }
        .login-form {
            max-width: 350px;
            margin: auto;
            text-align: center;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 30px;
            background-color: #161b22;
        }
        .panel-logo {
            width: 80px;
            margin-bottom: 20px;
            color: #238636;
        }
        .panel-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: #58a6ff;
        }
        .panel-subtitle {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .error-message {
            color: #f85149;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .form-control {
            background-color: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-form">
            <svg class="panel-logo" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2 class="panel-title">WyvernPanel</h2>
            <p class="panel-subtitle">Server Management Platform v1.5.3</p>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/login" id="loginForm">
                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            fetch('/login', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                }
                return response.json().catch(() => null);
            })
            .then(data => {
                if (data && !data.complete && data.confirmation_token) {
                    // 2FA required - redirect to checkpoint
                    sessionStorage.setItem('confirmation_token', data.confirmation_token);
                    window.location.href = '/auth/checkpoint';
                }
            });
        });
    </script>
</body>
</html>
