<!-- Default credentials: test / test -->
<!-- NOTE: In server mode, ensure proper authentication configuration -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBAdmin Pro - Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #2d3436;
            color: #dfe6e9;
        }
        .container {
            margin-top: 80px;
        }
        .form-group label {
            color: #dfe6e9;
        }
        .btn-primary {
            background-color: #0984e3;
            border-color: #0984e3;
        }
        .btn-primary:hover {
            background-color: #0652DD;
            border-color: #0652DD;
        }
        .login-form {
            max-width: 340px;
            margin: auto;
            text-align: center;
            border: 1px solid #0984e3;
            border-radius: 8px;
            padding: 30px;
            background-color: #363d40;
        }
        .app-logo {
            width: 80px;
            margin-bottom: 15px;
            color: #0984e3;
        }
        .app-title {
            font-size: 22px;
            margin-bottom: 5px;
            color: #0984e3;
        }
        .app-subtitle {
            font-size: 12px;
            margin-bottom: 20px;
            color: #b2bec3;
        }
        .error-message {
            color: #d63031;
            margin-top: 10px;
            font-size: 14px;
        }
        .version-info {
            font-size: 10px;
            color: #636e72;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-form">
            <svg width="70" height="70" fill="currentColor" class="app-logo" viewBox="0 0 16 16">
                <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0Z"/>
                <path d="M12.096 6.223A4.92 4.92 0 0 0 13 5.698V7c0 .289-.213.654-.753 1.007a4.493 4.493 0 0 1 1.753.25V4c0-1.007-.875-1.755-1.904-2.223C11.022 1.289 9.573 1 8 1s-3.022.289-4.096.777C2.875 2.245 2 2.993 2 4v9c0 1.007.875 1.755 1.904 2.223C4.978 15.71 6.427 16 8 16c.536 0 1.058-.034 1.555-.097a4.525 4.525 0 0 1-.813-.927C8.5 14.992 8.252 15 8 15c-1.464 0-2.766-.27-3.682-.687C3.356 13.875 3 13.373 3 13v-1.302c.271.202.58.378.904.525C4.978 12.71 6.427 13 8 13h.027a4.552 4.552 0 0 1 0-1H8c-1.464 0-2.766-.27-3.682-.687C3.356 10.875 3 10.373 3 10V8.698c.271.202.58.378.904.525C4.978 9.71 6.427 10 8 10c.262 0 .52-.008.774-.024a4.525 4.525 0 0 1 1.102-1.132C9.298 8.944 8.666 9 8 9c-1.464 0-2.766-.27-3.682-.687C3.356 7.875 3 7.373 3 7V5.698c.271.202.58.378.904.525C4.978 6.711 6.427 7 8 7s3.022-.289 4.096-.777ZM3 4c0-.374.356-.875 1.318-1.313C5.234 2.271 6.536 2 8 2s2.766.27 3.682.687C12.644 3.125 13 3.627 13 4c0 .374-.356.875-1.318 1.313C10.766 5.729 9.464 6 8 6s-2.766-.27-3.682-.687C3.356 4.875 3 4.373 3 4Z"/>
            </svg>
            <h2 class="app-title">DBAdmin Pro</h2>
            <p class="app-subtitle">Database Administration Platform</p>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="form-group mt-2">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-3">Sign In</button>
            </form>
            <p class="version-info">Version 6.21 | Server Mode</p>
        </div>
    </div>
</body>
</html>
