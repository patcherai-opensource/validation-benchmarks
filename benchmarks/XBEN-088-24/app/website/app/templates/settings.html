<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WyvernPanel - Settings</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .container-fluid {
            padding: 0;
        }
        .sidebar {
            background-color: #161b22;
            border-right: 1px solid #30363d;
            padding-top: 20px;
            padding-bottom: 20px;
            min-height: 100vh;
            padding-left: 15px;
            padding-right: 15px;
        }
        .nav-link {
            color: #8b949e;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            margin-bottom: 5px;
            border-radius: 6px;
        }
        .nav-link:hover {
            color: #c9d1d9;
            background-color: #21262d;
        }
        .nav-link.active {
            color: #c9d1d9;
            background-color: #21262d;
        }
        .content {
            padding: 30px;
        }
        .sidebar-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #58a6ff;
            padding: 10px 15px;
        }
        .form-control {
            background-color: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
        }
        .btn-primary {
            background-color: #238636;
            border-color: #238636;
        }
        .settings-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .message-success {
            color: #3fb950;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <h2 class="sidebar-title">WyvernPanel</h2>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('servers') }}">Servers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('settings') }}">Settings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_panel') }}">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
            <div class="col-md-10">
                <div class="content">
                    <h1>Account Settings</h1>
                    
                    {% if message %}
                    <div class="message-success">{{ message }}</div>
                    {% endif %}
                    
                    <div class="settings-card">
                        <h5>Profile Settings</h5>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" value="user@wyvern.local" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Display Name</label>
                                <input type="text" class="form-control" name="display_name" value="User">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                    
                    <div class="settings-card">
                        <h5>Security</h5>
                        <p style="color: #8b949e;">Two-factor authentication adds an extra layer of security to your account.</p>
                        <p><strong>2FA Status:</strong> <span style="color: #f85149;">Disabled</span></p>
                        <button class="btn btn-secondary" disabled>Enable 2FA</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
