<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouterXYZ-Pro - System Information</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
        }
        .info-card {
            background-color: #333333;
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 25px;
        }
        .info-card h2 {
            color: #ff4444;
            margin-bottom: 20px;
        }
        .info-row {
            padding: 8px 0;
            border-bottom: 1px solid #444;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #aaa;
            font-weight: bold;
        }
        .info-value {
            color: white;
            float: right;
        }
        .footer-links {
            margin-top: 20px;
            text-align: center;
        }
        .footer-links a {
            color: #888;
            font-size: 12px;
            margin: 0 10px;
            text-decoration: none;
        }
        .footer-links a:hover {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-card">
            <h2>System Information</h2>
            <div class="info-row">
                <span class="info-label">Model</span>
                <span class="info-value">{{ info.model }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Manufacturer</span>
                <span class="info-value">{{ info.manufacturer }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Firmware Version</span>
                <span class="info-value">{{ info.firmware_version }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Build Date</span>
                <span class="info-value">{{ info.build_date }}</span>
            </div>
        </div>
        <div class="footer-links">
            <a href="/login">Login</a>
            <a href="/support/firmware_manual">Support &amp; Documentation</a>
        </div>
    </div>
</body>
</html>
