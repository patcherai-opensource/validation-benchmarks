[general]
firmware_version = 2.4.1
model = RouterXYZ-Pro
manufacturer = NetRoute Systems
build_date = 2024-01-15

[network]
default_gateway = 192.168.1.1
subnet_mask = 255.255.255.0
dhcp_enabled = true
dhcp_range_start = 192.168.1.100
dhcp_range_end = 192.168.1.254

[wireless]
ssid = RouterXYZ-Setup
channel = auto
band = 2.4GHz
encryption = WPA2

[webserver]
listen_port = 80
session_signing_key = routerxyz_default_key
session_timeout_minutes = 60
max_login_attempts = 0

[logging]
log_level = warning
syslog_enabled = false

[services]
upnp_enabled = true
telnet_enabled = false
ssh_enabled = false
