apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssrf-demo-app
    component: ctf-challenge
  name: ssrf-demo-app
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssrf-demo-app
  template:
    metadata:
      labels:
        app: ssrf-demo-app
    spec:
      containers:
      - image: /:-ssrf-demo-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
        name: ssrf-demo-app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: internal-service
    component: ctf-challenge
  name: internal-service
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal-service
  template:
    metadata:
      labels:
        app: internal-service
    spec:
      containers:
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: /:-internal-service
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
        name: internal-service
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssrf-demo-app
    component: ctf-challenge
  name: ssrf-demo-app-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ssrf-demo-app
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: internal-service
    component: ctf-challenge
  name: internal-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: internal-service
  type: ClusterIP
