<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/theme.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Source Sans Pro', ui-sans-serif, system-ui, sans-serif; background: #0b0f19; color: #c5c8d6; min-height: 100vh; }
        .main-container { max-width: 768px; margin: 0 auto; padding: 2rem 1rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; color: #e5e7eb; margin-bottom: 0.5rem; }
        .header p { font-size: 0.875rem; color: #9ca3af; }
        .component-wrapper { background: #1f2937; border: 1px solid #374151; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
        .component-wrapper label { display: block; font-size: 0.875rem; font-weight: 600; color: #d1d5db; margin-bottom: 0.5rem; }
        .component-wrapper textarea { width: 100%; background: #111827; border: 1px solid #374151; border-radius: 0.375rem; color: #e5e7eb; padding: 0.75rem; font-size: 0.875rem; resize: vertical; min-height: 80px; }
        .component-wrapper textarea:focus { outline: none; border-color: #f97316; }
        .btn-primary { background: #f97316; color: #fff; border: none; padding: 0.625rem 1.25rem; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-primary:hover { background: #ea580c; }
        .footer { text-align: center; margin-top: 2rem; font-size: 0.75rem; color: #6b7280; }
        .footer a { color: #9ca3af; text-decoration: none; }
        .output-text { min-height: 80px; background: #111827; border: 1px solid #374151; border-radius: 0.375rem; padding: 0.75rem; font-size: 0.875rem; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>{{ title }}</h1>
            <p>Text processing interface</p>
        </div>

        <div class="component-wrapper">
            <label for="input-text">Input Text</label>
            <textarea id="input-text" placeholder="Enter text to process..." rows="3"></textarea>
        </div>

        <div style="margin-bottom: 1rem;">
            <button class="btn-primary" id="submit-btn" onclick="submitPrediction()">Process</button>
        </div>

        <div class="component-wrapper">
            <label>Output</label>
            <div class="output-text" id="output-text"></div>
        </div>

        <div class="footer">
            <p>Built with <a href="https://gradio.app" target="_blank">Gradio</a></p>
        </div>
    </div>

    <script>
        async function submitPrediction() {
            const input = document.getElementById('input-text').value;
            const outputEl = document.getElementById('output-text');
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.textContent = 'Processing...';
            outputEl.textContent = '';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [input], fn_index: 0 }),
                });
                const result = await response.json();
                outputEl.textContent = result.data ? result.data[0] : 'No output';
            } catch (err) {
                outputEl.textContent = 'Error processing request.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Process';
            }
        }
    </script>
</body>
</html>
