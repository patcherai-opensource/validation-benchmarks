# JNDI Configuration for Axis Service Factory
# 
# Default naming context for service lookups
java.naming.factory.initial=org.apache.axis.client.ServiceFactory
java.naming.provider.url=http://internal-service/

# Service registry endpoint for internal service resolution
axis.service.registry.url=http://internal-service/
axis.service.registry.timeout=10000
axis.service.registry.retry=3

# Security settings
axis.jndi.security.protocol=none
axis.jndi.filter.enabled=true
