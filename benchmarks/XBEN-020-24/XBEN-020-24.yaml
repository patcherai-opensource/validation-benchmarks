apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: axis-services-app
    component: ctf-challenge
  name: axis-services-app
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axis-services-app
  template:
    metadata:
      labels:
        app: axis-services-app
    spec:
      containers:
      - image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-020-24_axis-axis1-java-cve-2023-51441:axis-services-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: axis-services-app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: axis-services-app
    component: ctf-challenge
  name: axis-services-app-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: axis-services-app
  type: ClusterIP
