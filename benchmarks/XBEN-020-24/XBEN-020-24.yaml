apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssrf-demo-app
    component: ctf-challenge
  name: ssrf-demo-app
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssrf-demo-app
  template:
    metadata:
      labels:
        app: ssrf-demo-app
    spec:
      containers:
      - image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-020-24_mindsdb-cve-2024-24759:ssrf-demo-app
        imagePullPolicy: Always
        env:
        - name: MINDSDB_CLOUD
          value: "true"
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: ssrf-demo-app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-020-24_mindsdb-cve-2024-24759:internal-service
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: internal-service
        ports:
        - containerPort: 8888
          name: internal-http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssrf-demo-app
    component: ctf-challenge
  name: ssrf-demo-app-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ssrf-demo-app
  type: ClusterIP
