services:
  ssrf-demo-app:
    build: ./ssrf-demo-app
    ports:
      - "8080:80"
    environment:
      - MINDSDB_CLOUD=true
    networks:
      - mindsdb-net
    depends_on:
      internal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  internal-service:
    build:
      context: ./internal-service
    environment:
      - FLAG=${FLAG}
    networks:
      - mindsdb-net
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  mindsdb-net:
    driver: bridge
