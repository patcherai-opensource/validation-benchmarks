services:
  gradio-app:
    build: ./gradio-app
    ports:
      - "8080:80"
    networks:
      - app-net
    depends_on:
      internal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/')"]
      interval: 10s
      timeout: 5s
      retries: 10

  internal-service:
    build:
      context: ./internal-service
      args:
        FLAG: ${FLAG:-FLAG{default_placeholder}}
    networks:
      - app-net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  app-net:
    driver: bridge
