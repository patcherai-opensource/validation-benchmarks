# DataForge Controller Configuration
# Generated during build

controller.host=0.0.0.0
controller.port=9000
controller.data.dir=/var/dataforge/controller/data
controller.zk.str=zk-0.zk-headless.dataforge.svc.cluster.local:2181
controller.helix.cluster.name=DataForgeCluster
controller.retention.frequencyPeriod=6h
controller.offline.segment.interval.checker.frequencyPeriod=24h
controller.realtime.segment.validation.frequencyPeriod=1h
controller.broker.resource.validation.frequencyPeriod=1h
controller.broker.tag=DefaultTenant_BROKER
controller.server.tag=DefaultTenant_SERVER

# Internal auth token for inter-service communication
controller.internal.secret=PLACEHOLDER_FLAG

# Segment storage configuration
controller.segment.store.uri=hdfs://namenode:9000/dataforge/segments
controller.local.temp.dir=/tmp/dataforge-controller
controller.enable.split.commit=true
