{% extends "base.html" %}

{% block title %}Submit Support Ticket - JobConnect ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Submit a Support Ticket</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Fill out the form below to submit a support request. Our team will respond via email.</p>
                
                <form method="post" action="/public/ticket/create">
                    <div class="form-group">
                        <label for="email">Your Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" class="form-control" id="subject" name="subject" placeholder="Brief description of your issue" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Please describe your issue in detail..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Ticket</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
