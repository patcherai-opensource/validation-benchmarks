<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{% block title %}Apache Pinot Controller{% endblock %}</title>
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: bold; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 20px; }
        .sidebar a { color: #adb5bd; display: block; padding: 8px 16px; text-decoration: none; }
        .sidebar a:hover { color: #fff; background-color: #495057; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="/dashboard">Apache Pinot</a>
        {% block nav_right %}{% endblock %}
    </nav>
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
