<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>{% block title %}SupportFAQ Portal{% endblock %}</title>
    <style>
        .navbar-brand { font-weight: bold; }
        .question-card { margin-bottom: 15px; }
        .question-text { font-size: 1.1em; }
        .meta-info { color: #6c757d; font-size: 0.85em; }
        .badge-open { background-color: #ffc107; color: #000; }
        .badge-answered { background-color: #28a745; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">SupportFAQ Portal</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/questions">View Questions</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="text-center mt-5 mb-3 text-muted">
        <small>SupportFAQ Portal v2.3.1 - Powered by phpMyFAQ Community</small>
    </footer>
</body>
</html>
