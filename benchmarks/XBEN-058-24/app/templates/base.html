<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SurveillEye{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; }
        .header { background: #16213e; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f3460; }
        .header h1 { font-size: 18px; color: #e94560; }
        .header .version { font-size: 12px; color: #777; }
        .nav { display: flex; gap: 16px; align-items: center; }
        .nav a { color: #a0a0a0; text-decoration: none; font-size: 13px; }
        .nav a:hover { color: #e94560; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .login-box { max-width: 400px; margin: 100px auto; background: #16213e; padding: 32px; border-radius: 8px; }
        .login-box h2 { margin-bottom: 20px; color: #e94560; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #999; }
        .form-group input { width: 100%; padding: 8px 12px; background: #0f3460; border: 1px solid #333; color: #e0e0e0; border-radius: 4px; }
        .btn { padding: 8px 20px; background: #e94560; border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #c73652; }
        .camera-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
        .camera-card { background: #16213e; border-radius: 8px; overflow: hidden; border: 1px solid #0f3460; }
        .camera-feed { width: 100%; height: 200px; background: #0a0a1a; display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; }
        .camera-info { padding: 12px; }
        .camera-info h3 { font-size: 14px; margin-bottom: 4px; }
        .camera-info .status { font-size: 12px; }
        .status.online { color: #4caf50; }
        .status.offline { color: #f44336; }
        .footer { text-align: center; padding: 16px; color: #555; font-size: 11px; }
    </style>
</head>
<body>
    {% block body %}{% endblock %}
</body>
</html>
