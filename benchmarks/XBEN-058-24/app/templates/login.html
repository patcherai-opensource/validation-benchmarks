{% extends "base.html" %}

{% block title %}Sign In - Pinot Controller{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h4><img src="https://pinot.apache.org/img/pinot-logo.svg" alt="Apache Pinot" style="height:32px;" onerror="this.style.display='none'"> Controller</h4>
                <small class="text-muted">Real-Time Distributed OLAP Datastore</small>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}
                <form method="post" action="/auth/login">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
