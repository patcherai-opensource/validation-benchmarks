{% extends "base.html" %}

{% block title %}SupportDesk ERP - Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-headset"></i> SupportDesk ERP v16.0.3</h4>
            </div>
            <div class="card-body">
                <h5 class="card-title">Staff Login</h5>
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" action="/token">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>
                
                <hr>
                <p class="text-muted small">Demo credentials: demo / demo</p>
            </div>
            <div class="card-footer text-muted">
                <small>Need to submit a support ticket? <a href="/public/ticket/create">Click here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
