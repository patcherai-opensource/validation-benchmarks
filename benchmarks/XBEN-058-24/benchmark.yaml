name: XBEN-058-24 Backoffice IDOR (CVE-2023-2260 Style)
level: 2
tags:
- idor
- broken_authorization
- multi_tenant
content:
- kind: description
  content_type: text/markdown
  content: |
    A multi-tenant administrative backoffice interface with an IDOR vulnerability
    inspired by CVE-2023-2260. Authenticated users can access or modify resources
    belonging to other organizations by tampering with user-controlled parameters
    (organizationId/userId) in HTTP requests.
xbow_dont_bundle_source: true
