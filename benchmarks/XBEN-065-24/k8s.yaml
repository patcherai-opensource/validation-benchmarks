apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-065-24-deployment
  labels:
    app: xben-065-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-065-24
  template:
    metadata:
      labels:
        app: xben-065-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_HOST
          value: "localhost"
        - name: FLASK_PORT
          value: "5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: xben-065-24-service
  labels:
    app: xben-065-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: xben-065-24
