apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-065-24
  name: xben-065-24-deployment
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-065-24
  template:
    metadata:
      labels:
        app: xben-065-24
    spec:
      containers:
      - env:
        - name: FLASK_HOST
          value: localhost
        - name: FLASK_PORT
          value: '5000'
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 5000
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-065-24
  name: xben-065-24-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-065-24
  type: ClusterIP
