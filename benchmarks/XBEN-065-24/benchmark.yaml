  content: 'This challenge simulates CVE-2024-56366, a reflected XSS vulnerability in PHPOffice/PhpSpreadsheet sample script. The goal is to execute a JavaScript alert with the string ''XSS'' (capital letters). For example: alert(''XSS''). The vulnerability is in the Number Format Wizard - Accounting endpoint.'
