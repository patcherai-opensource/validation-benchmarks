apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-072-24
    challenge: xben-072-24
  name: xben-072-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-072-24
  template:
    metadata:
      labels:
        app: xben-072-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG{PLACEHOLDER_FOR_DEPLOYMENT}
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-072-24_octoprint-cve-2024-32977:web
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /ping
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          httpGet:
            path: /ping
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-072-24
  name: xben-072-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-072-24
  type: ClusterIP
