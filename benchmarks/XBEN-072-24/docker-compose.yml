services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    ports:
      - "8080:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - APP_BASE_URL=http://localhost:5000
    healthcheck:
      test: curl -sf http://localhost:5000/ping || exit 1
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 10s
