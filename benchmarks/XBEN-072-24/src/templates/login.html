{% extends "base.html" %}
{% block title %}FabricCtl - Login{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h1>FabricCtl</h1>
            <p>3D Printer Management</p>
        </div>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="user">Username</label>
                <input type="text" id="user" name="user" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="pass">Password</label>
                <input type="password" id="pass" name="pass" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
</div>
{% endblock %}
