<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FabricCtl{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav class="navbar">
        <div class="nav-brand">
            <a href="{{ url_for('dashboard') }}">FabricCtl</a>
            <span class="version">1.8.7</span>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('temperature') }}" class="{% if request.endpoint == 'temperature' %}active{% endif %}">Temperature</a>
            <a href="{{ url_for('control') }}" class="{% if request.endpoint == 'control' %}active{% endif %}">Control</a>
            {% if current_user.is_admin %}
            <a href="#" class="nav-settings-link">Settings</a>
            {% endif %}
        </div>
        <div class="nav-user">
            <span class="user-name">{{ current_user.get_id() }}</span>
            <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
        </div>
    </nav>
    {% endif %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
