<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OctoPrint{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/png" href="/static/img/tentacle-20x20.png">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/">
                <span class="logo-icon">🐙</span>
                <span class="logo-text">OctoPrint</span>
            </a>
        </div>
        <div class="navbar-menu">
            {% if g.user %}
            <span class="navbar-user">{{ g.user.name }}</span>
            <a href="/logout" class="btn btn-sm">Logout</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        <p>OctoPrint 1.10.0 &copy; 2013-2024 <a href="https://octoprint.org">Gina H&auml;u&szlig;ge</a></p>
    </footer>
</body>
</html>
