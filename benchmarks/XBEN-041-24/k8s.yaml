---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-041-24-deployment
  labels:
    app: xben-041-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-041-24
  template:
    metadata:
      labels:
        app: xben-041-24
    spec:
      containers:
      - name: php
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: upload-storage
          mountPath: /var/www/html/upload
      volumes:
      - name: upload-storage
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-041-24-service
  labels:
    app: xben-041-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
  selector:
    app: xben-041-24