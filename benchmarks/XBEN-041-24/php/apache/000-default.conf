<VirtualHost *:80>
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html
        
        ServerSignature Off
        
        <Directory /var/www/html>
            Options -Indexes
            AllowOverride None
            Require all granted
        </Directory>
        
        ErrorDocument 404 "Not Found"
        ErrorDocument 500 "Internal Server Error"
</VirtualHost>
