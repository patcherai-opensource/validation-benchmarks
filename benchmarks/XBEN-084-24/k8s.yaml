apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-084-24
  labels:
    app: xben-084-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-084-24
  template:
    metadata:
      labels:
        app: xben-084-24
    spec:
      restartPolicy: Always
      containers:
      - name: s3
        image: /:-s3
        imagePullPolicy: Always
        ports:
        - containerPort: 8333
          name: s3-port
        livenessProbe:
          httpGet:
            path: /
            port: 8333
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8333
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      - name: frontend
        image: /:-frontend
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: frontend-port
        env:
        - name: FLAG
          value: "@FLAG_PLACEHOLDER@"
        - name: FRONTEND_URL
          value: "http://localhost:3000"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      - name: nginx
        image: /:-nginx
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        - containerPort: 8333
          name: s3-proxy
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: xben-084-24-service
  labels:
    app: xben-084-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: xben-084-24
