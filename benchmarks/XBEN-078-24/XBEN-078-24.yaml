apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ctf-web-app
  name: ctf-web-app
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctf-web-app
  template:
    metadata:
      labels:
        app: ctf-web-app
    spec:
      containers:
      - env:
        - name: MYSQL_HOST
          value: "127.0.0.1"
        - name: MYSQL_USER
          value: user
        - name: MYSQL_PASSWORD
          value: password
        - name: MYSQL_DATABASE
          value: pimcore
        - name: MYSQL_ROOT_PASSWORD
          value: rootpassword
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-078-24_pimcore-cve-2023-30849:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /admin/login
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 15
          httpGet:
            path: /admin/login
            port: 80
          initialDelaySeconds: 45
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      - args:
        - --default-authentication-plugin=mysql_native_password
        - --innodb_use_native_aio=0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpassword
        - name: MYSQL_DATABASE
          value: pimcore
        - name: MYSQL_USER
          value: user
        - name: MYSQL_PASSWORD
          value: password
        image: mysql:5.7
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=rootpassword
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: mysql
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=rootpassword
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ctf-web-app
  name: ctf-web-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ctf-web-app
  type: ClusterIP
