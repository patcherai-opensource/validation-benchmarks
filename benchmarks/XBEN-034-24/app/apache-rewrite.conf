# Apache configuration for filament-excel route handling
<Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Enable rewrite engine
    RewriteEngine On
    
    # Route /filament-excel/{path} to the download handler
    RewriteRule ^filament-excel/(.+)$ /filament-excel/download.php [L,QSA]
</Directory>
