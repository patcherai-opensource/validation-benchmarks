apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-086-24-app
  name: xben-086-24-app
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-086-24-app
  template:
    metadata:
      labels:
        app: xben-086-24-app
    spec:
      containers:
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-086-24:app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 4567
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 4567
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 4567
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-086-24-app
  name: xben-086-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 4567
  selector:
    app: xben-086-24-app
  type: ClusterIP
