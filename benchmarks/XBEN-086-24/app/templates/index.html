<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoLLMs Web UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #e0e0e0; }
        .navbar { background-color: #16213e !important; }
        .navbar-brand { color: #e94560 !important; font-weight: bold; }
        .card { background-color: #0f3460; border: 1px solid #533483; }
        .card-header { background-color: #16213e; color: #e94560; }
        .sidebar { background-color: #16213e; min-height: calc(100vh - 56px); padding: 20px; }
        .sidebar a { color: #e0e0e0; text-decoration: none; display: block; padding: 8px 12px; border-radius: 4px; margin-bottom: 4px; }
        .sidebar a:hover { background-color: #0f3460; }
        .chat-area { padding: 20px; }
        .message { margin-bottom: 15px; padding: 12px; border-radius: 8px; }
        .message.user { background-color: #533483; margin-left: 20%; }
        .message.assistant { background-color: #0f3460; margin-right: 20%; }
        .input-area { background-color: #16213e; padding: 15px; border-radius: 8px; }
        .btn-primary { background-color: #e94560; border-color: #e94560; }
        .btn-primary:hover { background-color: #c73652; border-color: #c73652; }
        .form-control { background-color: #1a1a2e; border-color: #533483; color: #e0e0e0; }
        .form-control:focus { background-color: #1a1a2e; color: #e0e0e0; border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, 0.25); }
        .status-badge { font-size: 0.8em; padding: 4px 8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-robot"></i> LoLLMs WebUI
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/settings"><i class="fas fa-cog"></i> Settings</a>
                <span class="nav-link text-muted">v{{ version }}</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar">
                <h6 class="text-muted mb-3"><i class="fas fa-comments"></i> Discussions</h6>
                <button class="btn btn-primary btn-sm w-100 mb-3" onclick="newDiscussion()">
                    <i class="fas fa-plus"></i> New Discussion
                </button>
                <div id="discussion-list"></div>
            </div>
            <div class="col-md-9">
                <div class="chat-area" id="chat-area">
                    <div class="text-center mt-5">
                        <h2><i class="fas fa-robot"></i></h2>
                        <h4>Welcome to LoLLMs</h4>
                        <p class="text-muted">Lord of Large Language and Multimodal Systems</p>
                        <p class="text-muted">Start a new discussion or select an existing one.</p>
                    </div>
                </div>
                <div class="input-area mx-3 mb-3">
                    <div class="input-group">
                        <input type="text" class="form-control" id="prompt-input" placeholder="Type your message...">
                        <button class="btn btn-primary" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentDiscussion = null;

        async function loadDiscussions() {
            const resp = await fetch('/list_discussions');
            const data = await resp.json();
            const list = document.getElementById('discussion-list');
            list.innerHTML = '';
            data.discussions.forEach(d => {
                const el = document.createElement('a');
                el.href = '#';
                el.textContent = d.title;
                el.onclick = () => selectDiscussion(d.id);
                list.appendChild(el);
            });
        }

        async function newDiscussion() {
            const title = prompt('Discussion title:');
            if (!title) return;
            await fetch('/new_discussion', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: title})
            });
            loadDiscussions();
        }

        async function selectDiscussion(id) {
            currentDiscussion = id;
            loadDiscussions();
        }

        async function sendMessage() {
            const input = document.getElementById('prompt-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const chatArea = document.getElementById('chat-area');
            chatArea.innerHTML += `<div class="message user">${text}</div>`;

            const resp = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: text})
            });
            const data = await resp.json();
            chatArea.innerHTML += `<div class="message assistant">${data.text}</div>`;
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        document.getElementById('prompt-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        loadDiscussions();
    </script>
</body>
</html>
