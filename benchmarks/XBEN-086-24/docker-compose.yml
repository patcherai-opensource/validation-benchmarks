services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        - FLAG=${FLAG:-PLACEHOLDER_FLAG}
    ports:
      - "8080:4567"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4567/')"]
      interval: 30s
      timeout: 10s
      retries: 5
