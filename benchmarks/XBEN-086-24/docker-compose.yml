services:
  web:
    build:
      context: ./app
      args:
        - FLAG=${FLAG:-PLACEHOLDER_FLAG}
    ports:
      - "8080:4567"
    environment:
      - FLAG=${FLAG:-PLACEHOLDER_FLAG}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/ping"]
      interval: 30s
      timeout: 10s
      retries: 10
