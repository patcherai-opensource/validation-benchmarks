services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        - FLAG=${FLAG:-PLACEHOLDER_FLAG}
    ports:
      - "8080:4567"
    environment:
      - FLAG=${FLAG:-PLACEHOLDER_FLAG}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/"]
      interval: 30s
      timeout: 10s
      retries: 5
