apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-086-24-app
  labels:
    app: xben-086-24-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-086-24-app
  template:
    metadata:
      labels:
        app: xben-086-24-app
    spec:
      containers:
      - name: app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 4567
          name: http
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 4567
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 4567
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-086-24-service
  labels:
    app: xben-086-24-app
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 4567
    protocol: TCP
    name: http
  selector:
    app: xben-086-24-app