<h2>GeoData Catalog Service</h2>
<p>Welcome to the GeoData Catalog Service. This service allows you to import and manage geospatial metadata.</p>

<h3>Available Functions</h3>
<ul>
    <li><a href="/import">Import Geospatial Metadata (XML)</a></li>
</ul>

<h4>Example XML Format</h4>
<p>Use this example format for importing metadata:</p>
<textarea readonly rows="18" cols="60">
&lt;?xml version="1.0"?&gt;
&lt;Metadata&gt;
    &lt;Title&gt;Sample Geospatial Dataset&lt;/Title&gt;
    &lt;Identifier&gt;geo-dataset-001&lt;/Identifier&gt;
    &lt;Abstract&gt;A sample dataset for demonstration&lt;/Abstract&gt;
    &lt;BoundingBox&gt;
        &lt;West&gt;-180&lt;/West&gt;
        &lt;East&gt;180&lt;/East&gt;
        &lt;South&gt;-90&lt;/South&gt;
        &lt;North&gt;90&lt;/North&gt;
    &lt;/BoundingBox&gt;
    &lt;Contact&gt;
        &lt;Name&gt;GeoData Admin&lt;/Name&gt;
        &lt;Email&gt;admin@geodata.local&lt;/Email&gt;
    &lt;/Contact&gt;
&lt;/Metadata&gt;
</textarea>
</body>
</html>
