<!-- templates/result.html -->
{% extends "base.html" %}

{% block title %}SVG Processing Result{% endblock %}

{% block content %}
<style>
    .result-container { max-width: 900px; margin: 20px auto; }
    h2 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
    .status { padding: 15px; background: #e8f5e9; border-left: 4px solid #4CAF50; margin: 15px 0; border-radius: 4px; }
    .output { background: #f5f5f5; border: 1px solid #ddd; padding: 15px; border-radius: 4px; overflow-x: auto; }
    pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; font-size: 12px; }
    a { color: #4CAF50; }
</style>

<div class="result-container">
    <h2>✅ SVG Table Processing Result</h2>
    
    <div class="status">
        <strong>Status:</strong> {{ msg | safe }}
    </div>
    
    <h3>Processed SVG Output:</h3>
    <div class="output">
        <pre>{{ parsed_xml | safe }}</pre>
    </div>
    
    <p style="margin-top: 20px;">
        <a href="/subset">← Process Another SVG Table</a> | 
        <a href="/">Home</a>
    </p>
</div>
{% endblock %}
