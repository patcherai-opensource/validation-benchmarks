{% extends "base.html" %}

{% block title %}Login - GeoMetadata Service{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto;">
    <h2>GeoMetadata Service Login</h2>
    
    {% if msg %}
    <div style="background: {% if 'successful' in msg %}#c6f6d5{% else %}#fed7d7{% endif %}; padding: 10px; border-radius: 4px; margin: 15px 0;">
        {{ msg }}
    </div>
    {% endif %}
    
    <form method="POST" style="background: #f7fafc; padding: 20px; border-radius: 8px;">
        <div style="margin-bottom: 15px;">
            <label for="username"><strong>Username:</strong></label><br>
            <input type="text" name="username" id="username" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e2e8f0; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label for="password"><strong>Password:</strong></label><br>
            <input type="password" name="password" id="password" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #e2e8f0; border-radius: 4px;">
        </div>
        <button type="submit" style="background: #3182ce; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Login</button>
    </form>
    
    <p style="margin-top: 20px; text-align: center;"><a href="/">← Back to Home</a></p>
</div>
{% endblock %}
