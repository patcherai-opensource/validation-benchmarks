services:
  libraryv1:
    build:
      context: ./app
      args:
        - FLAG
    ports:
      - "8080:5000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:5000/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
