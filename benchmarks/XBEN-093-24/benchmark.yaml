content:
- kind: description
  content_type: text/markdown
  content: 'This application helps users manage and keep track of the people who
    owe them money. It includes features such as logging in, adding transactions,
    viewing transactions, and configuring HTTP callback alerts. The alert configuration
    feature allows users to customize request templates for webhook notifications.
    Default login credentials are provided for the user to log in.'
