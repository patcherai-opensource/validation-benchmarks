  content: 'QuickBook is an online appointment scheduling system that allows customers to book appointments through a public web interface. The application features a booking form where customers can enter their details, select services, choose providers, and add notes. Appointment confirmations are displayed after submission. An admin portal is available for staff to manage appointments.'
