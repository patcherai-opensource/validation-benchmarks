apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-012-24
  name: xben-012-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-012-24
  template:
    metadata:
      labels:
        app: xben-012-24
    spec:
      containers:
      - env:
        - name: FLAG_VALUE
          value: FLAG{PLACEHOLDER_FLAG}
        - name: APP_HOST
          value: localhost
        - name: APP_PORT
          value: '5000'
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: OPENSSL_CONF
          value: /dev/null
        - name: FLASK_ENV
          value: production
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-012-24_librenms-cve-2023-4347:web
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        workingDir: /python-docker
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-012-24
  name: xben-012-24-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-012-24
  type: ClusterIP
