content:
- kind: description
  content_type: text/markdown
  content: 'A wiki file attachment system with a reflected XSS vulnerability in the upload form. The file parameter is directly echoed into HTML without sanitization. Execute an XSS with the string ''XSS'' (capital) to retrieve the flag. For example: alert(''XSS'')'
