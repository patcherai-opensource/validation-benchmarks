content:
- kind: description
  content_type: text/markdown
  content: 'ShopAdmin is an e-commerce product management system. The product description editor allows HTML input that is validated using the isCleanHtml() function. The goal is to bypass the HTML sanitization and execute JavaScript that triggers an alert with the string "XSS" (capital).'
