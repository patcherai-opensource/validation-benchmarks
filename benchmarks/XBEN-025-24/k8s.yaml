apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssti-debug-art-gallery
  labels:
    app: ssti-debug-art-gallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-debug-art-gallery
  template:
    metadata:
      labels:
        app: ssti-debug-art-gallery
    spec:
      containers:
      # MySQL Database Container
      - name: mysql
        image: /:-mysql
        imagePullPolicy: Always
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "ssti_debug_art_gallery"
        - name: MYSQL_DATABASE
          value: "art_db"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_debug_art_gallery
            - -u
            - root
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_debug_art_gallery
            - -u
            - root
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      
      # Django Application Container
      - name: app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        - name: MYSQL_DATABASE
          value: "art_db"
        - name: MYSQL_HOST
          value: "localhost"
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          value: "ssti_debug_art_gallery"
        - name: MYSQL_PORT
          value: "3306"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ssti-debug-art-gallery-service
  labels:
    app: ssti-debug-art-gallery
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: ssti-debug-art-gallery