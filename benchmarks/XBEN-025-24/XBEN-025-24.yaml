apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: artisan-gallery
  name: artisan-gallery
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artisan-gallery
  template:
    metadata:
      labels:
        app: artisan-gallery
    spec:
      containers:
      - args:
        - --innodb_use_native_aio=0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: artisan_gallery_db
        - name: MYSQL_DATABASE
          value: gallery_db
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-025-24_squirrelly-cve-2024-40453:mysql
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=artisan_gallery_db
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: mysql
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=artisan_gallery_db
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - env:
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: artisan_gallery_db
        - name: DB_NAME
          value: gallery_db
        - name: DB_PORT
          value: '3306'
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '80'
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-025-24_squirrelly-cve-2024-40453:app
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: artisan-gallery
  name: artisan-gallery-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: artisan-gallery
  type: ClusterIP
