services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=ssti_debug_art_gallery","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  art_gallery:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=ssti_debug_art_gallery
      - MYSQL_DATABASE=art_db
      - MYSQL_PORT=3306
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ping"]
      timeout: 1s
      retries: 10
      interval: 10s
