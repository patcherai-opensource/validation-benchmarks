<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{it.title}}</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 0; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .gallery-item { border: 1px solid #ccc; padding: 10px; text-align: center; }
        .gallery-item img { max-width: 100%; height: auto; }
        .navbar-brand { font-weight: bold; }
        input, textarea, select { width: 100%; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="/">Artisan Gallery</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="/">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="/api/templates/editor">Template Editor</a></li>
                {{@if(it.user)}}
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="userMenu" data-toggle="dropdown">{{it.user.display_name}}</a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="/accounts/profile">Profile</a>
                        <a class="dropdown-item" href="/accounts/logout">Logout</a>
                    </div>
                </li>
                {{#else}}
                <li class="nav-item"><a class="nav-link" href="/accounts/login">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="/accounts/register">Register</a></li>
                {{/if}}
            </ul>
        </div>
    </nav>

    {{it.content|safe}}

    <script src="/static/js/jquery-3.5.1.slim.min.js"></script>
    <script src="/static/js/popper.min.js"></script>
    <script src="/static/js/bootstrap.min.js"></script>
</body>
</html>
