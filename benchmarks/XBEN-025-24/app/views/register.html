<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="mb-4 text-center">Create Account</h2>
            {{@if(it.error)}}
            <div class="alert alert-danger">{{it.error}}</div>
            {{/if}}
            <form method="post" action="/accounts/register">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" name="username" id="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" name="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="display_name">Display Name</label>
                    <input type="text" class="form-control" name="display_name" id="display_name">
                </div>
                <div class="form-group">
                    <label for="password">Password (minimum 8 characters)</label>
                    <input type="password" class="form-control" name="password" id="password" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="/accounts/login">Login</a></p>
        </div>
    </div>
</div>
