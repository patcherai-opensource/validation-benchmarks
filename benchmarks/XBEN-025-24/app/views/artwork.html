<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <img src="/static/img/{{it.artwork.image_file}}" alt="{{it.artwork.title}}" class="img-fluid">
        </div>
        <div class="col-md-6">
            <h2>{{it.artwork.title}}</h2>
            <p class="text-muted">By {{it.artwork.artist}}</p>
            <p>{{it.artwork.description}}</p>
            <p class="lead">Price: <strong>$ {{it.artwork.price}}</strong></p>
            <span class="badge badge-secondary">{{it.artwork.category}}</span>
            <hr>
            <a href="/" class="btn btn-outline-primary">Back to Gallery</a>
            <button class="btn btn-primary disabled">Add to Cart (Coming Soon)</button>
        </div>
    </div>
</div>
