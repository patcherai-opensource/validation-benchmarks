<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathDoc - {{ document.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">MathDoc</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('list_documents') }}">Documents</a>
            <a href="{{ url_for('upload_mathml') }}">Upload</a>
            <a href="{{ url_for('logout') }}">Sign Out</a>
        </div>
    </nav>
    <div class="main-content">
        <div class="page-header">
            <h2>{{ document.title }}</h2>
            <div class="doc-meta">
                <span>By {{ document.author }}</span>
                <span>Created: {{ document.created[:10] }}</span>
                <span class="badge badge-{{ document.status }}">{{ document.status }}</span>
            </div>
        </div>
        <div class="doc-content">
            <div class="section">
                <h3>Rendered Output</h3>
                <div class="math-render">{{ document.html_preview|safe }}</div>
            </div>
        </div>
        <a href="{{ url_for('list_documents') }}" class="btn btn-secondary">&larr; Back to Documents</a>
    </div>
</body>
</html>
