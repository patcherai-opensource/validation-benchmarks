<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathDoc - Documents</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">MathDoc</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('list_documents') }}" class="active">Documents</a>
            <a href="{{ url_for('upload_mathml') }}">Upload</a>
            <a href="{{ url_for('logout') }}">Sign Out</a>
        </div>
    </nav>
    <div class="main-content">
        <div class="page-header">
            <h2>Documents</h2>
            <a href="{{ url_for('upload_mathml') }}" class="btn btn-primary">New Document</a>
        </div>
        {% if documents %}
        <table class="doc-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Created</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for doc in documents %}
                <tr>
                    <td><a href="{{ url_for('view_document', doc_id=doc.id) }}">{{ doc.title }}</a></td>
                    <td>{{ doc.author }}</td>
                    <td>{{ doc.created[:10] }}</td>
                    <td><span class="badge badge-{{ doc.status }}">{{ doc.status }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="empty-state">No documents found.</p>
        {% endif %}
    </div>
</body>
</html>
