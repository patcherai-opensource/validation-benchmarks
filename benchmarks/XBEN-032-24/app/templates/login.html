<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GeoProcessing WPS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>GeoProcessing WPS Server</h1>
            <p class="subtitle">Administration Panel</p>
        </header>
        
        <nav class="main-nav">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="/wps?service=WPS&request=GetCapabilities">Capabilities</a>
            <a href="{{ url_for('admin_login') }}" class="active">Admin</a>
        </nav>
        
        <main>
            <section class="login-section">
                <h2>Administrator Login</h2>
                <form method="post" action="{{ url_for('admin_do_login') }}" class="login-form">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2024 GeoData Solutions Inc. | OGC WPS 1.0.0 Compliant</p>
        </footer>
    </div>
</body>
</html>
