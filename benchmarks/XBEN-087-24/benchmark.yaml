content:
- kind: description
  content_type: text/markdown
  content: 'A Game Server List (LGSL-inspired) application allows registering game servers with extended information. The goal is to achieve stored XSS by injecting malicious content that triggers an alert with the string ''XSS'' (capital). For example: alert(''XSS'')'
