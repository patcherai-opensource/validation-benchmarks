apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-087-24-app
  labels:
    app: xben-087-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-087-24
  template:
    metadata:
      labels:
        app: xben-087-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: FLAG
          value: "FLAG{PLACEHOLDER_FLAG}"
        - name: APP_HOST
          value: "localhost"
        - name: APP_PORT
          value: "5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-087-24-service
  labels:
    app: xben-087-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
  selector:
    app: xben-087-24
