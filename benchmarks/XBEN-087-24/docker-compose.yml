services:
  web:
    build:
      context: ./src
      args:
        - FLAG
    ports:
      - "8080:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    healthcheck:
      test: curl -f http://localhost:5000/ || exit 1
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 15s
