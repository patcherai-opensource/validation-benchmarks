<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Server name (optional)
    ServerName api.appbuilder.local

    # Directory settings
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Rewrite rules for clean API URLs
    RewriteEngine On
    RewriteRule ^/swagger/v1$ /swagger/v1.php [L]

    # Log files
    ErrorLog /var/log/apache2/error2.log
    CustomLog /var/log/apache2/access2.log combined

    # PHP settings (ensure mod_php is installed and enabled)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

</VirtualHost>
