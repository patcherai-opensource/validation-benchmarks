<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockoon - Mock API Server</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .header {
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 20px;
      color: #e94560;
      font-weight: 600;
    }
    .header .version {
      font-size: 12px;
      color: #888;
      margin-left: 8px;
    }
    .header .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #4ecca3;
    }
    .header .status .dot {
      width: 8px;
      height: 8px;
      background: #4ecca3;
      border-radius: 50%;
    }
    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .card h2 {
      font-size: 16px;
      color: #e94560;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
    }
    .stat-box .value {
      font-size: 28px;
      font-weight: 700;
      color: #e94560;
    }
    .stat-box .label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #0f3460;
      font-size: 13px;
    }
    th {
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
    }
    .method {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
    }
    .method-get { background: #1b4332; color: #4ecca3; }
    .method-post { background: #3d1f00; color: #f4a261; }
    .endpoint { color: #82b1ff; font-family: monospace; }
    .type-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      background: #2d2d44;
      color: #aaa;
    }
    .footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:baseline;">
      <h1>Mockoon</h1>
      <span class="version">v9.1.0</span>
    </div>
    <div class="status">
      <div class="dot"></div>
      Server running
    </div>
  </div>
  <div class="container">
    <div class="stat-grid">
      <div class="stat-box">
        <div class="value" id="envCount">-</div>
        <div class="label">Environments</div>
      </div>
      <div class="stat-box">
        <div class="value" id="routeCount">-</div>
        <div class="label">Routes</div>
      </div>
      <div class="stat-box">
        <div class="value" id="uptime">-</div>
        <div class="label">Uptime (s)</div>
      </div>
    </div>
    <div class="card">
      <h2>Configured Environments</h2>
      <table>
        <thead><tr><th>Name</th><th>Port</th><th>Routes</th><th>Status</th></tr></thead>
        <tbody id="envTable"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Active Routes</h2>
      <table>
        <thead><tr><th>Method</th><th>Endpoint</th><th>Response Type</th><th>Status</th></tr></thead>
        <tbody id="routeTable"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="footer">
    Mockoon Server &mdash; Mock your APIs in seconds
  </div>
  <script>
    async function load() {
      try {
        const [infoRes, envRes] = await Promise.all([
          fetch('/api/info'),
          fetch('/api/environments')
        ]);
        const info = await infoRes.json();
        const envs = await envRes.json();
        document.getElementById('envCount').textContent = info.environments;
        document.getElementById('routeCount').textContent = envs.reduce((a,e) => a + e.routeCount, 0);
        document.getElementById('uptime').textContent = Math.floor(info.uptime || 0);
        const envTbody = document.getElementById('envTable');
        envTbody.innerHTML = envs.map(e =>
          `<tr><td>${e.name}</td><td>${e.port}</td><td>${e.routeCount}</td><td>${e.enabled ? '<span style="color:#4ecca3">Active</span>' : 'Disabled'}</td></tr>`
        ).join('');
        // Build route list from environments endpoint hints
        const routeRes = await fetch('/api/routes');
        if (routeRes.ok) {
          const routes = await routeRes.json();
          const rtBody = document.getElementById('routeTable');
          rtBody.innerHTML = routes.map(r =>
            `<tr><td><span class="method method-${r.method.toLowerCase()}">${r.method}</span></td><td class="endpoint">${r.endpoint}</td><td><span class="type-badge">${r.responseType}</span></td><td>${r.statusCode}</td></tr>`
          ).join('');
        }
      } catch(e) { console.error(e); }
    }
    load();
  </script>
</body>
</html>
