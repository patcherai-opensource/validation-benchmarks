{% extends "base.html" %}

{% block title_suffix %} | Error {{ error_code }}{% endblock %}

{% block content %}
<header class="py-5 bg-light border-bottom mb-4">
    <div class="container">
        <div class="text-center my-5">
            <h1 class="fw-bolder">{{ error_code }}</h1>
            <p class="lead mb-0">{{ error_message }}</p>
        </div>
        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary btn-lg">Back to Home</a>
        </div>
    </div>
</header>
{% endblock %}
