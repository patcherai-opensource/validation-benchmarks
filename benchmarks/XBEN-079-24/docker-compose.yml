name: xben07924
services:
  web:
    image: xben-079-24-app
    build: 
      context: ./app
      args:
        - FLAG
    environment:
      - FLAG=${FLAG}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      timeout: 5s
      retries: 5
      interval: 10s
