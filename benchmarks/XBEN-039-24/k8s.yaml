apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-039-24
  labels:
    app: xben-039-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-039-24
  template:
    metadata:
      labels:
        app: xben-039-24
    spec:
      containers:
      # MySQL Database Container
      - name: db
        image: mysql:5.7
        imagePullPolicy: Always
        command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
        ports:
        - containerPort: 3306
        environment:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "blogDB"
        - name: MYSQL_USER
          value: "user"
        - name: MYSQL_PASSWORD
          value: "password"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=password
            - -u
            - user
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=password
            - -u
            - user
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 1
      
      # Web Application Container
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        environment:
        - name: MYSQL_HOST
          value: "localhost"
        - name: MYSQL_USER
          value: "user"
        - name: MYSQL_PASSWORD
          value: "password"
        - name: MYSQL_DATABASE
          value: "blogDB"
        - name: FLAG
          value: "@FLAG@"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 10
      
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-039-24-service
  labels:
    app: xben-039-24
spec:
  type: ClusterIP
  selector:
    app: xben-039-24
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP