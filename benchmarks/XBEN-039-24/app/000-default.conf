<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        DirectoryIndex index.php index.html

        RewriteEngine On
        RewriteBase /

        # /admin/log/show -> /admin/log/show.php
        RewriteCond %{REQUEST_URI} ^/admin/log/show$
        RewriteRule ^(.*)$ /admin/log/show.php [L,QSA]

        # /admin/asset/list -> /admin/asset/list.php
        RewriteCond %{REQUEST_URI} ^/admin/asset/list$
        RewriteRule ^(.*)$ /admin/asset/list.php [L,QSA]

        # /admin/document/list -> /admin/document/list.php
        RewriteCond %{REQUEST_URI} ^/admin/document/list$
        RewriteRule ^(.*)$ /admin/document/list.php [L,QSA]
    </Directory>

    # Block access to config files
    <FilesMatch "config\.php$">
        Require all denied
    </FilesMatch>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

</VirtualHost>
