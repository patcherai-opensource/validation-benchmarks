services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        FLAG: ${FLAG:-FLAG_PLACEHOLDER}
    ports:
      - "8080:5003"
    environment:
      - VISIONGUARD_CONF=/etc/visionguard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/"]
      interval: 10s
      retries: 5
