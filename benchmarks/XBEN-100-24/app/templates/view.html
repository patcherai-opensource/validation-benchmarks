<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ doc.title }} - Corporate Wiki</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Corporate Wiki</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item"><a href="#">{{ doc.space }}</a></li>
                <li class="breadcrumb-item active">{{ doc.title }}</li>
            </ol>
        </nav>

        <article class="wiki-content">
            <h1>{{ doc.title }}</h1>
            <div class="text-muted mb-3">
                <small>Space: {{ doc.space }} | Created by: {{ doc.creator }} | Views: {{ doc.view_count }}</small>
            </div>
            <hr>
            <div class="content-body">
                <p>{{ doc.content }}</p>
            </div>
        </article>
    </div>

    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">Corporate Wiki &copy; 2024</span>
        </div>
    </footer>
</body>
</html>
