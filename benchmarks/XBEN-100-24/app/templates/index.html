<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionGuard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
        .header { background: #16213e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
        .header h1 { font-size: 1.4em; color: #e94560; font-weight: 600; }
        .header .version { font-size: 0.8em; color: #666; }
        .nav { display: flex; gap: 16px; align-items: center; }
        .nav a { color: #a0a0a0; text-decoration: none; font-size: 0.9em; padding: 6px 12px; border-radius: 4px; }
        .nav a:hover { background: #0f3460; color: #fff; }
        .nav a.active { background: #e94560; color: #fff; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .cameras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; margin-top: 16px; }
        .camera-card { background: #16213e; border-radius: 8px; overflow: hidden; border: 1px solid #0f3460; }
        .camera-preview { background: #0a0a1a; height: 200px; display: flex; align-items: center; justify-content: center; color: #444; font-size: 0.9em; }
        .camera-info { padding: 12px 16px; }
        .camera-info h3 { font-size: 1em; margin-bottom: 4px; }
        .camera-info .meta { font-size: 0.8em; color: #888; }
        .camera-info .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; margin-top: 4px; }
        .status-online { background: #1b4332; color: #52b788; }
        .status-offline { background: #3d0000; color: #e94560; }
        .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background: #16213e; padding: 32px; border-radius: 8px; width: 360px; border: 1px solid #0f3460; }
        .login-box h2 { margin-bottom: 16px; font-size: 1.2em; color: #e94560; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 12px; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 4px; color: #e0e0e0; }
        .login-box button { width: 100%; padding: 10px; background: #e94560; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 1em; }
        .login-box button:hover { background: #c73650; }
        .section-title { font-size: 1.1em; color: #ccc; border-bottom: 1px solid #0f3460; padding-bottom: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>VisionGuard</h1>
            <span class="version">v0.9.2</span>
        </div>
        <div class="nav">
            <a href="/" class="active">Cameras</a>
            <a href="#" id="settings-link">Settings</a>
            <a href="#" id="login-link">Login</a>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Camera Feeds</h2>
        <div class="cameras-grid" id="cameras-container">
            <div class="camera-card">
                <div class="camera-preview">connecting...</div>
                <div class="camera-info">
                    <h3>Loading...</h3>
                    <div class="meta">Please wait</div>
                </div>
            </div>
        </div>
    </div>

    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>Administrator Login</h2>
            <input type="text" id="login-user" placeholder="Username">
            <input type="password" id="login-pass" placeholder="Password">
            <button id="login-btn">Sign In</button>
            <p id="login-error" style="color: #e94560; font-size: 0.85em; margin-top: 8px; display: none;"></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
