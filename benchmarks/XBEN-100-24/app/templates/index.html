<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onyx - Enterprise Knowledge Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #1a1a2e; }
        .navbar { background: #1a1a2e; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .navbar .brand { color: #fff; font-size: 1.5rem; font-weight: 700; text-decoration: none; }
        .navbar .brand span { color: #6c63ff; }
        .navbar .nav-links a { color: #ccc; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
        .navbar .nav-links a:hover { color: #fff; }
        .container { max-width: 480px; margin: 80px auto; padding: 2rem; }
        .card { background: #fff; border-radius: 12px; padding: 2.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .card h2 { margin-bottom: 0.5rem; font-size: 1.5rem; }
        .card p { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; font-weight: 600; color: #333; }
        .form-group input { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
        .form-group input:focus { outline: none; border-color: #6c63ff; }
        .btn { width: 100%; padding: 0.7rem; border: none; border-radius: 6px; background: #6c63ff; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        .btn:hover { background: #5a52d5; }
        .error { color: #dc3545; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
        .footer { text-align: center; margin-top: 2rem; color: #999; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand"><span>Onyx</span> Enterprise</a>
        <div class="nav-links">
            <a href="/api/manage/documents">Documents</a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h2>Sign In</h2>
            <p>Access your knowledge management workspace.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <div class="error" id="error-msg"></div>
            </form>
        </div>
        <div class="footer">Onyx Enterprise Edition &copy; 2024</div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await resp.json();
            if (resp.ok) {
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/';
            } else {
                errEl.textContent = data.detail || 'Login failed';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
