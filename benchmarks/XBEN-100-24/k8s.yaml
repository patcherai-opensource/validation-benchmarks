apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-100-24-deployment
  labels:
    app: xben-100-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-100-24
  template:
    metadata:
      labels:
        app: xben-100-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        - name: MONGO_URI
          value: "mongodb://localhost:27017/viewtheadmins"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      - name: mongo
        image: mongo:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
          name: mongo
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-100-24-service
  labels:
    app: xben-100-24
spec:
  type: ClusterIP
  selector:
    app: xben-100-24
  ports:
  - name: http
    port: 8080
    targetPort: 5003
    protocol: TCP
