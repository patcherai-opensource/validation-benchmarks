<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamPass | Dashboard</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">🔐 TeamPass</span>
            <div class="d-flex">
                <span class="navbar-text me-3">Welcome, {{ username }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">Folders</div>
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action">Personal</a>
                        <a href="#" class="list-group-item list-group-item-action">Shared</a>
                        <a href="#" class="list-group-item list-group-item-action">Servers</a>
                        <a href="#" class="list-group-item list-group-item-action">Databases</a>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <span>Items</span>
                        <div>
                            <input type="text" class="form-control form-control-sm" placeholder="Search..." style="width: 200px; display: inline-block;">
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="text-muted text-center py-4">Select a folder to view items.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
