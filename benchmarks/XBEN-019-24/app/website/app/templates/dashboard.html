<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Spring Content Service</title>
    <link href="/content/css/bootstrap.min.css" rel="stylesheet">
    <link href="/content/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Spring Content Service</span>
            <a href="/portal/login" class="btn btn-outline-light btn-sm">Sign Out</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h3>Dashboard</h3>
                <p class="text-muted">Content management overview</p>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Static Content</h5>
                        <p class="card-text">Manage static resources served via the content endpoint.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Configuration</h5>
                        <p class="card-text">Application configuration and settings.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Health Status</h5>
                        <p class="card-text">Monitor application health via actuator endpoints.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/content/js/bootstrap.bundle.min.js"></script>
</body>
</html>
