<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Portal - Dashboard</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Document Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/login">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Available Documents</h5>
                    </div>
                    <div class="card-body">
                        <div id="documents-list">
                            <p class="text-muted">Loading documents...</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <p>Welcome to the Document Portal.</p>
                        <p class="text-muted">Use the API to access files:</p>
                        <code>/api/v1/files?path=documents/filename.txt</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('/api/v1/documents')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('documents-list');
                if (data.documents && data.documents.length > 0) {
                    let html = '<ul class="list-group">';
                    data.documents.forEach(doc => {
                        html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            ${doc.name}
                            <a href="${doc.url}" class="btn btn-sm btn-primary">Download</a>
                        </li>`;
                    });
                    html += '</ul>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p class="text-muted">No documents available.</p>';
                }
            })
            .catch(err => {
                document.getElementById('documents-list').innerHTML = '<p class="text-danger">Error loading documents.</p>';
            });
    </script>
</body>
</html>
