<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Frame-Options" content="SameOrigin">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>VaultKeeper - Collaborative Password Manager</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <div style="margin:30px;">
                <img src="/static/images/vaultkeeper-logo.png" alt="VaultKeeper" style="max-width:120px;" onerror="this.style.display='none'">
            </div>
            <div style="font-weight:bold;">
                VaultKeeper
            </div>
            <small class="text-muted">Collaborative Password Manager</small>
        </div>

        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Sign in to manage your vault</p>

                {% if error %}
                <div class="alert alert-danger alert-dismissible" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form action="{{ url_for('login') }}" method="post" id="loginForm">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="login" placeholder="Login" required autocomplete="username">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user">&#128100;</span>
                            </div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" name="pw" placeholder="Password" required autocomplete="current-password">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock">&#128274;</span>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label for="duree_session" class="form-label small">Session duration</label>
                            <select class="form-control form-control-sm" name="duree_session" id="duree_session">
                                <option value="30">30 min</option>
                                <option value="60" selected>60 min</option>
                                <option value="120">2 hours</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </div>
                    </div>
                </form>

                <p class="mt-3 mb-1 small text-center text-muted">
                    &copy; 2024 VaultKeeper &mdash; v3.0.9
                </p>
            </div>
        </div>
    </div>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script>
        // Application configuration
        var appSettings = {
            'appName': 'VaultKeeper',
            'version': '3.0.9',
            'sessionDuration': 60,
            'configPath': '/config',
            'apiBase': '/svc',
            'modulesBase': '/modules',
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            var login = document.querySelector('input[name="login"]').value;
            var pw = document.querySelector('input[name="pw"]').value;
            if (!login || !pw) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
