<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Spring Resource Server</title>
    <link href="/resources?path=css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .login-container { max-width: 400px; margin: 100px auto; }
        .spring-logo { color: #6db33f; font-weight: bold; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="text-center mb-4">
            <h2 class="spring-logo">🍃 Spring Resource Server</h2>
            <p class="text-muted">Administration Portal</p>
        </div>
        <div class="card">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">Admin Login</h4>
                <form id="loginForm" action="{{ url_for('admin_login') }}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Sign In</button>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-3" role="alert">
                    {{ error }}
                </div>
                {% endif %}
            </div>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">Spring Framework 6.1.2 | Resource Router v2.0</small>
        </div>
    </div>
    <script src="/resources?path=js/bootstrap.bundle.min.js"></script>
</body>
</html>
