<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill Connection Manager</title>
    <link href="/resource?filename=css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Apache Drill Connection Manager</span>
            <span class="navbar-text text-white">v2.4.2</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Database Connections</h5>
                        <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newConnectionModal">
                            + New Connection
                        </button>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Connection ID</th>
                                    <th>Type</th>
                                    <th>Host</th>
                                    <th>Port</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="connectionsTable">
                                <!-- Connections will be loaded here -->
                            </tbody>
                        </table>
                        <p class="text-muted" id="noConnections">No connections configured. Create one to get started.</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h6 class="mb-0">Connection Test Results</h6>
                    </div>
                    <div class="card-body">
                        <pre id="testResults" class="bg-light p-3" style="min-height: 100px; max-height: 300px; overflow: auto;">
Ready to test connections...
                        </pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Connection Modal -->
    <div class="modal fade" id="newConnectionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Connection</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="connectionForm">
                        <div class="mb-3">
                            <label class="form-label">Connection ID *</label>
                            <input type="text" class="form-control" id="connId" required placeholder="e.g., my_drill_conn">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Connection Type</label>
                            <select class="form-select" id="connType">
                                <option value="drill" selected>Apache Drill</option>
                                <option value="postgres">PostgreSQL</option>
                                <option value="mysql">MySQL</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Host *</label>
                            <input type="text" class="form-control" id="host" value="localhost" placeholder="Database host">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Port</label>
                            <input type="text" class="form-control" id="port" value="8047">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Schema</label>
                            <input type="text" class="form-control" id="schema" value="dfs" placeholder="Database schema">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Extra (JSON)</label>
                            <textarea class="form-control" id="extra" rows="3" placeholder='{"dialect_driver": "drill+sadrill"}'></textarea>
                            <small class="text-muted">Optional JSON configuration for dialect_driver, storage_plugin, etc.</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createConnection()">Create Connection</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/resource?filename=js/bootstrap.bundle.min.js"></script>
    <script>
        let connectionsData = {};

        function loadConnections() {
            fetch('/api/connections')
                .then(r => r.json())
                .then(data => {
                    const table = document.getElementById('connectionsTable');
                    const noConn = document.getElementById('noConnections');
                    
                    if (data.connections && data.connections.length > 0) {
                        noConn.style.display = 'none';
                        table.innerHTML = data.connections.map(connId => {
                            const conn = connectionsData[connId] || {};
                            return `<tr>
                                <td>${connId}</td>
                                <td>${conn.conn_type || 'drill'}</td>
                                <td>${conn.host || 'localhost'}</td>
                                <td>${conn.port || '8047'}</td>
                                <td>
                                    <button class="btn btn-info btn-sm" onclick="testConnection('${connId}')">Test</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteConnection('${connId}')">Delete</button>
                                </td>
                            </tr>`;
                        }).join('');
                    } else {
                        noConn.style.display = 'block';
                        table.innerHTML = '';
                    }
                });
        }

        function createConnection() {
            const connId = document.getElementById('connId').value;
            const connType = document.getElementById('connType').value;
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            const schema = document.getElementById('schema').value;
            let extra = {};
            
            try {
                const extraText = document.getElementById('extra').value;
                if (extraText) extra = JSON.parse(extraText);
            } catch(e) {
                alert('Invalid JSON in Extra field');
                return;
            }

            const data = { conn_id: connId, conn_type: connType, host, port, schema, extra };
            connectionsData[connId] = data;

            fetch('/api/connections', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(result => {
                if (result.status === 'created') {
                    bootstrap.Modal.getInstance(document.getElementById('newConnectionModal')).hide();
                    document.getElementById('connectionForm').reset();
                    loadConnections();
                } else {
                    alert(result.error || 'Failed to create connection');
                }
            });
        }

        function testConnection(connId) {
            const results = document.getElementById('testResults');
            results.textContent = `Testing connection '${connId}'...\n`;

            fetch(`/api/connections/${connId}/test`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    results.textContent = JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    results.textContent = `Error: ${err.message}`;
                });
        }

        function deleteConnection(connId) {
            if (!confirm(`Delete connection '${connId}'?`)) return;
            
            fetch(`/api/connections/${connId}`, { method: 'DELETE' })
                .then(r => r.json())
                .then(() => {
                    delete connectionsData[connId];
                    loadConnections();
                });
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadConnections);
    </script>
</body>
</html>
