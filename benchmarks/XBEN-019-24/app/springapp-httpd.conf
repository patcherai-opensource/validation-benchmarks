<VirtualHost *:80>
    DocumentRoot /var/www/lfi_static_resource/
    
    WSGIDaemonProcess /springapp python-path=/var/www/lfi_static_resource/
    WSGIProcessGroup /springapp
    WSGIScriptAlias / /var/www/lfi_static_resource/lfi_static_resource.wsgi

    <Directory "/var/www/lfi_static_resource/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /springapp
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Block direct access to Spring app data directory
    <Directory /var/www/springapp/data/>
        Require all denied
    </Directory>

    # Public resources directory - accessible
    <Directory /var/www/springapp/public/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
