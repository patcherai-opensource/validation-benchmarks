<VirtualHost *:80>
    DocumentRoot /var/www/springdocs/
    
    WSGIDaemonProcess /springdocs python-path=/var/www/springdocs/
    WSGIProcessGroup /springdocs
    WSGIScriptAlias / /var/www/springdocs/springdocs.wsgi

    <Directory "/var/www/springdocs/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /springdocs
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Block direct access to hidden config files
    <Directory /var/www/springdocs/app/static/>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "^\.(secret|config|htaccess|htpasswd)">
            Order allow,deny
            deny from all
        </FilesMatch>
    </Directory>
</VirtualHost>
