<VirtualHost *:80>
    ServerName passwords.internal.corp
    DocumentRoot /var/www/teampass

    # Default directory settings - no direct access to doc root
    <Directory /var/www/teampass>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Static assets served directly by Apache
    Alias /css /var/www/teampass/css
    Alias /js /var/www/teampass/js

    <Directory /var/www/teampass/css>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/teampass/js>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # TeamPass application directories served by Apache
    # Note: PHP files are served as plain text since PHP module is not loaded
    # These directories contain application source files

    Alias /api /var/www/teampass/api
    <Directory /var/www/teampass/api>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /includes /var/www/teampass/includes
    <Directory /var/www/teampass/includes>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /pages /var/www/teampass/pages
    <Directory /var/www/teampass/pages>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /plugins /var/www/teampass/plugins
    <Directory /var/www/teampass/plugins>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /scripts /var/www/teampass/scripts
    <Directory /var/www/teampass/scripts>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /sources /var/www/teampass/sources
    <Directory /var/www/teampass/sources>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /files /var/www/teampass/files
    <Directory /var/www/teampass/files>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /upload /var/www/teampass/upload
    <Directory /var/www/teampass/upload>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Flask application handles dynamic routes
    WSGIDaemonProcess teampass python-path=/var/www/teampass/webapp/
    WSGIProcessGroup teampass
    WSGIScriptAlias / /var/www/teampass/webapp/teampass.wsgi

    <Directory "/var/www/teampass/webapp/">
        WSGIProcessGroup teampass
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version info
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
