<VirtualHost *:80>
    DocumentRoot /var/www/vizboard/

    # Allow encoded slashes for package paths like @scope/package
    AllowEncodedSlashes NoDecode

    WSGIDaemonProcess vizboard python-path=/var/www/vizboard/
    WSGIProcessGroup vizboard
    WSGIScriptAlias / /var/www/vizboard/vizboard.wsgi

    <Directory "/var/www/vizboard/app/">
        WSGIProcessGroup vizboard
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/vizboard/app/static
    <Directory /var/www/vizboard/app/static/>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ServerSignature Off
    ServerTokens Prod
    Header unset X-Powered-By
</VirtualHost>
