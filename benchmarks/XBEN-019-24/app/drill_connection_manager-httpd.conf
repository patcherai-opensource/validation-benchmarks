<VirtualHost *:80>
    DocumentRoot /var/www/drill_connection_manager/
    
    WSGIDaemonProcess /drill_connection_manager python-path=/var/www/drill_connection_manager/
    WSGIProcessGroup /drill_connection_manager
    WSGIScriptAlias / /var/www/drill_connection_manager/drill_connection_manager.wsgi

    <Directory "/var/www/drill_connection_manager/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /drill_connection_manager
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/drill_connection_manager/app/static
    <Directory /var/www/drill_connection_manager/app/static/>
        Options -Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Block direct access to config directory
    <Directory /var/www/drill_connection_manager/config/>
        Order deny,allow
        Deny from all
    </Directory>
</VirtualHost>
