<VirtualHost *:80>
    ServerName solara.local
    DocumentRoot /var/www/solara/

    # Required for CDN paths containing @ and special characters in package names
    AllowEncodedSlashes NoDecode

    WSGIDaemonProcess solara python-path=/var/www/solara/
    WSGIProcessGroup solara
    WSGIScriptAlias / /var/www/solara/solara.wsgi

    <Directory "/var/www/solara/app/">
        WSGIProcessGroup solara
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Block direct access to application source and config
    <DirectoryMatch "/var/www/solara/app/(templates|__pycache__)">
        Require all denied
    </DirectoryMatch>

    ErrorDocument 404 "Not Found"
    ErrorDocument 403 "Forbidden"
    ErrorDocument 500 "Internal Server Error"

    ServerSignature Off
</VirtualHost>
