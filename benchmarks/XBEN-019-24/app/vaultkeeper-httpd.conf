<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/vaultkeeper/

    WSGIDaemonProcess vaultkeeper python-path=/var/www/vaultkeeper/
    WSGIProcessGroup vaultkeeper

    # Flask application handles /app/ routes
    WSGIScriptAlias /app /var/www/vaultkeeper/vaultkeeper.wsgi

    <Directory "/var/www/vaultkeeper/app/">
        WSGIProcessGroup vaultkeeper
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Static assets for the web UI
    Alias /static /var/www/vaultkeeper/app/static
    <Directory /var/www/vaultkeeper/app/static/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Service API directory
    Alias /svc /var/www/vaultkeeper/svc
    <Directory /var/www/vaultkeeper/svc/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Configuration directory
    Alias /config /var/www/vaultkeeper/config
    <Directory /var/www/vaultkeeper/config/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Modules directory
    Alias /modules /var/www/vaultkeeper/modules
    <Directory /var/www/vaultkeeper/modules/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Resources directory
    Alias /resources /var/www/vaultkeeper/resources
    <Directory /var/www/vaultkeeper/resources/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Data directory
    Alias /data /var/www/vaultkeeper/data
    <Directory /var/www/vaultkeeper/data/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Handlers directory
    Alias /handlers /var/www/vaultkeeper/handlers
    <Directory /var/www/vaultkeeper/handlers/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version info
    ServerSignature Off

    # Default page redirects to login
    RedirectMatch ^/$ /app/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
