<VirtualHost *:80>
    DocumentRoot /var/www/mockapi_server/
    
    WSGIDaemonProcess /mockapi_server python-path=/var/www/mockapi_server/
    WSGIProcessGroup /mockapi_server
    WSGIScriptAlias / /var/www/mockapi_server/mockapi_server.wsgi

    <Directory "/var/www/mockapi_server/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /mockapi_server
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/mockapi_server/app/static
    <Directory /var/www/mockapi_server/app/static/>
        Options Indexes FollowSymLinks
        IndexOptions ShowForbidden
        AllowOverride None
        Require all granted
    </Directory>

    # Block direct access to secrets
    <FilesMatch "^secrets\.txt$">
        Order allow,deny
        deny from all
    </FilesMatch>
</VirtualHost>
