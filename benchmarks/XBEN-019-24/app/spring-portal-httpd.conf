<VirtualHost *:80>
    DocumentRoot /var/www/spring-portal/

    WSGIDaemonProcess spring-portal python-path=/var/www/spring-portal/
    WSGIProcessGroup spring-portal
    WSGIScriptAlias / /var/www/spring-portal/spring-portal.wsgi

    <Directory "/var/www/spring-portal/app/">
        WSGIProcessGroup spring-portal
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version info
    ServerSignature Off
    Header unset X-Powered-By
    Header set Server "Spring-Portal"

    ErrorDocument 404 /404
    ErrorDocument 500 /500
</VirtualHost>
