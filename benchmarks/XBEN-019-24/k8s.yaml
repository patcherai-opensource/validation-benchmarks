apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfi-static-resource
  labels:
    app: lfi-static-resource
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lfi-static-resource
  template:
    metadata:
      labels:
        app: lfi-static-resource
    spec:
      containers:
      - name: lfi-static-resource
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: lfi-static-resource-service
  labels:
    app: lfi-static-resource
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: lfi-static-resource
