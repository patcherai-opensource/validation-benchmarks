apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vaultkeeper
  name: vaultkeeper
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultkeeper
  template:
    metadata:
      labels:
        app: vaultkeeper
    spec:
      containers:
      - image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-019-24_teampass-cve-2023-3553:vaultkeeper
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: vaultkeeper
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: vaultkeeper
  name: vaultkeeper-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: vaultkeeper
  type: ClusterIP
