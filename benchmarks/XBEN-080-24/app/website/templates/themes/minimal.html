<!-- Minimal Theme Template -->
<html>
<head>
    <title>Minimal Theme</title>
    <style>
        body { font-family: 'Helvetica Neue', sans-serif; background-color: white; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px; }
        .header { border-bottom: 1px solid #ddd; padding-bottom: 20px; margin-bottom: 30px; }
        .content { line-height: 1.8; }
        h1 { font-weight: 300; font-size: 2.5em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Minimal Theme</h1>
            <p>Less is more</p>
        </div>
        <div class="content">
            <h2>Welcome</h2>
            <p>This is the minimal theme focusing on content and readability.</p>
        </div>
    </div>
</body>
</html>
