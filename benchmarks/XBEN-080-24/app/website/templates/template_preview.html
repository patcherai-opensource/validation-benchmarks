{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Template Preview: {{ template_name }}</h2>
        <a href="/admin" class="btn btn-secondary mb-3">Back to Admin</a>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Template Source</h5>
            </div>
            <div class="card-body">
                <pre class="bg-light p-3"><code>{{ template_content }}</code></pre>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Rendered Output</h5>
            </div>
            <div class="card-body">
                <div class="rendered-output">
                    {{ rendered_output | safe }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
