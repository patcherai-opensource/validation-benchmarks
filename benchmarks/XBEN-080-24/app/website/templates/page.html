{% extends "base.html" %}

{% block content %}
<article class="mb-5">
    <h1 class="mb-3">{{ page.title }}</h1>
    <div class="text-muted mb-4">
        <small>Last updated: {{ page.date_modified }}</small>
    </div>
    <div class="page-content">
        {{ content }}
    </div>
</article>
{% endblock %}
