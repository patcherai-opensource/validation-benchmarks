{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>Notification Test Result</h2>
        <a href="/admin" class="btn btn-secondary mb-3">Back to Admin</a>
        <hr>
    </div>
</div>

<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Notification Sent to: {{ recipient }}</h5>
            </div>
            <div class="card-body">
                <h6>Notification Content:</h6>
                <div class="border p-3 bg-light">
                    {{ notification_body | safe }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
