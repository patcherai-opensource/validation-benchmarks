{% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header" style="background-color: #1a237e; color: white;">
                    Contact Us
                </div>
                <div class="card-body">
                    <form action="/submit" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Business Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="company" class="form-label">Company</label>
                            <input type="text" class="form-control" id="company" name="company">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card">
                <div class="card-header" style="background-color: #3949ab; color: white;">
                    Contact Information
                </div>
                <div class="card-body">
                    <p><strong>Email:</strong> sales@techvault.example.com</p>
                    <p><strong>Phone:</strong> +1 (555) 123-4567</p>
                    <p><strong>Address:</strong><br>
                    TechVault Solutions<br>
                    123 Innovation Drive<br>
                    Tech City, TC 12345</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
