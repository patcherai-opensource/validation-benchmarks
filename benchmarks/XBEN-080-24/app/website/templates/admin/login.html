<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ site_title | default('Grav') }} Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #323640; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background-color: #fff; border-radius: 4px; padding: 2rem; width: 100%; max-width: 400px; }
        .login-card h3 { color: #333; }
        .btn-grav { background-color: #4a8eff; border: none; color: #fff; }
        .btn-grav:hover { background-color: #3a7eef; color: #fff; }
    </style>
</head>
<body>
    <div class="login-card shadow">
        <h3 class="text-center mb-4">Grav Admin</h3>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-grav w-100">Login</button>
        </form>
        <div class="text-center mt-3">
            <a href="/" class="text-muted small">Back to site</a>
        </div>
    </div>
</body>
</html>
