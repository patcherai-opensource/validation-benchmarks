{% extends "admin/base_admin.html" %}

{% block admin_content %}
<h2 class="mb-4">New Page</h2>

<form method="post">
    <div class="card mb-4">
        <div class="card-header">Page Settings</div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="slug" class="form-label">Slug</label>
                        <input type="text" class="form-control" id="slug" name="slug" placeholder="auto-generated from title">
                    </div>
                </div>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="published" name="published" checked>
                <label class="form-check-label" for="published">Published</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="twig_processing" name="twig_processing" checked>
                <label class="form-check-label" for="twig_processing">Twig Processing</label>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Content (Markdown + Twig)</div>
        <div class="card-body">
            <textarea class="form-control font-monospace" id="content" name="content" rows="20"></textarea>
            <small class="text-muted mt-1 d-block">Supports Markdown formatting. Twig template directives are processed when Twig Processing is enabled.</small>
        </div>
    </div>

    <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-grav">Create</button>
    </div>
</form>
{% endblock %}
