<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DataFlow Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { background-color: #001529; min-height: 100vh; color: #fff; width: 220px; position: fixed; }
        .sidebar .nav-link { color: rgba(255,255,255,.65); padding: 10px 24px; font-size: 14px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: rgba(255,255,255,.08); }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { margin-left: 220px; padding: 24px; }
        .logo { padding: 16px 24px; font-size: 18px; font-weight: 600; color: #fff; border-bottom: 1px solid rgba(255,255,255,.1); }
        .top-bar { background: #fff; padding: 12px 24px; margin-bottom: 24px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .section-header { font-size: 14px; color: #8c8c8c; text-transform: uppercase; letter-spacing: 1px; margin: 16px 24px 8px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}
    <div class="sidebar">
        <div class="logo">
            <i class="bi bi-activity"></i> DataFlow
        </div>
        <div class="section-header">Streaming</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a class="nav-link" href="/job/list"><i class="bi bi-diagram-3"></i> Jobs</a>
            <a class="nav-link" href="/cluster/list"><i class="bi bi-hdd-rack"></i> Clusters</a>
        </nav>
        <div class="section-header">Settings</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/setting/notification"><i class="bi bi-bell"></i> Notifications</a>
            <a class="nav-link" href="/setting/variable"><i class="bi bi-sliders"></i> Variables</a>
        </nav>
        <div class="section-header">Account</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/passport/signout"><i class="bi bi-box-arrow-left"></i> Sign Out</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="top-bar">
            <div>{% block page_title %}{% endblock %}</div>
            <div class="text-muted"><i class="bi bi-person-circle"></i> {{ username }}</div>
        </div>
        {% block content %}{% endblock %}
    </div>
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
