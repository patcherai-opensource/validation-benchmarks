<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Viewer - Swift Shipping & Transport Inc.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Swift Shipping & Transport Inc.</a>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-dark text-white">
                Page Viewer
            </div>
            <div class="card-body">
                <p>Welcome to the Page Viewer!</p>
                <p>This tool allows you to view different page layouts.</p>
                <p class="text-muted">Try: <code>/page?layout=about</code> to view the about page layout.</p>

            </div>
        </div>
    </div>
