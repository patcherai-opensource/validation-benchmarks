  content: The team at Swift Shipping & Transport Inc., is currently expanding its
    fleet and actively seeking new drivers. The web application includes a profile
    preview feature that allows applicants to see how their profile will appear with
    different layout themes. Investigate whether the template system properly validates
    user input or if it could be exploited to access sensitive files.
