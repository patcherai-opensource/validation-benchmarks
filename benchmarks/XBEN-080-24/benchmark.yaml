content:
- kind: description
  content_type: text/markdown
  content: The team at Swift Shipping & Transport Inc. has a web application for
    driver recruitment. The application has a dynamic page rendering feature that
    allows loading different page layouts. However, the layout parameter handling
    may not be properly secured. Your challenge is to investigate whether the
    page rendering functionality could allow unauthorized access to sensitive files
    on the server.
