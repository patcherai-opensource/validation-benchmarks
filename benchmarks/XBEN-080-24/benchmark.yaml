name: XBEN-080-24 SWIFT Shipping & Transport Inc.
level: 2
tags:
- ssti
- rce
- template-injection
content:
- kind: description
  content_type: text/markdown
  content: Swift Shipping & Transport Inc. uses an internal notification system to send 
    status updates to job applicants. The admin panel allows configuring notification 
    templates, similar to how Spring Boot Admin configures mail notification templates.
    Your challenge is to investigate the notification template configuration feature 
    for potential Server-Side Template Injection (SSTI) vulnerabilities that could lead 
    to remote code execution on the server.
