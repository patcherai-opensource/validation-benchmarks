apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-046-24
  name: xben-046-24-deployment
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-046-24
  template:
    metadata:
      labels:
        app: xben-046-24
    spec:
      containers:
      - env:
        - name: FLASK_APP
          value: app.py
        - name: FLASK_ENV
          value: production
        - name: APP_BASE_URL
          value: http://localhost:5000
        - name: FLAG_VALUE
          valueFrom:
            configMapKeyRef:
              key: flag
              name: xben-046-24-config
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-046-24
  name: xben-046-24-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-046-24
  type: ClusterIP
---
apiVersion: v1
data:
  flag: FLAG_PLACEHOLDER
kind: ConfigMap
metadata:
  name: xben-046-24-config
  namespace: sandbox-dev
