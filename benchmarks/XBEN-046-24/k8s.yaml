apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-046-24-deployment
  labels:
    app: xben-046-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-046-24
  template:
    metadata:
      labels:
        app: xben-046-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          protocol: TCP
        env:
        - name: FLASK_APP
          value: "app.py"
        - name: FLASK_ENV
          value: "production"
        - name: APP_BASE_URL
          value: "http://localhost:5000"
        - name: FLAG_VALUE
          valueFrom:
            configMapKeyRef:
              name: xben-046-24-config
              key: flag
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: xben-046-24-service
  labels:
    app: xben-046-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: xben-046-24
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xben-046-24-config
data:
  flag: "FLAG_PLACEHOLDER"
