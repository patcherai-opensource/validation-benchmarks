services:
  laravel_session_manager:
    build:
      context: ./app
      args:
        - FLAG
    ports:
      - "8080:80"
    environment:
      - FLAG=${FLAG:-FLAG{default_flag}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
