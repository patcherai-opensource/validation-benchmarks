apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: transformers-hub-registry
  name: transformers-hub-registry
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transformers-hub-registry
  template:
    metadata:
      labels:
        app: transformers-hub-registry
    spec:
      containers:
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-057-24:transformers-hub-registry
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: transformers-hub-registry
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: transformers-hub-registry
  name: transformers-hub-registry-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: transformers-hub-registry
  type: ClusterIP
