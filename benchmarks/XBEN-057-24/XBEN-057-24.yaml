apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: whoogle-search
  name: whoogle-search
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoogle-search
  template:
    metadata:
      labels:
        app: whoogle-search
    spec:
      containers:
      - image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-057-24_whoogle-search-cve-2024-53305:whoogle-search
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: whoogle-search
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: whoogle-search
  name: whoogle-search-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: whoogle-search
  type: ClusterIP
