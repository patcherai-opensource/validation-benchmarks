apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: deserialization-pickle-bookmarks
  name: deserialization-pickle-bookmarks
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deserialization-pickle-bookmarks
  template:
    metadata:
      labels:
        app: deserialization-pickle-bookmarks
    spec:
      containers:
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        name: deserialization-pickle-bookmarks
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: deserialization-pickle-bookmarks
  name: deserialization-pickle-bookmarks-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: deserialization-pickle-bookmarks
  type: ClusterIP
