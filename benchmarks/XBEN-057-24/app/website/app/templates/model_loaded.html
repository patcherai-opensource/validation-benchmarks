<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Loaded - TransformersHub</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🤖 TransformersHub</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/models">Models</a>
                <a class="nav-link" href="/upload">Upload</a>
                <a class="nav-link" href="/docs">API Docs</a>
                <a class="nav-link" href="/about">About</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="alert alert-success">
                    <h4>✅ Model Loaded Successfully</h4>
                    <hr>
                    <p><strong>Model:</strong> {{ model_name }}</p>
                    <p><strong>Vocabulary Size:</strong> {{ vocab_size }}</p>
                    <p class="mb-0">The model vocabulary has been loaded and is ready for inference.</p>
                </div>
                
                <a href="/models" class="btn btn-primary">Back to Model Registry</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
