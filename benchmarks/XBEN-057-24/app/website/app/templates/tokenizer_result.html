<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokenizer Loaded - MLHub</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🤖 MLHub</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/models">Models</a>
                <a class="nav-link active" href="/tokenizer">Tokenizer</a>
                <a class="nav-link" href="/docs">API Docs</a>
                <a class="nav-link" href="/about">About</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>Vocabulary Loaded Successfully</h2>
        
        <div class="card mt-4">
            <div class="card-header">Vocabulary Information</div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>Source</th>
                        <td>{{ vocab_info.source }}</td>
                    </tr>
                    <tr>
                        <th>Type</th>
                        <td>{{ vocab_info.type }}</td>
                    </tr>
                    <tr>
                        <th>Size</th>
                        <td>{{ vocab_info.size }}</td>
                    </tr>
                </table>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">Vocabulary Preview</div>
            <div class="card-body">
                <pre class="bg-light p-3">{{ vocab_preview }}</pre>
            </div>
        </div>
        
        <a href="/tokenizer" class="btn btn-primary mt-3">Load Another</a>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
