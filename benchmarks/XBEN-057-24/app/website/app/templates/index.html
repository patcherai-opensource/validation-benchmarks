<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whoogle Search</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="home">
    <div class="search-container">
        <div class="logo">
            <h1>Whoogle<span class="accent">Search</span></h1>
            <p class="tagline">Get Google search results, but without any ads, JavaScript, AMP links, cookies, or IP address tracking.</p>
        </div>
        <form action="{{ url_for('search') }}" method="get" class="search-form">
            <div class="search-bar">
                <input type="text" name="q" placeholder="Search the web privately..." autofocus autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </div>
        </form>
        <div class="links">
            <a href="{{ url_for('preferences') }}">Preferences</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('donate') }}">Donate</a>
        </div>
    </div>
</body>
</html>
