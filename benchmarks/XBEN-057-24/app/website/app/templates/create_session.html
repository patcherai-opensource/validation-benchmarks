<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Session - Laravel Session Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="/">Laravel Session Manager</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center">Create New Session</h2>
                        <form id="sessionForm" action="{{ url_for('create_session') }}" method="post">
                            <div class="mb-3">
                                <label for="session_name" class="form-label">Session Name:</label>
                                <input type="text" class="form-control" id="session_name" name="session_name" placeholder="e.g., Chrome on Windows" required>
                            </div>
                            <div class="mb-3">
                                <label for="ip_address" class="form-label">IP Address:</label>
                                <input type="text" class="form-control" id="ip_address" name="ip_address" placeholder="e.g., 192.168.1.100" required>
                            </div>
                            <button type="submit" class="btn btn-danger">Create Session</button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                        </form>
                        {% if error %}
                        <div class="alert alert-danger mt-3" role="alert">
                            {{ error }}
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
