<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - MLHub</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">🤖 MLHub</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/models">Models</a>
                <a class="nav-link" href="/tokenizer">Tokenizer</a>
                <a class="nav-link" href="/docs">API Docs</a>
                <a class="nav-link" href="/about">About</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>Settings</h2>
        <p class="text-muted">Configure MLHub behavior</p>
        
        <div class="card mt-4">
            <div class="card-header">Security Settings</div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="trust_remote_code" disabled>
                            <label class="form-check-label" for="trust_remote_code">
                                Trust Remote Code (TRUST_REMOTE_CODE)
                            </label>
                            <div class="form-text">Allow execution of code from remote model repositories. Currently disabled for security.</div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-header">Storage Settings</div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>Cache Directory</th>
                        <td>/tmp/models</td>
                    </tr>
                    <tr>
                        <th>Max File Size</th>
                        <td>16 MB</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
