{% extends "base.html" %}
{% block title %}Import Index - VectorStore Manager{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">Import Vector Index</h3>
                <p class="text-muted">Restore a previously exported vector index. Upload a <code>.vidx</code> file or paste the base64-encoded serialized data.</p>
                <form method="post" action="{{ url_for('import_index') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="index_file" class="form-label">Index File (.vidx)</label>
                        <input type="file" class="form-control" id="index_file" name="index_file" accept=".vidx,.bin,.pkl">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">— or —</label>
                    </div>
                    <div class="mb-3">
                        <label for="serialized_data" class="form-label">Serialized Data (base64)</label>
                        <textarea class="form-control" id="serialized_data" name="serialized_data" rows="6" placeholder="Paste base64-encoded index data here..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Import Index</button>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
