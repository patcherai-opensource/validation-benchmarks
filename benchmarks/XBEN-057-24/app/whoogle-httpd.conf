<VirtualHost *:80>
    DocumentRoot /var/www/whoogle/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess whoogle python-path=/var/www/whoogle/
    WSGIProcessGroup whoogle
    WSGIScriptAlias / /var/www/whoogle/whoogle.wsgi

    <Directory "/var/www/whoogle/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup whoogle
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/whoogle/app/static/"
    <Directory "/var/www/whoogle/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version info
    ServerSignature Off
    Header unset X-Powered-By
</VirtualHost>