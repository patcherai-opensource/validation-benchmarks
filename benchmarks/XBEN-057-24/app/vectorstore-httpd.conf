<VirtualHost *:80>
    DocumentRoot /var/www/vectorstore_manager/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off

    WSGIDaemonProcess vectorstore_manager python-path=/var/www/vectorstore_manager/
    WSGIProcessGroup vectorstore_manager
    WSGIScriptAlias / /var/www/vectorstore_manager/vectorstore_manager.wsgi

    <Directory "/var/www/vectorstore_manager/app/">
        WSGIProcessGroup vectorstore_manager
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/vectorstore_manager/app/static/"
    <Directory "/var/www/vectorstore_manager/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
