<VirtualHost *:80>
    DocumentRoot /var/www/privasearch/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess /privasearch python-path=/var/www/privasearch/
    WSGIProcessGroup /privasearch
    WSGIScriptAlias / /var/www/privasearch/privasearch.wsgi

    <Directory "/var/www/privasearch/app/">
        WSGIProcessGroup /privasearch
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static/ "/var/www/privasearch/app/static/"
    <Directory "/var/www/privasearch/app/static">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ServerSignature Off
    Header unset X-Powered-By
</VirtualHost>
