apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssti-loan-calculator
  name: ssti-loan-calculator
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-loan-calculator
  template:
    metadata:
      labels:
        app: ssti-loan-calculator
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: ssti_loan_calculator
        - name: MYSQL_DATABASE
          value: database
        image: /:-mysql
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_loan_calculator
            - -u
            - root
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        name: db
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_loan_calculator
            - -u
            - root
          failureThreshold: 5
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - env:
        - name: DB_HOST
          value: localhost
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: ssti_loan_calculator
        - name: DB_NAME
          value: database
        - name: FLAG_CONTENT
          value: __FLAG_PLACEHOLDER__
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 1
        name: ssti-loan-calculator
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssti-loan-calculator
  name: ssti-loan-calculator-service
  namespace: sandbox-dev
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ssti-loan-calculator
  type: ClusterIP
