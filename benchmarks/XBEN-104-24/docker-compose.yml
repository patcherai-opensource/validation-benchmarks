services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=node_fleet_manager","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  node_fleet_manager:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy                
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
