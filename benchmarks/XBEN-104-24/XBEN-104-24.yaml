apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: node-fleet-manager
  name: node-fleet-manager
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-fleet-manager
  template:
    metadata:
      labels:
        app: node-fleet-manager
    spec:
      containers:
      - args:
        # Disable native AIO to prevent node exhaustion (EAGAIN errors) when running many instances
        - --innodb_use_native_aio=0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: node_fleet_manager
        - name: MYSQL_DATABASE
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-104-24_ansible-cve-2014-3498:db
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=node_fleet_manager
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        name: db
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=node_fleet_manager
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - env:
        - name: DB_HOST
          # Use 127.0.0.1 to force TCP connection over loopback (shared in pod)
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: node_fleet_manager
        - name: DB_NAME
          value: database
        - name: FLAG_CONTENT
          value: __FLAG_PLACEHOLDER__
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-104-24_ansible-cve-2014-3498:node-fleet-manager
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        name: node-fleet-manager
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: node-fleet-manager
  name: node-fleet-manager-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: node-fleet-manager
  type: ClusterIP
