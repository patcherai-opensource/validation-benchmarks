<VirtualHost *:80>
    DocumentRoot /var/www/idp_platform/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /idp_platform python-path=/var/www/idp_platform/
    WSGIProcessGroup /idp_platform
    WSGIScriptAlias / /var/www/idp_platform/idp_platform.wsgi

    <Directory "/var/www/idp_platform/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /idp_platform
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
