<VirtualHost *:80>
    DocumentRoot /var/www/gravsite/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /gravsite python-path=/var/www/gravsite/
    WSGIProcessGroup /gravsite
    WSGIScriptAlias / /var/www/gravsite/gravsite.wsgi

    <Directory "/var/www/gravsite/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /gravsite
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
