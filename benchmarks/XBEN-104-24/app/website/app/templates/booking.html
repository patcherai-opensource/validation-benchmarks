<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment - LoanServices</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('booking') }}">LoanServices</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('booking') }}">Book Appointment</a>
                <a class="nav-link" href="{{ url_for('booking_lookup') }}">Lookup Appointment</a>
                <a class="nav-link" href="{{ url_for('login') }}">Staff Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Book an Appointment</h3>
                    </div>
                    <div class="card-body">
                        <form method="post" action="{{ url_for('booking') }}">
                            <h5 class="mb-3">Your Information</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="customer_name" class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" id="customer_name" name="customer_name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="customer_email" class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="customer_email" name="customer_email" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="customer_phone" class="form-label">Phone</label>
                                    <input type="tel" class="form-control" id="customer_phone" name="customer_phone">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="customer_address" class="form-label">Address</label>
                                    <input type="text" class="form-control" id="customer_address" name="customer_address">
                                </div>
                            </div>

                            <hr>
                            <h5 class="mb-3">Appointment Details</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="service_id" class="form-label">Service *</label>
                                    <select class="form-select" id="service_id" name="service_id" required>
                                        {% for service in services %}
                                        <option value="{{ service.id }}">{{ service.name }} - ${{ service.price }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="provider_id" class="form-label">Provider *</label>
                                    <select class="form-select" id="provider_id" name="provider_id" required>
                                        {% for provider in providers %}
                                        <option value="{{ provider.id }}">{{ provider.name }} ({{ provider.specialty }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="appointment_date" class="form-label">Date *</label>
                                    <input type="date" class="form-control" id="appointment_date" name="appointment_date" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="appointment_time" class="form-label">Time *</label>
                                    <select class="form-select" id="appointment_time" name="appointment_time" required>
                                        <option value="09:00">9:00 AM</option>
                                        <option value="10:00">10:00 AM</option>
                                        <option value="11:00">11:00 AM</option>
                                        <option value="13:00">1:00 PM</option>
                                        <option value="14:00">2:00 PM</option>
                                        <option value="15:00">3:00 PM</option>
                                        <option value="16:00">4:00 PM</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="notes" class="form-label">Additional Notes</label>
                                <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Any special requests or information..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Book Appointment</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
