<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookup Appointment - LoanServices</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('booking') }}">LoanServices</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('booking') }}">Book Appointment</a>
                <a class="nav-link" href="{{ url_for('booking_lookup') }}">Lookup Appointment</a>
                <a class="nav-link" href="{{ url_for('login') }}">Staff Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Lookup Your Appointment</h3>
                    </div>
                    <div class="card-body">
                        <p>Enter your confirmation code to view your appointment details.</p>
                        <form method="post" action="{{ url_for('booking_lookup') }}">
                            <div class="mb-3">
                                <label for="confirmation_code" class="form-label">Confirmation Code</label>
                                <input type="text" class="form-control" id="confirmation_code" name="confirmation_code" 
                                       placeholder="e.g., A1B2C3D4" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Lookup Appointment</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
