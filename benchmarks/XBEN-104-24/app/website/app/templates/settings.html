<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Node Fleet Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-between mt-5">
            <div class="col-md-9">
                <h2>Settings</h2>
                <p>Configure your account and alert thresholds</p>
                <hr>
                <form action="{{ url_for('settings') }}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">First Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Last Name:</label>
                        <input type="text" class="form-control" id="lastname" name="lastname" value="{{ user.lastname }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <hr>
                    <h5>Alert Thresholds</h5>
                    <div class="mb-3">
                        <label for="cpu_threshold" class="form-label">CPU Threshold (%):</label>
                        <input type="number" class="form-control" id="cpu_threshold" name="cpu_threshold" value="{{ user.cpu_threshold }}" step="0.1">
                    </div>
                    <div class="mb-3">
                        <label for="memory_threshold" class="form-label">Memory Threshold (%):</label>
                        <input type="number" class="form-control" id="memory_threshold" name="memory_threshold" value="{{ user.memory_threshold }}" step="0.1">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('nodes') }}">Nodes</a></li>
                            <li class="list-group-item"><a href="{{ url_for('settings') }}">Settings</a></li>
                            <li class="list-group-item"><a href="{{ url_for('docs') }}">API Docs</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Exit</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
