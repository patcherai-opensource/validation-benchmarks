<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OpenAM Console{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        .sidebar { min-height: calc(100vh - 56px); background-color: #343a40; padding-top: 20px; }
        .sidebar a { color: #adb5bd; display: block; padding: 8px 16px; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: #495057; }
        .sidebar .section-title { color: #6c757d; padding: 8px 16px; font-size: 12px; text-transform: uppercase; margin-top: 10px; }
        .main-content { padding: 20px; }
        .navbar-brand { font-weight: bold; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">OpenAM Console</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">{{ user.display_name }}</span>
                <a class="nav-link" href="{{ url_for('console_logout') }}">Sign Out</a>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            {% block sidebar %}
            <div class="col-md-2 sidebar">
                <div class="section-title">Access Management</div>
                <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
                <a href="{{ url_for('list_realms') }}">Realms</a>
                <a href="{{ url_for('list_users') }}">Identities</a>
                <div class="section-title">System</div>
                <a href="{{ url_for('audit_log') }}">Audit Logs</a>
            </div>
            {% endblock %}
            <div class="col-md-10 main-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
