<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAM - Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .login-container { max-width: 400px; margin: 80px auto; }
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header h1 { color: #333; font-size: 28px; }
        .brand-header p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <h1>OpenAM</h1>
            <p>Access Management Console</p>
        </div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title text-center mb-3">Sign In</h5>
                <form action="{{ url_for('console_login') }}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-3" role="alert">
                    {{ error }}
                </div>
                {% endif %}
            </div>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">OpenAM 15.0.3</small>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
