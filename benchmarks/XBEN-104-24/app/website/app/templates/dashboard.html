<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Node Fleet Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-between mt-5">
            <div class="col-md-9">
                <h2>Welcome {{ user.name }} {{ user.lastname }}!</h2>
                <p>Node Fleet Manager - Infrastructure Automation Platform</p>
                <hr>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Managed Nodes</h5>
                                <p class="card-text display-4" id="nodeCount">{{ user.node_count }}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Cluster Health</h5>
                                <p class="card-text display-4 text-success" id="clusterHealth">Good</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">Active Jobs</h5>
                                <p class="card-text display-4" id="activeJobs">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('nodes') }}">Nodes</a></li>
                            <li class="list-group-item"><a href="{{ url_for('settings') }}">Settings</a></li>
                            <li class="list-group-item"><a href="{{ url_for('docs') }}">API Docs</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Exit</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
