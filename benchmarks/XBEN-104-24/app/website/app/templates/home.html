<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Home</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">LoanServices Staff</a>
            <div class="navbar-nav ms-auto">

                <p>Staff portal - manage your profile and loan details</p>
            </div>

                <div class="card">

                            <li class="list-group-item"><a href="{{ url_for('home') }}">Home</a></li>

                            <li class="list-group-item"><a href="{{ url_for('loan_details') }}">Loan Details</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Logout</a></li>

                    </div>
                </div>
