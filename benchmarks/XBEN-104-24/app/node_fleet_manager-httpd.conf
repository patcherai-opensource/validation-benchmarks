<VirtualHost *:80>
    DocumentRoot /var/www/node_fleet_manager/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /node_fleet_manager python-path=/var/www/node_fleet_manager/
    WSGIProcessGroup /node_fleet_manager
    WSGIScriptAlias / /var/www/node_fleet_manager/node_fleet_manager.wsgi

    <Directory "/var/www/node_fleet_manager/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /node_fleet_manager
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
