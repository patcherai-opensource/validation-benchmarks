<VirtualHost *:80>
    DocumentRoot /var/www/openam/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess openam python-path=/var/www/openam/
    WSGIProcessGroup openam
    WSGIScriptAlias / /var/www/openam/openam.wsgi

    <Directory "/var/www/openam/app/">
        WSGIProcessGroup openam
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version info
    ServerSignature Off
</VirtualHost>