<VirtualHost *:80>
    DocumentRoot /var/www/easyappointments/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /easyappointments python-path=/var/www/easyappointments/
    WSGIProcessGroup /easyappointments
    WSGIScriptAlias / /var/www/easyappointments/easyappointments.wsgi

    <Directory "/var/www/easyappointments/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /easyappointments
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
