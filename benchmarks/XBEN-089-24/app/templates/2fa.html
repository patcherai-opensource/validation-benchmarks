<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimcore Admin - Two-Factor Authentication</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1f2937 0%, #374151 100%); min-height: 100vh; }
        .login-card { max-width: 400px; margin: 100px auto; }
        .brand-logo { font-size: 2rem; font-weight: bold; color: #8b5cf6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="text-center mb-4">
                <span class="brand-logo">Pimcore</span>
                <p class="text-light mt-2">Security Verification</p>
            </div>
            <div class="card shadow">
                <div class="card-header bg-white text-center">
                    <h5 class="mb-0">Two-Factor Authentication</h5>
                </div>
                <div class="card-body">
                    <div id="alert-container"></div>
                    <p class="text-muted text-center">Enter the 6-digit code from your authenticator app</p>
                    <form id="otpForm">
                        <div class="form-group">
                            <label for="code">Verification Code</label>
                            <input type="text" class="form-control text-center" id="code" name="code" 
                                   maxlength="6" pattern="[0-9]{6}" placeholder="000000" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Verify</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center">
                    <small class="text-muted">Code expires in 5 minutes</small>
                </div>
            </div>
            <p class="text-center text-light mt-3">
                <a href="/admin" class="text-light">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#otpForm").submit(function(e) {
                e.preventDefault();
                var code = $("#code").val();
                
                $.ajax({
                    url: "/admin/security/2fa",
                    type: "POST",
                    data: { code: code },
                    success: function(data) {
                        if (data.success) {
                            window.location.href = data.redirect;
                        } else {
                            $("#alert-container").html('<div class="alert alert-danger">' + data.message + '</div>');
                        }
                    },
                    error: function() {
                        $("#alert-container").html('<div class="alert alert-danger">Verification failed</div>');
                    }
                });
            });
        });
    </script>
</body>
</html>
