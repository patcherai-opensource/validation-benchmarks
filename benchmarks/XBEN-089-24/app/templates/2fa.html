<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimcore - Two-Factor Authentication</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .verify-container { margin-top: 100px; }
        .card { border: none; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .security-icon { font-size: 48px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container verify-container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header text-center">
                        <h5>🔐 Two-Factor Authentication</h5>
                    </div>
                    <div class="card-body text-center">
                        <div class="security-icon">🛡️</div>
                        <p class="text-muted">Enter the verification code sent to your authenticator app</p>
                        <div id="error-alert" class="alert alert-danger" role="alert" style="display: none;"></div>
                        <form method="post">
                            <div class="form-group">
                                <input type="text" class="form-control text-center" id="code" name="code" 
                                       placeholder="Enter 2FA code" maxlength="8" required 
                                       style="font-size: 24px; letter-spacing: 5px;">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Verify</button>
                        </form>
                        <hr>
                        <small class="text-muted">
                            Code sent to your registered authenticator device
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $("form").submit(function(e) {
                e.preventDefault();
                var code = $("#code").val();
                $.ajax({
                    url: "/admin/2fa",
                    type: "POST",
                    data: {
                        code: code
                    },
                    success: function(data) {
                        if (data.success == true) {
                            window.location.href = data.redirect;
                        } else {
                            $("#error-alert").text(data.message || "Invalid code").show();
                        }
                    },
                    error: function() {
                        $("#error-alert").text("Verification failed").show();
                    }
                });
            });
        });
    </script>
</body>
</html>
