<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h4>Admin Panel Login</h4>
                        <small class="text-muted">Legacy Authentication System</small>
                    </div>
                    <div class="card-body">
                        <div id="error-msg" class="alert alert-danger" role="alert" style="display: none;"></div>
                        <form method="post">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $("form").submit(function(e) {
                e.preventDefault();
                var username = $("#username").val();
                var password = $("#password").val();
                $.ajax({
                    url: "/panel/login",
                    type: "POST",
                    data: {
                        username: username,
                        password: password
                    },
                    success: function(data) {
                        if (data.success == true) {
                            window.location.href = data.redirect;
                        } else {
                            $("#error-msg").text(data.message).show();
                        }
                    },
                    error: function() {
                        $("#error-msg").text("An error occurred. Please try again.").show();
                    }
                });
            });
        });
    </script>
</body>
</html>
