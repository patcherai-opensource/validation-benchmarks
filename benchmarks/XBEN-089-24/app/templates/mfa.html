<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Verification - SecureAuth Portal</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .mfa-container { margin-top: 100px; }
        .card-header { background-color: #28a745; color: white; }
        .code-input { font-size: 24px; text-align: center; letter-spacing: 10px; }
    </style>
</head>
<body>
    <div class="container mfa-container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h4>Multi-Factor Authentication</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-warning" role="alert">
                            <strong>Verification Required</strong><br>
                            A 6-digit code has been sent to your registered device.
                        </div>
                        <!-- Demo mode: showing code for testing -->
                        <div class="alert alert-secondary" role="alert">
                            <small><strong>Demo Mode:</strong> Your code is <code>{{ demo_code }}</code></small>
                        </div>
                        <form method="post" id="mfaForm">
                            <div class="form-group">
                                <label for="code">Enter Verification Code</label>
                                <input type="text" class="form-control code-input" id="code" name="code" 
                                       maxlength="6" pattern="[0-9]{6}" required 
                                       placeholder="______">
                            </div>
                            <button type="submit" class="btn btn-success btn-block">Verify</button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <small class="text-muted">
                                Didn't receive the code? <a href="/portal/mfa">Resend Code</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#mfaForm").submit(function(e) {
                e.preventDefault();
                var code = $("#code").val();
                $.ajax({
                    url: "/portal/mfa",
                    type: "POST",
                    data: { code: code },
                    success: function(data) {
                        if (data.success == true) {
                            window.location.href = data.redirect;
                        } else {
                            alert(data.message || "Invalid verification code");
                        }
                    },
                    error: function() {
                        alert("Verification failed. Please try again.");
                    }
                });
            });
        });
    </script>
</body>
</html>
