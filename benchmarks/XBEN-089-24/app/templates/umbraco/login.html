<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbraco - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #1b264f; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-wrapper { width: 100%; max-width: 400px; }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo h1 { color: #fff; font-size: 28px; font-weight: 300; letter-spacing: 2px; }
        .login-logo .sub { color: rgba(255,255,255,.5); font-size: 12px; margin-top: 5px; }
        .login-card { background: #fff; border-radius: 4px; padding: 35px 30px; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
        .login-card h2 { font-size: 16px; color: #1b264f; margin-bottom: 20px; font-weight: 600; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #777; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 3px; font-size: 14px; transition: border-color .2s; }
        .form-group input:focus { border-color: #1b264f; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: #2bc37b; color: #fff; border: none; border-radius: 3px; font-size: 14px; cursor: pointer; font-weight: 600; transition: background .2s; }
        .btn-login:hover { background: #25a96b; }
        .btn-login:disabled { background: #ccc; cursor: not-allowed; }
        .error-msg { padding: 10px 15px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 3px; margin-bottom: 15px; font-size: 13px; display: none; }
        .footer-links { text-align: center; margin-top: 20px; }
        .footer-links a { color: rgba(255,255,255,.5); font-size: 12px; text-decoration: none; }
        .footer-links a:hover { color: rgba(255,255,255,.8); }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <h1>UMBRACO</h1>
            <div class="sub">Backoffice</div>
        </div>
        <div class="login-card">
            <h2>Sign in</h2>
            <div class="error-msg" id="error"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="username" placeholder="email@example.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign in</button>
            </form>
        </div>
        <div class="footer-links">
            <a href="#">Forgot password?</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = document.getElementById('loginBtn');
            var errorEl = document.getElementById('error');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorEl.style.display = 'none';

            fetch('/umbraco/api/authentication/PostLogin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            })
            .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
            .then(function(res) {
                if (res.data.success) {
                    window.location.href = res.data.redirect || '/umbraco/backoffice';
                } else {
                    errorEl.textContent = res.data.error || 'Login failed';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign in';
                }
            })
            .catch(function() {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign in';
            });
        });
    </script>
</body>
</html>
