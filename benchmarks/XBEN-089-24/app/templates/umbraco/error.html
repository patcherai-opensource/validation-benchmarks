<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbraco - Error {{ error_code }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-page { text-align: center; }
        .error-code { font-size: 72px; color: #1b264f; font-weight: 300; }
        .error-msg { font-size: 18px; color: #666; margin-top: 10px; }
        .back-link { display: inline-block; margin-top: 20px; color: #2bc37b; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">{{ error_code }}</div>
        <div class="error-msg">{{ error_message }}</div>
        <a href="/umbraco" class="back-link">Return to Umbraco</a>
    </div>
</body>
</html>
