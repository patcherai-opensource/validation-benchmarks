<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froxlor Server Management Panel - Login</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
        }
        .login-container {
            margin-top: 100px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card-header {
            background-color: #3498db;
            color: white;
            border-radius: 10px 10px 0 0 !important;
        }
        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        .brand-logo {
            font-weight: bold;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header text-center">
                        <span class="brand-logo">🖥️ Froxlor</span>
                        <p class="mb-0 mt-2">Server Management Panel</p>
                    </div>
                    <div class="card-body">
                        <div id="alert-box"></div>
                        <form id="login-form" method="post">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </form>
                        <hr>
                        <p class="text-muted text-center small">
                            Froxlor v2.0.19 - Server Management Panel<br>
                            <!-- Note: Update system available at /admin/autoupdate -->
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#login-form").submit(function(e) {
                e.preventDefault();
                var username = $("#username").val();
                var password = $("#password").val();
                
                $.ajax({
                    url: "/login",
                    type: "POST",
                    data: {
                        username: username,
                        password: password
                    },
                    success: function(data) {
                        if (data.success === true) {
                            window.location.href = data.redirect;
                        } else {
                            $("#alert-box").html('<div class="alert alert-danger">' + data.message + '</div>');
                        }
                    },
                    error: function() {
                        $("#alert-box").html('<div class="alert alert-danger">Connection error</div>');
                    }
                });
            });
        });
    </script>
</body>
</html>
