<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - CMS Backoffice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1b264f; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: #fff; border-radius: 8px; padding: 48px; width: 100%; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
        .login-container h1 { font-size: 24px; color: #1b264f; margin-bottom: 8px; }
        .login-container p.subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #333; margin-bottom: 4px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #2bc37b; }
        .btn-login { width: 100%; padding: 12px; background: #1b264f; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-login:hover { background: #2a3a6e; }
        .error-msg { background: #fdecea; color: #c62828; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo span { font-size: 28px; font-weight: 700; color: #1b264f; letter-spacing: -1px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo"><span>CMS</span></div>
        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to access the backoffice</p>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/umbraco/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Sign in</button>
        </form>
    </div>
</body>
</html>
