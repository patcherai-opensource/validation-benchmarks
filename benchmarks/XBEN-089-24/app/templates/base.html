<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pterodactyl{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #e0e0e0; }
        .navbar { background-color: #16213e !important; }
        .card { background-color: #0f3460; border: none; }
        .card-header { background-color: #16213e; border-bottom: 1px solid #1a1a2e; }
        .table { color: #e0e0e0; }
        .table-dark { background-color: #16213e; }
        .btn-primary { background-color: #533483; border-color: #533483; }
        .btn-primary:hover { background-color: #6a42a5; border-color: #6a42a5; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #16213e; }
        .sidebar .nav-link { color: #a0a0a0; padding: 0.75rem 1rem; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: rgba(255,255,255,0.05); }
        .badge-running { background-color: #198754; }
        .badge-stopped { background-color: #dc3545; }
        .form-control { background-color: #1a1a2e; color: #e0e0e0; border-color: #333; }
        .form-control:focus { background-color: #1a1a2e; color: #e0e0e0; border-color: #533483; box-shadow: 0 0 0 .25rem rgba(83,52,131,.25); }
        a { color: #7c83ff; }
        a:hover { color: #a0a5ff; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
