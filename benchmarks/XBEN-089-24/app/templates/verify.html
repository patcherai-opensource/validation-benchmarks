<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlex Panel &mdash; Two-Factor Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #111827; }
        .panel-card { background-color: #1f2937; border: 1px solid #374151; }
        .panel-input { background-color: #111827; border: 1px solid #4b5563; color: #e5e7eb; }
        .panel-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
        .panel-btn { background-color: #3b82f6; }
        .panel-btn:hover { background-color: #2563eb; }
        .panel-link { color: #60a5fa; }
        .panel-link:hover { color: #93bbfd; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">NovaPlex Panel</h1>
            <p class="text-gray-400 text-sm mt-1">Two-Factor Authentication</p>
        </div>
        <div class="panel-card rounded-lg p-8">
            <h2 class="text-xl font-semibold text-white mb-2">Device Verification</h2>
            <p class="text-gray-400 text-sm mb-6">Enter the authentication code from your authenticator app to continue.</p>
            <div id="error-msg" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded mb-4 text-sm"></div>

            <div id="totp-section">
                <form id="verify-form">
                    <input type="hidden" id="verification_token" value="{{ token }}">
                    <div class="mb-6">
                        <label class="block text-gray-300 text-sm font-medium mb-2" for="authentication_code">Authentication Code</label>
                        <input type="text" id="authentication_code" name="authentication_code"
                               class="panel-input w-full px-3 py-2 rounded text-sm tracking-widest text-center"
                               maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autocomplete="one-time-code">
                    </div>
                    <button type="submit" class="panel-btn w-full text-white font-medium py-2 px-4 rounded text-sm transition">
                        Verify
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <a href="#" id="show-recovery" class="panel-link text-sm">Use a recovery code instead</a>
                </div>
            </div>

            <div id="recovery-section" class="hidden">
                <form id="recovery-form">
                    <input type="hidden" id="recovery_verification_token" value="{{ token }}">
                    <div class="mb-6">
                        <label class="block text-gray-300 text-sm font-medium mb-2" for="recovery_code">Recovery Code</label>
                        <input type="text" id="recovery_code" name="recovery_code"
                               class="panel-input w-full px-3 py-2 rounded text-sm"
                               placeholder="RC-XXXX-XXXXX" required>
                    </div>
                    <button type="submit" class="panel-btn w-full text-white font-medium py-2 px-4 rounded text-sm transition">
                        Submit Recovery Code
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <a href="#" id="show-totp" class="panel-link text-sm">Use authenticator code instead</a>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="/auth/signin" class="text-sm text-gray-500 hover:text-gray-400">Return to sign in</a>
        </div>
        <p class="text-center text-gray-600 text-xs mt-6">&copy; 2024 NovaPlex Technologies</p>
    </div>
    <script>
        document.getElementById('show-recovery').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('totp-section').classList.add('hidden');
            document.getElementById('recovery-section').classList.remove('hidden');
        });
        document.getElementById('show-totp').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('recovery-section').classList.add('hidden');
            document.getElementById('totp-section').classList.remove('hidden');
        });

        function handleVerify(payload) {
            var errorDiv = document.getElementById('error-msg');
            errorDiv.classList.add('hidden');
            fetch('/auth/signin/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(function(resp) { return resp.json().then(function(d) { return {status: resp.status, body: d}; }); })
            .then(function(result) {
                if (result.body.error) {
                    errorDiv.textContent = result.body.error;
                    errorDiv.classList.remove('hidden');
                } else if (result.body.data && result.body.data.complete) {
                    window.location.href = result.body.data.intended;
                }
            })
            .catch(function() {
                errorDiv.textContent = 'An unexpected error occurred.';
                errorDiv.classList.remove('hidden');
            });
        }

        document.getElementById('verify-form').addEventListener('submit', function(e) {
            e.preventDefault();
            handleVerify({
                verification_token: document.getElementById('verification_token').value,
                authentication_code: document.getElementById('authentication_code').value
            });
        });

        document.getElementById('recovery-form').addEventListener('submit', function(e) {
            e.preventDefault();
            handleVerify({
                verification_token: document.getElementById('recovery_verification_token').value,
                recovery_code: document.getElementById('recovery_code').value
            });
        });
    </script>
</body>
</html>
