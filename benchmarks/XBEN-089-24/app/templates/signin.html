<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlex Panel &mdash; Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #111827; }
        .panel-card { background-color: #1f2937; border: 1px solid #374151; }
        .panel-input { background-color: #111827; border: 1px solid #4b5563; color: #e5e7eb; }
        .panel-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }
        .panel-btn { background-color: #3b82f6; }
        .panel-btn:hover { background-color: #2563eb; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-6">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">NovaPlex Panel</h1>
            <p class="text-gray-400 text-sm mt-1">Server Management</p>
        </div>
        <div class="panel-card rounded-lg p-8">
            <h2 class="text-xl font-semibold text-white mb-6">Sign In</h2>
            <div id="error-msg" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded mb-4 text-sm"></div>
            <form id="signin-form">
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm font-medium mb-2" for="user">Username or Email</label>
                    <input type="text" id="user" name="user" class="panel-input w-full px-3 py-2 rounded text-sm" required autocomplete="username">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm font-medium mb-2" for="password">Password</label>
                    <input type="password" id="password" name="password" class="panel-input w-full px-3 py-2 rounded text-sm" required autocomplete="current-password">
                </div>
                <button type="submit" class="panel-btn w-full text-white font-medium py-2 px-4 rounded text-sm transition">
                    Sign In
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="#" class="text-sm text-blue-400 hover:text-blue-300">Forgot password?</a>
            </div>
        </div>
        <p class="text-center text-gray-600 text-xs mt-6">&copy; 2024 NovaPlex Technologies</p>
    </div>
    <script>
        document.getElementById('signin-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorDiv = document.getElementById('error-msg');
            errorDiv.classList.add('hidden');

            fetch('/auth/signin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user: document.getElementById('user').value,
                    password: document.getElementById('password').value
                })
            })
            .then(function(resp) { return resp.json().then(function(d) { return {status: resp.status, body: d}; }); })
            .then(function(result) {
                if (result.body.error) {
                    errorDiv.textContent = result.body.error;
                    errorDiv.classList.remove('hidden');
                } else if (result.body.data) {
                    if (result.body.data.complete) {
                        window.location.href = result.body.data.intended;
                    } else {
                        window.location.href = '/auth/signin/verify?token=' + result.body.data.verification_token;
                    }
                }
            })
            .catch(function() {
                errorDiv.textContent = 'An unexpected error occurred.';
                errorDiv.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
