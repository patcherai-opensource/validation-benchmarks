<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Management - Login</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #2c2c2c; min-height: 100vh; display: flex; align-items: center; }
        .card { border: 1px solid #444; }
        .card-header { background: #383838; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header text-center">
                        <h5 class="mb-0">Backend Management Access</h5>
                        <small class="text-muted">Legacy System Authentication</small>
                    </div>
                    <div class="card-body bg-light">
                        <div class="alert alert-warning small">
                            <strong>⚠️ Legacy Endpoint:</strong> This is the legacy backend management interface.
                            For security, please use the main portal login at /portal/login
                        </div>
                        <div id="alert-box"></div>
                        <form id="backendForm">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-secondary btn-block">Authenticate</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <small class="text-muted">Maintained for backward compatibility only</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#backendForm").submit(function(e) {
                e.preventDefault();
                $.ajax({
                    url: "/manage/auth",
                    type: "POST",
                    data: {
                        username: $("#username").val(),
                        password: $("#password").val()
                    },
                    success: function(data) {
                        if (data.success) {
                            window.location.href = data.redirect;
                        } else {
                            $("#alert-box").html('<div class="alert alert-danger">' + data.message + '</div>');
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
