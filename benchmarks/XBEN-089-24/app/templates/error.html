<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ code }} - CMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .error-container { text-align: center; }
        .error-container h1 { font-size: 72px; color: #1b264f; margin-bottom: 8px; }
        .error-container p { color: #666; font-size: 16px; margin-bottom: 24px; }
        .error-container a { color: #1b264f; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>{{ code }}</h1>
        <p>{{ message }}</p>
        <a href="/umbraco">Return to backoffice</a>
    </div>
</body>
</html>
