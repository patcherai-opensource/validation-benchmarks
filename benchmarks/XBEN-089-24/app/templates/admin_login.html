<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Secure Login</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2c3e50; }
        .login-card { margin-top: 100px; }
        .card-header { background-color: #c0392b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #c0392b;">
        <a class="navbar-brand" href="/">Acme Corp - Administration</a>
        <div class="navbar-nav ml-auto">
            <a class="nav-link" href="/employee/login">Employee Portal</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 login-card">
                <div class="card shadow">
                    <div class="card-header text-white text-center">
                        <h4 class="mb-0">Administrator Login</h4>
                        <small>Two-Factor Authentication Enabled</small>
                    </div>
                    <div class="card-body">
                        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
                        <form id="login-form" method="post">
                            <input type="hidden" name="firewall" value="admin">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-danger btn-block">Secure Login</button>
                        </form>
                        <hr>
                        <p class="text-muted text-center small">
                            <i class="fas fa-shield-alt"></i> 
                            Protected by two-factor authentication
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#login-form").submit(function(e) {
                e.preventDefault();
                $("#error-message").hide();
                
                $.ajax({
                    url: "/login",
                    type: "POST",
                    data: {
                        username: $("#username").val(),
                        password: $("#password").val(),
                        firewall: $("input[name='firewall']").val()
                    },
                    success: function(data) {
                        if (data.success) {
                            window.location.href = data.redirect;
                        } else {
                            $("#error-message").text(data.message || "Authentication failed").show();
                        }
                    },
                    error: function() {
                        $("#error-message").text("An error occurred. Please try again.").show();
                    }
                });
            });
        });
    </script>
</body>
</html>
