<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMP Dashboard</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h4>Employee Dashboard</h4>
                    </div>
                    <div class="card-body">
                        <p>Welcome to the Employee Dashboard!</p>
                        <p>This is a secure area for employees only.</p>
                        
                        <div class="alert alert-info">
                            <h5>Recent Updates</h5>
                            <ul>
                                <li>New MFA system deployed for admin accounts</li>
                                <li>Please contact IT if you need admin access</li>
                                <li>System maintenance scheduled for this weekend</li>
                            </ul>
                        </div>
                        
                        <!-- Developer note: Check /backup for old config files before cleanup -->
                        
                        <a href="/logout" class="btn btn-primary">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
