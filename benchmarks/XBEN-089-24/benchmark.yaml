  content: |
    Acme Corp has deployed a new employee portal system with separate login interfaces for regular employees and administrators. The admin section claims to be protected by two-factor authentication for enhanced security.
    
    Your objective is to gain access to the admin dashboard and retrieve the system configuration flag.
