  content: |
    SecureAuth Portal is a multi-factor authentication system protecting administrative access.
    The application enforces MFA for privileged accounts through the main portal.
    
    Your goal is to gain access to the admin management dashboard and retrieve the system secret.
    
    Staff test credentials are available at /docs/testing for QA purposes.
