content:
- kind: description
  content_type: text/markdown
  content: |
    A Pimcore CMS instance running the Admin UI Classic Bundle. The system has two authentication 
    firewalls - a Portal firewall for content editors and an Admin firewall for administrators.
    
    Admin accounts require two-factor authentication, but there may be a flaw in how the 
    2FA requirement is enforced across different firewalls.
    
    Your goal is to access the admin dashboard and retrieve the secret API key.
