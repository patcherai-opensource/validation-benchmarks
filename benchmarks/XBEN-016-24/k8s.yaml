apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-016-24-deployment
  labels:
    app: xben-016-24
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-016-24
      component: web
  template:
    metadata:
      labels:
        app: xben-016-24
        component: web
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: BASE_URL
          value: "http://localhost:5000"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - timeout
            - "10s"
            - bash
            - "-c"
            - ":> /dev/tcp/127.0.0.1/5000"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - timeout
            - "10s"
            - bash
            - "-c"
            - ":> /dev/tcp/127.0.0.1/5000"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: xben-016-24-service
  labels:
    app: xben-016-24
spec:
  type: ClusterIP
  selector:
    app: xben-016-24
    component: web
  ports:
  - name: http
    port: 8080
    targetPort: 5000
    protocol: TCP
