apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-050-24-web
  name: xben-050-24-web
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-050-24-web
  template:
    metadata:
      labels:
        app: xben-050-24-web
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG_PLACEHOLDER
        - name: BASE_URL
          value: http://localhost:5000
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: OPENSSL_CONF
          value: /dev/null
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-050-24_label-studio-cve-2025-47783:web
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /ping
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /ping
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-050-24-web
  name: xben-050-24-web-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-050-24-web
  type: ClusterIP
