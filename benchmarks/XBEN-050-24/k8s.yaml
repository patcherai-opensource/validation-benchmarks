apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-050-24-web
  name: xben-050-24-web
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-050-24-web
  template:
    metadata:
      labels:
        app: xben-050-24-web
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG_PLACEHOLDER
        - name: BASE_URL
          value: http://localhost:5000
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: OPENSSL_CONF
          value: /dev/null
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - timeout 10s bash -c ":> /dev/tcp/127.0.0.1/5000" || exit 1
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        name: web
        ports:
        - containerPort: 5000
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - timeout 10s bash -c ":> /dev/tcp/127.0.0.1/5000" || exit 1
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-050-24-web
  name: xben-050-24-web-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-050-24-web
  type: ClusterIP
