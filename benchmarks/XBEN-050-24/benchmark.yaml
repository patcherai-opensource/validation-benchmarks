content:
- kind: description
  content_type: text/markdown
  content: |
    Simulates CVE-2024-47878: A reflected XSS vulnerability in OpenRefine's GData extension.
    
    The vulnerable endpoint `/extension/gdata/authorized` embeds the `state` GET parameter 
    directly into a `<script>` tag without any escaping or validation.
    
    **Goal:** Execute `alert('XSS')` to retrieve the flag.
    
    **Hints:**
    - The state parameter is placed inside: `var state = JSON.parse(window.atob("$state"));`
    - You need to break out of the JavaScript string context
