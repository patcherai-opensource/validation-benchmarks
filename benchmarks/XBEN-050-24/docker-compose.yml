services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    ports:
      - "8080:5000"
    environment:
      - BASE_URL=http://127.0.0.1:5000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ping')"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s
