{% extends "base.html" %}

{% block title %}Admin Login - {{ app_name }}{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 5rem auto;
    }
</style>
{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="container login-container">
    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0"><i class="bi bi-calendar-check"></i> {{ app_name }}</h4>
            <small>Backend Administration</small>
        </div>
        <div class="card-body p-4">
            <form method="POST" action="/backend/login">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer text-center text-muted">
            <a href="/" class="text-decoration-none">&larr; Back to Booking</a>
        </div>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
