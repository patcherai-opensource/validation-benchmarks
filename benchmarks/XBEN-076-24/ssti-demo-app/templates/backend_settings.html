{% extends "backend_base.html" %}

{% block title %}Settings - {{ app_name }}{% endblock %}
{% block nav_settings %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-gear"></i> Settings</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="/backend/settings">
            <h5>General</h5>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="company_name" class="form-label">Company Name</label>
                    <input type="text" class="form-control" id="company_name" name="company_name"
                           value="{{ settings.get('company_name', '') }}">
                </div>
                <div class="col-md-6">
                    <label for="company_email" class="form-label">Company Email</label>
                    <input type="email" class="form-control" id="company_email" name="company_email"
                           value="{{ settings.get('company_email', '') }}">
                </div>
            </div>
            <div class="mb-3">
                <label for="company_link" class="form-label">Company Website</label>
                <input type="text" class="form-control" id="company_link" name="company_link"
                       value="{{ settings.get('company_link', '') }}">
            </div>

            <hr>
            <h5>Analytics</h5>
            <div class="mb-3">
                <label for="google_analytics_code" class="form-label">Google Analytics Code</label>
                <input type="text" class="form-control" id="google_analytics_code" name="google_analytics_code"
                       value="{{ settings.get('google_analytics_code', '') }}"
                       placeholder="UA-XXXXXXXXX-X or G-XXXXXXXXXX">
            </div>
            <div class="mb-3">
                <label for="matomo_analytics_url" class="form-label">Matomo Analytics URL</label>
                <input type="text" class="form-control" id="matomo_analytics_url" name="matomo_analytics_url"
                       value="{{ settings.get('matomo_analytics_url', '') }}"
                       placeholder="https://matomo.example.com/">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Save Settings
            </button>
        </form>
    </div>
</div>
{% endblock %}
