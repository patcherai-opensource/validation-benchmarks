apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssti-demo-app
  labels:
    app: ssti-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-demo-app
  template:
    metadata:
      labels:
        app: ssti-demo-app
    spec:
      restartPolicy: Always
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ssti-demo-app-service
  labels:
    app: ssti-demo-app
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: ssti-demo-app