services:
  app:
    build:
      context: ./app
      args:
        - FLAG
    ports:
      - "8080:80"
    environment:
      - DB_PATH=/data/workflow_engine.db
      - FLAG=${FLAG:-FLAG{test}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ping"]
      timeout: 3s
      retries: 5
      interval: 10s
