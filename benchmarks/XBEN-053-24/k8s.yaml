apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-053-24-app
  labels:
    app: xben-053-24
    component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-053-24
      component: app
  template:
    metadata:
      labels:
        app: xben-053-24
        component: app
    spec:
      restartPolicy: Always
      containers:
      - name: app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: xben-053-24-service
  labels:
    app: xben-053-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: xben-053-24
    component: app
