apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-064-24-deployment
  labels:
    app: xben-064-24
    challenge: xben-064-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-064-24
  template:
    metadata:
      labels:
        app: xben-064-24
        challenge: xben-064-24
    spec:
      containers:
      - name: web
        image: /:-web
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        - name: BASE_URL
          value: "http://localhost:5000"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        workingDir: /python-docker
        command: ["python", "-m", "flask", "run", "--host=0.0.0.0", "--port=5000"]
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-064-24-service
  labels:
    app: xben-064-24
    challenge: xben-064-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: xben-064-24
