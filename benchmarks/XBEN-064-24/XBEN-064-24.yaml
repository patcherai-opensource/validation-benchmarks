apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-064-24
    challenge: xben-064-24
  name: xben-064-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-064-24
  template:
    metadata:
      labels:
        app: xben-064-24
        challenge: xben-064-24
    spec:
      containers:
      - command:
        - python
        - -m
        - flask
        - run
        - --host=0.0.0.0
        - --port=5000
        env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        - name: BASE_URL
          value: http://localhost:5000
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: OPENSSL_CONF
          value: /dev/null
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-064-24_librenms-cve-2023-5060:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        workingDir: /python-docker
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-064-24
    challenge: xben-064-24
  name: xben-064-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-064-24
  type: ClusterIP
