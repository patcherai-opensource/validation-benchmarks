{% extends "base.html" %}
{% block title %}{{ user.username }}'s Pages{% endblock %}
{% block content %}
    <h2>{{ user.username }}'s Pages</h2>
    <ul class="list-group">
        {% for page in pages %}
            <li class="list-group-item">
                <h3>{{ page.title }}</h3>  
                <a href="/edit_page/{{ page.id }}" class="btn btn-primary">View and Edit</a>
            </li>
        {% else %}
            <li class="list-group-item text-muted">No pages yet. <a href="/create_page">Create one!</a></li>
        {% endfor %}
    </ul>
{% endblock %}
