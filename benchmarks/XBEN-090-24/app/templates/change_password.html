{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
    <h2>Change Password</h2>
    <form method="POST" action="/user-password">
        {{ form.hidden_tag() }}
        <input type="hidden" name="username" value="{{ current_user.username }}">
        <div class="form-group">
            <label class="form-control-label" for="newPassword">New Password</label>
            <input class="form-control form-control-lg" id="newPassword" name="newPassword" required type="password">
        </div>
        <div class="form-group">
            <label class="form-control-label" for="confirmPassword">Confirm New Password</label>
            <input class="form-control form-control-lg" id="confirmPassword" name="confirmPassword" required type="password">
        </div>
        <div class="form-group">
            <input class="btn btn-primary btn-lg btn-block" type="submit" value="Change Password">
        </div>
    </form>
{% endblock %}
