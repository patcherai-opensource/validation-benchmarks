{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
    <div class="card mt-4">
        <div class="card-header">
            <h4>Change Password</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('change_password') }}">
                {{ form.hidden_tag() }}
                <input type="hidden" name="username" value="{{ current_user.username }}">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="4">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary">Update Password</button>
                <a href="{{ url_for('account_settings') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
