{% extends "base.html" %}
{% block title %}WP Project Manager{% endblock %}
{% block content %}
<div class="wrap">
    <h1>WP Project Manager</h1>
    <p>Project, Task Management &amp; Team Collaboration for WordPress.</p>
    <p style="margin-top: 15px;">
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('dashboard') }}" class="button">Go to Dashboard</a>
        {% else %}
        <a href="{{ url_for('login') }}" class="button">Log In</a>
        {% endif %}
    </p>
</div>
{% endblock %}
