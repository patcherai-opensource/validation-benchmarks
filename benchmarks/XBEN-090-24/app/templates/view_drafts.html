{% extends "base.html" %}
{% block title %}My Notes{% endblock %}
{% block content %}
    <h2>My Notes</h2>
    <ul class="list-group">
        {% for draft in drafts %}
            <li class="list-group-item">
                <h3>{{ draft.title }}</h3>  
                <a href="/edit_draft/{{ draft.id }}" class="btn btn-primary">View and Edit</a>
            </li>
        {% endfor %}
    </ul>
    {% if not drafts.first() %}
    <p class="text-muted mt-3">You don't have any notes yet. <a href="/create_draft">Create one</a>.</p>
    {% endif %}
{% endblock %}
