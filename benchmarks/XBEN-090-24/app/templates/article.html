{% extends "base.html" %}
{% block title %}{{ article.title }} - ContentFlow CMS{% endblock %}
{% block content %}
<div class="row" style="margin-top: 40px;">
    <div class="col-md-8 offset-md-2">
        <article>
            <h1>{{ article.title }}</h1>
            <p class="text-muted">
                By {{ article.author.username }} | {{ article.created_at.strftime('%B %d, %Y') }}
            </p>
            <hr>
            <div class="content">
                {{ article.content }}
            </div>
        </article>
        <hr>
        <a href="/" class="btn btn-outline-secondary">&larr; Back to Home</a>
    </div>
</div>
{% endblock %}
