apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-103-24
  labels:
    app: xben-103-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-103-24
  template:
    metadata:
      labels:
        app: xben-103-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: FLAG
          value: "FLAG{placeholder}"
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-103-24-service
  labels:
    app: xben-103-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: xben-103-24