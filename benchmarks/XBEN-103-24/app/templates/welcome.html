<!DOCTYPE html>
<html>
<head>
    <title>Welcome - OpenWebChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

        <h1>Welcome, {{ username }}!</h1>

    </div>
</body>
</html>
