<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if session.get('user_id') %}
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="{{ url_for('dashboard_list') }}">{{ app_name }}</a>
        </div>
        <div class="navbar-menu">
            <a href="{{ url_for('dashboard_list') }}">Dashboards</a>
            <a href="{{ url_for('chart_list') }}">Charts</a>
            <a href="{{ url_for('dataset_list') }}">Datasets</a>
            <a href="{{ url_for('database_list') }}">Data</a>
            {% if 'Admin' in session.get('roles', []) %}
            <a href="{{ url_for('sqllab') }}">SQL Lab</a>
            <a href="{{ url_for('user_list') }}">Users</a>
            <a href="{{ url_for('security_settings') }}">Settings</a>
            {% endif %}
        </div>
        <div class="navbar-user">
            <span>{{ session.get('username') }}</span>
            <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
