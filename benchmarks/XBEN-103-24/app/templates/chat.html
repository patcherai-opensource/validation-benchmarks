<!DOCTYPE html>
<html>
<head>
    <title>OpenChat - Team Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        .app-container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #16213e;
            padding: 20px;
            border-right: 1px solid #2a2a4a;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .sidebar-header h2 {
            font-size: 20px;
            margin-left: 10px;
        }
        .user-info {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .user-info .name {
            font-weight: 600;
            color: #fff;
        }
        .user-info .role {
            font-size: 12px;
            color: #888;
            text-transform: capitalize;
        }
        .nav-links {
            list-style: none;
        }
        .nav-links li {
            margin-bottom: 5px;
        }
        .nav-links a {
            display: block;
            padding: 12px 15px;
            color: #aaa;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            background: #1a1a2e;
            color: #fff;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
        }
        .chat-header h1 {
            font-size: 18px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .message {
            margin-bottom: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .message-user {
            font-weight: 600;
            color: #4a90d9;
        }
        .message-time {
            margin-left: 10px;
            font-size: 12px;
            color: #666;
        }
        .message-content {
            color: #ddd;
            line-height: 1.5;
        }
        .chat-input-container {
            padding: 20px;
            background: #16213e;
            border-top: 1px solid #2a2a4a;
        }
        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }
        #message-input {
            flex: 1;
            padding: 12px 15px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        #message-input:focus {
            outline: none;
            border-color: #4a90d9;
        }
        .btn-send {
            padding: 12px 25px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:hover {
            background: #357abd;
        }
        .input-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        .logout-btn {
            display: block;
            margin-top: auto;
            padding: 12px;
            text-align: center;
            color: #888;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #2a2a4a;
            color: #fff;
        }
        .version-tag {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span style="font-size: 24px;">🗨️</span>
                <h2>OpenChat</h2>
            </div>
            
            <div class="user-info">
                <div class="name">{{ user.name }}</div>
                <div class="role">{{ user.role }}</div>
            </div>
            
            <ul class="nav-links">
                <li><a href="/chat" class="active">💬 Team Chat</a></li>
                <li><a href="/api/whoami">👤 Profile</a></li>
                <li><a href="/api/admin/panel">🔐 Admin Panel</a></li>
            </ul>
            
            <a href="/logout" class="logout-btn">Logout</a>
            <div class="version-tag">v0.3.8</div>
        </aside>
        
        <main class="main-content">
            <div class="chat-header">
                <h1>💬 Team Chat</h1>
            </div>
            
            <div class="chat-messages" id="messages-container">
                {% for msg in messages %}
                <div class="message">
                    <div class="message-header">
                        <span class="message-user">{{ msg.user }}</span>
                        <span class="message-time">{{ msg.timestamp | int }}</span>
                    </div>
                    <div class="message-content">{{ msg.content | safe }}</div>
                </div>
                {% endfor %}
            </div>
            
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <input type="text" id="message-input" placeholder="Type a message... (HTML/Markdown supported)" />
                    <button class="btn-send" onclick="sendMessage()">Send</button>
                </div>
                <div class="input-hint">💡 Tip: HTML formatting is supported for rich content</div>
            </div>
        </main>
    </div>
    
    <script>
        function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content) return;
            
            fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({content: content})
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                }
            });
            
            input.value = '';
        }
        
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
