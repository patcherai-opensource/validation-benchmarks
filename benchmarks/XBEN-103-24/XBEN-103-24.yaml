apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-103-24
  name: xben-103-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-103-24
  template:
    metadata:
      labels:
        app: xben-103-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG{placeholder}
        - name: FLASK_ENV
          value: production
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-103-24_airflow-cve-2020-17526:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: http-internal
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-103-24
  name: xben-103-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: http-internal
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: xben-103-24
  type: ClusterIP
