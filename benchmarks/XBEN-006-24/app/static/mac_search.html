<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC Address Search - NetMon</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; color: #fff; }
        .navbar { background: #16213e; }
        .sidebar { background: #0f3460; min-height: calc(100vh - 56px); padding: 20px 0; }
        .sidebar a { color: #aaa; display: block; padding: 10px 20px; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { color: #4fc3f7; background: rgba(255,255,255,0.05); }
        .main-content { padding: 30px; }
        .search-box { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 30px; }
        .form-control { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; }
        .form-control:focus { background: rgba(255,255,255,0.15); border-color: #4fc3f7; color: #fff; }
        .btn-search { background: #0f3460; border: none; }
        .btn-search:hover { background: #1a5276; }
        .results-table { background: rgba(255,255,255,0.05); border-radius: 10px; margin-top: 20px; }
        .results-table th { border-top: none; color: #4fc3f7; }
        .results-table td { border-color: rgba(255,255,255,0.1); }
        .alert-info { background: rgba(79, 195, 247, 0.2); border-color: #4fc3f7; color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard"><strong>NetMon</strong></a>
            <div class="navbar-nav ml-auto">
                <a class="nav-link" href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <a href="/dashboard">Dashboard</a>
                <a href="/search/mac" class="active">MAC Search</a>
                <a href="/settings">Settings</a>
            </div>
            <div class="col-md-10 main-content">
                <h2 class="mb-4">MAC Address Search</h2>
                
                <div class="search-box">
                    <form id="search-form">
                        <div class="form-group">
                            <label>Search by MAC Address</label>
                            <input type="text" id="mac-address" class="form-control" 
                                   placeholder="Enter MAC address (e.g., AA:BB:CC:DD:EE:FF or AABBCCDDEEFF)">
                            <small class="form-text text-muted">
                                Supports various formats: AA:BB:CC:DD:EE:FF, AA-BB-CC-DD-EE-FF, AABBCCDDEEFF
                            </small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-search">Search</button>
                    </form>
                </div>

                <div id="results-container" style="display:none;">
                    <div class="results-table p-3">
                        <h5 class="mb-3">Search Results</h5>
                        <table class="table table-dark table-borderless">
                            <thead>
                                <tr>
                                    <th>Device</th>
                                    <th>IP Address</th>
                                    <th>Interface</th>
                                    <th>MAC Address</th>
                                    <th>Speed</th>
                                    <th>Status</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody id="results-body">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="no-results" class="alert alert-info mt-4" style="display:none;">
                    No interfaces found matching the specified MAC address.
                </div>

                <div id="error-msg" class="alert alert-danger mt-4" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('search-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const address = document.getElementById('mac-address').value;
            const resultsContainer = document.getElementById('results-container');
            const noResults = document.getElementById('no-results');
            const errorMsg = document.getElementById('error-msg');
            
            resultsContainer.style.display = 'none';
            noResults.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/search/address', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.results && data.results.length > 0) {
                        const tbody = document.getElementById('results-body');
                        tbody.innerHTML = '';
                        data.results.forEach(r => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${r.hostname || '-'}</td>
                                    <td>${r.ip_address || '-'}</td>
                                    <td>${r.if_name || '-'}</td>
                                    <td><code>${r.if_phys_address || '-'}</code></td>
                                    <td>${r.if_speed ? r.if_speed + ' Mbps' : '-'}</td>
                                    <td>${r.if_status || '-'}</td>
                                    <td>${r.description || '-'}</td>
                                </tr>
                            `;
                        });
                        resultsContainer.style.display = 'block';
                    } else {
                        noResults.style.display = 'block';
                    }
                } else {
                    errorMsg.textContent = data.error + (data.detail ? ': ' + data.detail : '');
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Connection error';
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async function(e) {
            e.preventDefault();
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        });
    </script>
</body>
</html>
