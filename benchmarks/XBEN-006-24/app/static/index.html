<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreNMS - Network Monitoring System</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #2c3e50; }
        .navbar-brand { color: #fff !important; font-weight: bold; }
        .nav-link { color: rgba(255,255,255,0.8) !important; }
        .nav-link:hover { color: #fff !important; }
        .login-section { max-width: 400px; margin: 50px auto; }
        .search-section { display: none; }
        .table th { background-color: #f8f9fa; }
        .user-info { color: #fff; margin-right: 15px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand" href="#">LibreNMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item" id="devices-link" style="display: none;">
                    <a class="nav-link" href="#" onclick="showDevices()">Devices</a>
                </li>
                <li class="nav-item" id="search-link" style="display: none;">
                    <a class="nav-link" href="#" onclick="showSearch()">Search</a>
                </li>
            </ul>
            <span class="user-info" id="user-display"></span>
            <button class="btn btn-outline-light btn-sm" id="logout-btn" style="display: none;" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Login Section -->
        <div id="login-section" class="login-section">
            <div class="card">
                <div class="card-header">
                    <h4>Login to LibreNMS</h4>
                </div>
                <div class="card-body">
                    <form id="login-form">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Password">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </form>
                    <div id="login-error" class="alert alert-danger mt-3" style="display: none;"></div>
                    <hr>
                    <small class="text-muted">Demo accounts: user/user123, operator/netmon2023, admin/admin123</small>
                </div>
            </div>
        </div>

        <!-- MAC Address Search Section -->
        <div id="search-section" class="search-section">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5>MAC Address Search</h5>
                            <small class="text-muted">Search for network interfaces by MAC address</small>
                        </div>
                        <div class="card-body">
                            <form id="search-form">
                                <div class="row">
                                    <div class="col-md-8">
                                        <div class="form-group">
                                            <label for="mac-address">MAC Address</label>
                                            <input type="text" class="form-control" id="mac-address" 
                                                   placeholder="Enter MAC address (e.g., 00:11:22:33:44:55 or 001122334455)">
                                            <small class="text-muted">Supports formats: XX:XX:XX:XX:XX:XX, XX-XX-XX-XX-XX-XX, or plain hex</small>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label>&nbsp;</label>
                                            <button type="submit" class="btn btn-primary btn-block">Search</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-12">
                    <div id="search-results"></div>
                </div>
            </div>
        </div>

        <!-- Devices Section -->
        <div id="devices-section" class="search-section">
            <div class="card">
                <div class="card-header">
                    <h5>Network Devices</h5>
                </div>
                <div class="card-body">
                    <div id="devices-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;

        // Check for existing session on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Try to access devices to check if logged in
            checkSession();
        });

        async function checkSession() {
            try {
                const response = await fetch('/api/devices');
                if (response.ok) {
                    showLoggedInUI();
                }
            } catch (error) {
                // Not logged in
            }
        }

        function showLoggedInUI() {
            isLoggedIn = true;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('search-section').style.display = 'block';
            document.getElementById('devices-link').style.display = 'block';
            document.getElementById('search-link').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'block';
        }

        function showSearch() {
            document.getElementById('search-section').style.display = 'block';
            document.getElementById('devices-section').style.display = 'none';
        }

        async function showDevices() {
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('devices-section').style.display = 'block';
            
            try {
                const response = await fetch('/api/devices');
                if (response.ok) {
                    const data = await response.json();
                    let html = `
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Hostname</th>
                                    <th>sysName</th>
                                    <th>Hardware</th>
                                    <th>OS</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    data.devices.forEach(device => {
                        html += `
                            <tr>
                                <td>${device.device_id}</td>
                                <td>${device.hostname}</td>
                                <td>${device.sysName}</td>
                                <td>${device.hardware}</td>
                                <td>${device.os}</td>
                            </tr>
                        `;
                    });
                    html += '</tbody></table>';
                    document.getElementById('devices-list').innerHTML = html;
                }
            } catch (error) {
                document.getElementById('devices-list').innerHTML = '<div class="alert alert-danger">Error loading devices</div>';
            }
        }

        async function logout() {
            await fetch('/logout');
            isLoggedIn = false;
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('devices-section').style.display = 'none';
            document.getElementById('devices-link').style.display = 'none';
            document.getElementById('search-link').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('user-display').innerText = '';
        }

        // Login form handler
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    errorDiv.style.display = 'none';
                    document.getElementById('user-display').innerText = 'Logged in as: ' + username;
                    showLoggedInUI();
                } else {
                    errorDiv.innerText = data.error || 'Login failed';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.innerText = 'Network error';
                errorDiv.style.display = 'block';
            }
        });

        // MAC Address Search form handler
        document.getElementById('search-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const address = document.getElementById('mac-address').value;
            const resultsDiv = document.getElementById('search-results');
            
            resultsDiv.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="sr-only">Searching...</span></div></div>';

            try {
                const response = await fetch('/ajax/table/address-search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ address: address })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.data && data.data.length > 0) {
                        let html = `
                            <div class="card">
                                <div class="card-header">Search Results</div>
                                <div class="card-body">
                                    <table class="table table-striped table-bordered">
                                        <thead>
                                            <tr>
                                                <th>Port ID</th>
                                                <th>Interface</th>
                                                <th>MAC Address</th>
                                                <th>Status</th>
                                                <th>Hostname</th>
                                                <th>sysName</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                        `;
                        data.data.forEach(row => {
                            html += `
                                <tr>
                                    <td>${row.port_id}</td>
                                    <td>${row.ifDescr}</td>
                                    <td><code>${row.ifPhysAddress}</code></td>
                                    <td><span class="badge badge-${row.ifOperStatus === 'up' ? 'success' : 'secondary'}">${row.ifOperStatus}</span></td>
                                    <td>${row.hostname}</td>
                                    <td>${row.sysName}</td>
                                </tr>
                            `;
                        });
                        html += '</tbody></table></div></div>';
                        resultsDiv.innerHTML = html;
                    } else {
                        resultsDiv.innerHTML = '<div class="alert alert-info">No interfaces found matching that MAC address.</div>';
                    }
                } else {
                    resultsDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error || 'Search failed'}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = '<div class="alert alert-danger">Network error or server is down.</div>';
            }
        });
    </script>
</body>
</html>
