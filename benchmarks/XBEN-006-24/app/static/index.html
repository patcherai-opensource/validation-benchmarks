<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetMonitor - Network Device Management</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .sidebar { background-color: #343a40; min-height: calc(100vh - 56px); }
        .sidebar a { color: #fff; padding: 10px 15px; display: block; }
        .sidebar a:hover { background-color: #495057; text-decoration: none; }
        .status-up { color: #28a745; }
        .status-down { color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <a class="navbar-brand" href="/">NetMonitor</a>
        <span class="navbar-text">Network Device Management System v2.4.1</span>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar py-3">
                <a href="/">Dashboard</a>
                <a href="/api/devices">Devices</a>
                <a href="/search/mac">MAC Address Search</a>
            </nav>
            
            <main role="main" class="col-md-10 ml-sm-auto px-4 py-4">
                <h2>Dashboard</h2>
                <p class="lead">Welcome to NetMonitor - Your Network Monitoring Solution</p>
                
                <div class="card mt-4">
                    <div class="card-header">
                        <h5>Monitored Devices</h5>
                    </div>
                    <div class="card-body">
                        <div id="devices-list">Loading devices...</div>
                    </div>
                </div>
                
                <div class="card mt-4">
                    <div class="card-header">
                        <h5>Quick Search</h5>
                    </div>
                    <div class="card-body">
                        <p>Use the <a href="/search/mac">MAC Address Search</a> to find interfaces by their physical address.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        async function loadDevices() {
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();
                
                let html = '<table class="table table-striped"><thead><tr><th>Hostname</th><th>IP Address</th><th>Status</th></tr></thead><tbody>';
                devices.forEach(device => {
                    const statusClass = device.status === 'up' ? 'status-up' : 'status-down';
                    html += `<tr>
                        <td>${device.hostname}</td>
                        <td>${device.ip_address}</td>
                        <td class="${statusClass}">${device.status}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('devices-list').innerHTML = html;
            } catch (error) {
                document.getElementById('devices-list').innerHTML = '<div class="alert alert-danger">Failed to load devices</div>';
            }
        }
        
        loadDevices();
    </script>
</body>
</html>
