<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimcore - Object Manager</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .sidebar { background-color: #2c3e50; min-height: calc(100vh - 56px); color: white; }
        .sidebar a { color: #bdc3c7; }
        .sidebar a:hover { color: white; text-decoration: none; }
        .sidebar .nav-link { padding: 0.75rem 1rem; }
        .sidebar .nav-link.active { background-color: #34495e; }
        .content { padding: 20px; }
        .grid-toolbar { background-color: #f8f9fa; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .table th { background-color: #3498db; color: white; }
        .badge-published { background-color: #27ae60; }
        .badge-draft { background-color: #f39c12; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">
            <span style="color: #3498db;">pim</span>core
        </a>
        <span class="navbar-text ml-3">Object Manager v2.1.3</span>
        <div class="ml-auto">
            <span class="navbar-text">Logged in as: <strong>viewer</strong></span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            📦 Data Objects
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            📁 Assets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            📄 Documents
                        </a>
                    </li>
                    <li class="nav-item mt-4">
                        <a class="nav-link" href="#">
                            👥 Users
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            ⚙️ Settings
                        </a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-10 content">
                <h4>Products Grid</h4>
                <p class="text-muted">Browse and filter product data objects</p>
                
                <div class="grid-toolbar">
                    <div class="row">
                        <div class="col-md-3">
                            <label>Filter by Status</label>
                            <select id="status-filter" class="form-control form-control-sm">
                                <option value="">All</option>
                                <option value="published">Published</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label>Filter by Tags</label>
                            <select id="tags-filter" class="form-control form-control-sm" multiple>
                                <option value="electronics">electronics</option>
                                <option value="featured">featured</option>
                                <option value="accessories">accessories</option>
                                <option value="gaming">gaming</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label>&nbsp;</label>
                            <button id="apply-filter" class="btn btn-primary btn-sm btn-block">Apply Filter</button>
                        </div>
                        <div class="col-md-2">
                            <label>&nbsp;</label>
                            <button id="clear-filter" class="btn btn-secondary btn-sm btn-block">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="products-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Key</th>
                                <th>Name</th>
                                <th>SKU</th>
                                <th>Tags</th>
                                <th>Price</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="products-body">
                            <tr><td colspan="7" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="result-info" class="text-muted"></div>
            </main>
        </div>
    </div>

    <script>
        async function loadProducts(filters = []) {
            const tbody = document.getElementById('products-body');
            const resultInfo = document.getElementById('result-info');
            
            try {
                const response = await fetch('/admin/object/grid-proxy?classId=Product', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filter: filters, sort: 'o_id', dir: 'ASC' })
                });
                
                const result = await response.json();
                
                if (result.success && result.data) {
                    if (result.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No products found</td></tr>';
                    } else {
                        tbody.innerHTML = result.data.map(p => `
                            <tr>
                                <td>${p.o_id}</td>
                                <td>${p.o_key}</td>
                                <td>${p.name}</td>
                                <td>${p.sku}</td>
                                <td>${p.tags}</td>
                                <td>$${p.price.toFixed(2)}</td>
                                <td><span class="badge badge-${p.status === 'published' ? 'published' : 'draft'}">${p.status}</span></td>
                            </tr>
                        `).join('');
                    }
                    resultInfo.textContent = `Showing ${result.total} object(s)`;
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-danger">${result.message || 'Error loading data'}</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-danger">Network error</td></tr>';
            }
        }

        document.getElementById('apply-filter').addEventListener('click', function() {
            const filters = [];
            
            const status = document.getElementById('status-filter').value;
            if (status) {
                filters.push({ property: 'status', operator: '=', type: 'string', value: status });
            }
            
            const tagsSelect = document.getElementById('tags-filter');
            const selectedTags = Array.from(tagsSelect.selectedOptions).map(o => o.value);
            if (selectedTags.length > 0) {
                filters.push({ property: 'tags', operator: '=', type: 'list', value: selectedTags });
            }
            
            loadProducts(filters);
        });

        document.getElementById('clear-filter').addEventListener('click', function() {
            document.getElementById('status-filter').value = '';
            document.getElementById('tags-filter').selectedIndex = -1;
            loadProducts([]);
        });

        // Load products on page load
        loadProducts([]);
    </script>
</body>
</html>
