<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eKuiper Stream Processing Manager</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #eee; }
        .card { background-color: #16213e; border: 1px solid #0f3460; }
        .card-header { background-color: #0f3460; color: #e94560; }
        .table { color: #eee; }
        .table-dark { background-color: #16213e; }
        .table-dark td, .table-dark th { border-color: #0f3460; }
        .btn-primary { background-color: #e94560; border-color: #e94560; }
        .btn-primary:hover { background-color: #c73e54; border-color: #c73e54; }
        .navbar { background-color: #0f3460 !important; }
        .status-running { color: #4ade80; }
        .status-stopped { color: #f87171; }
        pre { background-color: #0d1b2a; padding: 15px; border-radius: 5px; color: #94a3b8; }
        .api-doc { font-family: monospace; background-color: #0d1b2a; padding: 10px; border-radius: 3px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <a class="navbar-brand" href="#">
            <strong>eKuiper</strong> <small class="text-muted">v1.14.1</small>
        </a>
        <span class="navbar-text">Stream Processing Engine</span>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
                <div class="card mb-3">
                    <div class="card-header">Navigation</div>
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action bg-dark text-light" onclick="loadRules()">Rules</a>
                        <a href="#" class="list-group-item list-group-item-action bg-dark text-light" onclick="loadConfigs()">Configurations</a>
                        <a href="#" class="list-group-item list-group-item-action bg-dark text-light" onclick="showApiDocs()">API Reference</a>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">System Status</div>
                    <div class="card-body">
                        <p><small>Version: 1.14.1</small></p>
                        <p><small>Backend: SQLite KV Store</small></p>
                        <p><small>Status: <span class="status-running">● Running</span></small></p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header" id="content-header">Stream Processing Rules</div>
                    <div class="card-body" id="content-body">
                        <p class="text-muted">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadRules() {
            document.getElementById('content-header').textContent = 'Stream Processing Rules';
            const contentBody = document.getElementById('content-body');
            contentBody.innerHTML = '<p class="text-muted">Loading rules...</p>';
            
            try {
                const response = await fetch('/rules');
                const rules = await response.json();
                
                let html = `
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Rule ID</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                rules.forEach(rule => {
                    html += `
                        <tr>
                            <td>${rule.id}</td>
                            <td><span class="status-running">● ${rule.status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-info" onclick="viewRule('${rule.id}')">View</button>
                                <button class="btn btn-sm btn-outline-warning" onclick="explainRule('${rule.id}')">Explain</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                contentBody.innerHTML = html;
            } catch (error) {
                contentBody.innerHTML = `<div class="alert alert-danger">Error loading rules: ${error.message}</div>`;
            }
        }
        
        async function viewRule(ruleId) {
            document.getElementById('content-header').textContent = `Rule: ${ruleId}`;
            const contentBody = document.getElementById('content-body');
            
            try {
                const response = await fetch(`/rules/${ruleId}`);
                const rule = await response.json();
                contentBody.innerHTML = `<pre>${JSON.stringify(rule, null, 2)}</pre>`;
            } catch (error) {
                contentBody.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
        
        async function explainRule(ruleId) {
            document.getElementById('content-header').textContent = `Execution Plan: ${ruleId}`;
            const contentBody = document.getElementById('content-body');
            
            try {
                const response = await fetch(`/rules/${ruleId}/explain`);
                const plan = await response.json();
                contentBody.innerHTML = `<pre>${JSON.stringify(plan, null, 2)}</pre>`;
            } catch (error) {
                contentBody.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
        
        async function loadConfigs() {
            document.getElementById('content-header').textContent = 'System Configurations';
            const contentBody = document.getElementById('content-body');
            contentBody.innerHTML = '<p class="text-muted">Loading configurations...</p>';
            
            try {
                const response = await fetch('/configs');
                const configs = await response.json();
                
                let html = `
                    <table class="table table-dark table-hover">
                        <thead>
                            <tr>
                                <th>Config Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                configs.forEach(config => {
                    html += `
                        <tr>
                            <td>${config}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-info" onclick="viewConfig('${config}')">View</button>
                            </td>
                        </tr>
                    `;
                });
                
                html += '</tbody></table>';
                contentBody.innerHTML = html;
            } catch (error) {
                contentBody.innerHTML = `<div class="alert alert-danger">Error loading configs: ${error.message}</div>`;
            }
        }
        
        async function viewConfig(configName) {
            document.getElementById('content-header').textContent = `Config: ${configName}`;
            const contentBody = document.getElementById('content-body');
            
            try {
                const response = await fetch(`/configs/${configName}`);
                const config = await response.json();
                contentBody.innerHTML = `<pre>${JSON.stringify(config, null, 2)}</pre>`;
            } catch (error) {
                contentBody.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
        
        function showApiDocs() {
            document.getElementById('content-header').textContent = 'REST API Reference';
            const contentBody = document.getElementById('content-body');
            contentBody.innerHTML = `
                <h5>Rules API</h5>
                <div class="api-doc mb-2">GET /rules - List all rules</div>
                <div class="api-doc mb-2">GET /rules/{name} - Get rule by name</div>
                <div class="api-doc mb-2">GET /rules/{name}/explain - Get execution plan for rule</div>
                <div class="api-doc mb-2">DELETE /rules/{name} - Delete a rule</div>
                
                <h5 class="mt-4">Configurations API</h5>
                <div class="api-doc mb-2">GET /configs - List all configurations</div>
                <div class="api-doc mb-2">GET /configs/{name} - Get configuration by name</div>
                
                <h5 class="mt-4">System API</h5>
                <div class="api-doc mb-2">GET /ping - Health check endpoint</div>
                
                <div class="alert alert-info mt-4">
                    <strong>Note:</strong> The rule and config endpoints accept the resource name directly in the URL path.
                    The backend uses a SQLite-based key-value store for persistence.
                </div>
            `;
        }
        
        // Load rules on page load
        document.addEventListener('DOMContentLoaded', loadRules);
    </script>
</body>
</html>
