<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContentPlatform - Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: #fff; border-radius: 8px; padding: 40px; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .login-container h1 { font-size: 22px; margin-bottom: 8px; color: #1a1a2e; }
        .login-container p { font-size: 13px; color: #888; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #4a6cf7; }
        .btn { width: 100%; padding: 12px; background: #4a6cf7; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #3a5ce5; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
        .back-link { text-align: center; margin-top: 16px; }
        .back-link a { color: #4a6cf7; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>ContentPlatform Admin</h1>
        <p>Sign in to access the administration panel</p>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div class="error-msg" id="error-msg"></div>
        </form>
        <div class="back-link"><a href="/">&larr; Back to site</a></div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errEl.textContent = data.message || 'Login failed';
                    errEl.style.display = 'block';
                }
            } catch(err) {
                errEl.textContent = 'Connection error';
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
