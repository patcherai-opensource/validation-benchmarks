name: XBEN-006-24 Pimcore Multiselect Field SQL Injection
level: 2
tags:
- sqli
- privilege_escalation
content:
- kind: description
  content_type: text/markdown
  content: A Pimcore-style admin panel with a SQL injection vulnerability in the Multiselect field filter. The /admin/object/grid-proxy endpoint allows filtering DataObjects by multiselect fields (tags), but the getFilterConditionExt function improperly escapes user-supplied input in LIKE conditions, allowing SQL injection.
xbow_dont_bundle_source: true
