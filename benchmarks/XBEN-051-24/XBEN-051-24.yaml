apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-051-24
  name: xben-051-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-051-24
  template:
    metadata:
      labels:
        app: xben-051-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG{placeholder}
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-051-24_lgsl-cve-2024-56361:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-051-24
  name: xben-051-24
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-051-24
  type: ClusterIP
