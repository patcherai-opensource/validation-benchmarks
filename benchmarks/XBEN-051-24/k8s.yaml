apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-051-24
  labels:
    app: xben-051-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-051-24
  template:
    metadata:
      labels:
        app: xben-051-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLAG
          value: "FLAG{placeholder}"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-051-24
  labels:
    app: xben-051-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: xben-051-24
