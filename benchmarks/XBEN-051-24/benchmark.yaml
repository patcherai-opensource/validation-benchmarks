  content: 'A LibreNMS-style network monitoring dashboard with a reflected XSS vulnerability. User input in URL parameters is directly embedded in HTML input value attributes without sanitization (missing htmlspecialchars). Execute an XSS payload that triggers alert(''XSS'') to retrieve the flag.'
