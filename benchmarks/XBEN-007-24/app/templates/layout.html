{% extends "base.html" %}
{% block body %}
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 sidebar d-flex flex-column">
            <div class="brand">Backoffice</div>
            <ul class="nav flex-column mt-3">
                <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/organizations">Organizations</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/events">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/members">Members</a></li>
                <li class="nav-item"><a class="nav-link" href="/admin/settings">Settings</a></li>
            </ul>
            <div class="mt-auto p-3">
                <small class="text-muted d-block mb-2" id="sidebar-user"></small>
                <button class="btn btn-sm btn-outline-light w-100" onclick="doLogout()">Sign Out</button>
            </div>
        </nav>
        <main class="col-md-10 main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function doLogout() {
    fetch('/admin/api/logout', {method:'POST'}).then(function(){window.location.href='/authentication';});
}
function loadCurrentUser() {
    fetch('/admin/api/account/current').then(function(r){return r.json();}).then(function(d){
        var el = document.getElementById('sidebar-user');
        if(el && d.username) el.textContent = d.username + ' (' + d.role + ')';
        window._currentAccount = d;
    });
}
loadCurrentUser();
</script>
{% block page_scripts %}{% endblock %}
{% endblock %}
