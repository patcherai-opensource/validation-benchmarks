{% extends "base.html" %}
{% block title %}{{ book.title }} - {{ settings.site_title }}{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Library</a></li>
                <li class="breadcrumb-item active">{{ book.title }}</li>
            </ol>
        </nav>
        <h2>{{ book.title }}</h2>
        <h5 class="text-muted">by {{ book.author }}</h5>
        <hr>
        <p>{{ book.description }}</p>
    </div>
</div>
{% endblock %}
