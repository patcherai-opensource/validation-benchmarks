{% extends "base.html" %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="breadcrumb-item active">Encounters</li>
    </ol>
</nav>

<h3>Encounter Summary - {{ patient.name }}</h3>
<p class="text-muted">Patient ID: {{ patient.pid }}</p>

<div class="alert alert-info">
    <small>This patient's encounter history is displayed below.</small>
</div>

<table class="table">
    <thead>
        <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Provider</th>
            <th>Notes</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>2024-01-15</td>
            <td>Office Visit</td>
            <td>Dr. General</td>
            <td>Routine checkup</td>
        </tr>
    </tbody>
</table>
{% endblock %}
