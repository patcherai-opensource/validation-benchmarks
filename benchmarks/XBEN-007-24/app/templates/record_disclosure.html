{% extends "base.html" %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('disclosure_full', pid=patient.pid) }}">Disclosures</a></li>
        <li class="breadcrumb-item active">Record New Disclosure</li>
    </ol>
</nav>

<h3>Record New Disclosure - {{ patient.name }}</h3>
<p class="text-muted">Patient ID: {{ patient.pid }}</p>

<div class="card">
    <div class="card-body">
        <form id="disclosureForm">
            <div class="form-group">
                <label>Disclosure Type</label>
                <select id="type" class="form-control">
                    <option value="Insurance">Insurance</option>
                    <option value="Legal">Legal</option>
                    <option value="Research">Research</option>
                    <option value="Family Member">Family Member</option>
                    <option value="Other Healthcare Provider">Other Healthcare Provider</option>
                </select>
            </div>
            <div class="form-group">
                <label>Recipient</label>
                <input type="text" id="recipient" class="form-control" placeholder="Name of recipient organization/person">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Details of the disclosure"></textarea>
            </div>
            <button type="button" onclick="submitDisclosure()" class="btn btn-primary">Record Disclosure</button>
            <a href="{{ url_for('disclosure_full', pid=patient.pid) }}" class="btn btn-secondary">Cancel</a>
        </form>
        <p id="message" class="mt-3"></p>
    </div>
</div>

<script>
function submitDisclosure() {
    fetch('/interface/patient_file/summary/record_disclosure.php?pid={{ patient.pid }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            type: document.getElementById('type').value,
            recipient: document.getElementById('recipient').value,
            description: document.getElementById('description').value
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') {
            document.getElementById('message').innerHTML = '<span class="text-success">Disclosure recorded successfully!</span>';
            setTimeout(() => window.location.href = '/interface/patient_file/summary/disclosure_full.php?pid={{ patient.pid }}', 1500);
        } else {
            document.getElementById('message').innerHTML = '<span class="text-danger">Error: ' + data.message + '</span>';
        }
    });
}
</script>
{% endblock %}
