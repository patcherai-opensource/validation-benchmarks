{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-3 sidebar py-3">
        <h6 class="text-muted px-3">PATIENT MENU</h6>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="{{ url_for('patient_demographics', pid=patient.pid) }}">Demographics</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="{{ url_for('disclosure_full', pid=patient.pid) }}">Disclosures</a>
            </li>
        </ul>
        <hr>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-sm mx-3">Back to Dashboard</a>
    </div>
    <div class="col-md-9 main-content">
        <h2>Record New Disclosure</h2>
        <p class="text-muted">{{ patient.first_name }} {{ patient.last_name }} (PID: {{ patient.pid }})</p>
        
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('record_disclosure', pid=patient.pid) }}">
                    <div class="mb-3">
                        <label for="disclosure_type" class="form-label">Disclosure Type</label>
                        <select class="form-select" id="disclosure_type" name="disclosure_type" required>
                            <option value="">Select type...</option>
                            <option value="Insurance Claim">Insurance Claim</option>
                            <option value="Referral">Referral</option>
                            <option value="Legal Request">Legal Request</option>
                            <option value="Research Study">Research Study</option>
                            <option value="School Records">School Records</option>
                            <option value="Employer Request">Employer Request</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="recipient" class="form-label">Recipient</label>
                        <input type="text" class="form-control" id="recipient" name="recipient" required placeholder="Organization or individual receiving the disclosure">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Details about the disclosure"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Disclosure</button>
                        <a href="{{ url_for('disclosure_full', pid=patient.pid) }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
