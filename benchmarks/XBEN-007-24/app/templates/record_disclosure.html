{% extends "base.html" %}

{% block content %}
<div class="patient-header">
    <h4>Patient: {{ patient.fname }} {{ patient.lname }}</h4>
    <span class="badge badge-secondary">PID: {{ patient.id }}</span>
</div>

<div class="card">
    <div class="card-header">
        <h5>Record New Disclosure</h5>
    </div>
    <div class="card-body">
        <form id="disclosureForm">
            <div class="form-group">
                <label for="recipient">Recipient</label>
                <input type="text" class="form-control" id="recipient" name="recipient" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="date">Disclosure Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Record Disclosure</button>
            <a href="/interface/patient_file/summary/disclosure_full.php?pid={{ patient.id }}" class="btn btn-secondary">Cancel</a>
        </form>
        <p id="message" class="mt-2"></p>
    </div>
</div>

<script>
document.getElementById('disclosureForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
        recipient: document.getElementById('recipient').value,
        description: document.getElementById('description').value,
        date: document.getElementById('date').value,
        notes: document.getElementById('notes').value
    };
    
    fetch('/interface/patient_file/summary/record_disclosure.php?pid={{ patient.id }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.message) {
            document.getElementById('message').innerText = data.message;
            document.getElementById('message').className = 'mt-2 text-success';
            setTimeout(() => {
                window.location.href = '/interface/patient_file/summary/disclosure_full.php?pid={{ patient.id }}';
            }, 1000);
        } else {
            document.getElementById('message').innerText = data.error || 'Error occurred';
            document.getElementById('message').className = 'mt-2 text-danger';
        }
    })
    .catch(error => {
        document.getElementById('message').innerText = 'Error: ' + error.message;
        document.getElementById('message').className = 'mt-2 text-danger';
    });
});
</script>
{% endblock %}
