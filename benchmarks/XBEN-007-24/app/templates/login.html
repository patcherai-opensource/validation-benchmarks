{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">OpenEMR Login</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Please enter your credentials to access the patient management system.</p>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password">
                </div>
                <button class="btn btn-primary btn-block" onclick="login()">Sign In</button>
                <p id="login-message" class="mt-2 text-danger"></p>
            </div>
            <div class="card-footer text-muted">
                <small>For technical support contact your system administrator.</small>
            </div>
        </div>
    </div>
</div>

<script>
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('role', data.role);
                document.getElementById('login-message').className = 'mt-2 text-success';
                document.getElementById('login-message').innerText = "Authentication successful. Redirecting...";
                window.location.href = "/interface/main/main_screen.php";
            } else {
                document.getElementById('login-message').innerText = data.message || "Authentication failed";
            }
        })
        .catch(error => {
            document.getElementById('login-message').innerText = "Connection error. Please try again.";
        });
    }
    
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });
</script>
{% endblock %}
