{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">alf.io Backoffice Login</h5></div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password">
                </div>
                <button class="btn btn-primary w-100" onclick="doLogin()">Sign In</button>
                <div id="login-error" class="text-danger mt-2" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function doLogin() {
    fetch('/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        })
    }).then(r => r.json().then(d => ({status: r.status, body: d})))
    .then(({status, body}) => {
        if (status === 200) {
            window.location.href = '/admin/dashboard';
        } else {
            document.getElementById('login-error').style.display = 'block';
            document.getElementById('login-error').textContent = body.error || 'Login failed';
        }
    });
}
document.getElementById('password').addEventListener('keypress', e => { if(e.key==='Enter') doLogin(); });
</script>
{% endblock %}
