{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">MedRecord Pro - Staff Portal</h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Please enter your credentials to access the Electronic Health Records system.</p>
                <div class="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password">
                    </div>
                    <button class="btn btn-primary btn-block" onclick="login()">Sign In</button>
                    <p id="login-message" class="mt-2 text-danger"></p>
                </div>
                <hr>
                <small class="text-muted">
                    For demo access use: <code>jdoe</code> / <code>welcome1</code><br>
                    <!-- Additional accounts: drsmith, admin -->
                </small>
            </div>
        </div>
    </div>
</div>

<script>
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.message === "Login successful") {
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('role', data.role);
                document.getElementById('login-message').innerText = "Login successful! Redirecting...";
                document.getElementById('login-message').className = "mt-2 text-success";
                window.location.href = "/interface/patient_file/summary/demographics.php";
            } else {
                document.getElementById('login-message').innerText = "Invalid credentials. Please try again.";
            }
        });
    }
    
    // Allow Enter key to submit
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') login();
    });
</script>
{% endblock %}
