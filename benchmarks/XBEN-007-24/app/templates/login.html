{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>FinanceHub Login</h2>
        <p class="text-muted">Access your financial dashboard</p>
        <div class="login-form mt-4">
            <input type="text" id="username" class="form-control" placeholder="Username">
            <input type="password" id="password" class="form-control" placeholder="Password" style="margin-top: 10px;">
            <button class="btn btn-success btn-block" style="margin-top: 15px;" onclick="login()">Login</button>
            <p id="login-message" class="mt-3 alert" style="display: none;"></p>
        </div>
        <div class="mt-4">
            <small class="text-muted">
                Demo accounts available. Contact support for credentials.
            </small>
        </div>
    </div>
</div>

<script>
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, password }),
        })
        .then(response => response.json())
        .then(data => {
            const msg = document.getElementById('login-message');
            msg.style.display = 'block';
            if (data.message === "Login successful") {
                localStorage.setItem('userID', data.userID);
                msg.className = 'mt-3 alert alert-success';
                msg.innerText = "Login successful! Redirecting...";
                setTimeout(() => window.location.href = "/dashboard", 1000);
            } else {
                msg.className = 'mt-3 alert alert-danger';
                msg.innerText = "Invalid credentials";
            }
        });
    }
</script>
{% endblock %}
