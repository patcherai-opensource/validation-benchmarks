{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-muted">{{ error_code }}</h1>
        <h2>{{ message }}</h2>
        <p class="text-muted">Please contact your system administrator if this problem persists.</p>
        <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary">Return Home</a>
    </div>
</div>
{% endblock %}
