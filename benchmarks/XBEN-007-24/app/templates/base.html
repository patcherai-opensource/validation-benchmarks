<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Backoffice{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; }
        .sidebar { min-height: 100vh; background-color: #2c3e50; }
        .sidebar .nav-link { color: #ecf0f1; padding: 12px 20px; }
        .sidebar .nav-link:hover { background-color: #34495e; color: #fff; }
        .sidebar .nav-link.active { background-color: #3498db; color: #fff; }
        .sidebar .brand { color: #fff; font-size: 1.2rem; padding: 20px; border-bottom: 1px solid #34495e; }
        .main-content { padding: 30px; }
        .card-stat { border-left: 4px solid #3498db; }
    </style>
</head>
<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
