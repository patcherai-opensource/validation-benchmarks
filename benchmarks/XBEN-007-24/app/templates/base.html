<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alf.io - Backoffice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background-color: #343a40; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #495057; }
        .navbar-brand img { height: 28px; margin-right: 8px; }
        .content-area { padding: 24px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="/admin/dashboard">
            <strong>alf.io</strong> <small class="text-muted">backoffice</small>
        </a>
        {% if user %}
        <div class="d-flex align-items-center">
            <span class="text-light me-3">{{ user.first_name }} {{ user.last_name }} <span class="badge bg-secondary">{{ user.role }}</span></span>
            <a href="/admin/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
        {% endif %}
    </nav>
    <div class="container-fluid">
        <div class="row">
            {% if user %}
            <nav class="col-md-2 d-none d-md-block sidebar py-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/events">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/organizations">Organizations</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/users">Users</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/api-keys">API Keys</a></li>
                </ul>
            </nav>
            <main class="col-md-10 content-area">
            {% else %}
            <main class="col-12 content-area">
            {% endif %}
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
