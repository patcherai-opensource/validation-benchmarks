<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedRecord Pro - Electronic Health Records</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background-color: #1a5276 !important; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover { color: #aed6f1 !important; }
        .sidebar { background-color: #f8f9fa; min-height: 100vh; padding: 20px; }
        .patient-info { background-color: #d5f5e3; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .disclosure-card { border-left: 4px solid #1a5276; margin-bottom: 10px; }
        .confidential { background-color: #fadbd8; }
        .footer-info { font-size: 0.8em; color: #666; margin-top: 30px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="#">
            <strong>MedRecord Pro</strong> <small>v6.0.2</small>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                {% if current_user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('patient_list') }}">Patient Demographics</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout ({{ current_user.username }})</a>
                </li>
                {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 mt-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <div class="footer-info text-center">
        <p>MedRecord Pro - Electronic Health Records System | HIPAA Compliant</p>
        <!-- System Version: 6.0.2-dev Build 2024.02.15 -->
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
