{% extends "base.html" %}
{% block title %}Edit User - {{ settings.site_title }}{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <h3>Edit User: {{ target.username }}</h3>
        <hr>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" value="{{ target.username }}" disabled>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="text" class="form-control" value="{{ target.email }}" disabled>
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Leave blank to keep current">
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select class="form-control" id="role" name="role">
                    <option value="0" {% if target.role == 0 %}selected{% endif %}>User</option>
                    <option value="1" {% if target.role == 1 %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
