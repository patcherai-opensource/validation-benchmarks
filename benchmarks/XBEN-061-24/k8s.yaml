apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-061-24-deployment
  labels:
    app: xben-061-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-061-24
  template:
    metadata:
      labels:
        app: xben-061-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-061-24-service
  labels:
    app: xben-061-24
spec:
  type: ClusterIP
  selector:
    app: xben-061-24
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP