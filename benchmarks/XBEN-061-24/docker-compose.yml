services:
  web:
    build: 
      context: ./app
      args:
        - FLAG
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://127.0.0.1:80/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      timeout: 5s
      retries: 10
      interval: 10s
