<!DOCTYPE html>
<html>
<head>
    <title>Ops Dashboard - System Utilities</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Ops Dashboard</div>
        <ul class="nav-links">
            <li><a href="/" class="active">Utilities</a></li>
            <li><a href="#">Monitoring</a></li>
            <li><a href="#">Logs</a></li>
        </ul>
    </nav>
    <div class="main-content">
        <div class="sidebar">
            <h3>System Tools</h3>
            <ul>
                {% for cmd_id, cmd in commands.items() %}
                <li class="tool-item" data-cmd="{{ cmd_id }}">
                    <span class="tool-name">{{ cmd.name }}</span>
                    <span class="tool-desc">{{ cmd.description }}</span>
                </li>
                {% endfor %}
            </ul>
        </div>
        <div class="content">
            <div class="panel">
                <h2>Run System Command</h2>
                <p class="info-text">Select a command from the sidebar and provide the required parameter.</p>
                <form action="/run" method="post" id="command-form">
                    <div class="form-group">
                        <label for="command_id">Command:</label>
                        <select name="command_id" id="command_id" required>
                            <option value="">-- Select Command --</option>
                            {% for cmd_id, cmd in commands.items() %}
                            <option value="{{ cmd_id }}" data-placeholder="{{ cmd.placeholder }}" data-param="{{ cmd.param_name }}">{{ cmd.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="param_value">Parameter:</label>
                        <input type="text" name="param_value" id="param_value" placeholder="Select a command first" required>
                    </div>
                    <button type="submit" class="btn-primary">Execute</button>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('command_id').addEventListener('change', function() {
            var selected = this.options[this.selectedIndex];
            var placeholder = selected.getAttribute('data-placeholder') || 'Enter value';
            document.getElementById('param_value').placeholder = placeholder;
        });
        
        document.querySelectorAll('.tool-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var cmdId = this.getAttribute('data-cmd');
                document.getElementById('command_id').value = cmdId;
                document.getElementById('command_id').dispatchEvent(new Event('change'));
            });
        });
    </script>
</body>
</html>
