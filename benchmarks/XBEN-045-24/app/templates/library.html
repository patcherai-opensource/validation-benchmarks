<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Library - MediaFlow</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">MediaFlow</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/library">Library</a>
            <a href="/process">Process</a>
            <a href="/presets">Action Presets</a>
        </div>
    </nav>
    <div class="container">
        <h1>Media Library</h1>
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Album</th>
                    <th>Duration</th>
                    <th>Format</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td><code>{{ item.id }}</code></td>
                    <td>{{ item.title }}</td>
                    <td>{{ item.artist }}</td>
                    <td>{{ item.album }}</td>
                    <td>{{ item.duration }}s</td>
                    <td>{{ item.format }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <h2>Add Media Item</h2>
        <form action="/api/media" method="post" class="add-form" id="addMediaForm">
            <div class="form-group">
                <label>Title:</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>Artist:</label>
                <input type="text" name="artist">
            </div>
            <div class="form-group">
                <label>Album:</label>
                <input type="text" name="album">
            </div>
            <div class="form-group">
                <label>Duration (seconds):</label>
                <input type="number" name="duration" value="0">
            </div>
            <div class="form-group">
                <label>Format:</label>
                <select name="format">
                    <option value="mp3">MP3</option>
                    <option value="flac">FLAC</option>
                    <option value="wav">WAV</option>
                    <option value="ogg">OGG</option>
                </select>
            </div>
            <button type="submit" class="btn">Add to Library</button>
        </form>
        <script>
        document.getElementById('addMediaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            fetch('/api/media', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(Object.fromEntries(formData))
            }).then(r => r.json()).then(data => {
                if (data.id) {
                    window.location.reload();
                } else {
                    alert(data.error || 'Failed to add item');
                }
            });
        });
        </script>
    </div>
</body>
</html>
