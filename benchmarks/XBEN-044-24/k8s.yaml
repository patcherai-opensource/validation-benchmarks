apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssti-twig-deployment
  labels:
    app: ssti-twig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-twig
  template:
    metadata:
      labels:
        app: ssti-twig
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: FLAG
          value: "FLAG{placeholder}"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /index.php
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /index.php
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ssti-twig-service
  labels:
    app: ssti-twig
spec:
  type: ClusterIP
  selector:
    app: ssti-twig
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
