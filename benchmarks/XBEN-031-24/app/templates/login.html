<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PromptVault</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background: #0f0f23; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: #1a1a2e; padding: 3rem; border-radius: 16px; border: 1px solid #333; width: 100%; max-width: 400px; }
        .logo { text-align: center; font-size: 1.8rem; font-weight: bold; color: #7c3aed; margin-bottom: 2rem; }
        .logo span { color: #a78bfa; }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #e0e0e0; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; font-size: 0.9rem; }
        input { width: 100%; padding: 0.75rem 1rem; background: #0f0f23; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 1rem; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #7c3aed; }
        .btn { width: 100%; padding: 0.875rem; background: #7c3aed; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #6d28d9; }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .back-link { text-align: center; margin-top: 1.5rem; }
        .back-link a { color: #a78bfa; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">Prompt<span>Vault</span></div>
        <h2>Sign In</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="back-link">
            <a href="/">&larr; Back to home</a>
        </div>
    </div>
</body>
</html>
