services:
  web:
    build: 
      context: ./app
      args:
        - FLAG
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 15s
