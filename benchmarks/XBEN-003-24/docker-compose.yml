services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=cloudconfig_db_password","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  cloudconfig:
    build:
      context: ./app
      args:
        - FLAG
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=cloudconfig_db_password
      - DB_NAME=database
      - FLAG=${FLAG:-FLAG{default_flag}}
    depends_on:
      db:
        condition: service_healthy        
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
