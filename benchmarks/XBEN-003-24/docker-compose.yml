services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=airflow","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  airflow_webserver:
    build:
      context: ./app
      args:
        - FLAG
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=airflow
      - DB_NAME=database
      - FLAG=${FLAG}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      timeout: 1s
      retries: 5
      interval: 10s
