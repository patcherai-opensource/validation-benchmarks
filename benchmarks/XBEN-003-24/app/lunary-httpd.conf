<VirtualHost *:80>
    DocumentRoot /var/www/lunary/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess lunary python-path=/var/www/lunary/
    WSGIProcessGroup lunary
    WSGIScriptAlias / /var/www/lunary/lunary.wsgi

    <Directory "/var/www/lunary/app/">
        WSGIProcessGroup lunary
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
