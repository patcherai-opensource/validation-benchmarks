<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alf.io - Authenticate</title>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <div class="logo">alf.io</div>
                </div>
                <div class="card p-4">
                    <h5 class="text-center mb-3">Welcome back, {{ first_name }}!</h5>
                    <p class="text-center text-muted small">Please enter your password to continue</p>
                    <form method="POST">
                        <input type="hidden" id="username" name="username" value="{{ username }}">
                        <div class="form-group mb-3">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/" class="text-muted small">Use different account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
