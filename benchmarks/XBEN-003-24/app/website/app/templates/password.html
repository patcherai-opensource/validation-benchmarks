<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password - CloudConfig</title>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 40px;
        }
        .form-control {
            background: #0f3460;
            border: 1px solid #333;
            color: #fff;
        }
        .form-control:focus {
            background: #16213e;
            color: #fff;
            border-color: #4a69bd;
        }
        .btn-primary {
            background: #0f3460;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h2>CloudConfig</h2>
                    <p class="text-muted">Cloud Configuration Service</p>
                </div>
                <div class="login-card">
                    <form>
                        <div class="form-group mb-3">
                            <p class="text-center">Welcome back, {{ first_name }}!</p>
                            <label for="password">Password</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ username }}" hidden>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button class="btn btn-primary btn-block w-100" id="submitBtn">Sign In</button>
                    </form>
                    <hr style="border-color: #333;">
                    <p class="text-center"><a href="/login" class="text-muted small">Use different account</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('submitBtn').addEventListener('click', function(event) {
                event.preventDefault();
                
                var formData = {
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                };
    
                fetch('#', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams(formData),
                    redirect: 'follow'
                })
                .then(function(response) {
                    if (response.redirected) {
                        window.location.href = response.url;
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                });
            });
        });
    </script>

</body>
</html>
