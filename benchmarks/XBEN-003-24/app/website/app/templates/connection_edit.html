{% extends "base.html" %}
{% block title %}Edit Connection: {{ conn.conn_id }}{% endblock %}
{% block content %}
<div class="page-header">
    <h4>Edit Connection</h4>
</div>
<div class="row">
    <div class="col-md-8">
        <form method="POST">
            <div class="card mb-3">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="conn_id" class="form-label">Connection Id</label>
                        <input type="text" class="form-control" id="conn_id" name="conn_id" value="{{ form_data.conn_id }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="conn_type" class="form-label">Connection Type</label>
                        <input type="text" class="form-control" id="conn_type" name="conn_type" value="{{ form_data.conn_type }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2">{{ form_data.description }}</textarea>
                    </div>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-header">Connection Details</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="host" class="form-label">Host</label>
                        <input type="text" class="form-control" id="host" name="host" value="{{ form_data.host }}">
                    </div>
                    <div class="mb-3">
                        <label for="schema" class="form-label">Schema</label>
                        <input type="text" class="form-control" id="schema" name="schema" value="{{ form_data.schema }}">
                    </div>
                    <div class="mb-3">
                        <label for="login" class="form-label">Login</label>
                        <input type="text" class="form-control" id="login" name="login" value="{{ form_data.login }}">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" value="{{ form_data.password }}">
                        <small class="text-muted">Leave unchanged to keep existing password.</small>
                    </div>
                    <div class="mb-3">
                        <label for="port" class="form-label">Port</label>
                        <input type="text" class="form-control" id="port" name="port" value="{{ form_data.port }}">
                    </div>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-header">Extra</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="extra" class="form-label">Extra (JSON)</label>
                        <textarea class="form-control font-monospace" id="extra" name="extra" rows="6">{{ form_data.extra }}</textarea>
                        <small class="text-muted">JSON formatted extra configuration for the connection.</small>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('connection_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
