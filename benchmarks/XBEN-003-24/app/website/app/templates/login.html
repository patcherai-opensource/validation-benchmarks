<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DataFlow Pipeline Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #1a1c23; color: #c7c7c7; }
        .card { background-color: #252830; border: 1px solid #353840; }
        .form-control { background-color: #1a1c23; border-color: #353840; color: #c7c7c7; }
        .form-control:focus { background-color: #1a1c23; color: #c7c7c7; border-color: #4e9af5; box-shadow: none; }
        .btn-primary { background-color: #4e9af5; border-color: #4e9af5; }
        .btn-primary:hover { background-color: #3a8ae5; }
        .brand-text { color: #4e9af5; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-4 brand-text">DataFlow Pipeline Manager</h2>
                <div class="card">
                    <div class="card-body p-4">
                        <h5 class="card-title text-center mb-3">Sign In</h5>
                        {% if error %}
                            <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}
                        <form method="POST">
                            <div class="form-group mb-3">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="form-group mb-3">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
                        </form>
                    </div>
                </div>
                <p class="text-center mt-3" style="color: #666; font-size: 0.85em;">v2.5.1</p>
            </div>
        </div>
    </div>
</body>
</html>
