<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - alf.io Backoffice</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            background-color: #16213e;
            color: #ffffff;
            border: 1px solid #0f3460;
            border-radius: 10px;
        }
        .card-header {
            background-color: #0f3460;
            border-bottom: 1px solid #0f3460;
        }
        .form-control {
            background-color: #1a1a2e;
            border: 1px solid #0f3460;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #1a1a2e;
            border-color: #e94560;
            color: #ffffff;
            box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, 0.25);
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <div class="logo">alf.io</div>
                    <div class="subtitle">Event Management Backoffice</div>
                    <div class="subtitle">Multi-tenant Administration Panel</div>
                </div>
                <div class="card">
                    <div class="card-header text-center">
                        <h5 class="mb-0">Administrator Login</h5>
                    </div>
                    <div class="card-body p-4">
                        {% if error %}
                            <div class="alert alert-danger" role="alert">{{ error }}</div>
                        {% endif %}
                        <form method="POST">
                            <div class="form-group mb-3">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter username">
                            </div>
                            <div class="form-group mb-4">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <small class="text-muted">v2.0-M4-2303 | Multi-Organization Support</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
