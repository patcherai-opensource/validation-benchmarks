<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alf.io - Backoffice Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
        .subtitle {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <div class="logo">alf.io</div>
                    <div class="subtitle">Event Management Backoffice</div>
                </div>
                <div class="card p-4">
                    <h4 class="text-center mb-3">Administrator Login</h4>
                    {% if error %}
                        <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                    </form>
                    <hr class="my-3" style="border-color: #333;">
                    <p class="text-center small text-muted mb-0">Multi-tenant ticketing system</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Note: Default operator account available for demo purposes -->
</body>
</html>
