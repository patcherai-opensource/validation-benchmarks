<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Enterprise Portal</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 30px;
            background-color: #16213e;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #0f4c75;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .logo p {
            color: #888;
            font-size: 0.9rem;
        }
        .form-control {
            background-color: #1a1a2e;
            border: 1px solid #3282b8;
            color: #eaeaea;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #1a1a2e;
            border-color: #0f4c75;
            color: #eaeaea;
            box-shadow: 0 0 5px rgba(50, 130, 184, 0.5);
        }
        .btn-primary {
            background-color: #3282b8;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0f4c75;
        }
        .alert-danger {
            background-color: #4a1515;
            border-color: #721c24;
            color: #f8d7da;
        }
        .error-details {
            background-color: #1a1a2e;
            border: 1px solid #721c24;
            border-radius: 5px;
            padding: 15px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Enterprise Portal</h1>
            <p>Secure Access Management System</p>
        </div>
        
        {% if error %}
            <div class="alert alert-danger" role="alert">
                <strong>{{ error }}</strong>
                {% if error_details %}
                    <div class="error-details">{{ error_details }}</div>
                {% endif %}
            </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group mb-3">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username">
            </div>
            <div class="form-group mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
        </form>
        
        <div class="footer-text">
            <p>© 2024 Enterprise Corp. All rights reserved.</p>
            <p>For support, contact helpdesk@enterprise.local</p>
        </div>
    </div>
</body>
</html>
