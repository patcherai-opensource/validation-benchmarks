<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudConfig</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 40px;
        }
        .form-control {
            background: #0f3460;
            border: 1px solid #333;
            color: #fff;
        }
        .form-control:focus {
            background: #16213e;
            color: #fff;
            border-color: #4a69bd;
        }
        .btn-primary {
            background: #0f3460;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h2>CloudConfig</h2>
                    <p class="text-muted">Cloud Configuration Service</p>
                </div>
                <div class="login-card">
                    {% if error %}
                        <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                    </form>
                    <hr style="border-color: #333;">
                    <p class="text-center text-muted small">Forgot your credentials? Contact your administrator.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
