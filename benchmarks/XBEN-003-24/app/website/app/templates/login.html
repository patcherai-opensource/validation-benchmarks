<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - alf.io Backoffice</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        .card {
            background-color: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
        }
        .card-header {
            background-color: #0f3460;
            border-bottom: 1px solid #e94560;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .btn-primary:hover {
            background-color: #c73e54;
            border-color: #c73e54;
        }
        .logo-text {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }
        .form-control {
            background-color: #1a1a2e;
            border-color: #0f3460;
            color: #eaeaea;
        }
        .form-control:focus {
            background-color: #1a1a2e;
            border-color: #e94560;
            color: #eaeaea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="text-center mb-4">
                <span class="logo-text">alf.io</span>
                <p class="text-muted">Event Management Backoffice</p>
            </div>
            <div class="card">
                <div class="card-header text-center">
                    <h5 class="mb-0">Administrator Login</h5>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Continue</button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted mt-3">
                <small>Version 2.0-M4 | Multi-tenant Event Platform</small>
            </p>
        </div>
    </div>
</body>
</html>
