<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Enterprise Portal</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #16213e !important;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #3282b8;
        }
        .btn-outline-light:hover {
            background-color: #3282b8;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Enterprise Portal</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form action="/logout" method="post">
                            <button type="submit" class="btn btn-outline-light">Sign Out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">User Dashboard</h2>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Welcome, {{ user.first_name }} {{ user.last_name }}</h5>
                        <p class="card-text">You are logged into the Enterprise Portal.</p>
                        <hr style="border-color: #3282b8;">
                        <p class="text-muted">Email: {{ user.email }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
