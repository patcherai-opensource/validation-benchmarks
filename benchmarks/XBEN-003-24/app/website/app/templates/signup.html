<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Lunary</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #0f1117; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .login-card { background-color: #1a1b23; border: 1px solid #2a2b35; border-radius: 12px; padding: 2rem; max-width: 400px; margin: 80px auto; }
        .login-card h2 { color: #fff; font-size: 1.5rem; margin-bottom: 0.5rem; }
        .login-card p.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-control { background-color: #0f1117; border: 1px solid #2a2b35; color: #e0e0e0; border-radius: 8px; padding: 0.6rem 0.8rem; }
        .form-control:focus { background-color: #0f1117; border-color: #6366f1; color: #e0e0e0; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
        .btn-primary { background-color: #6366f1; border-color: #6366f1; border-radius: 8px; width: 100%; padding: 0.6rem; font-weight: 500; }
        .btn-primary:hover { background-color: #5558e6; }
        label { font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo span { font-size: 1.8rem; font-weight: 700; color: #6366f1; }
        .alert-danger { background-color: #2d1f1f; border-color: #5c2828; color: #f87171; border-radius: 8px; font-size: 0.85rem; }
        a { color: #6366f1; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><span>🌙 lunary</span></div>
        <h2>Create an account</h2>
        <p class="subtitle">Get started with Lunary</p>
        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group mb-3">
                <label for="name">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Jane Doe" required>
            </div>
            <div class="form-group mb-3">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com" required>
            </div>
            <div class="form-group mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Create account</button>
        </form>
        <p class="text-center mt-3 small">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</body>
</html>
