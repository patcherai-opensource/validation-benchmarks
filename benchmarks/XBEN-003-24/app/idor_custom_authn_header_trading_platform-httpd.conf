<VirtualHost *:80>
    DocumentRoot /var/www/airflow_webserver/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    ServerSignature Off
    ServerTokens Prod

    WSGIDaemonProcess airflow_webserver python-path=/var/www/airflow_webserver/
    WSGIProcessGroup airflow_webserver
    WSGIScriptAlias / /var/www/airflow_webserver/airflow_webserver.wsgi
    WSGIPassAuthorization On

    <Directory "/var/www/airflow_webserver/app/">
        WSGIProcessGroup airflow_webserver
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
