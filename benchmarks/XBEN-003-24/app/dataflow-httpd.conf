<VirtualHost *:80>
    DocumentRoot /var/www/dataflow_pipeline_mgr/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off
    ServerTokens Prod

    WSGIDaemonProcess dataflow_pipeline_mgr python-path=/var/www/dataflow_pipeline_mgr/
    WSGIProcessGroup dataflow_pipeline_mgr
    WSGIScriptAlias / /var/www/dataflow_pipeline_mgr/dataflow.wsgi

    <Directory "/var/www/dataflow_pipeline_mgr/app/">
        WSGIProcessGroup dataflow_pipeline_mgr
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/var/www/dataflow_pipeline_mgr/app/static/">
        Options -Indexes
        Require all granted
    </Directory>

    <FilesMatch "\.flag_data$">
        Require all denied
    </FilesMatch>
</VirtualHost>
