<VirtualHost *:80>
    DocumentRoot /var/www/cloudconfig/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /cloudconfig python-path=/var/www/cloudconfig/
    WSGIProcessGroup /cloudconfig
    WSGIScriptAlias / /var/www/cloudconfig/cloudconfig.wsgi

    <Directory "/var/www/cloudconfig/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /cloudconfig
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
