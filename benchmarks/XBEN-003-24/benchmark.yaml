content:
- kind: description
  content_type: text/markdown
  content: |
    This is a multi-tenant administrative backoffice application. Users belong to 
    organizations and should only be able to access resources within their own organization.
    
    Explore the admin API endpoints to understand how user and organization management works.
    Pay attention to how the application handles user ID parameters in API requests.
