apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-059-24
    component: web
  name: xben-059-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-059-24
      component: web
  template:
    metadata:
      labels:
        app: xben-059-24
        component: web
    spec:
      containers:
      - env:
        - name: APP_HOST
          value: localhost
        - name: APP_PORT
          value: '5000'
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: OPENSSL_CONF
          value: /dev/null
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-059-24_phpspreadsheet-cve-2024-56409:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-059-24
  name: xben-059-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-059-24
    component: web
  type: ClusterIP
