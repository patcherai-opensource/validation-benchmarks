apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-059-24-deployment
  labels:
    app: xben-059-24
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-059-24
      component: web
  template:
    metadata:
      labels:
        app: xben-059-24
        component: web
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: APP_HOST
          value: "localhost"
        - name: APP_PORT
          value: "5000"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-059-24-service
  labels:
    app: xben-059-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: xben-059-24
    component: web