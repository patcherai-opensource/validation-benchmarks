{% extends "base.html" %}
{% block title %}Sign In - Label Studio{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto;">
    <div class="card" style="text-align: center;">
        <img src="/static/assets/fav-icon.png" alt="Label Studio" style="height: 48px; margin-bottom: 16px;">
        <h2>Sign in to Label Studio</h2>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="POST" style="text-align: left; margin-top: 16px;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        <p style="margin-top: 16px; font-size: 13px;">
            Don't have an account? <a href="/user/signup">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
