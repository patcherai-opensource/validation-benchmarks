{% extends "base.html" %}
{% block title %}Settings - {{ project.title }} - Label Studio{% endblock %}
{% block nav %}
<a href="/projects/">Projects</a>
<a href="/projects/{{ project.id }}/">Overview</a>
<a href="/user/logout">Logout</a>
{% endblock %}
{% block content %}
<h1>Project Settings</h1>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Project Name</label>
            <input type="text" name="title" value="{{ project.title }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" value="{{ project.description or '' }}">
        </div>
        <div class="form-group">
            <label>Labeling Config</label>
            <textarea name="label_config">{{ project.label_config or '' }}</textarea>
        </div>
        <div style="display: flex; gap: 8px;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/projects/{{ project.id }}/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
