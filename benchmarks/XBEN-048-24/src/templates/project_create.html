{% extends "base.html" %}
{% block title %}Create Project - Label Studio{% endblock %}
{% block nav %}
<a href="/projects/">Projects</a>
<a href="/user/logout">Logout</a>
{% endblock %}
{% block content %}
<h1>Create Project</h1>
{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label>Project Name</label>
            <input type="text" name="title" required placeholder="My Project">
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" placeholder="Optional description">
        </div>
        <div class="form-group">
            <label>Labeling Config</label>
            <textarea name="label_config" placeholder='<View><Text name="text" value="$text"/><Choices name="label" toName="text"><Choice value="Positive"/><Choice value="Negative"/></Choices></View>'></textarea>
            <p class="text-muted" style="margin-top: 4px;">Define your labeling interface using XML configuration</p>
        </div>
        <div style="display: flex; gap: 8px;">
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="/projects/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
