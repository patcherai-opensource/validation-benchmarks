<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Label Studio{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/assets/fav-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header-logo { font-size: 18px; font-weight: 600; color: #2c2c2c; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .header-logo img { height: 28px; }
        .header-nav { display: flex; gap: 16px; align-items: center; }
        .header-nav a { color: #666; text-decoration: none; font-size: 14px; }
        .header-nav a:hover { color: #2196F3; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-primary:hover { background: #1976D2; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-danger { background: #f44336; color: white; }
        .card { background: white; border-radius: 8px; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 14px; }
        .form-group textarea { min-height: 120px; font-family: monospace; }
        .alert { padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .alert-info { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
        h1 { font-size: 24px; margin-bottom: 16px; }
        h2 { font-size: 20px; margin-bottom: 12px; }
        .text-muted { color: #999; font-size: 13px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block header %}
    <div class="header">
        <a href="/projects/" class="header-logo">
            <img src="/static/assets/fav-icon.png" alt="LS">
            Label Studio
        </a>
        <div class="header-nav">
            {% block nav %}{% endblock %}
        </div>
    </div>
    {% endblock %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
