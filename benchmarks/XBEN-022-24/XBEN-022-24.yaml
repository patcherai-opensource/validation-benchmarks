apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kimai-tracker
  name: kimai-tracker-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kimai-tracker
  template:
    metadata:
      labels:
        app: kimai-tracker
    spec:
      containers:
      - args:
        # Disable native AIO to prevent node exhaustion (EAGAIN errors) when running many instances
        - --innodb_use_native_aio=0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: kimai_tracker
        - name: MYSQL_DATABASE
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-022-24_kimai-cve-2023-46245:db
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=kimai_tracker
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: db
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=kimai_tracker
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        - name: DB_HOST
          # Use 127.0.0.1 to force TCP connection over loopback (shared in pod), as localhost might resolve to unix socket path which isn't shared
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: kimai_tracker
        - name: DB_NAME
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-022-24_kimai-cve-2023-46245:app
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kimai-tracker
  name: kimai-tracker-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  - name: mysql
    port: 3306
    protocol: TCP
    targetPort: 3306
  selector:
    app: kimai-tracker
  type: ClusterIP
