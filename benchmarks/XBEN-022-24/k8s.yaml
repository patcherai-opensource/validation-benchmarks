apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssti-include-loan-calculator-deployment
  labels:
    app: ssti-include-loan-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-include-loan-calculator
  template:
    metadata:
      labels:
        app: ssti-include-loan-calculator
    spec:
      restartPolicy: Always
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z localhost 3306; do echo waiting for db; sleep 2; done;']
      containers:
      - name: db
        image: /:-mysql
        imagePullPolicy: Always
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "ssti_include_loan_calculator"
        - name: MYSQL_DATABASE
          value: "database"
        ports:
        - containerPort: 3306
          name: mysql
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_include_loan_calculator
            - -u
            - root
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_include_loan_calculator
            - -u
            - root
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
      - name: app
        image: /:-app
        imagePullPolicy: Always
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        - name: DB_HOST
          value: "localhost"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "ssti_include_loan_calculator"
        - name: DB_NAME
          value: "database"
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ssti-include-loan-calculator-service
  labels:
    app: ssti-include-loan-calculator
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    app: ssti-include-loan-calculator
