apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssti-include-loan-calculator
  name: ssti-include-loan-calculator-deployment
  namespace: sandbox-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-include-loan-calculator
  template:
    metadata:
      labels:
        app: ssti-include-loan-calculator
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: ssti_include_loan_calculator
        - name: MYSQL_DATABASE
          value: database
        image: /:-mysql
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_include_loan_calculator
            - -u
            - root
          failureThreshold: 5
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: db
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_include_loan_calculator
            - -u
            - root
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        - name: DB_HOST
          value: localhost
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: ssti_include_loan_calculator
        - name: DB_NAME
          value: database
        image: /:-app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      initContainers:
      - command:
        - sh
        - -c
        - until nc -z localhost 3306; do echo waiting for db; sleep 2; done;
        image: busybox:1.35
        name: wait-for-db
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssti-include-loan-calculator
  name: ssti-include-loan-calculator-service
  namespace: sandbox-dev
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  - name: mysql
    port: 3306
    protocol: TCP
    targetPort: 3306
  selector:
    app: ssti-include-loan-calculator
  type: ClusterIP
