{% extends "templates/admin/base_admin.html" %}
{% block title %}Preview: {{ page.title }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Preview: {{ page.title }}</h2>
    <div>
        <a href="{{ url_for('admin_page_edit', page_id=page.id) }}" class="btn btn-outline-primary">Edit</a>
        <a href="{{ url_for('view_page', slug=page.slug) }}" class="btn btn-outline-secondary" target="_blank">View Live</a>
    </div>
</div>
<div class="card">
    <div class="card-body page-content">
        {{ rendered_body | safe }}
    </div>
</div>
{% endblock %}
