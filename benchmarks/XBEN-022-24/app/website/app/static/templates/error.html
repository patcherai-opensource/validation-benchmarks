<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptStudio - Error</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .navbar-brand { font-weight: bold; }
        .error-message { font-size: 18px; color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">🚀 PromptStudio</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">⚠️ Error</h5>
                    </div>
                    <div class="card-body">
                        {% if error_type %}
                            <div class="error-content">
                                {% include error_type %}
                            </div>
                        {% else %}
                            <p class="error-message">{{ error_message }}</p>
                        {% endif %}
                        <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">Back to Dashboard</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('builder') }}">Prompt Builder</a></li>
                            <li class="list-group-item"><a href="{{ url_for('api_docs') }}">API Docs</a></li>
                            <li class="list-group-item"><a href="{{ url_for('profile') }}">Profile</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
