<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateCMS - Error</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .error-container {
            margin-top: 50px;
            text-align: center;
        }
        .error-message {
            font-size: 24px;
            color: red;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">TranslateCMS</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <div class="alert alert-danger">
                    <h4>Error</h4>
                    <p class="error-message">{{ error_message }}</p>
                </div>
                <a href="{{ url_for('home') }}" class="btn btn-primary">Back to Dashboard</a>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('translations') }}">Translations</a></li>
                            <li class="list-group-item"><a href="{{ url_for('profile') }}">Profile</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Sign Out</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap Bundle with Popper -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
