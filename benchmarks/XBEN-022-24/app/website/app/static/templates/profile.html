<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslateCMS - Profile</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">TranslateCMS</a>
            <span class="navbar-text text-white">
                Logged in as: {{ user.name }} ({{ user.role }})
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-9">
                <h2>User Profile</h2>
                <form method="post" enctype="multipart/form-data" action="{{ url_for('update_profile') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">First Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Last Name:</label>
                        <input type="text" class="form-control" id="lastname" name="lastname" value="{{ user.lastname }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role:</label>
                        <input type="text" class="form-control" value="{{ user.role }}" disabled>
                    </div>
                    <!-- Profile image upload -->
                    <div class="mb-3">
                        <label for="image_profile_filename" class="form-label">Profile Image:</label>
                        <input type="file" class="form-control" id="profile_image" name="image_profile" style="opacity:0;height:0;">
                    
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="text_input_span_id">Select Image</span>
                            <input type="text" id='text_input_id' class="form-control" placeholder="{{ user.image_profile_filename }}" style="caret-color: transparent" autocomplete="off">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('home') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('translations') }}">Translations</a></li>
                            <li class="list-group-item"><a href="{{ url_for('profile') }}">Profile</a></li>
                            <li class="list-group-item"><a href="{{ url_for('export_translations') }}">Export API</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Sign Out</a></li>
                        </ul>
                    </div>
                </div>
                <!-- Profile Image Section -->
                <div class="card mt-3">
                    <div class="card-body">
                        <h5 class="card-title">Profile Image</h5>
                        <img src="{{ url_for('static', filename='images/' + user.image_profile_filename) }}" alt="Profile Image" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script>
    $('#text_input_span_id').click(function () {
        $("#profile_image").trigger('click');
    })
    $('#text_input_id').click(function () {
        $("#profile_image").trigger('click');
    })
    $("#profile_image").change(function () {            
        $('#text_input_id').val(this.value.replace(/C:\\fakepath\\/i, ''))
    })
    </script>

    <!-- Bootstrap Bundle with Popper -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
