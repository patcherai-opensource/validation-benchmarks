{% extends "base.html" %}
{% block title %}Admin Login | Grav{% endblock %}
{% block head %}
<style>
    .login-wrapper { max-width: 400px; margin: 80px auto; }
    .grav-logo { text-align: center; margin-bottom: 30px; }
    .grav-logo h2 { color: #333; font-weight: 300; }
    .grav-logo span { color: #0090D9; font-weight: 700; }
</style>
{% endblock %}
{% block body %}
<div class="container">
    <div class="login-wrapper">
        <div class="grav-logo">
            <h2><span>Grav</span> Admin</h2>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h5 class="card-title mb-3">Login</h5>
                <form method="post" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-3" role="alert">{{ error }}</div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
