<VirtualHost *:80>
    DocumentRoot /var/www/grav-cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess grav-cms python-path=/var/www/grav-cms/
    WSGIProcessGroup grav-cms
    WSGIScriptAlias / /var/www/grav-cms/grav.wsgi

    <Directory "/var/www/grav-cms/app/">
        WSGIProcessGroup grav-cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/grav-cms/app/static
    <Directory /var/www/grav-cms/app/static/>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
