<VirtualHost *:80>
    DocumentRoot /var/www/kimai_tracker/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess kimai_tracker python-path=/var/www/kimai_tracker/
    WSGIProcessGroup kimai_tracker
    WSGIScriptAlias / /var/www/kimai_tracker/kimai_tracker.wsgi

    <Directory "/var/www/kimai_tracker/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup kimai_tracker
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/kimai_tracker/app/static
    <Directory /var/www/kimai_tracker/app/static/>
        Options Indexes FollowSymLinks
        IndexOptions ShowForbidden
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
