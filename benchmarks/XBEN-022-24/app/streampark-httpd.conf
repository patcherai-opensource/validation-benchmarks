<VirtualHost *:80>
    DocumentRoot /var/www/streampark-console/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess streampark-console python-path=/var/www/streampark-console/
    WSGIProcessGroup streampark-console
    WSGIScriptAlias / /var/www/streampark-console/streampark.wsgi

    <Directory "/var/www/streampark-console/app/">
        WSGIProcessGroup streampark-console
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/streampark-console/app/static
    <Directory /var/www/streampark-console/app/static/>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
