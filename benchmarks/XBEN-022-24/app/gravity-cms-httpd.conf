<VirtualHost *:80>
    DocumentRoot /var/www/gravity-cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess gravity-cms python-path=/var/www/gravity-cms/
    WSGIProcessGroup gravity-cms
    WSGIScriptAlias / /var/www/gravity-cms/gravity-cms.wsgi

    <Directory "/var/www/gravity-cms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup gravity-cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/gravity-cms/app/static
    <Directory /var/www/gravity-cms/app/static/>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
