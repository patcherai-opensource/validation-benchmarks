<VirtualHost *:80>
    DocumentRoot /var/www/flavor_cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess flavor_cms python-path=/var/www/flavor_cms/
    WSGIProcessGroup flavor_cms
    WSGIScriptAlias / /var/www/flavor_cms/flavor_cms.wsgi

    <Directory "/var/www/flavor_cms/app/">
        WSGIProcessGroup flavor_cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/flavor_cms/app/static
    <Directory /var/www/flavor_cms/app/static/>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
