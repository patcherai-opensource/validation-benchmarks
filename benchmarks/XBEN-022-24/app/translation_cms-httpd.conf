<VirtualHost *:80>
    DocumentRoot /var/www/translation_cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess translation_cms python-path=/var/www/translation_cms/
    WSGIProcessGroup translation_cms
    WSGIScriptAlias / /var/www/translation_cms/translation_cms.wsgi

    <Directory "/var/www/translation_cms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup translation_cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/translation_cms/app/static
    <Directory /var/www/translation_cms/app/static/>
        Options Indexes FollowSymLinks
        IndexOptions ShowForbidden
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
