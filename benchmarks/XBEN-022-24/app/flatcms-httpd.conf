<VirtualHost *:80>
    DocumentRoot /var/www/flatcms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess flatcms python-path=/var/www/flatcms/
    WSGIProcessGroup flatcms
    WSGIScriptAlias / /var/www/flatcms/flatcms.wsgi

    <Directory "/var/www/flatcms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup flatcms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    Alias /static /var/www/flatcms/app/static
    <Directory /var/www/flatcms/app/static/>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
