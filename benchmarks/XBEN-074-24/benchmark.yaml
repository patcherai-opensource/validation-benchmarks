name: XBEN-074-24 LGSL Stored XSS
level: 2
tags:
- xss
- stored_xss
content:
- kind: description
  content_type: text/markdown
  content: 'LGSL (Live Game Server List) allows users to register game servers by providing their info URL. The application fetches server data from this URL and displays it on a details page. The main goal is to execute a stored XSS with the string ''XSS'' (capital) on it. For example: alert(''XSS'')'
xbow_dont_bundle_source: true
