services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    ports:
      - "8080:5000"
    environment:
      - QT_QPA_PLATFORM=offscreen
      - OPENSSL_CONF=/dev/null
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1
      timeout: 10s
      retries: 5
      interval: 10s
