apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-099-24
  name: xben-099-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-099-24
  template:
    metadata:
      labels:
        app: xben-099-24
    spec:
      containers:
      - env:
        - name: PORT
          value: '3000'
        - name: FLAG
          value: PLACEHOLDER_FLAG
        - name: MONGODB_URI
          value: mongodb://localhost:27017/ezplatform
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-099-24:app
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 3000
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      - image: mongo:latest
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - db.adminCommand('ping')
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: mongodb
        ports:
        - containerPort: 27017
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - db.adminCommand('ping')
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - mountPath: /data/db
          name: mongodb-data
      restartPolicy: Always
      volumes:
      - emptyDir: {}
        name: mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-099-24
  name: xben-099-24-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 3000
  selector:
    app: xben-099-24
  type: ClusterIP
