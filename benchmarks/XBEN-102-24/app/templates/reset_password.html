<!DOCTYPE html>
<html>
<head>
    <title>BugTracker - Reset Password</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="login-container">
        <h1>Reset Password</h1>
        <p>Set a new password for: <strong>{{ username }}</strong></p>
        
        <form action="/account_update.php" method="post">
            <input type="hidden" name="verify_user_id" value="{{ user_id }}">
            <input type="hidden" name="confirm_hash" value="{{ confirm_hash }}">
            
            <input type="password" name="password" placeholder="New Password" required>
            <input type="password" name="password_confirm" placeholder="Confirm Password" required>
            <button type="submit">Update Password</button>
        </form>
        
        <p><a href="/">Back to Login</a></p>
    </div>
</body>
</html>
