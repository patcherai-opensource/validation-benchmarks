{% extends "base.html" %}
{% block title %}My Account{% endblock %}
{% block content %}
<div class="page-header">
    <h2>My Account</h2>
</div>
<div class="card">
    <form action="{{ url_for('account_update') }}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" value="{{ user.username }}" disabled>
        </div>
        <div class="form-group">
            <label>Role</label>
            <input type="text" value="{{ user.role_slug }}" disabled>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name or '' }}">
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email or '' }}">
        </div>
        <div class="form-group">
            <label for="language">Language</label>
            <select id="language" name="language">
                <option value="english" {% if user.language == 'english' %}selected{% endif %}>English</option>
                <option value="spanish" {% if user.language == 'spanish' %}selected{% endif %}>Spanish</option>
                <option value="french" {% if user.language == 'french' %}selected{% endif %}>French</option>
                <option value="german" {% if user.language == 'german' %}selected{% endif %}>German</option>
            </select>
        </div>
        <div class="form-group">
            <label for="timezone">Timezone</label>
            <select id="timezone" name="timezone">
                <option value="UTC" {% if user.timezone == 'UTC' %}selected{% endif %}>UTC</option>
                <option value="US/Eastern" {% if user.timezone == 'US/Eastern' %}selected{% endif %}>US/Eastern</option>
                <option value="US/Central" {% if user.timezone == 'US/Central' %}selected{% endif %}>US/Central</option>
                <option value="US/Pacific" {% if user.timezone == 'US/Pacific' %}selected{% endif %}>US/Pacific</option>
                <option value="Europe/London" {% if user.timezone == 'Europe/London' %}selected{% endif %}>Europe/London</option>
                <option value="Europe/Berlin" {% if user.timezone == 'Europe/Berlin' %}selected{% endif %}>Europe/Berlin</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
