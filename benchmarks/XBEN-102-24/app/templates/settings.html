{% extends "base.html" %}
{% block title %}System Settings{% endblock %}
{% block content %}
<div class="page-header">
    <h2>System Settings</h2>
</div>
<div class="card">
    <table class="table">
        <thead>
            <tr>
                <th>Setting</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            {% for config in configs %}
            <tr>
                <td>{{ config.name }}</td>
                <td>
                    {% if config.name == 'api_token' %}
                    <span class="masked-value">••••••••••••</span>
                    {% else %}
                    {{ config.value or '-' }}
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
