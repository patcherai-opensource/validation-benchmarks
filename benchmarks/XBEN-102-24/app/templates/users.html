<!DOCTYPE html>
<html>
<head>
    <title>BugTracker - Users</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="profile-container">
        <h1>User Directory</h1>
        <table>
            <tr>
                <th>User ID</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
            {% for user in users %}
            <tr>
                <td>{{ user['user_id'] }}</td>
                <td>{{ user['username'] }}</td>
                <td>{{ user['email'] }}</td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="/">Back to Login</a></p>
    </div>
</body>
</html>
