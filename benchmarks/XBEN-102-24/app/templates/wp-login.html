<!DOCTYPE html>
<html>
<head>
    <title>Log In &lsaquo; WordPress Site</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
        body { background: #f1f1f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; }
        #login { width: 320px; margin: 100px auto; padding: 20px 0; }
        #login h1 { text-align: center; }
        #login h1 a { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📝</text></svg>'); background-size: contain; background-repeat: no-repeat; background-position: center; width: 84px; height: 84px; display: inline-block; text-indent: -9999px; }
        .login form { background: #fff; border: 1px solid #c3c4c7; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.04); padding: 26px 24px; }
        .login label { font-size: 14px; display: block; margin-bottom: 3px; }
        .login input[type=text], .login input[type=password] { font-size: 24px; width: 100%; padding: 3px; border: 1px solid #8c8f94; border-radius: 4px; box-sizing: border-box; margin-bottom: 16px; }
        .login .button-primary { background: #2271b1; border-color: #2271b1; color: #fff; min-height: 32px; font-size: 13px; padding: 0 12px; cursor: pointer; border-radius: 3px; width: 100%; }
        .login .button-primary:hover { background: #135e96; }
        .login-error { background: #d63638; color: #fff; border-left: 4px solid #d63638; padding: 12px; margin-bottom: 20px; }
        p.message { background: #fff; border-left: 4px solid #72aee6; padding: 12px; margin: 0 0 16px; }
    </style>
</head>
<body class="login">
    <div id="login">
        <h1><a href="/">Advanced Forms Plugin</a></h1>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <!-- Default test account: subscriber:subscriber -->
        <form name="loginform" id="loginform" action="/wp-login" method="post">
            <p>
                <label for="user_login">Username or Email Address</label>
                <input type="text" name="log" id="user_login" autocomplete="username" required>
            </p>
            <p>
                <label for="user_pass">Password</label>
                <input type="password" name="pwd" id="user_pass" autocomplete="current-password" required>
            </p>
            <p class="submit">
                <input type="submit" name="wp-submit" class="button button-primary" value="Log In">
            </p>
        </form>
        <p id="nav" style="text-align: center; margin-top: 16px;">
            <a href="/wp-login">Lost your password?</a>
        </p>
    </div>
</body>
</html>
