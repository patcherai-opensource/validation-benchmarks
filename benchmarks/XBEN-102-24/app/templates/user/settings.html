{% extends "base.html" %}
{% block title %}My Account - Modoboa{% endblock %}
{% block content %}
<div class="page-header">
    <h1>My Account</h1>
</div>
<div class="detail-section">
    <h3>Profile Settings</h3>
    <form action="{{ url_for('user_settings') }}" method="post">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="{{ user_data.first_name }}">
        </div>
        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" value="{{ user_data.last_name }}">
        </div>
        <div class="form-group">
            <label for="language">Language</label>
            <select id="language" name="language">
                <option value="en" {{ 'selected' if user_data.language == 'en' }}>English</option>
                <option value="fr" {{ 'selected' if user_data.language == 'fr' }}>French</option>
                <option value="de" {{ 'selected' if user_data.language == 'de' }}>German</option>
                <option value="es" {{ 'selected' if user_data.language == 'es' }}>Spanish</option>
            </select>
        </div>
        <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ user_data.phone_number }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
