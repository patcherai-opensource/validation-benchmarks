<!DOCTYPE html>
<html>
<head>
    <title>Set New Password - BugTracker</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>BugTracker</h1>
            <p>Issue Management System</p>
        </div>
        <div class="login-container">
            <h2>Set New Password</h2>
            <p>Hello {{ username }}, please enter your new password below.</p>
            <form action="{{ url_for('account_update') }}" method="post">
                <input type="hidden" name="verify_user_id" value="{{ user_id }}">
                <input type="hidden" name="confirm_hash" value="{{ confirm_hash }}">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="password_confirm">Confirm Password</label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>
                <div class="form-group">
                    <label for="realname">Real Name (optional)</label>
                    <input type="text" id="realname" name="realname">
                </div>
                <button type="submit" class="btn btn-primary">Update Account</button>
            </form>
        </div>
        <div class="footer">
            <p>&copy; 2024 BugTracker</p>
        </div>
    </div>
</body>
</html>
