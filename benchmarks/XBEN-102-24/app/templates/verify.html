<!DOCTYPE html>
<html>
<head>
    <title>MantisBT - Verify Account</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="header">
        <h1>MantisBT Bug Tracker</h1>
        <span class="version">v2.26.1</span>
    </div>
    <div class="login-container">
        <h2>Set New Password</h2>
        <p>Please enter your new password below.</p>
        <!-- Form submits to account_update.php with verify_user_id -->
        <form action="/account_update.php" method="post">
            <input type="hidden" name="verify_user_id" value="{{ user_id }}">
            <input type="hidden" name="confirm_hash" value="{{ confirm_hash }}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password" required>
            </div>
            <div class="form-group">
                <label for="password_confirm">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="Confirm password" required>
            </div>
            <div class="form-group">
                <label for="realname">Real Name (optional)</label>
                <input type="text" id="realname" name="realname" placeholder="Your real name">
            </div>
            <div class="form-group">
                <label for="email">Email (optional)</label>
                <input type="email" id="email" name="email" placeholder="Your email">
            </div>
            <button type="submit" class="btn-primary">Update Account</button>
        </form>
    </div>
    <div class="footer">
        <p>MantisBT &copy; 2024 - Open Source Bug Tracker</p>
    </div>
</body>
</html>
