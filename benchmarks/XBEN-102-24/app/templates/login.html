<!DOCTYPE html>
<html>
<head>
    <title>Log In &lsaquo; FormBuilder Pro &mdash; WordPress</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
    <div id="login">
        <h1><a href="/" title="FormBuilder Pro">FormBuilder Pro</a></h1>
        <div class="login-form-container">
            {% if error %}
            <div class="login-error">
                <strong>Error:</strong> {{ error }}
            </div>
            {% endif %}
            <form name="loginform" id="loginform" action="/wp-login" method="post">
                <p>
                    <label for="user_login">Username or Email Address</label>
                    <input type="text" name="log" id="user_login" class="input" size="20" autocapitalize="off" required>
                </p>
                <p>
                    <label for="user_pass">Password</label>
                    <input type="password" name="pwd" id="user_pass" class="input" size="20" required>
                </p>
                <p class="forgetmenot">
                    <input name="rememberme" type="checkbox" id="rememberme" value="forever">
                    <label for="rememberme">Remember Me</label>
                </p>
                <p class="submit">
                    <input type="submit" name="wp-submit" id="wp-submit" class="button button-primary" value="Log In">
                </p>
            </form>
            <p id="nav">
                <a href="/docs">Documentation</a> | 
                <a href="/">Back to FormBuilder Pro</a>
            </p>
        </div>
    </div>
    <div class="privacy-policy-page-link">
        <p>FormBuilder Pro v1.6.8</p>
    </div>
</body>
</html>
