<!DOCTYPE html>
<html>
<head>
    <title>Profile &lsaquo; WordPress Admin</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
        body { background: #f0f0f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; margin: 0; }
        #wpadminbar { background: #1d2327; height: 32px; position: fixed; top: 0; left: 0; width: 100%; z-index: 99999; }
        #wpadminbar .ab-item { color: #c3c4c7; text-decoration: none; padding: 0 10px; line-height: 32px; display: inline-block; font-size: 13px; }
        #wpadminbar .ab-item:hover { color: #72aee6; }
        #adminmenu { background: #1d2327; width: 160px; position: fixed; top: 32px; left: 0; bottom: 0; padding-top: 12px; }
        #adminmenu a { color: #c3c4c7; display: block; padding: 8px 12px; text-decoration: none; font-size: 14px; }
        #adminmenu a:hover { color: #72aee6; background: #2c3338; }
        #adminmenu .current { background: #2271b1; color: #fff; }
        #wpcontent { margin-left: 160px; padding: 20px; margin-top: 52px; }
        .wrap { max-width: 800px; background: #fff; padding: 20px; border: 1px solid #c3c4c7; border-radius: 4px; }
        .wrap h1 { font-size: 23px; font-weight: 400; margin: 0 0 20px; padding: 0; color: #1d2327; }
        .form-table { border-collapse: collapse; width: 100%; }
        .form-table th { text-align: left; padding: 15px 10px 15px 0; width: 200px; font-weight: 400; }
        .form-table td { padding: 15px 10px; }
        .form-table input[type=email], .form-table input[type=text] { width: 25em; padding: 5px; border: 1px solid #8c8f94; border-radius: 4px; }
        .button { background: #2271b1; border: 1px solid #2271b1; border-radius: 3px; color: #fff; cursor: pointer; font-size: 13px; padding: 6px 12px; }
        .button:hover { background: #135e96; }
        .button-secondary { background: #f6f7f7; border-color: #8c8f94; color: #2271b1; }
        .button-secondary:hover { background: #f0f0f1; }
        .notice { border-left: 4px solid #00a32a; background: #fff; padding: 12px; margin: 5px 0 15px; }
        .notice-success { border-color: #00a32a; }
        .notice-error { border-color: #d63638; }
        .description { color: #646970; font-size: 13px; margin-top: 4px; }
        /* Debug info for form args - Advanced Forms plugin style */
        .af-form-debug { display: none; }
    </style>
</head>
<body>
    <div id="wpadminbar">
        <span class="ab-item">WordPress</span>
        <span class="ab-item">Howdy, {{ session['username'] }}</span>
        <form action="/wp-admin/logout" method="post" style="display: inline;">
            <button type="submit" class="ab-item" style="background: none; border: none; cursor: pointer;">Log Out</button>
        </form>
    </div>
    
    <div id="adminmenu">
        <a href="/wp-admin/profile">Dashboard</a>
        <a href="/wp-admin/profile" class="current">Profile</a>
        <a href="#">Posts</a>
        <a href="#">Media</a>
        <a href="#">Pages</a>
        <a href="#">Advanced Forms</a>
    </div>
    
    <div id="wpcontent">
        <div class="wrap">
            <h1>Profile</h1>
            
            {% if message %}
            <div class="notice notice-success">
                <p>{{ message }}</p>
            </div>
            {% endif %}
            
            {% if error %}
            <div class="notice notice-error">
                <p>{{ error }}</p>
            </div>
            {% endif %}
            
            <!-- Advanced Forms Plugin - Profile Update Form -->
            <!-- Form rendered by af_form shortcode -->
            <form id="af-form-profile" class="af-form" action="/wp-admin/profile" method="post">
                <table class="form-table" role="presentation">
                    <tr>
                        <th scope="row"><label for="user_id">User ID</label></th>
                        <td>
                            <input type="text" id="user_id" value="{{ user_id }}" disabled>
                            <p class="description">Your user ID cannot be changed.</p>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="username">Username</label></th>
                        <td>
                            <input type="text" id="username" value="{{ session['username'] }}" disabled>
                            <p class="description">Usernames cannot be changed.</p>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="role">Role</label></th>
                        <td>
                            <input type="text" id="role" value="{{ session['role'] }}" disabled>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row"><label for="email">Email</label></th>
                        <td>
                            <input type="email" name="email" id="email" value="{{ email }}" required>
                            <p class="description">Enter your new email address.</p>
                        </td>
                    </tr>
                </table>
                
                <!-- Advanced Forms plugin serialized arguments (af_form_args) -->
                <!-- Contains: user_id, form_key, action - serialized as base64(JSON) -->
                <input type="hidden" name="af_form_args" value="{{ af_form_args }}">
                
                <p class="submit">
                    <input type="submit" class="button button-primary" value="Update Profile">
                </p>
            </form>
            
            <!-- AF Form Debug (hidden) -->
            <div class="af-form-debug">
                <!-- Form args: {{ af_form_args }} -->
                <!-- Decoded: user_id={{ user_id }}, form_key=profile_update, action=update_profile -->
            </div>
        </div>
    </div>
</body>
</html>
