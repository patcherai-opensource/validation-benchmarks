<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Modoboa Admin{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    {% if user %}
    <nav class="main-nav">
        <div class="nav-brand">Modoboa</div>
        <div class="nav-links">
            {% if user.role in ('SuperAdmin', 'DomainAdmin') %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('domain_list') }}">Domains</a>
            <a href="{{ url_for('identity_list') }}">Identities</a>
            {% if user.role == 'SuperAdmin' %}
            <a href="{{ url_for('system_settings') }}">Settings</a>
            {% endif %}
            {% endif %}
            <a href="{{ url_for('user_settings') }}">My Account</a>
            <a href="{{ url_for('report_url') }}">Report</a>
        </div>
        <div class="nav-user">
            <span>{{ user.username }}</span>
            <form action="{{ url_for('logout') }}" method="post" style="display:inline">
                <button type="submit" class="btn-link">Logout</button>
            </form>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
