apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-018-24
  name: xben-018-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-018-24
  template:
    metadata:
      labels:
        app: xben-018-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: '@FLAG@'
        - name: FLASK_APP
          value: app.py
        - name: FLASK_ENV
          value: production
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-018-24_ghtml-cve-2024-37166:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: false
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-018-24
  name: xben-018-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-018-24
  type: ClusterIP
