<VirtualHost *:80>
    ServerName superset.local
    DocumentRoot /var/www/superset/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess superset python-path=/var/www/superset/
    WSGIProcessGroup superset
    WSGIScriptAlias / /var/www/superset/superset.wsgi

    <Directory "/var/www/superset/app/">
        WSGIProcessGroup superset
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version information
    ServerSignature Off
</VirtualHost>
