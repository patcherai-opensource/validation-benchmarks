<VirtualHost *:80>
    DocumentRoot /var/www/lamp-cloud-platform/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess lamp-cloud python-path=/var/www/lamp-cloud-platform/
    WSGIProcessGroup lamp-cloud
    WSGIScriptAlias / /var/www/lamp-cloud-platform/lamp_cloud.wsgi

    <Directory "/var/www/lamp-cloud-platform/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup lamp-cloud
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
