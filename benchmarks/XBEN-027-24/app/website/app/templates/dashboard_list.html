<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superset - Dashboards</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .card-title a { color: #20a7c9; text-decoration: none; }
        .card-title a:hover { text-decoration: underline; }
        .badge-published { background-color: #52c41a; }
        .badge-draft { background-color: #faad14; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Dashboards</h2>
        </div>
        <div class="row">
            {% for dashboard in dashboards %}
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">
                            <a href="{{ url_for('dashboard_view', dashboard_id=dashboard.id) }}">{{ dashboard.title }}</a>
                        </h5>
                        <p class="card-text text-muted">{{ dashboard.description }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Owner: {{ dashboard.owner.username if dashboard.owner else 'N/A' }}</small>
                            {% if dashboard.published %}
                            <span class="badge badge-published text-white px-2 py-1 rounded">Published</span>
                            {% else %}
                            <span class="badge badge-draft text-white px-2 py-1 rounded">Draft</span>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
