<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superset - Saved Queries</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .table { background: #fff; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-4">
        <h2>Saved Queries</h2>
        <table class="table table-hover mt-3">
            <thead>
                <tr>
                    <th>Label</th>
                    <th>Description</th>
                    <th>Database</th>
                    <th>Created By</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for query in queries %}
                <tr>
                    <td>{{ query.label }}</td>
                    <td>{{ query.description }}</td>
                    <td>{{ query.database.name if query.database else 'N/A' }}</td>
                    <td>{{ query.created_by.username if query.created_by else 'N/A' }}</td>
                    <td><a href="{{ url_for('saved_query_view', query_id=query.id) }}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
