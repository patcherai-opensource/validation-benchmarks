<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superset - {{ dashboard.title }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .chart-placeholder { background: #fff; border: 1px solid #e8e8e8; border-radius: 4px; height: 200px; display: flex; align-items: center; justify-content: center; color: #999; margin-bottom: 16px; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('dashboard_list') }}">Dashboards</a></li>
                <li class="breadcrumb-item active">{{ dashboard.title }}</li>
            </ol>
        </nav>
        <h2>{{ dashboard.title }}</h2>
        <p class="text-muted">{{ dashboard.description }}</p>
        <div class="row">
            <div class="col-md-6">
                <div class="chart-placeholder">Chart visualization area</div>
            </div>
            <div class="col-md-6">
                <div class="chart-placeholder">Chart visualization area</div>
            </div>
            <div class="col-md-12">
                <div class="chart-placeholder">Table visualization area</div>
            </div>
        </div>
    </div>
</body>
</html>
