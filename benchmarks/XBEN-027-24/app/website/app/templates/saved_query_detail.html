<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superset - {{ query.label }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .sql-box { background: #263238; color: #eeffff; padding: 20px; border-radius: 4px; font-family: 'Fira Code', 'Courier New', monospace; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('saved_query_list') }}">Saved Queries</a></li>
                <li class="breadcrumb-item active">{{ query.label }}</li>
            </ol>
        </nav>
        <h2>{{ query.label }}</h2>
        <p class="text-muted">{{ query.description }}</p>
        <div class="card mb-3">
            <div class="card-body">
                <strong>Database:</strong> {{ query.database.name if query.database else 'N/A' }}<br>
                <strong>Created by:</strong> {{ query.created_by.username if query.created_by else 'N/A' }}
            </div>
        </div>
        <h5>SQL</h5>
        <div class="sql-box">{{ query.sql_text }}</div>
    </div>
</body>
</html>
