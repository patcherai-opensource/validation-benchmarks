<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RosarioSIS - Salary Management</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .navbar { background-color: #2196F3; }
        .navbar-brand { color: white !important; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">RosarioSIS HR Portal</a>
            <div class="navbar-nav ml-auto">
                <a class="nav-link text-white" href="/employees">Employee Directory</a>
                <form action="/logout" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>Salary Document Management</h2>
        <p class="text-muted">Manage staff salary attachments</p>
        
        <table class="table table-striped bg-white">
            <thead class="thead-dark">
                <tr>
                    <th>Employee</th>
                    <th>Filename</th>
                    <th>Year</th>
                    <th>Month</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for doc in documents %}
                <tr>
                    <td>{{ doc.employee.name }}</td>
                    <td>{{ doc.filename }}</td>
                    <td>{{ doc.year }}</td>
                    <td>{{ doc.month }}</td>
                    <td>
                        <a href="/assets/FileUploads/{{ doc.year }}/staff_{{ doc.employee_id }}/{{ doc.filename }}" class="btn btn-sm btn-primary">Download</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
