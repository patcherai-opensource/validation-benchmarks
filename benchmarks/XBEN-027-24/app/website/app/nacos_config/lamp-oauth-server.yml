server:
  port: 8773

spring:
  datasource:
    druid:
      url: jdbc:mysql://${DB_HOST:127.0.0.1}:3306/lamp_cloud?useUnicode=true&characterEncoding=utf-8&useSSL=false
      username: root
      password: ${DB_PASSWORD:lamp_cloud_platform}

lamp:
  jwt:
    jwtSignKey: lamp-cloud_is_a_fantastic_project
    tokenExpireSeconds: 7200
    refreshTokenExpireSeconds: 28800
  oauth:
    defaultPassword: lamp123
    maxLoginAttempts: 5
    lockDurationMinutes: 30

logging:
  level:
    com.tangyh.lamp: info
