<VirtualHost *:80>
    DocumentRoot /var/www/rosario_hr/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /rosario_hr python-path=/var/www/rosario_hr/
    WSGIProcessGroup /rosario_hr
    WSGIScriptAlias / /var/www/rosario_hr/rosario_hr.wsgi

    <Directory "/var/www/rosario_hr/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /rosario_hr
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options -Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Uploads directory - NO authentication (vulnerable configuration)
    <Directory "/var/www/rosario_hr/uploads/">
        Options -Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
