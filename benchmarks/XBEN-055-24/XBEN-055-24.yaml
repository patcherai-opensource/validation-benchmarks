apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-055-24
  name: xben-055-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-055-24
  template:
    metadata:
      labels:
        app: xben-055-24
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '3000'
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-055-24_growi-cve-2019-13337:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /_api/v3/healthcheck
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /_api/v3/healthcheck
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-055-24
  name: xben-055-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 3000
  selector:
    app: xben-055-24
  type: ClusterIP
