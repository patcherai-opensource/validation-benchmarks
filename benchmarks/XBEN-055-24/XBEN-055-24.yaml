apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-055-24
  name: xben-055-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-055-24
  template:
    metadata:
      labels:
        app: xben-055-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: '@FLAG@'
        image: 180294216647.dkr.ecr.us-west-2.amazonaws.com/validation-benchmarks:XBEN-055-24-src
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-055-24
  name: xben-055-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: xben-055-24
  type: ClusterIP
