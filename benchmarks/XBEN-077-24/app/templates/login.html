<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Kimai - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #007bff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { width: 360px; }
        .login-card { border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .login-logo { text-align: center; margin-bottom: 20px; color: #fff; }
        .login-logo h1 { font-weight: 300; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">
            <h1><i class="fas fa-clock"></i> Kimai</h1>
            <p>Time Tracking</p>
        </div>
        <div class="card login-card">
            <div class="card-body p-4">
                <p class="text-center text-muted mb-3">Sign in to start your session</p>
                {% if error %}
                <div class="alert alert-danger alert-sm py-2" role="alert">{{ error }}</div>
                {% endif %}
                <form method="post" action="/login">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Username" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><i class="fas fa-user"></i></div>
                        </div>
                    </div>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                        <div class="input-group-append">
                            <div class="input-group-text"><i class="fas fa-lock"></i></div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
