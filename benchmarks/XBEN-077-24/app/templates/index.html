<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <title>MathML Formula Renderer</title>
</head>
<body>
    <div class="container mt-5">
        <h1>MathML Formula Renderer</h1>
        <p class="text-muted">Upload MathML XML files to render mathematical formulas</p>
        <form action="/" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Formula Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ formula.title }}" placeholder="e.g., Quadratic Formula">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" class="form-control" id="description" name="description" value="{{ formula.description }}" placeholder="Brief description of the formula">
            </div>
            <div class="form-group">
                <label for="mathml_file">MathML File (XML)</label>
                <input type="file" class="form-control-file" id="mathml_file" name="mathml_file" accept=".xml,.mathml">
                <small class="form-text text-muted">Upload a valid MathML XML file</small>
                {% if formula.rendered_math %}
                    <div class="mt-3">
                        <h5>Rendered Formula:</h5>
                        <div class="border p-3 bg-light">{{ formula.rendered_math | safe }}</div>
                    </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Render Formula</button>
        </form>
    </div>
</body>
</html>
