<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <title>Document Manager</title>
</head>
<body>
    <div class="container mt-5">
        <h1>Document Manager</h1>
        <p class="text-muted">Upload XML documents for processing. Our secure XML scanner protects against malicious content.</p>
        <form action="/" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Document Title</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ profile.name }}">
            </div>
            <div class="form-group">
                <label for="surname">Author</label>
                <input type="text" class="form-control" id="surname" name="surname" value="{{ profile.surname }}">
            </div>
            <div class="form-group">
                <label for="address">Description</label>
                <input type="text" class="form-control" id="address" name="address" value="{{ profile.address }}">
            </div>
            <div class="form-group">
                <label for="image">XML Document Upload</label>
                <input type="file" class="form-control-file" id="image" name="image" accept=".xml,.svg">
                <small class="form-text text-muted">Supported formats: XML, SVG. Documents are scanned for security.</small>
                {% if profile.image %}
                    <div class="mt-3">
                        <h5>Processed Document Content:</h5>
                        <div class="border p-2 bg-light">{{ profile.image | safe }}</div>
                    </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Process Document</button>
        </form>
    </div>
</body>
</html>
