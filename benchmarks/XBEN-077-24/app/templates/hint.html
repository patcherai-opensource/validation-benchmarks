<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>System Information - SpreadSheet Analytics Pro</title>
    <style>
        body {
            margin: 20px;
        }
        .file-list {
            font-family: monospace;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mt-4">System Debug Information</h2>
        <p class="text-muted">Application file structure for debugging purposes</p>
        <div class="file-list border p-3 mt-3">
            {% for file in files %}
                {{ file }}<br>
            {% endfor %}
        </div>
        <div class="mt-3">
            <a href="/" class="btn btn-secondary">Back to Upload</a>
        </div>
    </div>
</body>
</html>
