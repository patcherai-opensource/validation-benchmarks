<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansible Runner Web Interface</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #e94560;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }

        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            color: #0f3460;
            background: #e94560;
            padding: 10px 15px;
            border-radius: 5px;
            margin: -20px -20px 20px -20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #fff;
            font-family: monospace;
            box-sizing: border-box;
        }

        button {
            background: #e94560;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #c73e54;
        }

        .output {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .status-success { color: #4caf50; }
        .status-failed { color: #f44336; }

        a {
            color: #e94560;
        }

        .info {
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Ansible Runner Web Interface</h1>
        
        <div class="info">
            <strong>Welcome!</strong> This is a web interface for ansible-runner's command execution API.
            Use the forms below to run commands or check the <a href="/docs">API documentation</a>.
        </div>

        <div class="card">
            <h2>Run Command</h2>
            <form id="runCommandForm">
                <label for="executable_cmd">Executable Command:</label>
                <input type="text" id="executable_cmd" name="executable_cmd" placeholder="e.g., ls, whoami, ping" required>
                
                <label for="cmdline_args">Command Arguments (one per line):</label>
                <textarea id="cmdline_args" name="cmdline_args" rows="3" placeholder="e.g., -la&#10;/tmp"></textarea>
                
                <button type="submit">Execute</button>
            </form>
        </div>

        <div class="card">
            <h2>Quick Ping</h2>
            <form id="pingForm">
                <label for="host">Host to Ping:</label>
                <input type="text" id="host" name="host" placeholder="e.g., 127.0.0.1, google.com" required>
                
                <label for="count">Ping Count:</label>
                <input type="number" id="count" name="count" value="1" min="1" max="5">
                
                <button type="submit">Ping</button>
            </form>
        </div>

        <div class="card">
            <h2>Output</h2>
            <div id="output" class="output">Results will appear here...</div>
        </div>
    </div>

    <script>
        function displayResult(data) {
            const output = document.getElementById('output');
            let html = '';
            
            if (data.error) {
                html = `<span class="status-failed">Error: ${data.error}</span>`;
            } else {
                const statusClass = data.status === 'successful' ? 'status-success' : 'status-failed';
                html = `<span class="${statusClass}">Status: ${data.status}</span>\n`;
                html += `Return Code: ${data.rc}\n\n`;
                
                if (data.stdout) {
                    html += `--- STDOUT ---\n${data.stdout}\n`;
                }
                if (data.stderr) {
                    html += `\n--- STDERR ---\n${data.stderr}`;
                }
            }
            
            output.innerHTML = html;
        }

        document.getElementById('runCommandForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const executable_cmd = document.getElementById('executable_cmd').value;
            const argsText = document.getElementById('cmdline_args').value;
            const cmdline_args = argsText.split('\n').filter(arg => arg.trim() !== '');
            
            try {
                const response = await fetch('/api/run_command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        executable_cmd: executable_cmd,
                        cmdline_args: cmdline_args
                    })
                });
                
                const data = await response.json();
                displayResult(data);
            } catch (error) {
                displayResult({ error: error.message });
            }
        });

        document.getElementById('pingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const host = document.getElementById('host').value;
            const count = document.getElementById('count').value;
            
            try {
                const response = await fetch('/api/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        host: host,
                        count: parseInt(count)
                    })
                });
                
                const data = await response.json();
                displayResult(data);
            } catch (error) {
                displayResult({ error: error.message });
            }
        });
    </script>
</body>
</html>
