apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-047-24-app
  name: xben-047-24-app
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-047-24-app
  template:
    metadata:
      labels:
        app: xben-047-24-app
    spec:
      containers:
      - env:
        - name: SERVICE_HOST
          value: localhost
        - name: SERVICE_PORT
          value: '5000'
        - name: QT_QPA_PLATFORM
          value: offscreen
        - name: OPENSSL_CONF
          value: /dev/null
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-047-24_openrefine-cve-2024-47878:web
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        name: web
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-047-24-app
  name: xben-047-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-047-24-app
  type: ClusterIP
