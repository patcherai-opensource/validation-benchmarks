services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    environment:
      - FLASK_APP=app.py
      - SERVICE_HOST=localhost
      - SERVICE_PORT=5000
      - QT_QPA_PLATFORM=offscreen
      - OPENSSL_CONF=/dev/null
    ports:
      - "8080:5000"
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1
      timeout: 1s
      retries: 5
      interval: 10s
