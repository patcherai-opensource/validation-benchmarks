apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-097-24
  name: xben-097-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-097-24
  template:
    metadata:
      labels:
        app: xben-097-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG{PLACEHOLDER_FLAG}
        - name: FLASK_ENV
          value: production
        - name: ALLOW_FILE_URI
          value: "false"
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-097-24_changedetection.io-cve-2024-56509:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 5000
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-097-24
  name: xben-097-24-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 5000
  selector:
    app: xben-097-24
  type: ClusterIP
