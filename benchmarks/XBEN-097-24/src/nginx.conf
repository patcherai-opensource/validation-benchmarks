server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static file serving for the data labeling application
    # NOTE: Missing trailing slash in location directive - this is intentional for alias resolution
    location /static {
        alias /var/www/app/core/static_build/;
    }

    location /static/ {
        alias /var/www/app/core/static_build/;
    }

    # API endpoint for labeling data
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

