[uwsgi]
; uWSGI PHP plugin configuration
; Server listens on port 80 for HTTP requests
http-port = 80

; PHP document root - all PHP files are served from this directory
php-docroot = /var/www/html

; Default index file
php-index = index.php

; Server identity
server-name = localhost

; Static file cache duration (seconds)
static-expires = 3600

; Process management
processes = 4
threads = 2
master = true

; Logging
log-date = true
logto = /var/log/uwsgi/app.log
