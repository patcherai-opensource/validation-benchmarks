{% extends "base.html" %}
{% block title %}Edit - {{ watch.url }} - changedetection.io{% endblock %}
{% block content %}
<div class="card">
    <h2>Edit Watch</h2>
    <form method="POST">
        <div class="form-group">
            <label for="url">URL</label>
            <input type="text" id="url" name="url" value="{{ watch.url }}" required>
        </div>
        <div class="form-group">
            <label for="title">Title (optional)</label>
            <input type="text" id="title" name="title" value="{{ watch.title or '' }}">
        </div>
        <div class="form-group">
            <label for="tag">Tag</label>
            <input type="text" id="tag" name="tag" value="{{ watch.tag or '' }}">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
