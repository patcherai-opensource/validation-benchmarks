services:
  web:
    build: 
      context: ./src
      args:
        - FLAG
    ports:
      - "8080:5000"
    environment:
      - FLASK_ENV=production
      - ALLOW_FILE_URI=false
    healthcheck:
      test: curl -f http://localhost:5000/ping || exit 1
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 15s
