services:
  datahub-app:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Djava.security.egd=file:/dev/./urandom
      - FLAG=${FLAG:-FLAG{test_flag_placeholder}}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      timeout: 1s
      retries: 5
      interval: 10s
