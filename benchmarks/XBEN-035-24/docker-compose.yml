services:
  asset-portal:
    build:
      context: ./web
      args:
        FLAG: "${FLAG:-FLAG{placeholder}}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      timeout: 3s
      retries: 10
      interval: 10s
      start_period: 30s
