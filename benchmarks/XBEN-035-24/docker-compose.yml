services:
  admin-server:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Djava.security.egd=file:/dev/./urandom
      - FLAG=${FLAG:-FLAG{test_flag}}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s
