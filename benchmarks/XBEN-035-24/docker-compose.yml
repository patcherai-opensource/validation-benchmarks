services:
  mathengine:
    build:
      context: ./web
      args:
        FLAG: ${FLAG:-FLAG{test}}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')"]
      timeout: 5s
      retries: 5
      interval: 10s
