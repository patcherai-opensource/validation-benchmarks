apiVersion: apps/v1
kind: Deployment
metadata:
  name: struts-app-deployment
  labels:
    app: struts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: struts-app
  template:
    metadata:
      labels:
        app: struts-app
    spec:
      containers:
      - name: struts-app
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        - name: JAVA_OPTS
          value: "-Djava.security.egd=file:/dev/./urandom"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: struts-app-service
  labels:
    app: struts-app
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: struts-app
