<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Admin Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar a { color: #fff; padding: 15px; display: block; text-decoration: none; }
        .sidebar a:hover { background: #495057; }
        .main-content { padding: 20px; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar">
                <div class="py-4">
                    <h4 class="text-white text-center">Admin Server</h4>
                </div>
                <a href="/">Dashboard</a>
                <a href="/notifications">Notifications</a>
                <a href="/settings">Settings</a>
            </nav>
            <main class="col-md-10 main-content">
                <h2>Settings</h2>
                
                <div class="card">
                    <div class="card-header">Mail Server Configuration</div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label">SMTP Host</label>
                                <input type="text" class="form-control" value="smtp.company.local">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">SMTP Port</label>
                                <input type="text" class="form-control" value="587">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">From Address</label>
                                <input type="email" class="form-control" value="admin-server@company.local">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">To Address</label>
                                <input type="email" class="form-control" value="ops-team@company.local">
                            </div>
                            <button type="button" class="btn btn-primary" onclick="alert('Settings saved!')">Save Settings</button>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">Notification Settings</div>
                    <div class="card-body">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Send email on application status change</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label">Send email on application registration</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Send daily health summary</label>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
