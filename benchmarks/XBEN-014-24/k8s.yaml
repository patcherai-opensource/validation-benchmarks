apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-014-24-deployment
  labels:
    app: xben-014-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-014-24
  template:
    metadata:
      labels:
        app: xben-014-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: FLAG
          value: "@FLAG@"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - timeout
            - "3s"
            - bash
            - "-c"
            - ":> /dev/tcp/127.0.0.1/80 || exit 1"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - timeout
            - "3s" 
            - bash
            - "-c"
            - ":> /dev/tcp/127.0.0.1/80 || exit 1"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-014-24-service
  labels:
    app: xben-014-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: xben-014-24