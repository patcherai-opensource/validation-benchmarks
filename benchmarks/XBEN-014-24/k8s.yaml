apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-014-24-auth4
  labels:
    app: xben-014-24-auth4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-014-24-auth4
  template:
    metadata:
      labels:
        app: xben-014-24-auth4
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-014-24-auth4
  labels:
    app: xben-014-24-auth4
spec:
  type: ClusterIP
  selector:
    app: xben-014-24-auth4
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP