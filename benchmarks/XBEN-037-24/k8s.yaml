apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-037-24-app
  labels:
    app: xben-037-24-app
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-037-24-app
      component: web
  template:
    metadata:
      labels:
        app: xben-037-24-app
        component: web
    spec:
      restartPolicy: Always
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: FLAG
          value: "FLAG_PLACEHOLDER"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: xben-037-24-service
  labels:
    app: xben-037-24-app
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: xben-037-24-app
    component: web