<!DOCTYPE html>
<html>
<head>
    <title>RaspAP - Key Generation Result</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="header">
        <div class="logo">RaspAP</div>
        <div class="nav">
            <a href="/" class="active">WireGuard</a>
            <a href="#">Hotspot</a>
            <a href="#">DHCP Server</a>
            <a href="#">Networking</a>
            <a href="#">System</a>
        </div>
    </div>
    <div class="container">
        <div class="card">
            <h2><span class="icon">✓</span> Key Generation Result</h2>
            <div class="result-box">
                <p><strong>Entity:</strong> {{ entity }}</p>
                <pre>{{ result }}</pre>
            </div>
            <a href="/" class="btn-secondary">← Back to WireGuard Config</a>
        </div>
    </div>
</body>
</html>
