<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ansible Tower{% endblock %} - AWX</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">AWX</a>
            <span class="version">Community Edition</span>
        </div>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/playbooks" class="{% if '/playbooks' in request.path %}active{% endif %}">Templates</a>
            <a href="/inventories" class="{% if '/inventories' in request.path %}active{% endif %}">Inventories</a>
            <a href="/jobs" class="{% if '/jobs' in request.path %}active{% endif %}">Jobs</a>
        </div>
    </nav>
    <div class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
