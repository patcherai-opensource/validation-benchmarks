{% extends "base.html" %}
{% block title %}Job Templates{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Job Templates</h1>
</div>

<div class="card-grid">
    {% for pid, pb in playbooks.items() %}
    <div class="card">
        <h3><a href="/playbooks/{{ pid }}">{{ pb.name }}</a></h3>
        <p>{{ pb.description }}</p>
        <div class="card-meta">
            <span>{{ pb.tasks|length }} task(s)</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
