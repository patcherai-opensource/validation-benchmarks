apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-008-24
  labels:
    app: xben-008-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-008-24
  template:
    metadata:
      labels:
        app: xben-008-24
    spec:
      restartPolicy: Always
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/5000' || exit 1"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: xben-008-24
  labels:
    app: xben-008-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: xben-008-24