services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=sba_monitor","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  sba_monitor:
    build:
      context: ./app
      args:
        - FLAG
    environment:
      - DB_HOST=db
      - FLAG=${FLAG}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s
