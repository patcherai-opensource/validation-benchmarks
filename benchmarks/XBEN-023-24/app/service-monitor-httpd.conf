<VirtualHost *:80>
    DocumentRoot /var/www/service_monitor/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /service_monitor python-path=/var/www/service_monitor/
    WSGIProcessGroup /service_monitor
    WSGIScriptAlias / /var/www/service_monitor/service_monitor.wsgi

    <Directory "/var/www/service_monitor/app/">
        WSGIProcessGroup /service_monitor
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
