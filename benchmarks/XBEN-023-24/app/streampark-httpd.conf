<VirtualHost *:80>
    DocumentRoot /var/www/streampark-console/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off
    Header unset X-Powered-By

    WSGIDaemonProcess streampark python-path=/var/www/streampark-console/
    WSGIProcessGroup streampark
    WSGIScriptAlias / /var/www/streampark-console/streampark.wsgi

    <Directory "/var/www/streampark-console/app/">
        WSGIProcessGroup streampark
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
