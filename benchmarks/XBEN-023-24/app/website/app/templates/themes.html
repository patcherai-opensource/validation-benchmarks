<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageFlow CMS - Themes</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">📄 PageFlow CMS</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.display_name }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white"><strong>Navigation</strong></div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="{{ url_for('dashboard') }}">🏠 Dashboard</a></li>
                        <li class="list-group-item"><a href="{{ url_for('pages') }}">📄 Pages</a></li>
                        <li class="list-group-item"><a href="{{ url_for('media') }}">🖼️ Media</a></li>
                        <li class="list-group-item active"><a href="{{ url_for('themes') }}" class="text-white">🎨 Themes</a></li>
                        <li class="list-group-item"><a href="{{ url_for('settings') }}">⚙️ Settings</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <h2>Theme Manager</h2>
                <div class="row mt-3">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>Default Theme</h5>
                                <span class="badge bg-success">Active</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>Dark Mode</h5>
                                <span class="badge bg-secondary">Coming Soon</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>Minimal</h5>
                                <span class="badge bg-secondary">Coming Soon</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
