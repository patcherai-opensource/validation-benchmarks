<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Loan Portal CMS</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">Loan Portal Admin</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.name }}</span>
                <a class="nav-link" href="{{ url_for('home') }}">Site</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">Navigation</div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="{{ url_for('admin_dashboard') }}">Dashboard</a></li>
                        <li class="list-group-item"><a href="{{ url_for('admin_pages') }}">Pages</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <h2>Dashboard</h2>
                <div class="row mt-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h3>{{ pages|length }}</h3>
                                <p class="text-muted">Total Pages</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <h4>Quick Actions</h4>
                    <a href="{{ url_for('admin_page_new') }}" class="btn btn-primary">Create New Page</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
