<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPark Console | {{ code }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .error-container { text-align: center; }
        .error-code { font-size: 72px; font-weight: 700; color: #1890ff; }
        .error-message { font-size: 18px; color: #666; margin-top: 16px; }
        .back-link { display: inline-block; margin-top: 24px; color: #1890ff; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ code }}</div>
        <div class="error-message">{{ message }}</div>
        <a href="/" class="back-link">← Back to Dashboard</a>
    </div>
</body>
</html>
