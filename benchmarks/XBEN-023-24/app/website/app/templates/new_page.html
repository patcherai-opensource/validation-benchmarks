<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageFlow CMS - New Page</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">📄 PageFlow CMS</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.display_name }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white"><strong>Navigation</strong></div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="{{ url_for('dashboard') }}">🏠 Dashboard</a></li>
                        <li class="list-group-item active"><a href="{{ url_for('pages') }}" class="text-white">📄 Pages</a></li>
                        <li class="list-group-item"><a href="{{ url_for('media') }}">🖼️ Media</a></li>
                        <li class="list-group-item"><a href="{{ url_for('themes') }}">🎨 Themes</a></li>
                        <li class="list-group-item"><a href="{{ url_for('settings') }}">⚙️ Settings</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <h2>Create New Page</h2>
                <div class="card mt-3">
                    <div class="card-body">
                        <form method="post" id="pageForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Page Title</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="content" class="form-label">Content</label>
                                <textarea class="form-control" id="content" name="content" rows="12" placeholder="Enter page content..."></textarea>
                                <small class="text-muted">You can use HTML. Enable template processing for dynamic Jinja2 expressions.</small>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="template_enabled" name="template_enabled">
                                <label class="form-check-label" for="template_enabled">
                                    Enable Template Processing
                                    <small class="text-muted d-block">Allows Jinja2 template expressions in content</small>
                                </label>
                            </div>
                            <div class="mb-3">
                                <button type="button" class="btn btn-outline-secondary" onclick="previewContent()">Preview</button>
                                <button type="submit" class="btn btn-primary">Save Page</button>
                                <a href="{{ url_for('pages') }}" class="btn btn-link">Cancel</a>
                            </div>
                        </form>
                        
                        <div id="previewArea" class="mt-4" style="display: none;">
                            <h5>Preview</h5>
                            <div id="previewContent" class="border p-3 bg-light"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        function previewContent() {
            const content = document.getElementById('content').value;
            const templateEnabled = document.getElementById('template_enabled').checked;
            
            fetch('/api/preview', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'content=' + encodeURIComponent(content) + '&template_enabled=' + templateEnabled
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('previewArea').style.display = 'block';
                if (data.success) {
                    document.getElementById('previewContent').innerHTML = data.rendered;
                } else {
                    document.getElementById('previewContent').innerHTML = '<div class="text-danger">Error: ' + data.error + '</div>';
                }
            });
        }
    </script>
</body>
</html>
