{% extends "base.html" %}
{% block title %}{{ page.title }} - GravPy CMS{% endblock %}
{% block body %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">GravPy CMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    {% if preview is defined and preview %}
    <div class="alert alert-info">Preview Mode</div>
    {% endif %}
    <article>
        <h1>{{ page.title }}</h1>
        <div class="content mt-3">
            {{ rendered_content }}
        </div>
    </article>
</div>
<footer class="bg-dark text-light mt-5 py-3">
    <div class="container text-center">
        <small>&copy; 2023 GravPy CMS. Powered by GravPy v1.7.41</small>
    </div>
</footer>
{% endblock %}
