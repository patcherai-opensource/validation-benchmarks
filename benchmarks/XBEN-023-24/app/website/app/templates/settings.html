<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - AutoConfig Manager</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="row justify-content-between mt-5">
            <div class="col-md-9">
                <h2>User Settings</h2>
                <form method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">First Name:</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Last Name:</label>
                        <input type="text" class="form-control" id="lastname" name="lastname" value="{{ user.lastname }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <hr>
                    <h5>Template Defaults</h5>
                    <div class="mb-3">
                        <label for="default_hosts" class="form-label">Default Host Count:</label>
                        <input type="text" class="form-control" id="default_hosts" name="default_hosts" value="{{ user.default_hosts }}">
                    </div>
                    <div class="mb-3">
                        <label for="timeout_seconds" class="form-label">Timeout (seconds):</label>
                        <input type="number" class="form-control" id="timeout_seconds" name="timeout_seconds" value="{{ user.timeout_seconds }}">
                    </div>
                    <div class="mb-3">
                        <label for="retry_count" class="form-label">Retry Count:</label>
                        <input type="number" class="form-control" id="retry_count" name="retry_count" value="{{ user.retry_count }}">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Settings</button>
                </form>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Navigation</h5>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                            <li class="list-group-item"><a href="{{ url_for('settings') }}">Settings</a></li>
                            <li class="list-group-item"><a href="{{ url_for('template_list') }}">Templates</a></li>
                            <li class="list-group-item"><a href="{{ url_for('logout') }}">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
