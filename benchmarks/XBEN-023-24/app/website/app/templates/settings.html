<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - PageCraft CMS</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">📄 PageCraft CMS</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.name }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Navigation</h5>
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action">Dashboard</a>
                        <a href="{{ url_for('pages') }}" class="list-group-item list-group-item-action">Pages</a>
                        <a href="{{ url_for('new_page') }}" class="list-group-item list-group-item-action">New Page</a>
                        <a href="{{ url_for('settings') }}" class="list-group-item list-group-item-action active">Settings</a>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <h2>Account Settings</h2>
                
                <form method="post" class="mt-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Profile Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="name" class="form-label">Display Name</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" value="{{ user.role }}" disabled>
                            </div>
                            <button type="submit" class="btn btn-primary">Update Settings</button>
                        </div>
                    </div>
                </form>
                
                <div class="card mt-4">
                    <div class="card-header">
                        <h5 class="mb-0">System Information</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr>
                                <td><strong>CMS Version</strong></td>
                                <td>PageCraft CMS v1.7.41</td>
                            </tr>
                            <tr>
                                <td><strong>Template Engine</strong></td>
                                <td>Twig (Jinja2-compatible)</td>
                            </tr>
                            <tr>
                                <td><strong>Twig Filters</strong></td>
                                <td>map, reduce, filter, join (+ custom extensions)</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
