<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageFlow CMS - Settings</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">📄 PageFlow CMS</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.display_name }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white"><strong>Navigation</strong></div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="{{ url_for('dashboard') }}">🏠 Dashboard</a></li>
                        <li class="list-group-item"><a href="{{ url_for('pages') }}">📄 Pages</a></li>
                        <li class="list-group-item"><a href="{{ url_for('media') }}">🖼️ Media</a></li>
                        <li class="list-group-item"><a href="{{ url_for('themes') }}">🎨 Themes</a></li>
                        <li class="list-group-item active"><a href="{{ url_for('settings') }}" class="text-white">⚙️ Settings</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <h2>Account Settings</h2>
                <div class="card mt-3">
                    <div class="card-body">
                        <form method="post">
                            <div class="mb-3">
                                <label for="display_name" class="form-label">Display Name</label>
                                <input type="text" class="form-control" id="display_name" name="display_name" value="{{ user.display_name }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="bio" class="form-label">Bio</label>
                                <textarea class="form-control" id="bio" name="bio" rows="3">{{ user.bio }}</textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" value="{{ user.role }}" disabled>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
