<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageFlow CMS - {{ page.title }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('dashboard') }}">📄 PageFlow CMS</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">Welcome, {{ user.display_name }}</span>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header bg-primary text-white"><strong>Navigation</strong></div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><a href="{{ url_for('dashboard') }}">🏠 Dashboard</a></li>
                        <li class="list-group-item active"><a href="{{ url_for('pages') }}" class="text-white">📄 Pages</a></li>
                        <li class="list-group-item"><a href="{{ url_for('media') }}">🖼️ Media</a></li>
                        <li class="list-group-item"><a href="{{ url_for('themes') }}">🎨 Themes</a></li>
                        <li class="list-group-item"><a href="{{ url_for('settings') }}">⚙️ Settings</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>{{ page.title }}</h2>
                    <a href="{{ url_for('edit_page', page_id=page.id) }}" class="btn btn-outline-primary">Edit</a>
                </div>
                
                {% if page.template_enabled %}
                <div class="alert alert-info">
                    <small>Template processing is <strong>enabled</strong> for this page.</small>
                </div>
                {% endif %}
                
                <div class="card">
                    <div class="card-body">
                        {{ rendered_content | safe }}
                    </div>
                </div>
                
                <div class="mt-3">
                    <a href="{{ url_for('pages') }}" class="btn btn-link">&larr; Back to Pages</a>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
