<VirtualHost *:80>
    DocumentRoot /var/www/sba_monitor/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess sba_monitor python-path=/var/www/sba_monitor/
    WSGIProcessGroup sba_monitor
    WSGIScriptAlias / /var/www/sba_monitor/sba_monitor.wsgi

    <Directory "/var/www/sba_monitor/app/">
        WSGIProcessGroup sba_monitor
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Suppress server version info
    ServerSignature Off
</VirtualHost>
