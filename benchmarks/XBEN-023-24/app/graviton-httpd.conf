<VirtualHost *:80>
    DocumentRoot /var/www/graviton-cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess /graviton-cms python-path=/var/www/graviton-cms/
    WSGIProcessGroup /graviton-cms
    WSGIScriptAlias / /var/www/graviton-cms/graviton.wsgi

    <Directory "/var/www/graviton-cms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /graviton-cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
