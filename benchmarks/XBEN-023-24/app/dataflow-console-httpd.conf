<VirtualHost *:80>
    DocumentRoot /var/www/dataflow_console/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess /dataflow_console python-path=/var/www/dataflow_console/
    WSGIProcessGroup /dataflow_console
    WSGIScriptAlias / /var/www/dataflow_console/dataflow_console.wsgi

    <Directory "/var/www/dataflow_console/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /dataflow_console
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ServerSignature Off
    Header unset X-Powered-By
</VirtualHost>
