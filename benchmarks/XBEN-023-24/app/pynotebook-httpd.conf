<VirtualHost *:80>
    DocumentRoot /var/www/pynotebook/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /pynotebook python-path=/var/www/pynotebook/
    WSGIProcessGroup /pynotebook
    WSGIScriptAlias / /var/www/pynotebook/pynotebook.wsgi

    <Directory "/var/www/pynotebook/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /pynotebook
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
