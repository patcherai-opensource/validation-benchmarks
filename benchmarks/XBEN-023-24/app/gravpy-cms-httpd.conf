<VirtualHost *:80>
    DocumentRoot /var/www/gravpy-cms/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    WSGIDaemonProcess gravpy-cms python-path=/var/www/gravpy-cms/
    WSGIProcessGroup gravpy-cms
    WSGIScriptAlias / /var/www/gravpy-cms/gravpy_cms.wsgi

    <Directory "/var/www/gravpy-cms/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup gravpy-cms
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "\.(py|pyc|wsgi)$">
        Require all denied
    </FilesMatch>

    Header unset Server
    Header always set X-Content-Type-Options "nosniff"
    ServerSignature Off
</VirtualHost>
