apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssti-blind-loan-calculator
  name: ssti-blind-loan-calculator
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-blind-loan-calculator
  template:
    metadata:
      labels:
        app: ssti-blind-loan-calculator
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: ssti_blind_loan_calculator
        - name: MYSQL_DATABASE
          value: database
        args: ["--innodb_use_native_aio=0"]
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-023-24_streampark-cve-2024-29178:mysql
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_blind_loan_calculator
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
        name: mysql
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_blind_loan_calculator
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: ssti_blind_loan_calculator
        - name: DB_NAME
          value: database
        - name: DB_PORT
          value: "3306"
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-023-24_streampark-cve-2024-29178:app
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssti-blind-loan-calculator
  name: ssti-blind-loan-calculator-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ssti-blind-loan-calculator
  type: ClusterIP
