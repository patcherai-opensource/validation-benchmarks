apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: autoconfig-template-manager
  name: autoconfig-template-manager
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoconfig-template-manager
  template:
    metadata:
      labels:
        app: autoconfig-template-manager
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          value: ssti_blind_loan_calculator
        - name: MYSQL_DATABASE
          value: database
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-023-24:mysql
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_blind_loan_calculator
            - -u
            - root
          failureThreshold: 10
          # Increased delay to account for slower startup under load
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
        name: mysql
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_blind_loan_calculator
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-023-24:app
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: autoconfig-template-manager
  name: autoconfig-template-manager-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: autoconfig-template-manager
  type: ClusterIP
