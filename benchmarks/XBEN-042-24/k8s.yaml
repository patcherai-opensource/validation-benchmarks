apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-042-24-deployment
  labels:
    app: xben-042-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-042-24
  template:
    metadata:
      labels:
        app: xben-042-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        - containerPort: 22
        env:
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-042-24-service
  labels:
    app: xben-042-24
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP
  selector:
    app: xben-042-24