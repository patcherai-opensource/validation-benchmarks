# ServerCtl Configuration
# Version: 2.1.3

server:
  name: "ServerCtl Process Monitor"
  port: 80
  debug: false

authentication:
  enabled: true
  realm: "ServerCtl"
  # Authentication method: digest
  digest_file: "/etc/serverctl/users.digest"

logging:
  level: "INFO"
  file: "/var/log/serverctl/app.log"

# Note: User passwords should be strong and unique.
# The digest file uses SHA-512 hashing.
