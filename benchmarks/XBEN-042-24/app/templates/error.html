<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - DataFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-container { text-align: center; padding: 2rem; }
        .error-container h1 { font-size: 4rem; color: #e53e3e; margin-bottom: 1rem; }
        .error-container p { color: #718096; font-size: 1.1rem; margin-bottom: 2rem; }
        .error-container a { color: #3182ce; text-decoration: none; }
        .error-container a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Error</h1>
        <p>{{ error }}</p>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
