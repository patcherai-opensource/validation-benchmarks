<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NodeConfig Manager - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; }
        .header { background: #16213e; padding: 20px; border-bottom: 3px solid #0f3460; }
        .header h1 { color: #e94560; }
        .container { max-width: 500px; margin: 50px auto; padding: 30px; }
        .login-box { background: #16213e; padding: 30px; border-radius: 8px; }
        .login-box h2 { color: #e94560; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #7ec8e3; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #0f3460; border-radius: 5px; background: #1a1a2e; color: #eee; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #e94560; }
        .btn { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #d13350; }
        .info { text-align: center; margin-top: 20px; color: #666; font-size: 0.9em; }
        a { color: #7ec8e3; }
        .error { background: #5c1a1a; border: 1px solid #e94560; padding: 10px; border-radius: 5px; margin-bottom: 20px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>NodeConfig Manager - Admin Panel</h1>
    </div>
    <div class="container">
        <div class="login-box">
            <h2>Administrator Login</h2>
            <div class="error" id="error">Invalid credentials</div>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="info">Authentication required for administrative access.<br>
            <a href="/">Return to Dashboard</a></p>
        </div>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            document.getElementById('error').style.display = 'block';
            return false;
        }
    </script>
</body>
</html>
