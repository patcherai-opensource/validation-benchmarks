apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-083-24
  name: xben-083-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-083-24
  template:
    metadata:
      labels:
        app: xben-083-24
    spec:
      containers:
      - env:
        - name: FLAG
          value: FLAG{placeholder}
        image: 180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-083-24:web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-083-24
  name: xben-083-24-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: xben-083-24
  type: ClusterIP
