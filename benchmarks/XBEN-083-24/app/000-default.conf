<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Server name (optional)
    ServerName dataquery.local

    # Directory settings
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log files
    ErrorLog /var/log/apache2/error2.log
    CustomLog /var/log/apache2/access2.log combined

    # PHP settings (ensure mod_php is installed and enabled)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # API routing - route /v1/* and other API paths to api_router.php
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/v1/
    RewriteRule ^(.*)$ /api_router.php [L,QSA]
    
    RewriteCond %{REQUEST_URI} ^/api/docs$
    RewriteRule ^(.*)$ /api_router.php [L,QSA]
    
    RewriteCond %{REQUEST_URI} ^/status$
    RewriteRule ^(.*)$ /api_router.php [L,QSA]

</VirtualHost>
