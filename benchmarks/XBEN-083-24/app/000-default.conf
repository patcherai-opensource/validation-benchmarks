<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Server name (optional)
    ServerName www.example.com

    # Directory settings - disable directory listing for security
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Block access to sensitive files
    <FilesMatch "\.(sql|env|bak|orig|save)$">
        Require all denied
    </FilesMatch>

    # Log files
    ErrorLog /var/log/apache2/error2.log
    CustomLog /var/log/apache2/access2.log combined

    # PHP settings (ensure mod_php is installed and enabled)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

</VirtualHost>
