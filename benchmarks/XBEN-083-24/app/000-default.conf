<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Server name (optional)
    ServerName www.example.com

    # Enable rewrite engine
    RewriteEngine On

    # Rewrite rules for clean API URLs (without .php extension)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^v1/editor/sql/run$ /v1/editor/sql/run.php [L,QSA]
    
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^v1/editor/chart/run$ /v1/editor/chart/run.php [L,QSA]

    # Directory settings
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log files
    ErrorLog /var/log/apache2/error2.log
    CustomLog /var/log/apache2/access2.log combined

    # PHP settings (ensure mod_php is installed and enabled)
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

</VirtualHost>
