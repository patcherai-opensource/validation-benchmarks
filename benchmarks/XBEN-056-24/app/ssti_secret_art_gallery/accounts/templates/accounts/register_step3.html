{% extends 'base.html' %}

{% block title %}Register - Step 3{% endblock %}

{% block content %}
<nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Art Gallery</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
    </button>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Step 3: Subscription</h2>
            <p>Welcome, {{ account_name }}. Complete your registration below.</p>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_is_premium">Subscribe to premium:</label>
                    <input type="checkbox" name="is_premium" id="id_is_premium">
                </div>
                <button type="submit" class="btn btn-primary">Complete Registration</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
