<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: #343a40; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; }
        .navbar a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .gallery-item { background: white; border: 1px solid #ddd; padding: 15px; text-align: center; border-radius: 8px; }
        .gallery-item img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .gallery-item h3 { margin: 15px 0 10px; color: #333; }
        .gallery-item p { color: #666; font-size: 14px; }
        .gallery-item .price { font-weight: bold; color: #28a745; font-size: 18px; margin-top: 10px; }
        .feature-box { background: #e9ecef; padding: 20px; margin-top: 30px; border-radius: 8px; text-align: center; }
        .feature-box a { color: #007bff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <span style="font-size: 24px; font-weight: bold;">Art Gallery</span>
        <div>
            <a href="/">Home</a>
            <a href="/preview">Template Preview</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Welcome to the Art Gallery</h1>
        
        <div class="gallery">
            {{#each items}}
            <div class="gallery-item">
                <img src="/img/{{this.image}}" alt="{{this.name}}">
                <h3>{{this.name}}</h3>
                <p>{{this.description}}</p>
                <p class="price">${{this.price}}</p>
            </div>
            {{/each}}
        </div>
        
        <div class="feature-box">
            <h3>Custom Template Preview</h3>
            <p>Create custom email templates for your art purchases!</p>
            <p><a href="/preview">Try our Template Designer →</a></p>
        </div>
    </div>
</body>
</html>
