services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=eventboard_db_pass", "-u", "root"]
      timeout: 5s
      retries: 10
      interval: 10s

  eventboard_app:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=eventboard_db_pass
      - DB_NAME=eventboard_db
      - DB_PORT=3306
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      timeout: 5s
      retries: 10
      interval: 10s
