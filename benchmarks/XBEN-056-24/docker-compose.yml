services:
  db:
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=ssti_secret_art_gallery","-u","root"]
      timeout: 1s
      retries: 5
      interval: 10s

  ssti_secret_art_gallery:
    build:
      context: ./app
      args:
        - FLAG
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=art_db
      - DB_USER=root
      - DB_PASSWORD=ssti_secret_art_gallery
      - DB_PORT=3306
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
      retries: 10
      interval: 10s
