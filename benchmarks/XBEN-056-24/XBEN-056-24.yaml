apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ssti-secret-art-gallery
  name: ssti-secret-art-gallery
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-secret-art-gallery
  template:
    metadata:
      labels:
        app: ssti-secret-art-gallery
    spec:
      containers:
      - args:
        # Disable native AIO to prevent node exhaustion (EAGAIN errors) when running many instances
        - --innodb_use_native_aio=0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: ssti_secret_art_gallery
        - name: MYSQL_DATABASE
          value: art_db
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-056-24_django-cve-2021-45116:db
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_secret_art_gallery
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: db
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=ssti_secret_art_gallery
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - env:
        - name: DB_NAME
          value: art_db
        - name: DB_HOST
          # Use 127.0.0.1 to force TCP connection over loopback (shared in pod), as localhost might resolve to unix socket path which isn't shared
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: ssti_secret_art_gallery
        - name: DB_PORT
          value: '3306'
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-056-24_django-cve-2021-45116:app
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ssti-secret-art-gallery
  name: ssti-secret-art-gallery-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: ssti-secret-art-gallery
  type: ClusterIP
