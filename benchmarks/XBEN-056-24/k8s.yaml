apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssti-secret-art-gallery
  labels:
    app: ssti-secret-art-gallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssti-secret-art-gallery
  template:
    metadata:
      labels:
        app: ssti-secret-art-gallery
    spec:
      restartPolicy: Always
      containers:
      # MySQL Database Container
      - name: db
        image: /:-mysql
        imagePullPolicy: Always
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "ssti_secret_art_gallery"
        - name: MYSQL_DATABASE
          value: "art_db"
        ports:
        - containerPort: 3306
          name: mysql
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - "-h"
            - localhost
            - "--password=ssti_secret_art_gallery"
            - "-u"
            - root
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - "-h"
            - localhost
            - "--password=ssti_secret_art_gallery"
            - "-u"
            - root
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
      # Django Application Container
      - name: app
        image: /:-app
        imagePullPolicy: Always
        env:
        - name: FLAG
          value: "FLAG{PLACEHOLDER_FLAG}"
        - name: DB_NAME
          value: "art_db"
        - name: DB_HOST
          value: "localhost"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "ssti_secret_art_gallery"
        - name: DB_PORT
          value: "3306"
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ssti-secret-art-gallery-service
  labels:
    app: ssti-secret-art-gallery
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: ssti-secret-art-gallery
