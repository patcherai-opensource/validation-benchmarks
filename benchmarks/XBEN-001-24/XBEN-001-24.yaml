apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: netwatch-nms
  name: netwatch-nms
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netwatch-nms
  template:
    metadata:
      labels:
        app: netwatch-nms
    spec:
      containers:
      - args:
        - --innodb_use_native_aio=0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: netwatch_monitoring
        - name: MYSQL_DATABASE
          value: netwatch
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-001-24_librenms-cve-2023-5591:db
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=netwatch_monitoring
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=netwatch_monitoring
            - -u
            - root
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        - name: DB_HOST
          value: 127.0.0.1
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: netwatch_monitoring
        - name: DB_NAME
          value: netwatch
        - name: DB_PORT
          value: "3306"
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-001-24_librenms-cve-2023-5591:netwatch-nms
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        name: netwatch-nms
        ports:
        - containerPort: 80
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /ping
            port: 80
          initialDelaySeconds: 45
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: netwatch-nms
  name: netwatch-nms-service
  namespace: sandbox-prod
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: netwatch-nms
  type: ClusterIP
