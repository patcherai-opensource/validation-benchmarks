<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMatrix - Client Area</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #1a1d23; color: #c9d1d9; }
        .login-card { background-color: #21262d; border: 1px solid #30363d; border-radius: 6px; }
        .btn-primary { background-color: #238636; border-color: #238636; }
        .btn-primary:hover { background-color: #2ea043; border-color: #2ea043; }
        .form-control { background-color: #0d1117; border-color: #30363d; color: #c9d1d9; }
        .form-control:focus { background-color: #0d1117; border-color: #58a6ff; color: #c9d1d9; }
        .brand-header { color: #58a6ff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center mb-2 brand-header">CloudMatrix</h2>
                <p class="text-center text-muted mb-4">Virtual Server Management</p>
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                <div class="login-card p-4">
                    <h5 class="mb-3">Sign in to your account</h5>
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="username">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
                    </form>
                </div>
                <p class="text-center text-muted mt-3"><small>CloudMatrix VPS Platform v3.8.1</small></p>
            </div>
        </div>
    </div>
</body>
</html>
