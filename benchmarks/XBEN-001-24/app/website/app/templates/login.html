<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch NMS - Login</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #e0e0e0; }
        .login-card { background-color: #16213e; border: 1px solid #0f3460; max-width: 400px; margin: 100px auto; padding: 2rem; border-radius: 4px; }
        .login-card h4 { color: #4ecca3; margin-bottom: 1.5rem; }
        .form-control { background-color: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0; }
        .form-control:focus { background-color: #1a1a2e; border-color: #4ecca3; color: #e0e0e0; box-shadow: 0 0 0 0.2rem rgba(78,204,163,0.25); }
        .btn-login { background-color: #4ecca3; border-color: #4ecca3; color: #1a1a2e; width: 100%; }
        .btn-login:hover { background-color: #3dbd94; border-color: #3dbd94; color: #1a1a2e; }
        .alert-danger { background-color: rgba(192,57,43,0.2); border-color: #c0392b; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="login-card">
        <h4 class="text-center">NetWatch NMS</h4>
        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group mb-3">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
