<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password - NetMon NMS</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            color: #eaeaea;
            border: 1px solid #0f3460;
        }
        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
        .btn-primary {
            background-color: #0f3460;
            border-color: #0f3460;
        }
        .btn-primary:hover {
            background-color: #1a4a7a;
            border-color: #1a4a7a;
        }
        .brand-logo {
            font-size: 2.5rem;
            color: #00d9ff;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 login-container">
                <div class="text-center mb-4">
                    <div class="brand-logo">&#x1F4E1;</div>
                    <h2>NetMon NMS</h2>
                    <p class="text-muted">Network Monitoring System v24.5</p>
                </div>
                <div class="card">
                    <div class="card-body">
                        <p class="text-center mb-3">Welcome back, <strong>{{ first_name }}</strong></p>
                        <form method="POST">
                            <div class="form-group mb-3">
                                <label for="password">Password</label>
                                <input type="text" class="form-control" id="username" name="username" value="{{ username }}" hidden>
                                <input type="text" class="form-control" id="user_id" name="user_id" value="{{ user_id }}" hidden>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
