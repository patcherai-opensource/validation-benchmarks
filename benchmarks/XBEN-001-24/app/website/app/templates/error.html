{% extends "base.html" %}

{% block title %}{{ error_code }} - ShopStore{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-muted">{{ error_code }}</h1>
        <h2 class="mb-4">{{ error_message }}</h2>
        <a href="{{ url_for('shop') }}" class="btn btn-primary">Return to Shop</a>
    </div>
</div>
{% endblock %}
