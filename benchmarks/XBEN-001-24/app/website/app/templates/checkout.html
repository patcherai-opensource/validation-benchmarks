{% extends "base.html" %}

{% block title %}Checkout - ShopStore{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">Checkout</h2>
    </div>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Billing Details</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>First Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label>Last Name</label>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>City</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label>State</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="form-group col-md-2">
                            <label>ZIP</label>
                            <input type="text" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-header">
                <h5>Payment</h5>
            </div>
            <div class="card-body">
                <p><small class="text-muted">Payments securely processed by Stripe</small></p>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" class="form-control" placeholder="4242 4242 4242 4242">
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Expiry</label>
                        <input type="text" class="form-control" placeholder="MM/YY">
                    </div>
                    <div class="form-group col-md-6">
                        <label>CVC</label>
                        <input type="text" class="form-control" placeholder="123">
                    </div>
                </div>
                <button type="button" class="btn btn-success btn-block">Place Order</button>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>Order Summary</h5>
            </div>
            <div class="card-body">
                <p class="text-muted">Your cart is empty.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
