{% extends "base.html" %}

{% block title %}Cart - ShopStore{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">Shopping Cart</h2>
    </div>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <p class="text-muted">Your cart is empty.</p>
                <a href="{{ url_for('shop') }}" class="btn btn-primary">Continue Shopping</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>Order Summary</h5>
            </div>
            <div class="card-body">
                <p>Subtotal: $0.00</p>
                <p>Shipping: $0.00</p>
                <hr>
                <p class="font-weight-bold">Total: $0.00</p>
                <a href="{{ url_for('checkout') }}" class="btn btn-success btn-block">Proceed to Checkout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
