<VirtualHost *:80>
    DocumentRoot /var/www/cloudmatrix/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess cloudmatrix python-path=/var/www/cloudmatrix/
    WSGIProcessGroup cloudmatrix
    WSGIScriptAlias / /var/www/cloudmatrix/cloudmatrix.wsgi

    <Directory "/var/www/cloudmatrix/app/">
        WSGIProcessGroup cloudmatrix
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ServerSignature Off
</VirtualHost>
