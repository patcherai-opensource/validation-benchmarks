<VirtualHost *:80>
    DocumentRoot /var/www/netwatch/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    ServerSignature Off
    Header unset X-Powered-By

    WSGIDaemonProcess netwatch python-path=/var/www/netwatch/
    WSGIProcessGroup netwatch
    WSGIScriptAlias / /var/www/netwatch/netwatch.wsgi

    <Directory "/var/www/netwatch/app/">
        WSGIProcessGroup netwatch
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
