events {}

http {
    server {
        listen 4455;
        server_name imgopt;

        root /var/www/html;
        index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;            
        limit_except POST {
        deny all;
        }

        # Allow connections from the Docker internal network range
        allow 172.0.0.0/8;
        deny all;  # Deny all other connections

        } 

    # Legacy backup files 
    location /backup {        
        index index.html;
        autoindex on;
        autoindex_exact_size off;
    }

    # PHP API rewrite 
    location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

    # Health check endpoint
    location ~ ^/health(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Statistics endpoint
    location ~ ^/stats(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/stats.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Upload endpoint - accepts base64 image data
    location ~ ^/upload(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/sku_process.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Optimize endpoint - processes uploaded images
    location ~ ^/optimize(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/read_sku.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_pass 127.0.0.1:9000;
    }


    }
}
