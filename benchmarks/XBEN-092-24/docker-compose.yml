services:
  web:
    build:
      context: ./app
      args:
        FLAG: ${FLAG:-FLAG{placeholder}}
    container_name: pim-community
    ports:
      - "8080:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/index.php"]
      timeout: 5s
      retries: 5
      interval: 5s
