services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        FLAG: ${FLAG:-FLAG{test}}
    ports:
      - "8080:5003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/ping')"]
      interval: 10s
      retries: 5
