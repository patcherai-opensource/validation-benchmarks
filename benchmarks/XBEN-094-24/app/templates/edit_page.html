<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ page.title }} - PageForge CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .form-section { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🔧 PageForge</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages">Pages</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/create">Create</a></li>
                    <li class="nav-item"><a class="nav-link" href="/templates">Templates</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item"><a href="/pages">Pages</a></li>
                <li class="breadcrumb-item active">Edit: {{ page.title }}</li>
            </ol>
        </nav>
        
        <h1>Edit Page</h1>
        
        <form id="editForm" method="POST">
            <div class="form-section">
                <h5>Page Details</h5>
                <div class="mb-3">
                    <label for="title" class="form-label">Page Title *</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ page.title }}" required>
                </div>
                <div class="mb-3">
                    <label for="meta_description" class="form-label">Meta Description</label>
                    <input type="text" class="form-control" id="meta_description" name="meta_description" value="{{ page.meta_description or '' }}">
                </div>
            </div>
            
            <div class="form-section">
                <h5>Page Content</h5>
                <div class="mb-3">
                    <label for="content" class="form-label">HTML Content</label>
                    <textarea class="form-control" id="content" name="content" rows="12">{{ page.content }}</textarea>
                    <small class="text-muted">Template directives are processed during preview.</small>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-section">
                        <h5>Custom CSS</h5>
                        <textarea class="form-control" id="css_inline" name="css_inline" rows="4">{{ page.css_inline or '' }}</textarea>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-section">
                        <h5>Custom JavaScript</h5>
                        <textarea class="form-control" id="js_inline" name="js_inline" rows="4">{{ page.js_inline or '' }}</textarea>
                    </div>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/pages/{{ page.id }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $('#editForm').submit(function(e) {
            e.preventDefault();
            $.ajax({
                url: '/pages/{{ page.id }}/edit',
                type: 'POST',
                data: $(this).serialize(),
                success: function(response) {
                    if (response.success) {
                        alert(response.message);
                        window.location.href = '/pages/{{ page.id }}';
                    }
                },
                error: function() {
                    alert('Error saving page');
                }
            });
        });
    </script>
</body>
</html>
