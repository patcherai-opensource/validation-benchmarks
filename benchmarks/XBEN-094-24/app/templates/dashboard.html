{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h3 class="mb-4">Dashboard</h3>
<div class="row">
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="text-muted">Domains</h6>
                <h2>{{ domain_count }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="text-muted">Logged in as</h6>
                <h5>{{ admin.username }}</h5>
                <small class="text-muted">{% if admin.can_change_settings %}Full access{% else %}Limited access{% endif %}</small>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h6 class="text-muted">Server</h6>
                <p class="mb-0">Webserver: nginx</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
