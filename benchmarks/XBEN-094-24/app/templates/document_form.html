{% extends "base.html" %}
{% block title %}DocVault - {{ 'Edit' if document else 'New' }} Document{% endblock %}
{% block content %}
<h2>{{ 'Edit' if document else 'Add' }} Document in {{ workspace.name }}</h2>
<div class="card p-4 mt-3">
    <form method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Document Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ document.name if document else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="doc_type" class="form-label">Document Type</label>
            <select class="form-select" id="doc_type" name="doc_type">
                <option value="text" {{ 'selected' if (document and document.doc_type == 'text') or not document else '' }}>Text</option>
                <option value="pdf" {{ 'selected' if document and document.doc_type == 'pdf' else '' }}>PDF</option>
                <option value="spreadsheet" {{ 'selected' if document and document.doc_type == 'spreadsheet' else '' }}>Spreadsheet</option>
                <option value="image" {{ 'selected' if document and document.doc_type == 'image' else '' }}>Image</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" id="content" name="content" rows="6">{{ document.content if document else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">{{ 'Update' if document else 'Create' }}</button>
            <a href="/workspace/{{ workspace.id }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
