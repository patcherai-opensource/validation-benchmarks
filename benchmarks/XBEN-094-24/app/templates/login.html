<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froxlor - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #2c3e50; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 8px; padding: 40px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .login-card h2 { margin-bottom: 30px; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center">Froxlor Server Management</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="loginname" class="form-label">Username</label>
                <input type="text" class="form-control" id="loginname" name="loginname" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-muted text-center mt-3 mb-0" style="font-size:0.85em">Froxlor Server Management Panel v2.0.10</p>
    </div>
</body>
</html>
