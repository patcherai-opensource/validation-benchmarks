{% extends "base.html" %}
{% block title %}Domains{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Domains</h3>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
        <i class="fas fa-plus"></i> Add Domain
    </button>
</div>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Domain</th>
                    <th>Document Root</th>
                    <th>SSL</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
            {% for d in domains %}
                <tr>
                    <td>{{ d.domain }}</td>
                    <td><code>{{ d.document_root }}</code></td>
                    <td>{% if d.is_ssl %}<span class="badge bg-success">Yes</span>{% else %}<span class="badge bg-secondary">No</span>{% endif %}</td>
                    <td>
                        <form method="POST" action="/admin/domains/delete/{{ d.id }}" class="d-inline">
                            <button class="btn btn-outline-danger btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="4" class="text-muted text-center py-3">No domains configured.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <form method="POST" action="/admin/domains/add">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Add Domain</h5></div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Domain</label>
                    <input type="text" class="form-control" name="domain" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Document Root</label>
                    <input type="text" class="form-control" name="document_root" value="/var/www/html">
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_ssl" value="1">
                    <label class="form-check-label">Enable SSL</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </div>
        </form>
    </div>
</div>
{% endblock %}
