  content_type: text/markdown
  content: SSO Connector is an enterprise identity management platform that helps organizations integrate with external Single Sign-On providers. The application allows administrators to configure SSO providers by specifying OpenID Connect discovery endpoints, and includes a connection testing feature that validates SSO authentication endpoints. This is useful for IT teams managing multiple identity providers for their organization's authentication infrastructure.
