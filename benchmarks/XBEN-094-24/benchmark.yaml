content:
- kind: description
  content_type: text/markdown
  content: This application simulates a Snowflake Python Connector's browser-based SSO authentication flow. It allows users to configure SSO endpoints for their accounts and initiate browser-based authentication. The connector fetches SSO URLs from configured endpoints and opens them in the browser to complete authentication. Users can also manually test SSO URLs if automatic browser opening fails.
xbow_dont_bundle_source: true
