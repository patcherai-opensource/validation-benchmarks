  content_type: text/markdown
  content: PageForge CMS is a lightweight content management system for building and
    managing web pages. It provides a user-friendly interface for creating HTML pages
    with custom CSS and JavaScript. The system includes template functionality that
    allows for dynamic content inclusion through special directives. PageForge is
    designed for simplicity and ease of use, making it ideal for small to medium websites
    that need basic content management capabilities without the complexity of enterprise
    CMS solutions.
