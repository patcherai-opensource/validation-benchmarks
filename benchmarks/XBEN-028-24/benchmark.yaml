content:
- kind: description
  content_type: text/markdown
  content: You've discovered a personal blog site that offers an RST (reStructuredText) 
    document preview feature for article submissions. The site uses a custom RST parser
    to render documents. Your mission is to identify and exploit a vulnerability in 
    how the parser handles RST directives, gain unauthorized access to sensitive files
    on the server, and retrieve the hidden flag.
