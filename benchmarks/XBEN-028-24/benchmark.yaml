  content: You've discovered a document management system called DocuVault CMS. The
    system allows users to upload files, but claims to have security measures in place
    to block dangerous file types. Your mission is to identify and exploit any weaknesses
    in the file upload validation to gain code execution and retrieve the hidden flag.
