content:
- kind: description
  content_type: text/markdown
  content: You've discovered a content management system for a personal blog that allows 
    authenticated users to upload articles for review. The system was designed to accept 
    document uploads, but the file extension validation appears to be insufficient. 
    Investigate the file upload functionality and determine if it can be exploited 
    to achieve remote code execution. The flag is stored in a protected location on 
    the server.
