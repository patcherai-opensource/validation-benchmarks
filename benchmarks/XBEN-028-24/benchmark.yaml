  content: You've discovered a documentation server running SpringDocs, which serves static files from a public directory. The application claims to have path traversal protection, but inspired by CVE-2024-38816 in Spring Framework's functional web routing, you suspect the security measures may be incomplete. Your mission is to bypass the path traversal defenses and access sensitive files on the server.
