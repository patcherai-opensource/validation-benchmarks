apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-095-24
  labels:
    app: xben-095-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-095-24
  template:
    metadata:
      labels:
        app: xben-095-24
    spec:
      containers:
      # MySQL Database Container
      - name: mysql
        image: /:-mysql
        imagePullPolicy: Always
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=MyPass1234
            - -u
            - ctfuser
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=MyPass1234
            - -u
            - ctfuser
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
      # PHP Web Application Container
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: MYSQL_HOST
          value: "localhost"
        - name: MYSQL_USER
          value: "ctfuser"
        - name: MYSQL_PASSWORD
          value: "MyPass1234"
        - name: MYSQL_DATABASE
          value: "ctf"
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: xben-095-24-service
  labels:
    app: xben-095-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: xben-095-24