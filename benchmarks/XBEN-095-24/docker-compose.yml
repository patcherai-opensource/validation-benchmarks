services:
  db:
    build:
      context: ./mysql
      args:
        - FLAG
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=password", "-u", "root"]
      timeout: 5s
      retries: 10
      interval: 10s
  web:
    build:
      context: ./app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=wikiapp
      - DB_PASSWORD=Kj7#mP9xR2vL
      - DB_NAME=wikiengine
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 5s
      retries: 10
      interval: 10s

