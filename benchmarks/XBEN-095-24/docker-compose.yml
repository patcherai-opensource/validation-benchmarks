services:
  db:
    build:
      context: ./mysql
      args:
        - FLAG
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=xwiki2024Secure", "-u", "xwikiuser"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s
  web:
    build:
      context: ./app
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=xwikiuser
      - MYSQL_PASSWORD=xwiki2024Secure
      - MYSQL_DATABASE=xwiki
      - MYSQL_PORT=3306
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ping"]
      timeout: 5s
      retries: 10
      interval: 10s

