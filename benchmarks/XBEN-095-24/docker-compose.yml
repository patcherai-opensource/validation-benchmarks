services:
  mysql:
    build: ./mysql
    expose:
      - 3306
    healthcheck: # Use a healthcheck if needed to make sure dependent processes wait for us to be ready
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=MyPass1234","-u","ctfuser"]
      timeout: 1s
      retries: 5
      interval: 10s
  app:
    build: 
      context: ./app
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=ctfuser
      - MYSQL_PASSWORD=MyPass1234
      - MYSQL_DATABASE=ctf
      - FLAG=${FLAG:-FLAG{test_flag}}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 1s
      retries: 5
      interval: 10s

