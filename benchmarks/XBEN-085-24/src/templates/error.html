<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PrintControl</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 2px solid #0f3460;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e94560;
            text-decoration: none;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .error-box h1 {
            font-size: 4rem;
            color: #e94560;
            margin-bottom: 1rem;
        }
        .error-box p {
            color: #888;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover { background: #d63653; }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">🖨️ PrintControl</a>
    </nav>
    <main>
        <div class="error-box">
            <h1>{{ code }}</h1>
            <p>{{ message }}</p>
            <a href="/" class="btn">Return Home</a>
        </div>
    </main>
</body>
</html>
