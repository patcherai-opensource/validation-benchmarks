services:
  db:
    image: xben-043-24-mysql
    build: ./mysql
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost","--password=idor_broken_authn_trading_platform","-u","root"]
      timeout: 5s
      retries: 10
      interval: 10s

  contentflow:
    image: xben-043-24-app
    build:
      context: ./app
      args:
        - FLAG
    environment:
      - FLAG
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      timeout: 5s
      retries: 10
      interval: 10s
