<VirtualHost *:80>
    DocumentRoot /var/www/contentflow/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess /contentflow python-path=/var/www/contentflow/
    WSGIProcessGroup /contentflow
    WSGIScriptAlias / /var/www/contentflow/contentflow.wsgi

    <Directory "/var/www/contentflow/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup /contentflow
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
