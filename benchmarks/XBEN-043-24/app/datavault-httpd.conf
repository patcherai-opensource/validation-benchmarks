<VirtualHost *:80>
    DocumentRoot /var/www/datavault/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    WSGIDaemonProcess datavault python-path=/var/www/datavault/
    WSGIProcessGroup datavault
    WSGIScriptAlias / /var/www/datavault/datavault.wsgi

    <Directory "/var/www/datavault/app/">
        Header set Access-Control-Allow-Origin "*"
        WSGIProcessGroup datavault
        WSGIApplicationGroup %{GLOBAL}
        Options +ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ServerSignature Off
</VirtualHost>
