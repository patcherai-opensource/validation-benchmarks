<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}eZ Publish{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .ez-header { background-color: #1a1a2e; color: #fff; padding: 10px 0; }
        .ez-header a { color: #e0e0e0; text-decoration: none; }
        .ez-header a:hover { color: #fff; }
        .ez-nav { background-color: #16213e; padding: 8px 0; }
        .ez-nav a { color: #adb5bd; margin-right: 18px; text-decoration: none; font-size: 14px; }
        .ez-nav a:hover { color: #fff; }
        .ez-content { padding: 20px 0; }
        .ez-footer { background-color: #1a1a2e; color: #999; padding: 15px 0; font-size: 12px; margin-top: 40px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="ez-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a href="/" style="font-size: 20px; font-weight: bold;">eZ Publish</a>
                <div>
                    {% if user %}
                        <span style="font-size: 13px; color: #adb5bd;">Logged in as <strong>{{ user.login }}</strong></span>
                        <a href="{{ url_for('logout') }}" style="margin-left: 15px; font-size: 13px;">Logout</a>
                    {% else %}
                        <a href="{{ url_for('login') }}" style="font-size: 13px;">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    <div class="ez-nav">
        <div class="container">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('content_list') }}">Content</a>
            {% if user and session.get('role') == 'administrator' %}
                <a href="{{ url_for('admin_dashboard') }}">Administration</a>
            {% endif %}
        </div>
    </div>
    <div class="ez-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>
    <div class="ez-footer">
        <div class="container text-center">
            &copy; eZ Systems AS. eZ Publish CMS.
        </div>
    </div>
</body>
</html>
