<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Superset{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .navbar {
            background-color: #20a7c9 !important;
            padding: 0 20px;
        }
        .navbar-brand {
            color: #fff !important;
            font-weight: 600;
            font-size: 20px;
        }
        .nav-link {
            color: rgba(255,255,255,0.85) !important;
            padding: 15px 12px !important;
            font-size: 14px;
        }
        .nav-link:hover {
            color: #fff !important;
            background-color: rgba(255,255,255,0.1);
        }
        .nav-link.active {
            color: #fff !important;
            border-bottom: 3px solid #fff;
        }
        .content-wrapper {
            padding: 20px 30px;
        }
        .page-header {
            margin-bottom: 20px;
        }
        .page-header h3 {
            color: #333;
            font-weight: 500;
        }
        .card {
            border: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border-radius: 4px;
        }
        .table th {
            border-top: none;
            font-weight: 500;
            color: #666;
            font-size: 13px;
            text-transform: uppercase;
        }
        .badge-admin { background-color: #e74c3c; }
        .badge-alpha { background-color: #3498db; }
        .badge-gamma { background-color: #27ae60; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="/">Superset</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('dashboard_list') }}">Dashboards</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('sql_lab') }}">SQL Lab</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('profile') }}">{{ user.first_name }}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
