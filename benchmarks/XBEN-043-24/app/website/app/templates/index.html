<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibre-Web - Browse Your Digital Library</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            border: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        .navbar-dark {
            background-color: #0f3460 !important;
        }
        .hero {
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            padding: 60px 0;
        }
        .book-card {
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: scale(1.02);
        }
        a {
            color: #e94560;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">📚 Calibre-Web</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/search">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/register">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="hero text-center">
        <div class="container">
            <h1>Welcome to Calibre-Web</h1>
            <p class="lead">Your personal digital library management system</p>
            <a href="/login" class="btn btn-primary btn-lg">Browse Library</a>
        </div>
    </div>
    
    <div class="container mt-5">
        <h2 class="mb-4">Featured Books</h2>
        <div class="row">
            {% for book in books %}
            <div class="col-md-4 mb-4">
                <div class="card book-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ book.title }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
                        <p class="card-text">{{ book.description[:80] }}...</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <footer class="mt-5 py-3 text-center" style="background-color: #0f3460;">
        <p class="mb-0">Calibre-Web v0.6.19 | <a href="/about">About</a></p>
    </footer>
</body>
</html>
