<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - BookShelf</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .navbar {
            background-color: #16213e !important;
        }
        .card {
            background-color: #16213e;
            border: 1px solid #0f3460;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
        a {
            color: #e94560;
        }
        .book-content {
            background-color: #0f3460;
            padding: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: Georgia, serif;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/library">📚 BookShelf</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-item nav-link">Welcome, {{ user.first_name }}</span>
                <a class="nav-link" href="/library">Back to Library</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <h2>{{ book.title }}</h2>
                <h5 class="text-muted">by {{ book.author }}</h5>
                <hr>
                <div class="book-content">{{ book.content }}</div>
            </div>
        </div>
        <div class="mt-3">
            <a href="/library" class="btn btn-primary">← Back to Library</a>
        </div>
    </div>
</body>
</html>
