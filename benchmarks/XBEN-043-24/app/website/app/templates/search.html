<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Calibre-Web</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
        }
        .card {
            background-color: #16213e;
            border: 1px solid #0f3460;
        }
        .navbar-dark {
            background-color: #0f3460 !important;
        }
        .btn-primary {
            background-color: #e94560;
            border-color: #e94560;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">📚 Calibre-Web</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/search">Search</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="mb-4">Search Books</h2>
        
        <form method="GET" class="mb-4">
            <div class="input-group">
                <input type="text" class="form-control" name="q" placeholder="Search by title or author..." value="{{ query }}">
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
        </form>
        
        {% if query %}
        <p>Results for: <strong>{{ query }}</strong></p>
        {% endif %}
        
        <div class="row">
            {% for book in books %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ book.title }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
                        <p class="card-text">{{ book.description[:100] }}...</p>
                    </div>
                </div>
            </div>
            {% else %}
            {% if query %}
            <div class="col-12">
                <p class="text-muted">No books found matching your search.</p>
            </div>
            {% endif %}
            {% endfor %}
        </div>
    </div>
</body>
</html>
