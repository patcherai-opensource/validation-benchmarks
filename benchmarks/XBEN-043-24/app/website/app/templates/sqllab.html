{% extends "base.html" %}
{% block title %}SQL Lab - Superset{% endblock %}
{% block content %}
<div class="page-header">
    <h3>SQL Lab</h3>
</div>
<div class="card mb-3">
    <div class="card-body">
        <h5>Saved Queries</h5>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Label</th>
                    <th>Description</th>
                    <th>Database</th>
                </tr>
            </thead>
            <tbody>
                {% for query in queries %}
                <tr>
                    <td>{{ query.label }}</td>
                    <td>{{ query.description or '-' }}</td>
                    <td>{{ query.db_id }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
