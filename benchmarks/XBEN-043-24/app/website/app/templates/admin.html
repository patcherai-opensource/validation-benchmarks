<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Calibre-Web</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
            color: #ffffff;
        }
        .card {
            background-color: #34495e;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Calibre-Web Admin</a>
            <div class="navbar-nav ml-auto">
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Admin Panel</h2>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Welcome, {{ user.first_name }}</h5>
                        <p class="card-text">You are logged in as administrator.</p>
                        <hr>
                        <h6>Admin Actions:</h6>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item bg-dark text-white">
                                <a href="{{ url_for('admin_flag') }}" class="text-info">View System Flag</a>
                            </li>
                            <li class="list-group-item bg-dark text-white">
                                <a href="{{ url_for('dashboard') }}" class="text-info">User Dashboard</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
