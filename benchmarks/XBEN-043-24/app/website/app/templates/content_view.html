{% extends "base.html" %}
{% block title %}{{ article.title }} - ContentFlow CMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h3>{{ article.title }}</h3>
                <hr>
                <p>{{ article.body }}</p>
                <small class="text-muted">Last updated: {{ article.updated_at.strftime('%Y-%m-%d %H:%M') if article.updated_at else 'N/A' }}</small>
            </div>
        </div>
        <a href="{{ url_for('index') }}" class="btn btn-primary">&laquo; Back</a>
    </div>
</div>
{% endblock %}
