{% extends "base.html" %}
{% block title %}{{ content.name }} - eZ Publish{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Home</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('content_list') }}">Content</a></li>
        <li class="breadcrumb-item active">{{ content.name }}</li>
    </ol>
</nav>
<div class="card">
    <div class="card-body">
        <h4>{{ content.name }}</h4>
        <span class="badge badge-secondary">{{ content.content_type }}</span>
        {% if content.published == 0 %}
            <span class="badge badge-warning">Draft</span>
        {% endif %}
        <hr>
        <div>{{ content.body }}</div>
    </div>
</div>
{% endblock %}
