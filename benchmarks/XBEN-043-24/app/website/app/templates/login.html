{% extends "base.html" %}
{% block title %}Sign In - ContentFlow CMS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">Sign In</div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('user_login') }}">
                    <div class="mb-3">
                        <label for="LoginName" class="form-label">Username</label>
                        <input type="text" class="form-control" id="LoginName" name="LoginName" required>
                    </div>
                    <div class="mb-3">
                        <label for="Password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="Password" name="Password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
