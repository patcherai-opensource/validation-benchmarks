{% extends "base.html" %}
{% block title %}Login - DataVault Analytics{% endblock %}
{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 100px auto;
    }
    .login-logo {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-logo h1 {
        color: #4fc3f7;
        font-size: 1.8em;
    }
    .login-logo p {
        color: #78909c;
        font-size: 0.9em;
    }
    .form-control {
        background-color: #0f3460;
        border: 1px solid #1a1a2e;
        color: #e0e0e0;
    }
    .form-control:focus {
        background-color: #0f3460;
        border-color: #4fc3f7;
        color: #e0e0e0;
        box-shadow: 0 0 0 0.2rem rgba(79, 195, 247, 0.25);
    }
</style>
{% endblock %}
{% block content %}
<div class="login-container">
    <div class="login-logo">
        <h1>DataVault Analytics</h1>
        <p>Business Intelligence &amp; Data Exploration Platform</p>
    </div>
    <div class="card">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
            </form>
        </div>
        <div class="card-footer text-center" style="background-color: #0f3460; border-top: 1px solid #1a1a2e;">
            <small><a href="{{ url_for('about') }}" style="color: #78909c;">About DataVault Analytics</a></small>
        </div>
    </div>
</div>
{% endblock %}
