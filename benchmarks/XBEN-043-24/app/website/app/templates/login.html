<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CMS Admin Panel</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a2e;
            color: #eaeaea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: #16213e;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-header h1 {
            color: #ff6b35;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .brand-header small {
            color: #8892b0;
            font-size: 12px;
        }
        .form-control {
            background-color: #0f3460;
            border: 1px solid #1a1a2e;
            color: #eaeaea;
        }
        .form-control:focus {
            background-color: #0f3460;
            border-color: #ff6b35;
            color: #eaeaea;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 53, 0.25);
        }
        .btn-primary {
            background-color: #ff6b35;
            border-color: #ff6b35;
        }
        .btn-primary:hover {
            background-color: #e85a2b;
            border-color: #e85a2b;
        }
        label {
            color: #ccd6f6;
        }
        .alert-info {
            background-color: #0f3460;
            border-color: #1a1a2e;
            color: #64ffda;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <h1>CMS Admin Panel</h1>
            <small>Powered by SaltedPasswordService v3.2.1</small>
        </div>
        
        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}
        
        {% if message %}
            <div class="alert alert-info" role="alert">{{ message }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group mb-3">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary btn-block w-100">Sign In</button>
        </form>
        
        <!-- System notice: Password hashing upgraded. Users with legacy Blowfish hashes may experience issues. -->
        <!-- Default hash: MD5. Legacy support enabled for backward compatibility. -->
    </div>
</body>
</html>
