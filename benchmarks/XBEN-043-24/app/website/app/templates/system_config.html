<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Configuration - Trading Platform</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
            color: #ffffff;
        }
        .card {
            background-color: #34495e;
            color: #ffffff;
        }
        .sidebar {
            background-color: #1a252f;
            min-height: 100vh;
            padding-top: 20px;
        }
        .sidebar a {
            color: #bdc3c7;
            padding: 10px 15px;
            display: block;
        }
        .sidebar a:hover {
            background-color: #34495e;
            color: #ffffff;
            text-decoration: none;
        }
        .config-value {
            font-family: monospace;
            background-color: #1a252f;
            padding: 5px 10px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Trading Platform</a>
            <div class="navbar-nav ms-auto">
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar">
                <nav>
                    <a href="{{ url_for('dashboard') }}">Dashboard</a>
                    <a href="{{ url_for('profile') }}">Profile</a>
                    <a href="{{ url_for('admin_panel') }}">Admin Panel</a>
                    <a href="{{ url_for('system_config') }}">System Config</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <h2>System Configuration</h2>
                <div class="card mt-4">
                    <div class="card-header">
                        <h5>System Settings</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-dark">
                            <tbody>
                                <tr>
                                    <td>System Encryption Key</td>
                                    <td><span class="config-value">{{ config.system_encryption_key }}</span></td>
                                </tr>
                                <tr>
                                    <td>Database Host</td>
                                    <td><span class="config-value">{{ config.database_host }}</span></td>
                                </tr>
                                <tr>
                                    <td>Cache Enabled</td>
                                    <td><span class="config-value">{{ config.cache_enabled }}</span></td>
                                </tr>
                                <tr>
                                    <td>Session Timeout</td>
                                    <td><span class="config-value">{{ config.session_timeout }} seconds</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
