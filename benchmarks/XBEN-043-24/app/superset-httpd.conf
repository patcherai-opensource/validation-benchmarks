<VirtualHost *:80>
    DocumentRoot /var/www/superset_analytics/
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    
    ServerSignature Off
    Header always unset X-Powered-By
    
    WSGIDaemonProcess superset_analytics python-path=/var/www/superset_analytics/
    WSGIProcessGroup superset_analytics
    WSGIScriptAlias / /var/www/superset_analytics/superset.wsgi

    <Directory "/var/www/superset_analytics/app/">
        WSGIProcessGroup superset_analytics
        WSGIApplicationGroup %{GLOBAL}
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
