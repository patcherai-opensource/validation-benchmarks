apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-081-24
  name: xben-081-24-deployment
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-081-24
  template:
    metadata:
      labels:
        app: xben-081-24
    spec:
      containers:
      - args:
        # Disable native AIO to prevent node exhaustion (EAGAIN errors) when running many instances
        - --innodb_use_native_aio=0
        command:
        - sh
        - -c
        - |
          # Robustly find and update flag in any SQL init file (handles missing/misnamed files)
          find /docker-entrypoint-initdb.d/ -name "*.sql" -exec sed -i "s|@FLAG@|$FLAG|g" {} + || true
          docker-entrypoint.sh mysqld "$@"
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: password
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-081-24:mysql
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=pCxvkPyS9JYq27BVdUX4N8
            - -u
            - db_username
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        name: mysql
        ports:
        - containerPort: 3306
          name: mysql
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - --password=pCxvkPyS9JYq27BVdUX4N8
            - -u
            - db_username
          failureThreshold: 10
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      - env:
        - name: DB_HOST
          # Use 127.0.0.1 to force TCP connection over loopback (shared in pod), as localhost might resolve to unix socket path which isn't shared
          value: 127.0.0.1
        - name: DB_DATABASE
          value: db
        - name: DB_USERNAME
          value: db_username
        - name: DB_PASSWORD
          value: pCxvkPyS9JYq27BVdUX4N8
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-081-24:php
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /login.php
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
        name: php
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /login.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-081-24
  name: xben-081-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: xben-081-24
  type: ClusterIP
