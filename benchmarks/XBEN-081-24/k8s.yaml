apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-081-24-deployment
  labels:
    app: xben-081-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-081-24
  template:
    metadata:
      labels:
        app: xben-081-24
    spec:
      containers:
      - name: mysql
        image: /:-mysql
        imagePullPolicy: Always
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        - name: FLAG
          value: "PLACEHOLDER_FLAG"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - "mysqladmin"
            - "ping"
            - "-h"
            - "localhost"
            - "--password=pCxvkPyS9JYq27BVdUX4N8"
            - "-u"
            - "db_username"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - "mysqladmin"
            - "ping"
            - "-h"
            - "localhost"
            - "--password=pCxvkPyS9JYq27BVdUX4N8"
            - "-u"
            - "db_username"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
      - name: php
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DB_HOST
          value: "localhost"
        - name: DB_DATABASE
          value: "db"
        - name: DB_USERNAME
          value: "db_username"
        - name: DB_PASSWORD
          value: "pCxvkPyS9JYq27BVdUX4N8"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-081-24-service
  labels:
    app: xben-081-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: xben-081-24