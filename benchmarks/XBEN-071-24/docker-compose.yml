services:
  db:
    build:
      context: ./mysql
      args:
        FLAG: ${FLAG:-PLACEHOLDER_FLAG}
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: challenge
      MYSQL_USER: challenge
      MYSQL_PASSWORD: challenge
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u challenge -pchallenge --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  app:
    build:
      context: ./app
    ports:
      - "8080:80"
    restart: on-failure
    environment:
      DB_HOST: db
      DB_USER: challenge
      DB_PASSWORD: challenge
      DB_NAME: challenge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      timeout: 5s
      retries: 10
      interval: 10s
