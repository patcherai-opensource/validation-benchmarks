<!DOCTYPE html>
<html>
<head>
    <title>Simple Runner - Automation Runner</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #667eea; }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #667eea;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow: auto;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .info {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        a { color: #667eea; text-decoration: none; }
        .nav { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">← Back to Dashboard</a>
        </div>
        
        <h1>🔧 Simple Runner Interface</h1>
        
        <div class="info">
            <strong>Legacy Web Interface</strong><br>
            Execute system commands directly. For advanced usage with arguments, use the <a href="/docs">API</a>.
        </div>
        
        <form method="POST" action="/runner">
            <div class="form-group">
                <label for="executable">Command:</label>
                <input type="text" id="executable" name="executable" 
                       placeholder="e.g., ls, whoami, date" 
                       value="{{ executable if executable else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="args">Arguments (optional):</label>
                <input type="text" id="args" name="args" 
                       placeholder="e.g., -la /tmp"
                       value="{{ args if args else '' }}">
            </div>
            
            <button type="submit">Execute</button>
        </form>
        
        {% if error %}
        <div class="error">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}
        
        {% if output %}
        <div class="output">{{ output }}</div>
        {% endif %}
    </div>
</body>
</html>
