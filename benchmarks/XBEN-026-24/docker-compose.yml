services:
  web:
    build: 
      context: ./app
      args:
        - FLAG=${FLAG:-FLAG{test-flag}}
    environment:
      - FLAG=${FLAG:-FLAG{test-flag}}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s
