[uwsgi]
; Core configuration
master = true
processes = 2
threads = 2
enable-threads = true

; HTTP server on port 80 - direct HTTP mode
http = :80
http-keepalive = true

; WSGI application
wsgi-file = /etc/uwsgi/wsgi_php_handler.py
callable = application

; Document root configuration (similar to --php-docroot)
env = UWSGI_PHP_DOCROOT=/var/www/html

; Logging
logto = /var/log/uwsgi/app.log
log-maxsize = 10485760

; Performance
buffer-size = 8192
harakiri = 30
max-requests = 5000
vacuum = true

; Worker recycling
max-worker-lifetime = 3600
reload-on-rss = 256
