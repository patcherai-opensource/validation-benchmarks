<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConfigSync</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">ConfigSync</div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/docs">API Docs</a></li>
                <li><a href="/status">Status</a></li>
                <li><a href="/login" class="active">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="container page-content">
        <div class="login-form">
            <h1>Administrator Login</h1>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            
            <p class="help-text">This login is for administrators only. Agents should use API tokens for authentication.</p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 ConfigSync. Version 2.1.4</p>
        </div>
    </footer>
</body>
</html>
