{% extends "base.html" %}
{% block title %}Apps - ToolJet{% endblock %}
{% block content %}
<div class="row">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h2>Your Apps</h2>
        <button class="btn btn-primary" disabled>+ Create New App</button>
    </div>
</div>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-4">
            <h5>Sample App</h5>
            <p class="text-muted">A demo application</p>
            <span class="badge bg-success">Published</span>
        </div>
    </div>
</div>
<div class="row mt-4">
    <div class="col-12">
        <p class="text-muted">
            <small>Tip: Use the comments API to collaborate with your team. 
            Check <code>/api/threads</code> for available threads.</small>
        </p>
    </div>
</div>
{% endblock %}
