<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Salt Configuration Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-dark {
            background-color: #1a1a2e;
        }
        .sidebar {
            background-color: #f8f9fa;
            min-height: calc(100vh - 56px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark nav-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <strong>SaltConfig</strong>
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Welcome, {{ username }}
                </span>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar py-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="loadFiles()">File Browser</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showApiInfo()">API Access</a>
                    </li>
                </ul>
            </nav>

            <main class="col-md-10 py-4">
                <div id="content">
                    <h2>File Server Browser</h2>
                    <p>Browse and view configuration files from your Salt file roots.</p>
                    
                    <div class="card">
                        <div class="card-header">
                            <strong>Available Files (base environment)</strong>
                        </div>
                        <div class="card-body" id="file-list">
                            <p class="text-muted">Loading files...</p>
                        </div>
                    </div>

                    <div class="card mt-4" id="file-content" style="display: none;">
                        <div class="card-header">
                            <strong>File Content: <span id="file-name"></span></strong>
                        </div>
                        <div class="card-body">
                            <pre id="file-content-text"></pre>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadFiles() {
            document.getElementById('content').innerHTML = `
                <h2>File Server Browser</h2>
                <p>Browse and view configuration files from your Salt file roots.</p>
                
                <div class="card">
                    <div class="card-header">
                        <strong>Available Files (base environment)</strong>
                    </div>
                    <div class="card-body" id="file-list">
                        <p class="text-muted">Loading files...</p>
                    </div>
                </div>

                <div class="card mt-4" id="file-content" style="display: none;">
                    <div class="card-header">
                        <strong>File Content: <span id="file-name"></span></strong>
                    </div>
                    <div class="card-body">
                        <pre id="file-content-text"></pre>
                    </div>
                </div>
            `;
            
            fetch('/api/v1/file/list?saltenv=base')
                .then(response => response.json())
                .then(data => {
                    if (data.files && data.files.length > 0) {
                        let html = '<ul class="list-group">';
                        data.files.forEach(file => {
                            html += `<li class="list-group-item">
                                <a href="#" onclick="viewFile('${file}')">${file}</a>
                            </li>`;
                        });
                        html += '</ul>';
                        document.getElementById('file-list').innerHTML = html;
                    } else {
                        document.getElementById('file-list').innerHTML = '<p>No files found.</p>';
                    }
                })
                .catch(err => {
                    document.getElementById('file-list').innerHTML = '<p class="text-danger">Error loading files.</p>';
                });
        }

        function viewFile(path) {
            fetch('/api/v1/file/serve?path=' + encodeURIComponent(path) + '&saltenv=base')
                .then(response => response.json())
                .then(data => {
                    if (data.content) {
                        document.getElementById('file-content').style.display = 'block';
                        document.getElementById('file-name').textContent = path;
                        document.getElementById('file-content-text').textContent = data.content;
                    }
                })
                .catch(err => {
                    alert('Error loading file content');
                });
        }

        function showApiInfo() {
            document.getElementById('content').innerHTML = `
                <h2>API Access</h2>
                <p>Use the following endpoints to access the file server programmatically.</p>
                
                <div class="card mb-3">
                    <div class="card-header"><strong>Authentication</strong></div>
                    <div class="card-body">
                        <p>POST /login with JSON body to obtain a token:</p>
                        <pre>curl -X POST http://localhost/login \\
  -H "Content-Type: application/json" \\
  -d '{"username": "your_user", "password": "your_pass"}'</pre>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header"><strong>List Environments</strong></div>
                    <div class="card-body">
                        <pre>GET /api/v1/envs
X-Auth-Token: your_token</pre>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header"><strong>List Files</strong></div>
                    <div class="card-body">
                        <pre>GET /api/v1/file/list?saltenv=base
X-Auth-Token: your_token</pre>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-header"><strong>Serve File</strong></div>
                    <div class="card-body">
                        <pre>GET /api/v1/file/serve?path=init.sls&saltenv=base
X-Auth-Token: your_token</pre>
                    </div>
                </div>
            `;
        }

        // Load files on page load
        document.addEventListener('DOMContentLoaded', loadFiles);
    </script>
</body>
</html>
