  content: This challenge tests your ability to exploit a path traversal vulnerability in a file server API. The server provides file serving capabilities with authentication. While absolute paths are blocked, the path validation may be insufficient. Explore the API endpoints and find a way to access files outside the intended directory. The flag is stored somewhere on the filesystem.
