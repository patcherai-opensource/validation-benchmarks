apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pluginmanager-ctf
  name: pluginmanager-ctf
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pluginmanager-ctf
  template:
    metadata:
      labels:
        app: pluginmanager-ctf
    spec:
      containers:
      - env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: production
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-030-24_saltcorn-unknown:app
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: app
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pluginmanager-ctf
  name: pluginmanager-ctf-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 3000
  selector:
    app: pluginmanager-ctf
  type: ClusterIP
