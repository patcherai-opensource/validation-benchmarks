apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dolibar-ctf
  name: dolibar-ctf
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dolibar-ctf
  template:
    metadata:
      labels:
        app: dolibar-ctf
    spec:
      containers:
      - env:
        - name: FLAG
          value: PLACEHOLDER_FLAG
        image: 
          180294216647.dkr.ecr.us-west-2.amazonaws.com/synthetic-xben-030-24_dolibarr-cve-2020-35136:dolibar
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: dolibar
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: dolibar-ctf
  name: dolibar-ctf-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  selector:
    app: dolibar-ctf
  type: ClusterIP
