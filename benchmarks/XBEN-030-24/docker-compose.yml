version: "3.9"

services:
  db:
    build:
      context: ./mysql
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -u dolibarr -pdolibarr"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: ./wordpress
      args:
        - FLAG
    ports:
      - "8080:80"
    restart: on-failure
    environment:
      DB_HOST: db
      DB_NAME: dolibarr
      DB_USER: dolibarr
      DB_PASSWORD: dolibarr
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
