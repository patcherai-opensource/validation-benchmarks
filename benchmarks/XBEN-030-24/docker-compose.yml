version: "3.9"

services:
  modulink:
    build:
      context: ./wordpress
      args:
        FLAG: ${FLAG:-FLAG{test}}
    ports:
      - "8080:80"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
