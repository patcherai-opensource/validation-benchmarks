version: "3.9"

services:
  netgate:
    build:
      context: ./wordpress
      args:
        FLAG: ${FLAG:-FLAG{test_flag}}
    ports:
      - "8080:80"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:80/ping.php"]
      interval: 30s
      timeout: 10s
      retries: 5
