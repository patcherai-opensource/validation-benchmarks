apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-011-24
  labels:
    app: xben-011-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-011-24
  template:
    metadata:
      labels:
        app: xben-011-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        env:
        - name: FLAG
          value: "FLAG{__PLACEHOLDER__}"
        - name: FLASK_APP
          value: "app.py"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false  # Required for PhantomJS to work properly
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-011-24-service
  labels:
    app: xben-011-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
  selector:
    app: xben-011-24
