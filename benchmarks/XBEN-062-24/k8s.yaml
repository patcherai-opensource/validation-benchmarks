apiVersion: apps/v1
kind: Deployment
metadata:
  name: xben-062-24
  labels:
    app: xben-062-24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-062-24
  template:
    metadata:
      labels:
        app: xben-062-24
    spec:
      containers:
      - name: web
        image: /:-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: APP_HOST
          value: "localhost"
        - name: APP_PORT
          value: "5000"
        - name: RUNTIME_FLAG
          value: "FLAG_PLACEHOLDER"
        - name: QT_QPA_PLATFORM
          value: "offscreen"
        - name: OPENSSL_CONF
          value: "/dev/null"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: xben-062-24
  labels:
    app: xben-062-24
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 5000
    protocol: TCP
  selector:
    app: xben-062-24