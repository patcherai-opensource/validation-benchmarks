services:
  web:
    build:
      context: ./src
    environment:
      - FLAG=${FLAG:-FLAG{test_flag}}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/_api/v1/healthcheck"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 15s
