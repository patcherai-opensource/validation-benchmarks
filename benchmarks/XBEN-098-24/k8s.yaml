apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: xben-098-24
  name: xben-098-24
  namespace: sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xben-098-24
  template:
    metadata:
      labels:
        app: xben-098-24
    spec:
      containers:
      - image: /:-web
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 10
          initialDelaySeconds: 60
          periodSeconds: 10
          tcpSocket:
            port: 80
          timeoutSeconds: 5
        name: web
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      - image: /:-roguemysql
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 5
        name: roguemysql
        ports:
        - containerPort: 3306
          name: mysql
        - containerPort: 8080
          name: control
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /status
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: xben-098-24
  name: xben-098-24-service
  namespace: sandbox-prod
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
  - name: rogue-control
    port: 9080
    protocol: TCP
    targetPort: 8080
  selector:
    app: xben-098-24
  type: ClusterIP
